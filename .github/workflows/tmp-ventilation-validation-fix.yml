name: Temporary ventilation validation fix
on:
  push:
    branches:
      - fix/ventilation-regroupement-contracts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Patch final ventilation validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('noethys/Ctrl/CTRL_Ventilation.py')
          source = path.read_text(encoding='utf-8')

          old = '''    def Validation(self):\n        creditAVentiler = FloatToDecimal(self.montant_reglement) - FloatToDecimal(self.total_ventilation)\n        if self.validation == "ok" :\n            return True\n        if self.validation == "addition" :\n            totalRestePrestationsAVentiler = FloatToDecimal(self.ctrl_ventilation.GetTotalRestePrestationsAVentiler())\n            if creditAVentiler > totalRestePrestationsAVentiler :\n                creditAVentiler = totalRestePrestationsAVentiler\n            if creditAVentiler > FloatToDecimal(0.0) :\n                dlg = wx.MessageDialog(self, _(u"Vous devez encore ventiler %.2f %s.\\n\\nEtes-vous sûr de quand même vouloir valider et fermer ?") % (creditAVentiler, SYMBOLE), _(u"Confirmation"), wx.YES_NO|wx.NO_DEFAULT|wx.CANCEL|wx.ICON_EXCLAMATION)\n                reponse = dlg.ShowModal()\n                dlg.Destroy()\n                if reponse !=  wx.ID_YES :\n                    return False\n        if self.validation == "trop" :\n            dlg = wx.MessageDialog(self, _(u"Vous avez ventilé %.2f %s en trop !") % (-creditAVentiler, SYMBOLE), _(u"Erreur de saisie"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n        if self.validation == "erreur" :\n            dlg = wx.MessageDialog(self, _(u"La ventilation n'est pas valide. Veuillez la vérifier..."), _(u"Erreur de saisie"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n        return True\n'''
          new = '''    def Validation(self):\n        def AfficherErreurVentilation():\n            dlg = wx.MessageDialog(self, _(u"La ventilation n'est pas valide. Veuillez la vérifier..."), _(u"Erreur de saisie"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n\n        if self.validation == "ok" :\n            return True\n        if self.validation == "erreur" :\n            return AfficherErreurVentilation()\n\n        montant_reglement = FloatToDecimalFini(self.montant_reglement)\n        total_ventilation = FloatToDecimalFini(self.total_ventilation)\n        if montant_reglement is None or total_ventilation is None:\n            return AfficherErreurVentilation()\n        try:\n            creditAVentiler = montant_reglement - total_ventilation\n        except (decimal.DecimalException, TypeError, ValueError, OverflowError):\n            return AfficherErreurVentilation()\n\n        if self.validation == "addition" :\n            try:\n                totalRestePrestations = self.ctrl_ventilation.GetTotalRestePrestationsAVentiler()\n            except (decimal.DecimalException, TypeError, ValueError, OverflowError):\n                return AfficherErreurVentilation()\n            totalRestePrestationsAVentiler = FloatToDecimalFini(totalRestePrestations)\n            if totalRestePrestationsAVentiler is None:\n                return AfficherErreurVentilation()\n            if creditAVentiler > totalRestePrestationsAVentiler :\n                creditAVentiler = totalRestePrestationsAVentiler\n            if creditAVentiler > FloatToDecimal(0.0) :\n                dlg = wx.MessageDialog(self, _(u"Vous devez encore ventiler %.2f %s.\\n\\nEtes-vous sûr de quand même vouloir valider et fermer ?") % (creditAVentiler, SYMBOLE), _(u"Confirmation"), wx.YES_NO|wx.NO_DEFAULT|wx.CANCEL|wx.ICON_EXCLAMATION)\n                reponse = dlg.ShowModal()\n                dlg.Destroy()\n                if reponse !=  wx.ID_YES :\n                    return False\n        if self.validation == "trop" :\n            dlg = wx.MessageDialog(self, _(u"Vous avez ventilé %.2f %s en trop !") % (-creditAVentiler, SYMBOLE), _(u"Erreur de saisie"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n        return True\n'''
          count = source.count(old)
          if count != 1:
              raise SystemExit('Validation replacement mismatch: %d' % count)
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile noethys/Ctrl/CTRL_Ventilation.py
          python - <<'PY'
          from pathlib import Path
          from scripts import audit_branch_assignment_gaps as audit
          findings = audit.scan_file(Path('noethys/Ctrl/CTRL_Ventilation.py').resolve())
          print('remaining=', findings)
          if findings:
              raise SystemExit(1)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ventilation-validation-fix.yml
          git add noethys/Ctrl/CTRL_Ventilation.py
          git commit -m "Fix: sécuriser la validation finale de ventilation"
          git push
