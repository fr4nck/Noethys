name: Guard critical portal sync failures

on:
  push:
    paths:
      - '.github/workflows/_tmp_portal_sync_guards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Protéger upload, hébergement inconnu et IDaction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Utils/UTILS_Portail_synchro.py')
          s=p.read_text(encoding='utf-8')
          patches=[
          ('''        self.UploadFichier(ftp=ftp, nomFichierComplet=nomFichierCRYPT, repDest="application/data")\n\n        # Fermeture connexion FTP ou SFTP''', '''        resultat_upload = self.UploadFichier(ftp=ftp, nomFichierComplet=nomFichierCRYPT, repDest="application/data")\n        if resultat_upload is False:\n            self.log.EcritLog(_(u"[ERREUR] Envoi du fichier de données impossible. Synchronisation interrompue."))\n            self.Deconnexion(ftp)\n            return False\n\n        # Fermeture connexion FTP ou SFTP'''),
          ('''        else:\n            raise()\n        return repDestination, nomFichier''', '''        else:\n            self.log.EcritLog(_(u"[ERREUR] Type d'hébergement inconnu : %s") % self.dict_parametres.get("hebergement_type"))\n            return False\n        return repDestination, nomFichier'''),
          ('''            listeTemp = DB.ResultatReq()\n            if listeTemp[0][0] == None:\n                prochainIDaction = 1\n            else:\n                prochainIDaction = listeTemp[0][0] + 1''', '''            listeTemp = DB.ResultatReq()\n            if not listeTemp or listeTemp[0][0] is None:\n                prochainIDaction = 1\n            else:\n                prochainIDaction = listeTemp[0][0] + 1'''),
          ]
          for old,new in patches:
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'Motif attendu 1 fois, trouvé {count}: {old[:100]!r}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Portail_synchro.py
          python scripts/audit_runtime_patterns.py --json runtime.json
          python - <<'PY'
          import json
          d=json.load(open('runtime.json',encoding='utf-8'))
          x=[i for i in d['RESULT_ASSIGN'] if i['file']=='Utils/UTILS_Portail_synchro.py']
          print('RESULT_ASSIGN portail:',x)
          if x:
              raise SystemExit(1)
          PY
          git diff --check
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Portail_synchro.py
          git commit -m 'fix: sécuriser les échecs critiques de synchronisation portail'
          git push origin HEAD:master