name: Apply bytes text safe fixes

on:
  push:
    paths:
      - 'scripts/modernize_bytes_text_safe_cases.py'
      - '.github/workflows/apply-bytes-text-safe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer les corrections sûres
        run: python scripts/modernize_bytes_text_safe_cases.py
      - name: Vérifier l'audit bytes/texte
        run: python scripts/audit_bytes_text_boundaries.py || true
      - name: Committer si nécessaire
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/
          git commit -m "fix: corriger les frontières bytes texte certaines"
          git push origin master
