name: Locate DB unclosed

on:
  push:
    paths:
      - '.github/workflows/_tmp_locate_db_unclosed.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Lister les connexions potentiellement non fermées
        run: |
          python scripts/audit_runtime_patterns.py --json db.json
          python - <<'PY'
          import json
          data=json.load(open('db.json', encoding='utf-8'))
          for item in data.get('DB_UNCLOSED', []):
              print(f"{item['file']}:{item['line']} {item['function']}")
          PY
