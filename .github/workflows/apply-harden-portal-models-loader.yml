name: Apply harden portal models loader

on:
  push:
    paths:
      - 'scripts/harden_portal_models_loader.py'
      - '.github/workflows/apply-harden-portal-models-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer le durcissement
        run: python scripts/harden_portal_models_loader.py
      - name: Vérifier la compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Vérifier les risques dynamiques
        run: python scripts/audit_dynamic_import_risks.py --max-import-risks 0
      - name: Committer
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Utils/UTILS_Portail_synchro.py
          git commit -m "security: durcir le chargement des modèles portail"
          git push origin master
