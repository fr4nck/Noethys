name: History transaction support

on:
  push:
    paths:
      - '.github/workflows/_tmp_history_transaction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Corriger InsertActions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Utils/UTILS_Historique.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('def InsertActions(listeActions=[], DB=None):', 'def InsertActions(listeActions=[], DB=None, commit=True):', 1)
          old='''        if DB == None :\n            DB = GestionDB.DB()\n            try:\n                DB.Executermany(req, listeAjouts, commit=False)\n            except:\n                req = u"INSERT INTO historique (date, heure, IDutilisateur, IDfamille, IDindividu, IDcategorie, action) VALUES (?, ?, ?, ?, ?, ?, ?)"\n                DB.Executermany(req, listeAjouts[:-1], commit=False)\n            DB.Commit()\n            DB.Close()\n        else :\n            DB.Executermany(req, listeAjouts, commit=False)\n            DB.Commit()\n'''
          new='''        DBexterne = DB is not None\n        if not DBexterne:\n            DB = GestionDB.DB()\n        try:\n            DB.Executermany(req, listeAjouts, commit=False)\n        except Exception:\n            # Compatibilité avec les anciennes bases sans colonne IDdonnee.\n            req = u"INSERT INTO historique (date, heure, IDutilisateur, IDfamille, IDindividu, IDcategorie, action) VALUES (?, ?, ?, ?, ?, ?, ?)"\n            listeAjoutsCompat = [ligne[:-1] for ligne in listeAjouts]\n            DB.Executermany(req, listeAjoutsCompat, commit=False)\n        if commit:\n            DB.Commit()\n        if not DBexterne:\n            DB.Close()\n'''
          if s.count(old)!=1:
              raise SystemExit('motif InsertActions inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Historique.py
          git diff --check
          grep -q 'listeAjoutsCompat = \[ligne\[:-1\] for ligne in listeAjouts\]' noethys/Utils/UTILS_Historique.py
          grep -q 'def InsertActions(listeActions=\[\], DB=None, commit=True)' noethys/Utils/UTILS_Historique.py
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Historique.py
          git commit -m "fix: rendre l'historique transactionnel"
          git push origin HEAD:master