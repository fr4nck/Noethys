name: Apply Python 3 runtime source fixes

on:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_py3_runtime_source_fixes.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Apply source fixes
        run: |
          python scripts/apply_py3_runtime_source_fixes.py
          python -m py_compile \
            noethys/Ctrl/CTRL_Saisie_transport.py \
            noethys/Ctrl/CTRL_TaskBarIcon.py \
            noethys/Ol/OL_Modes_reglements.py \
            noethys/Dlg/DLG_Emetteurs.py \
            noethys/Dlg/DLG_Utilisateurs_reseau.py \
            noethys/Utils/UTILS_Organisateur.py \
            noethys/Noethys.py
          git diff --check

      - name: Commit fixes and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Ctrl/CTRL_Saisie_transport.py \
                  noethys/Ctrl/CTRL_TaskBarIcon.py \
                  noethys/Ol/OL_Modes_reglements.py \
                  noethys/Dlg/DLG_Emetteurs.py \
                  noethys/Dlg/DLG_Utilisateurs_reseau.py \
                  noethys/Utils/UTILS_Organisateur.py \
                  noethys/Noethys.py
          git rm scripts/apply_py3_runtime_source_fixes.py
          git rm .github/workflows/apply-py3-runtime-source-fixes.yml
          git commit -m "Fix Python 3 runtime regressions in source"
          git push origin HEAD:master
