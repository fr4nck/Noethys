name: Temporary synthese finite domain safe 5

on:
  push:
    branches:
      - audit/synthese-finite-domain-safe-5

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Prepare qualifications
        run: python scripts/tmp_qualify_finite_domain_safe_5.py
      - name: Verify targeted batch
        run: |
          python -m unittest tests.test_finite_domain_safe_invariants_5 -v
          python scripts/qualify_branch_assignment_gaps.py
      - name: Commit targeted batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qualify_branch_assignment_gaps.py tests/test_finite_domain_safe_invariants_5.py
          git commit -m "Audit: qualifier huit domaines finis sûrs"
          git push
