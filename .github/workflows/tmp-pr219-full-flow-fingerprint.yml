name: Temporary PR219 full-flow fingerprint

on:
  push:
    branches:
      - fix/branch-assignment-candidates-pass-1
    paths:
      - .github/workflows/tmp-pr219-full-flow-fingerprint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-candidates-pass-1
          fetch-depth: 0
      - name: Apply full-flow fingerprint hardening
        run: python scripts/tmp_pr219_full_flow_fingerprint.py
      - name: Compile and test qualification
        run: |
          python -m py_compile scripts/qualify_branch_assignment_gaps.py
          python -m unittest tests.test_branch_assignment_gap_qualification
          python scripts/qualify_branch_assignment_gaps.py
      - name: Commit fixes and cleanup
        run: |
          rm scripts/tmp_pr219_full_flow_fingerprint.py .github/workflows/tmp-pr219-full-flow-fingerprint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qualify_branch_assignment_gaps.py tests/test_branch_assignment_gap_qualification.py scripts/tmp_pr219_full_flow_fingerprint.py .github/workflows/tmp-pr219-full-flow-fingerprint.yml
          git commit -m "Fix: lier les qualifications au flot complet"
          git push origin HEAD:fix/branch-assignment-candidates-pass-1
