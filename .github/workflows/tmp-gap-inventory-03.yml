name: Temp gap batch 03 patch

on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-03

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch source and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('noethys/Utils/UTILS_Portail_synchro.py')
          text = path.read_text(encoding='utf-8')
          old = '''        # Paramètres SMTP pour Flask-mail\n        if self.dict_parametres["email_type_adresse"] > 0 :\n            adresse_valide = False\n'''
          new = '''        # Paramètres SMTP pour Flask-mail\n        MAIL_SERVER = None\n        MAIL_DEFAULT_SENDER = None\n        MAIL_PORT = None\n        MAIL_USE_TLS = None\n        MAIL_USE_SSL = None\n        MAIL_USERNAME = None\n        MAIL_PASSWORD = None\n        if self.dict_parametres["email_type_adresse"] > 0 :\n            adresse_valide = False\n'''
          if old not in text:
              raise SystemExit('SMTP anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_portail_synchro_smtp_contract.py')
          test.write_text('''import ast\nimport importlib.util\nfrom pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nSOURCE = ROOT / "noethys" / "Utils" / "UTILS_Portail_synchro.py"\nAUDIT = ROOT / "scripts" / "audit_branch_assignment_gaps.py"\n\n\ndef load_audit():\n    spec = importlib.util.spec_from_file_location("audit_branch_assignment_gaps", AUDIT)\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    return module\n\n\nclass PortailSynchroSmtpContractTests(unittest.TestCase):\n    def test_smtp_neutral_defaults_are_defined_before_selection(self):\n        tree = ast.parse(SOURCE.read_text(encoding="utf-8"))\n        names = {"MAIL_SERVER", "MAIL_DEFAULT_SENDER", "MAIL_PORT", "MAIL_USE_TLS", "MAIL_USE_SSL", "MAIL_USERNAME", "MAIL_PASSWORD"}\n        upload_config = next(node for node in ast.walk(tree) if isinstance(node, ast.FunctionDef) and node.name == "Upload_config")\n        defaults = {}\n        email_if_line = None\n        for node in upload_config.body:\n            if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name) and node.targets[0].id in names:\n                defaults[node.targets[0].id] = node\n            if isinstance(node, ast.If) and "email_type_adresse" in ast.unparse(node.test):\n                email_if_line = node.lineno\n                break\n        self.assertEqual(set(defaults), names)\n        self.assertTrue(all(isinstance(node.value, ast.Constant) and node.value.value is None for node in defaults.values()))\n        self.assertTrue(all(node.lineno < email_if_line for node in defaults.values()))\n\n    def test_targeted_smtp_gaps_disappear(self):\n        audit = load_audit()\n        findings = audit.scan_file(SOURCE, ROOT / "noethys")\n        names = {"MAIL_SERVER", "MAIL_DEFAULT_SENDER", "MAIL_USE_TLS", "MAIL_USE_SSL", "MAIL_USERNAME", "MAIL_PASSWORD"}\n        targeted = [item for item in findings if item.get("function") == "Upload_config" and item.get("name") in names]\n        self.assertEqual(targeted, [], targeted)\n\n    def test_module_still_parses(self):\n        ast.parse(SOURCE.read_text(encoding="utf-8"))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Validate targeted batch
        run: |
          python -m unittest tests.test_portail_synchro_smtp_contract
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json || true
          python - <<'PY'
          import json
          data=json.load(open('/tmp/gaps.json', encoding='utf-8'))
          findings=data if isinstance(data,list) else data.get('findings', data.get('results', []))
          print('BRANCH_ASSIGNMENT_GAPS=%d' % len(findings))
          targeted=[x for x in findings if x.get('file')=='Utils/UTILS_Portail_synchro.py' and x.get('function')=='Upload_config' and x.get('name') in {'MAIL_SERVER','MAIL_DEFAULT_SENDER','MAIL_USE_TLS','MAIL_USE_SSL','MAIL_USERNAME','MAIL_PASSWORD'}]
          print('TARGETED', targeted)
          if targeted or len(findings) != 226:
              raise SystemExit(1)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Portail_synchro.py tests/test_portail_synchro_smtp_contract.py
          git rm .github/workflows/tmp-gap-inventory-03.yml
          git commit -m 'Fix — expliciter le contrat SMTP du portail'
          git push
