name: Temp gap inventory 03

on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-03

permissions:
  contents: read

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inventory branch assignment gaps
        run: |
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json || true
          python - <<'PY'
          import json
          from collections import Counter
          data = json.load(open('/tmp/gaps.json', encoding='utf-8'))
          findings = data if isinstance(data, list) else data.get('findings', data.get('results', []))
          print('COUNT', len(findings))
          print('TOP FILES')
          for path, count in Counter(x.get('file') or x.get('path') for x in findings).most_common(20):
              print(count, path)
          print('FIRST 80')
          for x in findings[:80]:
              print(x)
          PY
