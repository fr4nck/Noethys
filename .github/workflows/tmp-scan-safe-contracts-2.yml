name: Temporary qualify safe contracts 2

on:
  push:
    branches:
      - audit/call-contract-safe-invariants-2

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/call-contract-safe-invariants-2
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Qualifier les contrats d'appel démontrés
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts import audit_branch_assignment_gaps as audit
          from scripts import qualify_branch_assignment_gaps as qualify

          root = Path('noethys')
          specs = (
              ('Dlg/DLG_Badgeage_importation.py', 'Connexion', 'scanner', 'body_only'),
              ('Dlg/DLG_Saisie_contrat_periode_auto.py', 'Generation', 'listeDates', 'body_only'),
              ('Dlg/DLG_Saisie_contrat_periode_auto.py', 'Generation', 'nom_auto', 'body_only'),
              ('Dlg/DLG_Saisie_lot_ouvertures2.py', 'Validation', 'expression', 'body_only'),
              ('Dlg/DLG_Liste_envoi_email.py', 'OnBoutonOk', 'tracks', 'body_only'),
              ('Dlg/DLG_Individu_coords.py', 'EnvoyerEmail', 'ctrl', 'body_only'),
              ('Ol/OL_Prelevements_sepa.py', 'MemoriseReglementHistorique', 'IDcategorie', 'body_only'),
              ('Ol/OL_Prelevements_sepa.py', 'MemoriseReglementHistorique', 'categorie', 'body_only'),
          )
          reasons = {
              ('Dlg/DLG_Badgeage_importation.py', 'Connexion', 'scanner'): "appareil provient du wx.Choice CTRL_Choix_appareil, dont le domaine est exactement cs1504/opn-2001 ; None est rejeté avant la branche et chacune des deux valeurs crée scanner avant le retour",
              ('Dlg/DLG_Saisie_contrat_periode_auto.py', 'Generation', 'listeDates'): "ctrl_periodicite est un wx.Choice à trois valeurs initialisé sur l'index 1 ; son domaine 0/1/2 est exhaustivement traité et affecte listeDates avant lecture",
              ('Dlg/DLG_Saisie_contrat_periode_auto.py', 'Generation', 'nom_auto'): "la même sélection de périodicité 0/1/2, issue d'un wx.Choice à trois valeurs initialisé, affecte exhaustivement nom_auto avant son utilisation",
              ('Dlg/DLG_Saisie_lot_ouvertures2.py', 'Validation', 'expression'): "radio_ajouter, radio_supprimer_expression et radio_supprimer_tout forment un seul groupe wx ; dans la branche de suppression, les deux états possibles affectent expression avant la recherche",
              ('Dlg/DLG_Liste_envoi_email.py', 'OnBoutonOk', 'tracks'): "les trois radios de sélection de lignes forment un groupe wx unique initialisé par radio_lignes_affichees ; chacune des trois valeurs affecte tracks avant son parcours",
              ('Dlg/DLG_Individu_coords.py', 'EnvoyerEmail', 'ctrl'): "EnvoyerEmail n'est lié par OnEnvoiEmail qu'aux quatre identifiants 801/802/901/902 ; 801/802 sélectionnent ctrl_travail_mail et 901/902 ctrl_mail avant toute lecture",
              ('Ol/OL_Prelevements_sepa.py', 'MemoriseReglementHistorique', 'IDcategorie'): "la méthode interne est appelée avec les modes historiques saisie/modification/suppression, son défaut est saisie, et chacun de ces trois modes affecte IDcategorie avant construction de l'action",
              ('Ol/OL_Prelevements_sepa.py', 'MemoriseReglementHistorique', 'categorie'): "la méthode interne est appelée avec les modes historiques saisie/modification/suppression, son défaut est saisie, et chacun de ces trois modes affecte categorie avant construction de l'action",
          }

          entries = []
          seen = set()
          for relative, function, name, detail in specs:
              findings = audit.scan_file(root / relative, root)
              matches = [item for item in findings if item['function'] == function and item['name'] == name and item['detail'] == detail]
              if len(matches) != 1:
                  raise SystemExit(f'{relative}::{function}::{name}: {len(matches)} candidat(s), attendu 1')
              key = qualify.qualification_key(matches[0], root)
              if key is None:
                  raise SystemExit(f'Empreinte impossible pour {relative}::{function}::{name}')
              if key in seen:
                  raise SystemExit(f'Clé dupliquée inattendue: {key!r}')
              seen.add(key)
              entries.append((key, reasons[(relative, function, name)]))

          qualifier = Path('scripts/qualify_branch_assignment_gaps.py')
          source = qualifier.read_text(encoding='utf-8')
          marker = '\n}\n\ndef _candidate_fingerprint'
          if source.count(marker) != 1:
              raise SystemExit('Structure du registre EXPLICIT_SAFE inattendue')
          missing = []
          for key, reason in entries:
              if key not in qualify.EXPLICIT_SAFE:
                  missing.append(f'    {key!r}: (\n        {reason!r}\n    ),\n')
          if missing:
              source = source.replace(marker, '\n' + ''.join(missing) + '}\n\ndef _candidate_fingerprint', 1)
              qualifier.write_text(source, encoding='utf-8')

          test = Path('tests/test_call_contract_safe_invariants_2.py')
          test.write_text('''import unittest\nfrom pathlib import Path\n\nfrom scripts import audit_branch_assignment_gaps as audit\nfrom scripts import qualify_branch_assignment_gaps as qualify\n\nROOT = Path(__file__).resolve().parents[1]\nNOETHYS = ROOT / "noethys"\n\nSPECS = (\n    ("Dlg/DLG_Badgeage_importation.py", "Connexion", "scanner", "body_only"),\n    ("Dlg/DLG_Saisie_contrat_periode_auto.py", "Generation", "listeDates", "body_only"),\n    ("Dlg/DLG_Saisie_contrat_periode_auto.py", "Generation", "nom_auto", "body_only"),\n    ("Dlg/DLG_Saisie_lot_ouvertures2.py", "Validation", "expression", "body_only"),\n    ("Dlg/DLG_Liste_envoi_email.py", "OnBoutonOk", "tracks", "body_only"),\n    ("Dlg/DLG_Individu_coords.py", "EnvoyerEmail", "ctrl", "body_only"),\n    ("Ol/OL_Prelevements_sepa.py", "MemoriseReglementHistorique", "IDcategorie", "body_only"),\n    ("Ol/OL_Prelevements_sepa.py", "MemoriseReglementHistorique", "categorie", "body_only"),\n)\n\nclass CallContractSafeInvariantTests2(unittest.TestCase):\n    def test_candidates_are_exactly_qualified(self):\n        for relative, function, name, detail in SPECS:\n            findings = audit.scan_file(NOETHYS / relative, NOETHYS)\n            matches = [item for item in findings if item["function"] == function and item["name"] == name and item["detail"] == detail]\n            self.assertEqual(len(matches), 1, (relative, function, name))\n            self.assertIn(qualify.qualification_key(matches[0], NOETHYS), qualify.EXPLICIT_SAFE)\n\n    def test_fixed_choice_domains_remain_explicit(self):\n        badge = (NOETHYS / "Dlg/DLG_Badgeage_importation.py").read_text(encoding="utf-8")\n        self.assertIn('(\"cs1504\", _(u\"Symbol CS1504\"))', badge)\n        self.assertIn('(\"opn-2001\", _(u\"Opticon OPN-2001\"))', badge)\n        self.assertIn('if (appareil == "cs1504") or (appareil == "opn-2001")', badge)\n\n        contrat = (NOETHYS / "Dlg/DLG_Saisie_contrat_periode_auto.py").read_text(encoding="utf-8")\n        self.assertIn('choices=[_(u"Annuelle"), _(u"Mensuelle"), _(u"Hebdomadaire")]', contrat)\n        self.assertIn('self.ctrl_periodicite.SetSelection(1)', contrat)\n        for value in (0, 1, 2):\n            self.assertIn(f'dictParametres["periodicite"] == {value}', contrat)\n\n    def test_radio_group_contracts_remain_explicit(self):\n        lot = (NOETHYS / "Dlg/DLG_Saisie_lot_ouvertures2.py").read_text(encoding="utf-8")\n        self.assertIn('self.radio_ajouter = wx.RadioButton', lot)\n        self.assertIn('style=wx.RB_GROUP', lot)\n        self.assertIn('self.radio_supprimer_expression = wx.RadioButton', lot)\n        self.assertIn('self.radio_supprimer_tout = wx.RadioButton', lot)\n        self.assertIn('expression = self.ctrl_expression.GetValue()', lot)\n        self.assertIn('expression = None', lot)\n\n        mail = (NOETHYS / "Dlg/DLG_Liste_envoi_email.py").read_text(encoding="utf-8")\n        self.assertIn('self.radio_lignes_affichees = wx.RadioButton', mail)\n        self.assertIn('self.radio_lignes_cochees = wx.RadioButton', mail)\n        self.assertIn('self.radio_ligne_selectionnee = wx.RadioButton', mail)\n        self.assertIn('tracks = self.listview.GetFilteredObjects()', mail)\n        self.assertIn('tracks = self.listview.GetCheckedObjects()', mail)\n        self.assertIn('tracks = self.listview.GetSelectedObjects()', mail)\n\n    def test_bound_event_and_internal_mode_domains_remain_explicit(self):\n        coords = (NOETHYS / "Dlg/DLG_Individu_coords.py").read_text(encoding="utf-8")\n        self.assertIn('if event.GetId() in (801, 802)', coords)\n        self.assertIn('if event.GetId() in (901, 902)', coords)\n        self.assertIn('self.Bind(wx.EVT_MENU, self.EnvoyerEmail, id=event.GetId()+1)', coords)\n        self.assertIn('self.Bind(wx.EVT_MENU, self.EnvoyerEmail, id=event.GetId()+2)', coords)\n\n        sepa = (NOETHYS / "Ol/OL_Prelevements_sepa.py").read_text(encoding="utf-8")\n        self.assertIn('def MemoriseReglementHistorique(self, mode="saisie"', sepa)\n        for mode in ("saisie", "modification", "suppression"):\n            self.assertIn(f'if mode == "{mode}"', sepa)\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          temporary = Path('.github/workflows/tmp-scan-safe-contracts-2.yml')
          if temporary.exists():
              temporary.unlink()
          PY
      - name: Vérifier le lot ciblé
        env:
          PYTHONPATH: ${{ github.workspace }}/noethys:${{ github.workspace }}
        run: python -m unittest tests.test_call_contract_safe_invariants_2 -v
      - name: Commit du lot qualifié
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Audit: qualifier huit contrats d appel sûrs'
          git push origin HEAD:audit/call-contract-safe-invariants-2
