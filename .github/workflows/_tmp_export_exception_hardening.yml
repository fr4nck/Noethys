name: Harden export exceptions

on:
  push:
    paths:
      - '.github/workflows/_tmp_export_exception_hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Durcir les exports génériques et NoethysWeb
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('noethys/Utils/UTILS_Export.py')
          s=p.read_text(encoding='utf-8')
          # Tous les bare except de ce module servent à des conversions ou à la finalisation Excel.
          before=s.count('except :') + s.count('except:')
          s=s.replace('except :', 'except Exception:').replace('except:', 'except Exception:')
          # Sécurise explicitement l'écriture texte.
          old='''    f = open(cheminFichier, "w", encoding="utf-8")\n    if six.PY2:\n        texte = texte.encode("utf8")\n    f.write(texte)\n    f.close()\n    \n    # Confirmation de création du fichier et demande d'ouverture directe dans Excel'''
          new='''    try:\n        with open(cheminFichier, "w", encoding="utf-8") as f:\n            f.write(texte)\n    except OSError as err:\n        dlg = wx.MessageDialog(None, _(u"Impossible d'enregistrer le fichier texte : %s") % err, _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n        dlg.ShowModal()\n        dlg.Destroy()\n        return False\n    \n    # Confirmation de création du fichier et demande d'ouverture directe dans Excel'''
          if old not in s:
              raise SystemExit('motif écriture texte introuvable')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('UTILS_Export bare except remplacés:', before)

          p=Path('noethys/Utils/UTILS_Export_noethysweb.py')
          s=p.read_text(encoding='utf-8')
          before=s.count('except:') + s.count('except :')
          s=s.replace('except:', 'except Exception:').replace('except :', 'except Exception:')
          p.write_text(s,encoding='utf-8')
          print('NoethysWeb bare except remplacés:', before)
          PY
          python -m py_compile noethys/Utils/UTILS_Export.py noethys/Utils/UTILS_Export_noethysweb.py
          python scripts/audit_runtime_patterns.py --json runtime.json
          python - <<'PY'
          import json
          d=json.load(open('runtime.json',encoding='utf-8'))
          for f in ('Utils/UTILS_Export.py','Utils/UTILS_Export_noethysweb.py'):
              x=[i for i in d['BARE_EXCEPT'] if i['file']==f]
              print(f, 'BARE_EXCEPT:', x)
              if x: raise SystemExit(1)
          PY
          git diff --check
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Export.py noethys/Utils/UTILS_Export_noethysweb.py
          git commit -m 'fix: durcir les erreurs des exports génériques et web'
          git push origin HEAD:master