name: Noe-020 wxPython Phoenix audit

on:
  pull_request:
    paths:
      - 'noethys/**'
      - 'scripts/audit_wxphoenix_compat.py'
      - '.github/workflows/noe020-wxphoenix-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-known-incompatibility:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'noe-020-wxphoenix-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remplacer SystemSettings_GetFont par l'API Phoenix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('noethys/Dlg/DLG_Nbre_inscrits.py')
          text = path.read_text(encoding='utf-8')
          old = 'font = wx.SystemSettings_GetFont(wx.SYS_DEFAULT_GUI_FONT)'
          new = 'font = wx.SystemSettings.GetFont(wx.SYS_DEFAULT_GUI_FONT)'
          if old in text:
              assert text.count(old) == 1, 'motif inattendu : remplacement refusé'
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('ni ancien ni nouveau motif trouvé')
          PY
          python -m py_compile noethys/Dlg/DLG_Nbre_inscrits.py
          git diff --check

      - name: Commit de la correction
        run: |
          if git diff --quiet -- noethys/Dlg/DLG_Nbre_inscrits.py; then
            echo 'Correction déjà appliquée.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Nbre_inscrits.py
          git commit -m "Noe-020: use Phoenix SystemSettings.GetFont API"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer wxPython
        run: python -m pip install --upgrade pip wxPython

      - name: Compiler l'auditeur
        run: python -m py_compile scripts/audit_wxphoenix_compat.py

      - name: Auditer les API historiques et le runtime Phoenix
        run: python scripts/audit_wxphoenix_compat.py --runtime --fail-missing --json tmp/wxphoenix-${{ runner.os }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wxphoenix-audit-${{ runner.os }}
          path: tmp/wxphoenix-${{ runner.os }}.json
          if-no-files-found: warn
