name: Apply wx integer geometry

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-wx-integer-geometry.yml'
      - 'scripts/modernize_wx_integer_geometry.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer les corrections
        run: python scripts/modernize_wx_integer_geometry.py
      - name: Vérifier l'audit wx
        run: python scripts/audit_wx_numeric_arguments.py || true
      - name: Committer si nécessaire
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/ObjectListView/ObjectListView.py noethys/Outils/ultimatelistctrl.py noethys/Outils/wxSchedulerPaint.py noethys/Utils/UTILS_TL_drawing_default.py
          git commit -m "fix: convertir les géométries wxPython en entiers"
          git push origin master
