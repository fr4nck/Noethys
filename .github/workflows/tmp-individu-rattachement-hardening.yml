name: Temporary individual rattachement hardening

on:
  push:
    branches:
      - fix/individual-rattachement-hardening
    paths:
      - .github/workflows/tmp-individu-rattachement-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/individual-rattachement-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Patch DLG_Individu and add regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('noethys/Dlg/DLG_Individu.py')
          text = path.read_text(encoding='utf-8')

          def block(lines):
              return "\n".join(lines) + "\n"

          replacements = [
              (
                  block([
                      "        dictFamilles = {}",
                      "        for IDrattachement, IDfamille, IDcategorie, titulaire, IDcompte_payeur in listeRattachements :",
                      "            if IDcategorie == 1 : nomCategorie = _(u\"représentant\")",
                      "            if IDcategorie == 2 : nomCategorie = _(u\"enfant\")",
                      "            if IDcategorie == 3 : nomCategorie = _(u\"contact\")",
                      "            dictFamilles[IDfamille] = {\"nomsTitulaires\" : u\"\", \"listeNomsTitulaires\" : [], \"IDcategorie\" : IDcategorie, \"nomCategorie\" : nomCategorie, \"IDcompte_payeur\" : IDcompte_payeur }",
                  ]),
                  block([
                      "        dictFamilles = {}",
                      "        dictNomsCategories = {",
                      "            1 : _(u\"représentant\"),",
                      "            2 : _(u\"enfant\"),",
                      "            3 : _(u\"contact\"),",
                      "        }",
                      "        for IDrattachement, IDfamille, IDcategorie, titulaire, IDcompte_payeur in listeRattachements :",
                      "            nomCategorie = dictNomsCategories.get(IDcategorie, _(u\"catégorie inconnue\"))",
                      "            dictFamilles[IDfamille] = {\"nomsTitulaires\" : u\"\", \"listeNomsTitulaires\" : [], \"IDcategorie\" : IDcategorie, \"nomCategorie\" : nomCategorie, \"IDcompte_payeur\" : IDcompte_payeur }",
                  ]),
              ),
              (
                  block([
                      "            if nbreTitulaires > 2 :",
                      "                texteNoms = \"\"",
                      "                for nomTitulaire in dictFamilles[IDfamille][\"listeNomsTitulaires\"][:-1] :",
                      "                    texteNoms += u\"%s, \" % nomTitulaire",
                      "                texteNoms = _(u\"%s et %s\") % (dictFamilles[IDfamille][\"listeNomsTitulaires\"][-2], dictFamilles[IDfamille][\"listeNomsTitulaires\"][-1])",
                      "                dictFamilles[IDfamille][\"nomsTitulaires\"] = texteNoms",
                  ]),
                  block([
                      "            if nbreTitulaires > 2 :",
                      "                texteNoms = u\", \".join(dictFamilles[IDfamille][\"listeNomsTitulaires\"][:-1])",
                      "                texteNoms = _(u\"%s et %s\") % (texteNoms, dictFamilles[IDfamille][\"listeNomsTitulaires\"][-1])",
                      "                dictFamilles[IDfamille][\"nomsTitulaires\"] = texteNoms",
                  ]),
              ),
              (
                  block([
                      "        if len(self.dictFamillesRattachees) == 0 :",
                      "            texteID = _(u\"Rattaché à aucune famille | ID : %d\") % self.IDindividu",
                      "        if len(self.dictFamillesRattachees) == 1 :",
                      "            texteID = _(u\"Rattaché à 1 famille | ID : %d\") % self.IDindividu",
                      "        if len(self.dictFamillesRattachees) > 1 :",
                      "            texteID = _(u\"Rattaché à %d familles | ID : %d\") % (len(self.dictFamillesRattachees), self.IDindividu)",
                  ]),
                  block([
                      "        nbreFamilles = len(self.dictFamillesRattachees)",
                      "        if nbreFamilles == 0 :",
                      "            texteID = _(u\"Rattaché à aucune famille | ID : %d\") % self.IDindividu",
                      "        elif nbreFamilles == 1 :",
                      "            texteID = _(u\"Rattaché à 1 famille | ID : %d\") % self.IDindividu",
                      "        else :",
                      "            texteID = _(u\"Rattaché à %d familles | ID : %d\") % (nbreFamilles, self.IDindividu)",
                  ]),
              ),
              (
                  block([
                      "        if IDcategorie == 1 : labelCategorie = _(u\"représentant\")",
                      "        if IDcategorie == 2 : labelCategorie = _(u\"enfant\")",
                      "        if IDcategorie == 3 : labelCategorie = _(u\"contact\")",
                      "        UTILS_Historique.InsertActions([{",
                  ]),
                  block([
                      "        dictLabelsCategories = {",
                      "            1 : _(u\"représentant\"),",
                      "            2 : _(u\"enfant\"),",
                      "            3 : _(u\"contact\"),",
                      "        }",
                      "        labelCategorie = dictLabelsCategories.get(IDcategorie, _(u\"catégorie inconnue\"))",
                      "        UTILS_Historique.InsertActions([{",
                  ]),
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit('bloc DLG_Individu inattendu: %d occurrence(s)' % count)
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          Path('tests/test_individu_rattachement_hardening.py').write_text(r'''#!/usr/bin/env python3
# -*- coding: utf-8 -*-

import ast
import types
import unittest
from pathlib import Path

from scripts import audit_branch_assignment_gaps


SOURCE = Path("noethys/Dlg/DLG_Individu.py")


def load_dialog_method(name, extra_globals=None):
    tree = ast.parse(SOURCE.read_text(encoding="utf-8"))
    dialog = next(
        node for node in tree.body
        if isinstance(node, ast.ClassDef) and node.name == "Dialog"
    )
    method = next(
        node for node in dialog.body
        if isinstance(node, ast.FunctionDef) and node.name == name
    )
    module = ast.Module(body=[method], type_ignores=[])
    ast.fix_missing_locations(module)
    namespace = {"_": lambda texte: texte}
    if extra_globals:
        namespace.update(extra_globals)
    exec(compile(module, str(SOURCE), "exec"), namespace)
    return namespace[name]


class IndividuRattachementHardeningTests(unittest.TestCase):
    def test_unknown_category_and_three_holders_are_stable(self):
        resultats = iter([
            [(1, 10, 99, 0, 100)],
            [
                (1, 101, 10, 1, 1, "Alpha", "Ana"),
                (2, 102, 10, 1, 1, "Beta", "Ben"),
                (3, 103, 10, 1, 1, "Gamma", "Gus"),
            ],
        ])

        class FakeDB:
            def ExecuterReq(self, req):
                return True

            def ResultatReq(self):
                return next(resultats)

            def Close(self):
                return None

        method = load_dialog_method(
            "GetFamillesRattachees",
            {"GestionDB": types.SimpleNamespace(DB=FakeDB)},
        )
        self_obj = types.SimpleNamespace(IDindividu=999)
        resultat = method(self_obj)

        self.assertEqual(resultat[10]["IDcategorie"], 99)
        self.assertEqual(resultat[10]["nomCategorie"], "catégorie inconnue")
        self.assertEqual(
            resultat[10]["nomsTitulaires"],
            "Alpha Ana, Beta Ben et Gamma Gus",
        )

    def test_unknown_category_is_recorded_without_unbound_label(self):
        actions = []

        class FakeDB:
            def ReqInsert(self, table, donnees):
                return 123

            def Close(self):
                return None

        method = load_dialog_method(
            "RattacherIndividu",
            {
                "GestionDB": types.SimpleNamespace(DB=FakeDB),
                "UTILS_Historique": types.SimpleNamespace(
                    InsertActions=lambda values: actions.extend(values)
                ),
            },
        )
        self_obj = types.SimpleNamespace(IDindividu=999)

        self.assertTrue(method(self_obj, IDfamille=10, IDcategorie=99, titulaire=0))
        self.assertEqual(len(actions), 1)
        self.assertIn("catégorie inconnue", actions[0]["action"])

    def test_dialog_individu_has_no_branch_assignment_gap_left(self):
        findings = audit_branch_assignment_gaps.scan_file(
            SOURCE.resolve(), Path("noethys").resolve()
        )
        self.assertEqual(findings, [])


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Individu.py tests/test_individu_rattachement_hardening.py
          PYTHONPATH=noethys:. python -m unittest tests.test_individu_rattachement_hardening -v
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git rm .github/workflows/tmp-individu-rattachement-hardening.yml
          git add noethys/Dlg/DLG_Individu.py tests/test_individu_rattachement_hardening.py
          git commit -m "Fix: durcir les rattachements individuels"
          git push origin HEAD:fix/individual-rattachement-hardening
