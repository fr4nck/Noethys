name: Apply remaining text encodings

on:
  push:
    paths:
      - 'scripts/fix_remaining_text_encodings.py'
      - '.github/workflows/apply-fix-remaining-text-encodings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer les corrections
        run: python scripts/fix_remaining_text_encodings.py
      - name: Vérifier la compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Vérifier l'audit UTF-8
        run: |
          output="$(python scripts/audit_utf8_boundaries.py)"
          echo "$output"
          echo "$output" | grep -q '0 frontière(s) texte/encodage actionnable(s)'
      - name: Vérifier les imports dynamiques
        run: python scripts/audit_dynamic_import_risks.py --max-import-risks 0
      - name: Vérifier le diff limité
        run: |
          git diff --stat
          files="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$files" = "noethys/Dlg/DLG_Saisie_lot_tresor_public_pes.py noethys/FonctionsPerso.py noethys/Utils/UTILS_Envoi_email.py "
      - name: Committer
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Saisie_lot_tresor_public_pes.py noethys/FonctionsPerso.py noethys/Utils/UTILS_Envoi_email.py
          git commit -m "fix: expliciter les derniers encodages texte"
          git push origin master
