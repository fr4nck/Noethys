name: tmp gap patch 14

on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-14

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-gap-batch-14
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/tmp_patch_gap_batch_14.py
      - name: Targeted tests
        run: python -m unittest tests.test_tariff_label_branch_contracts_batch_14 -v
      - name: Audit count and exhaustive coverage
        run: |
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json | tee /tmp/audit.txt
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/audit.txt').read_text(encoding='utf-8')
          if 'BRANCH_ASSIGNMENT_GAPS=167' not in text:
              raise SystemExit(text)
          m = re.search(r'trouvés=(\d+), lus=(\d+), parsés=(\d+)', text)
          if not m or len(set(m.groups())) != 1:
              raise SystemExit(text)
          PY
      - name: Remove temporary infrastructure and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp_patch_gap_batch_14.py .github/workflows/tmp-gap-patch-14.yml
          git add noethys/Dlg/DLG_Saisie_lot_forfaits_credits.py noethys/Dlg/DLG_Saisie_modele_prestation.py noethys/Dlg/DLG_Saisie_prestation.py tests/test_tariff_label_branch_contracts_batch_14.py
          git commit -m "fix: rendre exhaustifs trois libellés tarifaires"
          git push
