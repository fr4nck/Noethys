name: Apply timeline translation fix

on:
  push:
    branches:
      - fix/vanilla-final-runtime-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla-final-runtime-pass

      - name: Import the translation helper used by TimePeriod.zoom
        shell: python
        run: |
          from pathlib import Path
          path = Path("noethys/Utils/UTILS_TL_data.py")
          text = path.read_text(encoding="utf-8")
          old = "import wx\nfrom Ctrl import CTRL_Bouton_image\n"
          new = "import wx\nfrom Ctrl import CTRL_Bouton_image\nfrom Utils.UTILS_Traduction import _\n"
          if text.count(old) != 1:
              raise SystemExit(f"timeline import target count: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Validate active zoom error path and compile
        shell: python
        run: |
          import ast
          from pathlib import Path
          path = Path("noethys/Utils/UTILS_TL_data.py")
          text = path.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(path))
          imports_translation = any(
              isinstance(node, ast.ImportFrom)
              and node.module == "Utils.UTILS_Traduction"
              and any(alias.name == "_" for alias in node.names)
              for node in tree.body
          )
          assert imports_translation
          assert 'raise ValueError(_("Can\'t zoom wider than 120 years"))' in text
          assert 'raise ValueError(_("Can\'t zoom deeper than 1 hour"))' in text

      - name: Compile changed Python file
        run: python -m py_compile noethys/Utils/UTILS_TL_data.py

      - name: Commit application fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_apply-final-runtime-pass-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Utils/UTILS_TL_data.py .github/workflows/_apply-final-runtime-pass-3.yml
          git commit -m "Vanilla: corriger les limites de zoom de la chronologie"
          git push origin HEAD:fix/vanilla-final-runtime-pass
