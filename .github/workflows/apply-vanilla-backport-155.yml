name: Apply Vanilla backport 155

on:
  push:
    branches:
      - fix/vanilla-individus-preferences-backport

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vanilla-individus-preferences-backport
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Appliquer les correctifs historiques
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: motif attendu une fois, trouvé {count}")
              return text.replace(old, new, 1)

          individus_path = Path("noethys/Ol/OL_Individus.py")
          text = individus_path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '        if dictIndividus == self.dictIndividus and self.forceActualisation == False :\n            return None',
              '        if dictIndividus == self.dictIndividus and self.forceActualisation == False and self.donnees :\n            return None',
              'premier chargement vide',
          )

          text = replace_once(
              text,
              '        if dlg.ShowModal() == wx.ID_OK:\n            pass\n        # MAJ du listView',
              '        if dlg.ShowModal() == wx.ID_OK:\n            pass\n        dlg.Destroy()\n        # MAJ du listView',
              'destruction dialogue famille',
          )

          text = replace_once(
              text,
              '            try :\n                IDindividu = int(txtSearch)\n            except :\n                IDfamille = None',
              '            try :\n                IDindividu = int(txtSearch)\n            except :\n                IDindividu = None',
              'code-barres individu invalide',
          )

          text = replace_once(
              text,
              '                    # MAJ du remplissage\n                    if self.GetGrandParent().GetName() == "general" :\n                        self.GetGrandParent().MAJ() \n                    else:\n                        self.MAJ() \n                    self.OnCancel(None)',
              '                    # Actualise le conteneur métier quand il expose MAJ,\n                    # sinon recharge directement la liste. BarreRecherche n\'a\n                    # volontairement pas de méthode MAJ propre.\n                    actualiser = getattr(self.parent, "MAJ", None)\n                    if callable(actualiser):\n                        actualiser()\n                    else:\n                        self.listView.MAJ(forceActualisation=True)\n                    self.OnCancel(None)',
              'rafraichissement code-barres famille',
          )

          text = replace_once(
              text,
              '                    if self.dernierRFID != IDbadge :\n                        self.dernierRFID = IDbadge',
              '                    # Ignore une lecture répétée du même badge pendant\n                    # la fenêtre anti-rebond.\n                    if self.dernierRFID == IDbadge:\n                        return False\n                    self.dernierRFID = IDbadge',
              'anti-rebond RFID',
          )

          text = replace_once(
              text,
              '                    # On stoppe le timer de détection RFID\n                    self.timer_rfid.Stop()\n\n                    time.sleep(2)\n\n                    # Ouverture de la fiche famille\n                    if IDindividu != None:\n                        track = self.dictTracks[IDindividu]\n                        self.SelectObject(track)\n                        self.OuvrirFicheFamille(track)\n\n                    if IDfamille != None:\n                        self.OuvrirFicheFamille(IDfamille=IDfamille)\n\n                    # On relance le timer de détection RFID\n                    self.timer_rfid.Start()',
              '                    # Ne bloque pas la boucle wx et ne coupe pas le timer :\n                    # l\'anti-rebond est assuré par dernierRFID/delai.\n                    if IDindividu != None:\n                        track = self.dictTracks.get(IDindividu)\n                        if track is not None:\n                            self.SelectObject(track)\n                            self.OuvrirFicheFamille(track)\n                        elif IDfamille != None:\n                            self.OuvrirFicheFamille(IDfamille=IDfamille)\n\n                    elif IDfamille != None:\n                        self.OuvrirFicheFamille(IDfamille=IDfamille)',
              'callback RFID non bloquant',
          )

          individus_path.write_text(text, encoding="utf-8")

          preferences_path = Path("noethys/Dlg/DLG_Preferences.py")
          text = preferences_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '        self.ctrl_interface_mysql.Sauvegarde()\n        self.ctrl_email.Sauvegarde()',
              '        self.ctrl_interface_mysql.Sauvegarde()\n        self.ctrl_comptes_internet.Sauvegarde()\n        self.ctrl_email.Sauvegarde()',
              'sauvegarde comptes internet',
          )
          preferences_path.write_text(text, encoding="utf-8")

      - name: Compiler les fichiers modifiés
        run: python -m py_compile noethys/Ol/OL_Individus.py noethys/Dlg/DLG_Preferences.py

      - name: Vérifier les contrats ciblés
        shell: python
        run: |
          from pathlib import Path
          individus = Path("noethys/Ol/OL_Individus.py").read_text(encoding="utf-8")
          preferences = Path("noethys/Dlg/DLG_Preferences.py").read_text(encoding="utf-8")
          assert "and self.donnees" in individus
          assert "except :\n                IDindividu = None" in individus
          assert "self.dernierRFID == IDbadge" in individus
          assert "time.sleep(2)" not in individus
          assert "self.dictTracks.get(IDindividu)" in individus
          assert "self.ctrl_comptes_internet.Sauvegarde()" in preferences

      - name: Committer le patch et retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-vanilla-backport-155.yml
          git add noethys/Ol/OL_Individus.py noethys/Dlg/DLG_Preferences.py
          git commit -m "Vanilla: backporter les correctifs Individus et Préférences (#155)"
          git push origin HEAD:fix/vanilla-individus-preferences-backport
