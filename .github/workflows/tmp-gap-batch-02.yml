name: Temp gap batch 02
on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-02
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Patch source and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Ctrl/CTRL_ObjectListView.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''            typeDonnee = dictFiltre["typeDonnee"]\n            \n            # Texte''','''            typeDonnee = dictFiltre["typeDonnee"]\n            filtre = None\n            \n            # Texte''')
          old='''                if choix == "COMPRIS" :\n                    min = str(criteres.split(";")[0])\n                    max = str(criteres.split(";")[1])\n                else :\n                    criteres = str(criteres)\n                        \n                if choix == "EGAL" :\n                    filtre = "track.%s == %s" % (code, criteres)\n                if choix == "DIFFERENT" :\n                    filtre = "track.%s != %s" % (code, criteres)\n                if choix == "SUP" :\n                    filtre = "track.%s > %s" % (code, criteres)\n                if choix == "SUPEGAL" :\n                    filtre = "track.%s >= %s" % (code, criteres)\n                if choix == "INF" :\n                    filtre = "track.%s < %s" % (code, criteres)\n                if choix == "INFEGAL" :\n                    filtre = "track.%s <= %s" % (code, criteres)\n                if choix == "COMPRIS" :\n                    filtre = "track.%s >= %s and track.%s <= %s" % (code, min, code, max)'''
          new='''                if choix == "COMPRIS" :\n                    minimum, maximum = [str(valeur) for valeur in criteres.split(";")[:2]]\n                    filtre = "track.%s >= %s and track.%s <= %s" % (code, minimum, code, maximum)\n                else :\n                    criteres = str(criteres)\n                    if choix == "EGAL" :\n                        filtre = "track.%s == %s" % (code, criteres)\n                    elif choix == "DIFFERENT" :\n                        filtre = "track.%s != %s" % (code, criteres)\n                    elif choix == "SUP" :\n                        filtre = "track.%s > %s" % (code, criteres)\n                    elif choix == "SUPEGAL" :\n                        filtre = "track.%s >= %s" % (code, criteres)\n                    elif choix == "INF" :\n                        filtre = "track.%s < %s" % (code, criteres)\n                    elif choix == "INFEGAL" :\n                        filtre = "track.%s <= %s" % (code, criteres)'''
          if old not in s: raise SystemExit('numeric block not found')
          s=s.replace(old,new,1)
          old='''            # mémorisation\n            listeFiltresFinale.append(filtre)'''
          new='''            # mémorisation\n            if filtre is None :\n                raise ValueError("Filtre de colonne non supporté : type=%s choix=%s" % (typeDonnee, choix))\n            listeFiltresFinale.append(filtre)'''
          if old not in s: raise SystemExit('append block not found')
          s=s.replace(old,new,1)
          old='''        if mode == "individu" :\n            key = "inscriptions.IDindividu"\n        if mode == "famille" :\n            key = "inscriptions.IDfamille"'''
          new='''        if mode == "individu" :\n            key = "inscriptions.IDindividu"\n        elif mode == "famille" :\n            key = "inscriptions.IDfamille"\n        else :\n            raise ValueError("Mode d'inscription non supporté : %s" % mode)'''
          if old not in s: raise SystemExit('key block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/test_objectlistview_filter_contract.py')
          t.write_text('''import ast\nimport unittest\nfrom pathlib import Path\nfrom scripts import audit_branch_assignment_gaps\n\nROOT = Path(__file__).resolve().parents[1]\nSOURCE_ROOT = ROOT / "noethys"\nSOURCE_PATH = SOURCE_ROOT / "Ctrl" / "CTRL_ObjectListView.py"\n\ndef extract_method(name):\n    tree = ast.parse(SOURCE_PATH.read_text(encoding="utf-8"))\n    matches = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == name]\n    if len(matches) != 1:\n        raise AssertionError("method ambiguous: %s" % name)\n    module = ast.Module(body=[matches[0]], type_ignores=[])\n    ast.fix_missing_locations(module)\n    ns = {}\n    exec(compile(module, str(SOURCE_PATH), "exec"), ns)\n    return ns[name]\n\nclass FakeOwner:\n    def GetInscrits(self, **kwargs): return [1, 2]\n    def GetCotisations(self, **kwargs): return [3]\n\nclass ObjectListViewFilterContractTests(unittest.TestCase):\n    def test_numeric_range_keeps_historical_expression(self):\n        method = extract_method("formatageFiltres")\n        result = method(FakeOwner(), [{"code":"montant", "choix":"COMPRIS", "criteres":"10;20", "typeDonnee":"montant"}])\n        self.assertEqual(result, ["track.montant >= 10 and track.montant <= 20"])\n\n    def test_supported_text_filter_is_unchanged(self):\n        method = extract_method("formatageFiltres")\n        result = method(FakeOwner(), [{"code":"nom", "choix":"CONTIENT", "criteres":"abc", "typeDonnee":"texte"}])\n        self.assertEqual(result, ["track.nom != None and 'abc'.lower() in track.nom.lower()"])\n\n    def test_unsupported_filter_fails_explicitly(self):\n        method = extract_method("formatageFiltres")\n        with self.assertRaises(ValueError):\n            method(FakeOwner(), [{"code":"x", "choix":"INCONNU", "criteres":"", "typeDonnee":"texte"}])\n\n    def test_unsupported_inscription_mode_fails_before_database_access(self):\n        method = extract_method("GetInscrits")\n        criteres = {"listeActivites":[], "listeGroupes":[]}\n        with self.assertRaisesRegex(ValueError, "non supporté"):\n            method(FakeOwner(), mode="autre", choix="", criteres=criteres)\n\n    def test_targeted_gaps_are_gone(self):\n        findings = audit_branch_assignment_gaps.scan_file(SOURCE_PATH, SOURCE_ROOT)\n        targeted = [x for x in findings if x.get("function") in ("formatageFiltres", "GetInscrits") and x.get("name") in ("min", "max", "filtre", "key")]\n        self.assertEqual(targeted, [], targeted)\n\nif __name__ == "__main__": unittest.main()\n''', encoding='utf-8')
          PY
      - name: Validate targeted batch
        run: |
          python -m unittest tests.test_objectlistview_filter_contract
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json || true
          python - <<'PY'
          import json
          data=json.load(open('/tmp/gaps.json',encoding='utf-8'))
          items=data if isinstance(data,list) else data.get('findings',data.get('items',[]))
          print('BRANCH_ASSIGNMENT_GAPS',len(items))
          assert len(items) == 232, len(items)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ctrl/CTRL_ObjectListView.py tests/test_objectlistview_filter_contract.py
          git rm .github/workflows/tmp-gap-batch-02.yml
          git commit -m 'Fix — expliciter les contrats de filtres de colonnes'
          git push
