name: Atomic grid save

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_grid_save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fiabiliser Executermany et sauvegarde grille
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Executermany : statut + rollback
          p=Path('noethys/GestionDB.py')
          s=p.read_text(encoding='utf-8')
          old='''    def Executermany(self, req="", listeDonnees=[], commit=True):\n        """ Executemany pour local ou réseau """    \n        """ Exemple de req : "INSERT INTO table (IDtable, nom) VALUES (?, ?)" """  \n        """ Exemple de listeDonnees : [(1, 2), (3, 4), (5, 6)] """     \n        # Adaptation réseau/local\n        if self.isNetwork == True :\n            # Version MySQL\n            req = req.replace("?", "%s")\n        else:\n            # Version Sqlite\n            req = req.replace("%s", "?")\n        # Executemany\n        self.cursor.executemany(req, listeDonnees)\n        if commit == True :\n            self.connexion.commit()\n'''
          new='''    def Executermany(self, req="", listeDonnees=[], commit=True):\n        """ Executemany pour local ou réseau. Retourne True en cas de succès. """\n        # Adaptation réseau/local\n        if self.isNetwork == True :\n            req = req.replace("?", "%s")\n        else:\n            req = req.replace("%s", "?")\n        try:\n            self.cursor.executemany(req, listeDonnees)\n            if commit == True :\n                self.connexion.commit()\n            return True\n        except Exception as err:\n            print("Requete sql executemany incorrecte :\\n%s\\nErreur detectee:\\n%s" % (req, err))\n            try:\n                self.connexion.rollback()\n            except Exception:\n                pass\n            return False\n'''
          if s.count(old)!=1:
              raise SystemExit('Executermany motif inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 2) CTRL_Grille.Sauvegarde : contrôles + un seul commit + retour booléen
          p=Path('noethys/Ctrl/CTRL_Grille.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    def Sauvegarde(self):')
          end=s.index('    def SauvegardeTransports(self):', start)
          block=s[start:end]

          # Remplacements ciblés des écritures en lot.
          block=block.replace('            DB.Executermany("INSERT INTO prestations (%s) VALUES (%s)" % (texteChampsTemp, texteInterrogations), listeAjoutsPrestations, commit=False)',
                              '            if not DB.Executermany("INSERT INTO prestations (%s) VALUES (%s)" % (texteChampsTemp, texteInterrogations), listeAjoutsPrestations, commit=False):\n                DB.Close()\n                return False')
          block=block.replace('            DB.Executermany("INSERT INTO deductions (%s) VALUES (%s)" % (texteChampsTemp, texteInterrogations), listeAjoutsDeductions, commit=False)',
                              '            if not DB.Executermany("INSERT INTO deductions (%s) VALUES (%s)" % (texteChampsTemp, texteInterrogations), listeAjoutsDeductions, commit=False):\n                DB.Close()\n                return False')
          block=block.replace('            DB.Executermany("UPDATE prestations SET label=?, montant_initial=?, montant=?, forfait_date_debut=?, forfait_date_fin=?, code_compta=?, code_produit_local=?, tva=? WHERE IDprestation=?", listeModifications, commit=False)',
                              '            if not DB.Executermany("UPDATE prestations SET label=?, montant_initial=?, montant=?, forfait_date_debut=?, forfait_date_fin=?, code_compta=?, code_produit_local=?, tva=? WHERE IDprestation=?", listeModifications, commit=False):\n                DB.Close()\n                return False')
          block=block.replace('            DB.Executermany("INSERT INTO consommations (%s) VALUES (%s)" % (texteChampsTemp, texteInterrogations), listeAjouts, commit=False)',
                              '            if not DB.Executermany("INSERT INTO consommations (%s) VALUES (%s)" % (texteChampsTemp, texteInterrogations), listeAjouts, commit=False):\n                DB.Close()\n                return False')
          block=block.replace('            DB.Executermany("UPDATE consommations SET %s WHERE IDconso=?" % ", ".join(listeChampsTemp), listeModifications, commit=False)',
                              '            if not DB.Executermany("UPDATE consommations SET %s WHERE IDconso=?" % ", ".join(listeChampsTemp), listeModifications, commit=False):\n                DB.Close()\n                return False')

          # Les DELETE de la méthode doivent également réussir.
          delete_lines=[line for line in block.splitlines() if 'DB.ExecuterReq("DELETE ' in line]
          for line in delete_lines:
              indent=line[:len(line)-len(line.lstrip())]
              expr=line.strip()[len('DB.ExecuterReq('):-1]
              replacement=indent+'if not DB.ExecuterReq('+expr+'):\n'+indent+'    try:\n'+indent+'        DB.connexion.rollback()\n'+indent+'    except Exception:\n'+indent+'        pass\n'+indent+'    DB.Close()\n'+indent+'    return False'
              block=block.replace(line,replacement,1)

          # Supprime uniquement le commit intermédiaire avant les mémos.
          marker='''        # Application des modifications dans la base de données\n        DB.Commit()\n\n        # ---------------- Sauvegarde des mémos journaliers -------------------'''
          replacement='''        # Les consommations, prestations, mémos et historique sont validés ensemble.\n\n        # ---------------- Sauvegarde des mémos journaliers -------------------'''
          if block.count(marker)!=1:
              raise SystemExit('commit intermédiaire introuvable')
          block=block.replace(marker,replacement,1)

          # Vérifie les opérations de mémos.
          block=block.replace('                IDmemo = DB.ReqInsert("memo_journee", listeDonnees, commit=False)',
                              '                IDmemo = DB.ReqInsert("memo_journee", listeDonnees, commit=False)\n                if IDmemo is None:\n                    DB.Close()\n                    return False')
          block=block.replace('                DB.ReqMAJ("memo_journee", listeDonnees, "IDmemo", IDmemo, commit=False)',
                              '                if not DB.ReqMAJ("memo_journee", listeDonnees, "IDmemo", IDmemo, commit=False):\n                    DB.Close()\n                    return False')
          block=block.replace('                DB.ReqDEL("memo_journee", "IDmemo", IDmemo, commit=False)',
                              '                if not DB.ReqDEL("memo_journee", "IDmemo", IDmemo, commit=False):\n                    DB.Close()\n                    return False')

          # Retour explicite après le commit final.
          old_end='''        # Cloture de la DB\n        DB.Close()\n\n\n'''
          new_end='''        # Cloture de la DB\n        DB.Close()\n        return True\n\n\n'''
          if block.count(old_end)!=1:
              raise SystemExit('fin Sauvegarde inattendue')
          block=block.replace(old_end,new_end,1)
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')

          # 3) Le wrapper badgeage propage l'échec et capture une exception inattendue.
          p=Path('noethys/Dlg/DLG_Badgeage_grille.py')
          s=p.read_text(encoding='utf-8')
          old='''    def Sauvegarde(self):\n        """ Sauvegarde de la grille """\n        self.grille.Sauvegarde()\n        self.grille.SauvegardeTransports()\n'''
          new='''    def Sauvegarde(self):\n        """ Sauvegarde de la grille. Retourne False si une écriture échoue. """\n        try:\n            if self.grille.Sauvegarde() == False:\n                return False\n            self.grille.SauvegardeTransports()\n            return True\n        except Exception as err:\n            print("Erreur durant la sauvegarde de la grille : %s" % err)\n            return False\n'''
          if s.count(old)!=1:
              raise SystemExit('wrapper Sauvegarde motif inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 4) Le traitement portail refuse de valider si la grille n'est pas sauvegardée.
          p=Path('noethys/Dlg/DLG_Saisie_portail_demande.py')
          s=p.read_text(encoding='utf-8')
          old='''            if reponse_modal == wx.ID_OK :\n                self.Save_grille(dlg.ctrl_grille)\n                self.EcritLog(_(u"Enregistrement des consommations"))\n'''
          new='''            if reponse_modal == wx.ID_OK :\n                if self.Save_grille(dlg.ctrl_grille) == False:\n                    self.EcritLog(_(u"[ERREUR] Les consommations n'ont pas pu être enregistrées."))\n                    dlg = wx.MessageDialog(self.parent, _(u"Les réservations n'ont pas pu être enregistrées. La demande reste non validée."), _(u"Erreur d'enregistrement"), wx.OK | wx.ICON_ERROR)\n                    dlg.ShowModal()\n                    dlg.Destroy()\n                    return False\n                self.EcritLog(_(u"Enregistrement des consommations"))\n'''
          if s.count(old)!=1:
              raise SystemExit('Traitement_reservations motif inattendu')
          s=s.replace(old,new,1)
          old='''    def Save_grille(self, ctrl_grille=None):\n        """ Sauvegarde de la grille des conso """\n        ctrl_grille.Sauvegarde()\n'''
          new='''    def Save_grille(self, ctrl_grille=None):\n        """ Sauvegarde de la grille des conso """\n        return ctrl_grille.Sauvegarde()\n'''
          if s.count(old)!=1:
              raise SystemExit('Save_grille motif inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/GestionDB.py noethys/Ctrl/CTRL_Grille.py noethys/Dlg/DLG_Badgeage_grille.py noethys/Dlg/DLG_Saisie_portail_demande.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          g=Path('noethys/GestionDB.py').read_text(encoding='utf-8')
          c=Path('noethys/Ctrl/CTRL_Grille.py').read_text(encoding='utf-8')
          b=Path('noethys/Dlg/DLG_Badgeage_grille.py').read_text(encoding='utf-8')
          d=Path('noethys/Dlg/DLG_Saisie_portail_demande.py').read_text(encoding='utf-8')
          assert 'return True\n        except Exception as err:' in g
          assert 'Les consommations, prestations, mémos et historique sont validés ensemble.' in c
          assert 'return True\n\n\n    def SauvegardeTransports' in c
          assert 'if self.grille.Sauvegarde() == False:' in b
          assert 'return ctrl_grille.Sauvegarde()' in d
          assert 'La demande reste non validée.' in d
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/GestionDB.py noethys/Ctrl/CTRL_Grille.py noethys/Dlg/DLG_Badgeage_grille.py noethys/Dlg/DLG_Saisie_portail_demande.py
          git commit -m "fix: rendre atomique la sauvegarde des réservations"
          git push origin HEAD:master