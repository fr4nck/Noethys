name: Temporary grid family-count tariff patch

on:
  push:
    branches:
      - audit/grid-family-count-tariffs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/grid-family-count-tariffs
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply targeted source fix and regression
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Run targeted regression
        run: python -m unittest tests.test_ctrl_grille_family_count_tariffs -v
      - name: Commit final lot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Audit: sécuriser le tarif famille nul"
          git push origin HEAD:audit/grid-family-count-tariffs
