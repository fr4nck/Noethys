name: TEMP image color contract

on:
  push:
    branches:
      - fix/image-color-contract

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/image-color-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Tester le contrat et recompter le peigne
        env:
          PYTHONPATH: ${{ github.workspace }}/noethys:${{ github.workspace }}
        run: |
          python -m unittest tests.test_utils_images_color_contract -v
          python scripts/audit_branch_assignment_gaps.py --json /tmp/branch-gaps.json | tee /tmp/branch-gaps.txt
          grep 'BRANCH_ASSIGNMENT_GAPS=' /tmp/branch-gaps.txt
      - name: Retirer ce workflow temporaire
        run: |
          rm .github/workflows/tmp-image-color-contract.yml
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git add .github/workflows/tmp-image-color-contract.yml
          git commit -m "CI temporaire — retirer la validation couleur images"
          git push origin HEAD:fix/image-color-contract
