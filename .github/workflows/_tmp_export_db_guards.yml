name: Guard export DB rows

on:
  push:
    paths:
      - '.github/workflows/_tmp_export_db_guards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Protéger les accès DB des exports
        run: |
          python - <<'PY'
          from pathlib import Path
          patches={
            Path('noethys/Utils/UTILS_Export_documents.py'):[
              ('''    listeDonnees = DB.ResultatReq()\n    nom, categorie, largeur, hauteur, IDfond, defaut = listeDonnees[0]\n''', '''    listeDonnees = DB.ResultatReq()\n    if not listeDonnees:\n        DB.Close()\n        return False\n    nom, categorie, largeur, hauteur, IDfond, defaut = listeDonnees[0]\n'''),
            ],
            Path('noethys/Utils/UTILS_Export_noethysweb.py'):[
              ('''                    self.parent.DB.ExecuterReq(req)\n                    logo = self.parent.DB.ResultatReq()[0][0]\n                    if logo != None:\n''', '''                    self.parent.DB.ExecuterReq(req)\n                    liste_logo = self.parent.DB.ResultatReq()\n                    logo = liste_logo[0][0] if liste_logo else None\n                    if logo != None:\n'''),
              ('''                self.parent.DB.ExecuterReq(req)\n                IDreglement, IDcompte_payeur = self.parent.DB.ResultatReq()[0]\n                req = "SELECT IDpayeur, IDcompte_payeur FROM payeurs WHERE IDcompte_payeur=%d;" % IDcompte_payeur\n                self.parent.DB.ExecuterReq(req)\n                IDpayeur, IDcompte_payeur = self.parent.DB.ResultatReq()[0]\n                return IDpayeur\n            except:\n                pass\n''', '''                self.parent.DB.ExecuterReq(req)\n                liste_reglements = self.parent.DB.ResultatReq()\n                if not liste_reglements:\n                    return valeur\n                IDreglement, IDcompte_payeur = liste_reglements[0]\n                req = "SELECT IDpayeur, IDcompte_payeur FROM payeurs WHERE IDcompte_payeur=%d;" % IDcompte_payeur\n                self.parent.DB.ExecuterReq(req)\n                liste_payeurs = self.parent.DB.ResultatReq()\n                if not liste_payeurs:\n                    return valeur\n                IDpayeur, IDcompte_payeur = liste_payeurs[0]\n                return IDpayeur\n            except Exception:\n                pass\n'''),
            ],
          }
          for path,repls in patches.items():
              s=path.read_text(encoding='utf-8')
              for old,new in repls:
                  count=s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: motif attendu 1 fois, trouvé {count}')
                  s=s.replace(old,new,1)
              path.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Export_documents.py noethys/Utils/UTILS_Export_noethysweb.py
          python scripts/audit_runtime_patterns.py --json runtime.json
          git diff --check
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Export_documents.py noethys/Utils/UTILS_Export_noethysweb.py
          git commit -m 'fix: protéger les exports contre les données absentes'
          git push origin HEAD:master