name: Temporary synchronisation data branch fix

on:
  push:
    branches:
      - fix/synchronisation-donnees-branch-gaps
    paths:
      - .github/workflows/tmp-sync-data-branch-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/synchronisation-donnees-branch-gaps
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Patch synchronisation contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path('noethys/Dlg/DLG_Synchronisation_donnees.py')
          text = path.read_text(encoding='utf-8')

          old_intro = '''        if nbreErreurs > 0 or nbreNonTraites > 0 :\n            if nbreErreurs > 0 and nbreNonTraites == 0 : intro = _(u"%d erreurs ont été trouvées lors de l'importation. ") % nbreErreurs\n            if nbreErreurs == 0 and nbreNonTraites > 0 : intro = _(u"%d actions n'ont pas été traitées. ") % nbreNonTraites\n            if nbreErreurs > 0 and nbreNonTraites > 0 : intro = _(u"%d actions n'ont pas été traitées et %d erreurs ont été trouvées. ") % (nbreErreurs, nbreNonTraites)\n'''
          new_intro = '''        if nbreErreurs > 0 or nbreNonTraites > 0 :\n            if nbreErreurs > 0 and nbreNonTraites == 0 :\n                intro = _(u"%d erreurs ont été trouvées lors de l'importation. ") % nbreErreurs\n            elif nbreErreurs == 0 :\n                intro = _(u"%d actions n'ont pas été traitées. ") % nbreNonTraites\n            else :\n                intro = _(u"%d actions n'ont pas été traitées et %d erreurs ont été trouvées. ") % (nbreErreurs, nbreNonTraites)\n'''

          marker = '''class Abort(Exception): \n    pass \n\nclass Traitement(Thread): \n'''
          replacement = '''ETATS_CONSOMMATION = {\n    "reservation": ("reservation", "reservation"),\n    "attente": ("attente", "reservation"),\n    "refus": ("refus", "reservation"),\n    "present": ("reservation", "present"),\n    "absenti": ("reservation", "absenti"),\n    "absentj": ("reservation", "absentj"),\n}\n\ndef GetModeEtatConsommation(etat):\n    return ETATS_CONSOMMATION.get(etat)\n\n\nclass Abort(Exception): \n    pass \n\nclass Traitement(Thread): \n'''

          old_conso = '''                        if track.etat == "reservation" : mode, etat = "reservation", "reservation"\n                        if track.etat == "attente" : mode, etat = "attente", "reservation"\n                        if track.etat == "refus" : mode, etat = "refus", "reservation"\n                        if track.etat == "present" : mode, etat = "reservation", "present"\n                        if track.etat == "absenti" : mode, etat = "reservation", "absenti"\n                        if track.etat == "absentj" : mode, etat = "reservation", "absentj"\n\n                        heure_debut = self.ConvertitHeure(track.heure_debut)\n                        heure_fin = self.ConvertitHeure(track.heure_fin)\n\n                        if track.action == "ajouter" or track.action == "modifier" :\n                            resultat = self.parent.ctrl_grille.SaisieConso(IDunite=track.IDunite, mode=mode, etat=etat, heure_debut=heure_debut, heure_fin=heure_fin, quantite=track.quantite)\n                        if track.action == "supprimer" :\n                            resultat = self.parent.ctrl_grille.SupprimeConso(IDunite=track.IDunite, date=track.date)\n'''
          new_conso = '''                        mode_etat = GetModeEtatConsommation(track.etat)\n                        if mode_etat is None :\n                            resultat = _(u"État de consommation inconnu : %s") % track.etat\n                        else :\n                            mode, etat = mode_etat\n                            heure_debut = self.ConvertitHeure(track.heure_debut)\n                            heure_fin = self.ConvertitHeure(track.heure_fin)\n\n                            if track.action == "ajouter" or track.action == "modifier" :\n                                resultat = self.parent.ctrl_grille.SaisieConso(IDunite=track.IDunite, mode=mode, etat=etat, heure_debut=heure_debut, heure_fin=heure_fin, quantite=track.quantite)\n                            elif track.action == "supprimer" :\n                                resultat = self.parent.ctrl_grille.SupprimeConso(IDunite=track.IDunite, date=track.date)\n                            else :\n                                resultat = _(u"Action de consommation inconnue : %s") % track.action\n'''

          for old, new, label in (
              (old_intro, new_intro, 'archive intro'),
              (marker, replacement, 'state mapping'),
              (old_conso, new_conso, 'consumption processing'),
          ):
              if text.count(old) != 1:
                  raise SystemExit('Bloc attendu absent ou ambigu: %s' % label)
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
      - name: Validate targeted source
        run: |
          python -m py_compile noethys/Dlg/DLG_Synchronisation_donnees.py
          python -m unittest tests.test_synchronisation_donnees_hardening -v
          python - <<'PY'
          from pathlib import Path
          from scripts import audit_branch_assignment_gaps
          path = Path('noethys/Dlg/DLG_Synchronisation_donnees.py').resolve()
          findings = audit_branch_assignment_gaps.scan_file(path)
          targets = {
              ('ArchiverFichiers', 'intro'),
              ('run', 'mode'),
              ('run', 'etat'),
              ('run', 'resultat'),
          }
          remaining = [item for item in findings if (item['function'], item['name']) in targets]
          if remaining:
              raise SystemExit('Signaux résiduels: %r' % remaining)
          print('Synchronisation targeted branch gaps: 0')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-sync-data-branch-fix.yml
          git add noethys/Dlg/DLG_Synchronisation_donnees.py
          git commit -m 'Fix: sécuriser les états et actions de synchronisation'
          git push origin HEAD:fix/synchronisation-donnees-branch-gaps
