name: tmp gap patch 13 review2

on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-13

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-gap-batch-13
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply review patch
        run: python scripts/tmp_patch_gap_batch_13_review2.py
      - name: Targeted tests
        run: python -m unittest tests.test_small_ui_branch_contracts_batch_13 -v
      - name: Audit count and exhaustive coverage
        run: |
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json | tee /tmp/audit.txt
          python - <<'PY'
          import json, re
          data = json.load(open('/tmp/gaps.json', encoding='utf-8'))
          assert data['count'] == 170, data['count']
          text = open('/tmp/audit.txt', encoding='utf-8').read()
          assert 'BRANCH_ASSIGNMENT_GAPS=170' in text
          m = re.search(r'trouvés=(\d+), lus=(\d+), parsés=(\d+)', text)
          assert m and len(set(m.groups())) == 1, m.groups() if m else None
          PY
      - name: Remove temporary infrastructure and commit
        run: |
          git rm scripts/tmp_patch_gap_batch_13_review2.py .github/workflows/tmp-gap-patch-13-review2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add noethys/Ctrl/CTRL_Grille_renderers.py tests/test_small_ui_branch_contracts_batch_13.py
          git commit -m "fix: valider la position avant le retour anticipé"
          git push
