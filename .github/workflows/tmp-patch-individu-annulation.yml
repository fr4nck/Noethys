name: tmp patch individu annulation
on:
  push:
    paths:
      - 'tools/tmp_patch_individu_annulation.py'
      - '.github/workflows/tmp-patch-individu-annulation.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch
        run: python tools/tmp_patch_individu_annulation.py
      - name: Checks
        run: |
          python -m py_compile noethys/Dlg/DLG_Individu.py
          git diff --check
          grep -q 'suppressions = \[' noethys/Dlg/DLG_Individu.py
          grep -q 'ReqDEL(table, champ, self.IDindividu, commit=False)' noethys/Dlg/DLG_Individu.py
          grep -q 'DB.Commit()' noethys/Dlg/DLG_Individu.py
          grep -q 'DBphotos = GestionDB.DB(suffixe="PHOTOS")' noethys/Dlg/DLG_Individu.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Individu.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: atomiser annulation des nouvelles fiches individu'
          git pull --rebase origin master
          git push origin HEAD:master
