name: Apply deduction synthesis Python 3 fix

on:
  push:
    branches:
      - fix/vanilla-final-runtime-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla-final-runtime-pass

      - name: Replace Python 2-only unicode conversion
        shell: python
        run: |
          from pathlib import Path
          path = Path("noethys/Ctrl/CTRL_Synthese_deductions.py")
          text = path.read_text(encoding="utf-8")
          old = "                self.SetCellValue(numLigne, numColonne, unicode(valeur))\n"
          new = "                self.SetCellValue(numLigne, numColonne, six.text_type(valeur))\n"
          if text.count(old) != 1:
              raise SystemExit(f"unicode target count: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Validate and compile
        shell: python
        run: |
          import ast
          from pathlib import Path
          path = Path("noethys/Ctrl/CTRL_Synthese_deductions.py")
          text = path.read_text(encoding="utf-8")
          ast.parse(text, filename=str(path))
          assert "SetCellValue(numLigne, numColonne, unicode(valeur))" not in text
          assert "SetCellValue(numLigne, numColonne, six.text_type(valeur))" in text

      - name: Compile changed Python file
        run: python -m py_compile noethys/Ctrl/CTRL_Synthese_deductions.py

      - name: Commit application fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_apply-final-runtime-pass-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Ctrl/CTRL_Synthese_deductions.py .github/workflows/_apply-final-runtime-pass-2.yml
          git commit -m "Vanilla: corriger la synthèse des déductions sous Python 3"
          git push origin HEAD:fix/vanilla-final-runtime-pass
