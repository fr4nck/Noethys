name: tmp gap patch 08
on:
  push:
    branches: [fix/branch-assignment-gap-batch-08]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Appliquer et valider
        run: |
          python scripts/tmp_patch_gap_batch_08.py
          python -m unittest tests.test_saisie_transport_branch_contract
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json
          python - <<'PY'
          import json
          with open('/tmp/gaps.json', encoding='utf-8') as fh:
              report = json.load(fh)
          print('COUNT', report['count'])
          assert report['count'] == 198, report['count']
          PY
      - name: Nettoyer et pousser
        run: |
          git rm scripts/tmp_patch_gap_batch_08.py .github/workflows/tmp-gap-patch-08.yml .github/workflows/tmp-gap-inventory-08.yml
          git add noethys/Ctrl/CTRL_Saisie_transport.py tests/test_saisie_transport_branch_contract.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: expliciter les contrats de saisie transport"
          git push
