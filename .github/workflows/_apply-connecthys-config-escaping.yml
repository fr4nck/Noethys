name: Apply Connecthys config escaping fix

on:
  push:
    branches:
      - fix/vanilla-connecthys-config-escaping

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla-connecthys-config-escaping
          fetch-depth: 0

      - name: Safely serialize Connecthys configuration values
        shell: python
        run: |
          from pathlib import Path

          path = Path("noethys/Utils/UTILS_Portail_synchro.py")
          text = path.read_text(encoding="utf-8")

          old_import = 'from six.moves.urllib.request import Request, urlopen\n'
          new_import = old_import + 'from six.moves.urllib.parse import quote\n'
          if text.count(old_import) != 1:
              raise SystemExit(f"urllib request import count: {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_helper = '''        def Ecrit_ligne(key="", valeur="", type_valeur=None):
              if type_valeur == six.text_type :
                  valeur = u'u"%s"' % valeur
              elif type_valeur == str :
                  valeur = u'"%s"' % valeur
              elif type_valeur == None :
                  valeur = valeur
              else :
                  valeur = str(valeur)
              return u"     %s = %s\\n" % (key, valeur)
          '''
          old_helper = old_helper.replace('              ', '            ', 7)
          new_helper = '''        def Ecrit_ligne(key="", valeur="", type_valeur=None):
              if type_valeur in (six.text_type, str):
                  valeur = repr(valeur)
              elif type_valeur == None :
                  valeur = valeur
              else :
                  valeur = str(valeur)
              return u"     %s = %s\\n" % (key, valeur)

          def Encode_uri_component(valeur):
              if valeur is None:
                  valeur = u""
              elif not isinstance(valeur, six.text_type):
                  valeur = six.text_type(valeur)
              if six.PY2:
                  valeur = valeur.encode("utf8")
              return quote(valeur, safe="")
          '''
          new_helper = new_helper.replace('              ', '            ', 10)
          if text.count(old_helper) != 1:
              raise SystemExit(f"Ecrit_ligne helper count: {text.count(old_helper)}")
          text = text.replace(old_helper, new_helper, 1)

          old_db = '''            db_serveur = self.dict_parametres["db_serveur"]
              db_utilisateur = self.dict_parametres["db_utilisateur"]
              db_mdp = self.dict_parametres["db_mdp"]
              db_nom = self.dict_parametres["db_nom"]
              liste_lignes.append(Ecrit_ligne("SQLALCHEMY_DATABASE_URI", "mysql://%s:%s@%s/%s?charset=utf8" % (db_utilisateur, db_mdp, db_serveur, db_nom), type_valeur=str))
          '''
          old_db = old_db.replace('              ', '            ', 5)
          new_db = '''            db_serveur = self.dict_parametres["db_serveur"]
              db_utilisateur = Encode_uri_component(self.dict_parametres["db_utilisateur"])
              db_mdp = Encode_uri_component(self.dict_parametres["db_mdp"])
              db_nom = Encode_uri_component(self.dict_parametres["db_nom"])
              liste_lignes.append(Ecrit_ligne("SQLALCHEMY_DATABASE_URI", "mysql://%s:%s@%s/%s?charset=utf8" % (db_utilisateur, db_mdp, db_serveur, db_nom), type_valeur=str))
          '''
          new_db = new_db.replace('              ', '            ', 5)
          if text.count(old_db) != 1:
              raise SystemExit(f"MySQL URI block count: {text.count(old_db)}")
          text = text.replace(old_db, new_db, 1)

          path.write_text(text, encoding="utf-8")

      - name: Test Python literals and URI components
        shell: python
        run: |
          import ast
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          text = Path("noethys/Utils/UTILS_Portail_synchro.py").read_text(encoding="utf-8")
          tree = ast.parse(text)

          nested = {}
          for node in tree.body:
              if isinstance(node, ast.ClassDef) and node.name == "Synchro":
                  for child in node.body:
                      if isinstance(child, ast.FunctionDef) and child.name == "Upload_config":
                          for helper in child.body:
                              if isinstance(helper, ast.FunctionDef) and helper.name in ("Ecrit_ligne", "Encode_uri_component"):
                                  nested[helper.name] = helper

          assert set(nested) == {"Ecrit_ligne", "Encode_uri_component"}

          module = ast.Module(
              body=[
                  ast.Import(names=[ast.alias(name="six")]),
                  ast.ImportFrom(module="six.moves.urllib.parse", names=[ast.alias(name="quote")], level=0),
                  nested["Ecrit_ligne"],
                  nested["Encode_uri_component"],
              ],
              type_ignores=[],
          )
          ast.fix_missing_locations(module)
          namespace = {}
          exec(compile(module, "helpers", "exec"), namespace)

          ecrit = namespace["Ecrit_ligne"]
          encode = namespace["Encode_uri_component"]

          for value in ['mot"de\\passe\nligne', "apostrophe'", "accentué", "100%"]:
              assignment = ecrit("VALUE", value, type_valeur=str).strip()
              result = {}
              exec(assignment, {}, result)
              assert result["VALUE"] == value

          username = "user@domain:admin%"
          password = 'p@ss:word%/\\"'
          database = "base/name%test"
          eu, ep, ed = encode(username), encode(password), encode(database)
          assert eu == "user%40domain%3Aadmin%25"
          assert ep == "p%40ss%3Aword%25%2F%5C%22"
          assert ed == "base%2Fname%25test"

          uri = "mysql://%s:%s@db.example/%s?charset=utf8" % (eu, ep, ed)
          parsed = urlsplit(uri)
          assert unquote(parsed.username) == username
          assert unquote(parsed.password) == password
          assert unquote(parsed.path.lstrip("/")) == database

          compile(text, "noethys/Utils/UTILS_Portail_synchro.py", "exec")

      - name: Commit application fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_apply-connecthys-config-escaping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Utils/UTILS_Portail_synchro.py .github/workflows/_apply-connecthys-config-escaping.yml
          git commit -m "Vanilla: sécuriser la génération de config Connecthys"
          git push origin HEAD:fix/vanilla-connecthys-config-escaping
