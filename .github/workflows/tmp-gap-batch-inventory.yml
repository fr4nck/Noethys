name: Temp gap batch patch
on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-01
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-gap-batch-01
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Patch source and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('noethys/Ctrl/CTRL_Droits.py')
          s = p.read_text(encoding='utf-8')
          old = '''            # Groupe de catégorie\n            if type(dictCategorie) != dict :\n                typeLigne = "groupe"\n                nomGroupe = dictCategorie\n                hauteurLigne = 20\n                self.SetRowLabelValue(numLigne, nomGroupe)\n                self.SetRowSize(numLigne, hauteurLigne)\n                self.SetRowLabelRenderer(numLigne, MyRowLabelRenderer(COULEUR_CASE_GROUPE))\n                numGroupe += 1\n            \n            \n            # Catégorie\n            if type(dictCategorie) == dict :\n                typeLigne = "categorie"'''
          new = '''            # Groupe de catégorie\n            if type(dictCategorie) != dict :\n                typeLigne = "groupe"\n                nomGroupe = dictCategorie\n                hauteurLigne = 20\n                self.SetRowLabelValue(numLigne, nomGroupe)\n                self.SetRowSize(numLigne, hauteurLigne)\n                self.SetRowLabelRenderer(numLigne, MyRowLabelRenderer(COULEUR_CASE_GROUPE))\n                numGroupe += 1\n            \n            \n            # Catégorie\n            else :\n                typeLigne = "categorie"'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                if typeLigne == "groupe" :\n                    etat = "groupe"\n                    \n                if typeLigne == "categorie" :'''
          new = '''                if typeLigne == "groupe" :\n                    etat = "groupe"\n                    \n                else :'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        self.case_selection = None\n        if (numLigne, numColonne) in self.dictCases :\n            case = self.dictCases[(numLigne, numColonne)]'''
          new = '''        self.case_selection = None\n        case = None\n        if (numLigne, numColonne) in self.dictCases :\n            case = self.dictCases[(numLigne, numColonne)]'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        # sélectionne l'état à appliquer\n        if str(ID)[0] == "1" :'''
          new = '''        # sélectionne l'état à appliquer\n        etat = None\n        IDcommande = None\n        if str(ID)[0] == "1" :'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_ctrl_droits_branch_contract.py')
          t.write_text('''import unittest\nfrom pathlib import Path\nfrom scripts import audit_branch_assignment_gaps\n\nROOT = Path(__file__).resolve().parents[1]\nSOURCE_ROOT = ROOT / "noethys"\nSOURCE_PATH = SOURCE_ROOT / "Ctrl" / "CTRL_Droits.py"\n\nTARGETS = {\n    ("InitGrid", "typeLigne"),\n    ("InitGrid", "etat"),\n    ("OnRightClick", "case"),\n    ("OnActionMenuContextuel", "etat"),\n    ("OnActionMenuContextuel", "IDcommande"),\n}\n\nclass CtrlDroitsBranchContractTests(unittest.TestCase):\n    def test_targeted_branch_assignment_gaps_are_gone(self):\n        findings = audit_branch_assignment_gaps.scan_file(SOURCE_PATH, SOURCE_ROOT)\n        targeted = [\n            item for item in findings\n            if (item.get("function"), item.get("name")) in TARGETS\n        ]\n        self.assertEqual(targeted, [], targeted)\n\n    def test_source_compiles(self):\n        compile(SOURCE_PATH.read_text(encoding="utf-8"), str(SOURCE_PATH), "exec")\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Validate targeted batch
        run: |
          python -m unittest tests.test_ctrl_droits_branch_contract -v
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json || true
          python - <<'PY'
          import json
          data=json.load(open('/tmp/gaps.json', encoding='utf-8'))
          items=data if isinstance(data,list) else data.get('findings', data.get('items', []))
          print('COUNT_AFTER', len(items))
          hits=[x for x in items if x.get('file') == 'Ctrl/CTRL_Droits.py']
          print('CTRL_DROITS_GAPS', hits)
          if hits: raise SystemExit(1)
          if len(items) != 236: raise SystemExit('Expected 236 gaps, got %s' % len(items))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add noethys/Ctrl/CTRL_Droits.py tests/test_ctrl_droits_branch_contract.py
          git rm .github/workflows/tmp-gap-batch-inventory.yml
          git commit -m "Fix — traiter un lot de droits conditionnels"
          git push
