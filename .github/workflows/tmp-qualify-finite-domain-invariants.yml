name: Temporary qualify finite-domain invariants

on:
  push:
    branches:
      - audit/finite-domain-safe-invariants

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/finite-domain-safe-invariants
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Qualifier les invariants de domaine fini
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          from scripts import audit_branch_assignment_gaps as audit
          from scripts import qualify_branch_assignment_gaps as qualify

          root = Path('noethys')
          specs = (
              ('Dlg/DLG_Impression_don_oeuvres.py', 'SetListeDonnees', 'nomTitulaires', 'body_only'),
              ('Dlg/DLG_Saisie_cotisation.py', 'SetListeDonnees', 'nomTitulaires', 'body_only'),
              ('Dlg/DLG_Saisie_cotisation.py', 'MAJ', 'nomTitulaires', 'body_only'),
              ('Dlg/DLG_Saisie_cotisation.py', 'MAJ', 'IDcompte_payeur', 'body_only'),
              ('Ol/OL_Etat_nomin_resultats.py', '__init__', 'valeur', 'body_only'),
              ('Utils/UTILS_Sauvegarde.py', 'Sauvegarde', 'err', 'body_only'),
              ('Dlg/DLG_Releve_prestations_saisie.py', 'GetOptions', 'regroupement', 'body_only'),
              ('Dlg/DLG_Saisie_texte_html.py', 'Importation', 'condition', 'body_only'),
              ('Dlg/DLG_Stats.py', 'Imprimer', 'html', 'body_only'),
              ('Utils/UTILS_Stats_modeles.py', 'GetHTML', 'html', 'body_only'),
          )
          reasons = {
              ('Dlg/DLG_Impression_don_oeuvres.py', 'SetListeDonnees', 'nomTitulaires'): "nbreTitulaires provient de len(listeTitulaires), donc est un entier >= 0 ; les cas 0, 1, 2 et > 2 sont exhaustifs et affectent tous nomTitulaires avant sa lecture",
              ('Dlg/DLG_Saisie_cotisation.py', 'SetListeDonnees', 'nomTitulaires'): "nbreTitulaires provient de len(listeTitulaires), donc est un entier >= 0 ; les cas 0, 1, 2 et > 2 sont exhaustifs et affectent tous nomTitulaires avant sa lecture",
              ('Dlg/DLG_Saisie_cotisation.py', 'MAJ', 'nomTitulaires'): "nbreTitulaires provient de len(listeTitulaires), donc est un entier >= 0 ; les cas 0, 1, 2 et > 2 sont exhaustifs et affectent tous nomTitulaires avant sa lecture",
              ('Dlg/DLG_Saisie_cotisation.py', 'MAJ', 'IDcompte_payeur'): "si listeTitulaires est vide, la branche nbreTitulaires == 0 affecte explicitement IDcompte_payeur à None ; sinon la boucle ayant construit listeTitulaires a exécuté au moins une itération et a déjà affecté IDcompte_payeur",
              ('Ol/OL_Etat_nomin_resultats.py', '__init__', 'valeur'): "prefixe parcourt exclusivement NBRE, TEMPS et TEMPS_FACTURE ; en absence de données, NBRE affecte valeur à 0 et les deux autres valeurs du domaine l'affectent à un timedelta nul avant setattr",
              ('Utils/UTILS_Sauvegarde.py', 'Sauvegarde', 'err'): "err est lié par le except Exception as err externe ; le try/except interne ne possède pas de cible d'exception et ne supprime donc jamais cette liaison avant le message d'erreur",
              ('Dlg/DLG_Releve_prestations_saisie.py', 'GetOptions', 'regroupement'): "ctrl_regroupement_date est un wx.Choice à trois valeurs initialisé sur l'index 0 ; lorsque le regroupement est activé, les index possibles 0, 1 et 2 affectent tous regroupement, sinon il vaut explicitement None",
              ('Dlg/DLG_Saisie_texte_html.py', 'Importation', 'condition'): "le constructeur n'appelle Importation que si IDelement ou categorie est non nul ; Importation affecte condition sous chacun de ces deux gardes avant la requête",
              ('Dlg/DLG_Stats.py', 'Imprimer', 'html'): "Imprimer n'est relié qu'aux trois commandes de menu 10, 20 et 30 ; chacune de ces trois valeurs affecte html avant le contrôle de longueur",
              ('Utils/UTILS_Stats_modeles.py', 'GetHTML', 'html'): "le garde initial rejette explicitement tout mode autre que affichage ou impression ; chacune des deux valeurs autorisées affecte html avant le retour final",
          }

          entries = []
          seen = set()
          for relative, function, name, detail in specs:
              findings = audit.scan_file(root / relative, root)
              matches = [item for item in findings if item['function'] == function and item['name'] == name and item['detail'] == detail]
              if len(matches) != 1:
                  raise SystemExit(f'{relative}::{function}::{name}: {len(matches)} candidat(s), attendu 1')
              key = qualify.qualification_key(matches[0], root)
              if key is None:
                  raise SystemExit(f'Empreinte impossible pour {relative}::{function}::{name}')
              if key in seen:
                  raise SystemExit(f'Clé dupliquée inattendue: {key!r}')
              seen.add(key)
              reason = reasons[(relative, function, name)]
              entries.append((key, reason))

          qualifier = Path('scripts/qualify_branch_assignment_gaps.py')
          source = qualifier.read_text(encoding='utf-8')
          marker = '\n}\n\ndef _candidate_fingerprint'
          if source.count(marker) != 1:
              raise SystemExit('Structure du registre EXPLICIT_SAFE inattendue')
          missing = []
          for key, reason in entries:
              fingerprint = key[-1]
              if fingerprint not in source:
                  missing.append(f'    {key!r}: (\n        {reason!r}\n    ),\n')
          if missing:
              source = source.replace(marker, '\n' + ''.join(missing) + '}\n\ndef _candidate_fingerprint', 1)
              qualifier.write_text(source, encoding='utf-8')

          test = Path('tests/test_finite_domain_safe_invariants.py')
          test.write_text('''import unittest\nfrom pathlib import Path\n\nfrom scripts import audit_branch_assignment_gaps as audit\nfrom scripts import qualify_branch_assignment_gaps as qualify\n\nROOT = Path(__file__).resolve().parents[1]\nNOETHYS = ROOT / "noethys"\n\nSPECS = (\n    ("Dlg/DLG_Impression_don_oeuvres.py", "SetListeDonnees", "nomTitulaires", "body_only"),\n    ("Dlg/DLG_Saisie_cotisation.py", "SetListeDonnees", "nomTitulaires", "body_only"),\n    ("Dlg/DLG_Saisie_cotisation.py", "MAJ", "nomTitulaires", "body_only"),\n    ("Dlg/DLG_Saisie_cotisation.py", "MAJ", "IDcompte_payeur", "body_only"),\n    ("Ol/OL_Etat_nomin_resultats.py", "__init__", "valeur", "body_only"),\n    ("Utils/UTILS_Sauvegarde.py", "Sauvegarde", "err", "body_only"),\n    ("Dlg/DLG_Releve_prestations_saisie.py", "GetOptions", "regroupement", "body_only"),\n    ("Dlg/DLG_Saisie_texte_html.py", "Importation", "condition", "body_only"),\n    ("Dlg/DLG_Stats.py", "Imprimer", "html", "body_only"),\n    ("Utils/UTILS_Stats_modeles.py", "GetHTML", "html", "body_only"),\n)\n\n\nclass FiniteDomainSafeInvariantTests(unittest.TestCase):\n    def test_candidates_are_exactly_qualified(self):\n        for relative, function, name, detail in SPECS:\n            findings = audit.scan_file(NOETHYS / relative, NOETHYS)\n            matches = [item for item in findings if item["function"] == function and item["name"] == name and item["detail"] == detail]\n            self.assertEqual(len(matches), 1, (relative, function, name))\n            self.assertIn(qualify.qualification_key(matches[0], NOETHYS), qualify.EXPLICIT_SAFE)\n\n    def test_holder_count_domains_are_exhaustive(self):\n        for relative in ("Dlg/DLG_Impression_don_oeuvres.py", "Dlg/DLG_Saisie_cotisation.py"):\n            text = (NOETHYS / relative).read_text(encoding="utf-8")\n            for condition in ("nbreTitulaires == 0", "nbreTitulaires == 1", "nbreTitulaires == 2", "nbreTitulaires > 2"):\n                self.assertIn(condition, text, relative)\n\n    def test_fixed_choice_and_guard_contracts_remain_explicit(self):\n        releve = (NOETHYS / "Dlg/DLG_Releve_prestations_saisie.py").read_text(encoding="utf-8")\n        self.assertIn('choices=["Date", _(u"Mois"), _(u"Année")]', releve)\n        self.assertIn("self.ctrl_regroupement_date.SetSelection(0)", releve)\n\n        texte_html = (NOETHYS / "Dlg/DLG_Saisie_texte_html.py").read_text(encoding="utf-8")\n        self.assertIn("if self.IDelement != None or self.categorie != None", texte_html)\n        self.assertIn("self.Importation()", texte_html)\n\n        stats = (NOETHYS / "Dlg/DLG_Stats.py").read_text(encoding="utf-8")\n        for ident in (10, 20, 30):\n            self.assertIn(f"self.Bind(wx.EVT_MENU, self.Imprimer, id={ident})", stats)\n            self.assertIn(f"if ID == {ident}", stats)\n\n        modeles = (NOETHYS / "Utils/UTILS_Stats_modeles.py").read_text(encoding="utf-8")\n        self.assertIn('if mode not in ("affichage", "impression")', modeles)\n        self.assertIn('if mode == "affichage"', modeles)\n        self.assertIn('if mode == "impression"', modeles)\n\n    def test_exception_target_and_prefix_domains_remain_explicit(self):\n        sauvegarde = (NOETHYS / "Utils/UTILS_Sauvegarde.py").read_text(encoding="utf-8")\n        self.assertIn("except Exception as err", sauvegarde)\n        self.assertIn("if six.PY2", sauvegarde)\n\n        etat = (NOETHYS / "Ol/OL_Etat_nomin_resultats.py").read_text(encoding="utf-8")\n        self.assertIn('for prefixe in ("NBRE", "TEMPS", "TEMPS_FACTURE")', etat)\n        self.assertIn('if prefixe == "NBRE"', etat)\n        self.assertIn('if prefixe in ("TEMPS", "TEMPS_FACTURE")', etat)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          temporary = Path('.github/workflows/tmp-qualify-finite-domain-invariants.yml')
          if temporary.exists():
              temporary.unlink()
          PY
      - name: Vérifier les qualifications ciblées
        env:
          PYTHONPATH: ${{ github.workspace }}/noethys:${{ github.workspace }}
        run: python -m unittest tests.test_finite_domain_safe_invariants -v
      - name: Commit du lot qualifié
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Audit: qualifier les invariants de domaine fini'
          git push origin HEAD:audit/finite-domain-safe-invariants
