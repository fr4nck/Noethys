name: Locate NoethysWeb finaliser

on:
  push:
    paths:
      - '.github/workflows/_tmp_noethysweb_finaliser_scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localiser les appels Finaliser
        run: |
          grep -n "Finaliser" noethys/Utils/UTILS_Export_noethysweb.py noethys/Dlg/DLG_Export_noethysweb.py || true