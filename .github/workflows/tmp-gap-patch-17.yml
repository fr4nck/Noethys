name: tmp gap patch 17
on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-17
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-gap-batch-17
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/tmp_patch_gap_batch_17.py
      - name: Targeted tests
        run: python -m unittest tests.test_branch_contracts_batch_17 -v
      - name: Audit count and exhaustive coverage
        run: |
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json | tee /tmp/audit.txt
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/audit.txt').read_text(encoding='utf-8')
          if 'BRANCH_ASSIGNMENT_GAPS=161' not in text:
              raise SystemExit(text)
          m = re.search(r'trouvés=(\d+), lus=(\d+), parsés=(\d+)', text)
          if not m or len(set(m.groups())) != 1:
              raise SystemExit(text)
          PY
      - name: Remove temporary infrastructure and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp_patch_gap_batch_17.py .github/workflows/tmp-gap-patch-17.yml
          git add noethys/Utils/UTILS_Archivage.py tests/test_branch_contracts_batch_17.py
          git commit -m "fix: sécuriser le nettoyage d'attente lors de l'archivage"
          git push
