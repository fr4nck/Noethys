name: Apply targeted Vanilla runtime fixes

on:
  push:
    branches:
      - fix/vanilla-runtime-reliability-2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla-runtime-reliability-2
          fetch-depth: 0

      - name: Apply exact source fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_token(path, token, replacement, minimum=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(token)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrences of {token!r}, got {count}")
              p.write_text(text.replace(token, replacement), encoding="utf-8")

          # #136 — Synthèse des consommations
          replace_once(
              "noethys/Ctrl/CTRL_Synthese_conso.py",
              "def DateComplete(dateDD):",
              "LARGEUR_COLONNE_UNITE = 60\n\n\ndef DateComplete(dateDD):",
          )

          # #136 — Badgeage : conserver les IDs du menu sur l'instance
          replace_token(
              "noethys/Dlg/DLG_Badgeage_importation.py",
              "ID_VIDER_MEMOIRE",
              "self.ID_VIDER_MEMOIRE",
              minimum=4,
          )
          replace_token(
              "noethys/Dlg/DLG_Badgeage_importation.py",
              "ID_REGLER_HEURE",
              "self.ID_REGLER_HEURE",
              minimum=4,
          )

          # #136 — Planning transports : IDs persistants + vraie annulation du sélecteur de date
          replace_token(
              "noethys/Dlg/DLG_Planning_transports.py",
              "ID_OUTIL_MOINS",
              "self.ID_OUTIL_MOINS",
              minimum=5,
          )
          replace_token(
              "noethys/Dlg/DLG_Planning_transports.py",
              "ID_OUTIL_PLUS",
              "self.ID_OUTIL_PLUS",
              minimum=4,
          )
          replace_once(
              "noethys/Dlg/DLG_Planning_transports.py",
              """        dlg = DLG_Recherche_date(self)\n        if dlg.ShowModal():\n            newDate = dlg.GetDate()\n        dlg.Destroy()\n        self.parent.ctrl_planning.SetDate(newDate)\n""",
              """        dlg = DLG_Recherche_date(self)\n        if dlg.ShowModal() == wx.ID_OK:\n            newDate = dlg.GetDate()\n            self.parent.ctrl_planning.SetDate(newDate)\n        dlg.Destroy()\n""",
          )

          # #137 — Trésorerie
          replace_once(
              "noethys/Ctrl/CTRL_Graph_tresorerie.py",
              '("12 prochains_mois", _(u"12 prochains mois")),',
              '("12_prochains_mois", _(u"12 prochains mois")),',
          )
          replace_once(
              "noethys/Ctrl/CTRL_Graph_tresorerie.py",
              "anneeMax = self.date_max.year + 1",
              "anneeMax = self.date_fin.year + 1",
          )

          # #138 — Une copie de sauvegarde ratée doit faire échouer l'opération
          replace_once(
              "noethys/Utils/UTILS_Sauvegarde.py",
              """        except :\n            print(\"Le repertoire de destination de sauvegarde n'existe pas.\")\n""",
              """        except Exception as err:\n            print(\"Le repertoire de destination de sauvegarde n'existe pas : %s\" % err)\n            dlgprogress.Destroy()\n            return False\n""",
          )

          # #139 — Ne pas masquer une erreur INSERT par newID non défini
          replace_once(
              "noethys/GestionDB.py",
              """        req = \"INSERT INTO %s %s VALUES %s\" % (nomTable, champs, interr)\n        \n        try:\n""",
              """        req = \"INSERT INTO %s %s VALUES %s\" % (nomTable, champs, interr)\n        newID = None\n        \n        try:\n""",
          )

      - name: Verify targeted invariants
        shell: python
        run: |
          from pathlib import Path

          synthese = Path("noethys/Ctrl/CTRL_Synthese_conso.py").read_text(encoding="utf-8")
          assert "LARGEUR_COLONNE_UNITE = 60" in synthese

          badge = Path("noethys/Dlg/DLG_Badgeage_importation.py").read_text(encoding="utf-8")
          assert "if ID == self.ID_VIDER_MEMOIRE" in badge
          assert "if ID == self.ID_REGLER_HEURE" in badge

          transports = Path("noethys/Dlg/DLG_Planning_transports.py").read_text(encoding="utf-8")
          assert "self.ID_OUTIL_MOINS" in transports
          assert "self.ID_OUTIL_PLUS" in transports
          assert "if dlg.ShowModal() == wx.ID_OK:" in transports

          tresorerie = Path("noethys/Ctrl/CTRL_Graph_tresorerie.py").read_text(encoding="utf-8")
          assert '("12_prochains_mois", _(u"12 prochains mois"))' in tresorerie
          assert "anneeMax = self.date_fin.year + 1" in tresorerie

          sauvegarde = Path("noethys/Utils/UTILS_Sauvegarde.py").read_text(encoding="utf-8")
          assert "except Exception as err:" in sauvegarde
          assert "dlgprogress.Destroy()\n            return False" in sauvegarde

          db = Path("noethys/GestionDB.py").read_text(encoding="utf-8")
          assert 'req = "INSERT INTO %s %s VALUES %s" % (nomTable, champs, interr)\n        newID = None' in db

      - name: Commit application fixes and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-runtime-reliability-2.yml
          git add noethys/Ctrl/CTRL_Synthese_conso.py \
                  noethys/Dlg/DLG_Badgeage_importation.py \
                  noethys/Dlg/DLG_Planning_transports.py \
                  noethys/Ctrl/CTRL_Graph_tresorerie.py \
                  noethys/Utils/UTILS_Sauvegarde.py \
                  noethys/GestionDB.py
          git commit -m "Vanilla: corriger un second lot de défauts runtime"
          git push origin HEAD:fix/vanilla-runtime-reliability-2
