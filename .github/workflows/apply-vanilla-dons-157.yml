name: Apply Vanilla dons fix 157

on:
  push:
    branches:
      - fix/vanilla-dons-date-edition

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vanilla-dons-date-edition
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Corriger la date d'édition vide
        shell: python
        run: |
          from pathlib import Path
          path = Path("noethys/Dlg/DLG_Impression_don_oeuvres.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if dictDonnees["date_edition"] != u"" : \n            date_edition = _(u"Le %s") % dictDonnees["date_edition"]\n        else:\n            dictDonnees["date_edition"] = u""'''
          new = '''        if dictDonnees["date_edition"] != u"" : \n            date_edition = _(u"Le %s") % dictDonnees["date_edition"]\n        else:\n            date_edition = u""'''
          if text.count(old) != 1:
              raise SystemExit(f"motif attendu une fois, trouvé {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Compiler et vérifier le contrat
        run: |
          python -m py_compile noethys/Dlg/DLG_Impression_don_oeuvres.py
          python - <<'PY'
          from pathlib import Path
          text = Path('noethys/Dlg/DLG_Impression_don_oeuvres.py').read_text(encoding='utf-8')
          assert 'else:\n            date_edition = u""' in text
          assert 'else:\n            dictDonnees["date_edition"] = u""' not in text
          PY
      - name: Committer et retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-vanilla-dons-157.yml
          git add noethys/Dlg/DLG_Impression_don_oeuvres.py
          git commit -m "Vanilla: sécuriser la date d'édition du reçu Dons (#157)"
          git push origin HEAD:fix/vanilla-dons-date-edition
