name: Temp batch22 export compta

on:
  push:
    branches:
      - fix/export-compta-batch-22

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Apply minimal fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('noethys/Dlg/DLG_Export_compta.py')
          s = p.read_text(encoding='utf-8')
          old1 = '    for keyTemp, ID in listeKeys() :\n'
          new1 = '    for keyTemp, ID in listeKeys :\n'
          old2 = '                    "code_compta" : code_compta,\n'
          new2 = '                    "code_compta" : dictMode["code_compta"],\n'
          if s.count(old1) != 1:
              raise SystemExit(f'Unexpected GetKeysDictTries match count: {s.count(old1)}')
          # Restrict the accounting replacement to GetReglements_Modes.
          start = s.index('    def GetReglements_Modes')
          end = s.index('    def GetReglements_Depots', start)
          block = s[start:end]
          if block.count(old2) != 1:
              raise SystemExit(f'Unexpected GetReglements_Modes code_compta match count: {block.count(old2)}')
          s = s.replace(old1, new1, 1)
          start = s.index('    def GetReglements_Modes')
          end = s.index('    def GetReglements_Depots', start)
          block = s[start:end].replace(old2, new2, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          python -m compileall -q noethys/Dlg/DLG_Export_compta.py
          python -m pytest -q tests/test_export_compta_batch_22.py
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/gaps.json', encoding='utf-8'))
          findings=data.get('findings', data.get('results', [])) if isinstance(data, dict) else data
          print('BRANCH_ASSIGNMENT_GAPS=', len(findings))
          targeted=[f for f in findings if f.get('file') == 'Dlg/DLG_Export_compta.py' and f.get('name') == 'code_compta']
          print('TARGETED=', targeted)
          if targeted:
              raise SystemExit('targeted code_compta finding remains')
          PY
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tmp-batch22.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Export_compta.py tests/test_export_compta_batch_22.py
          git commit -m 'fix: fiabiliser export comptable'
          git push origin HEAD:fix/export-compta-batch-22
