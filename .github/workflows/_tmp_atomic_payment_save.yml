name: Atomic payment save

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_payment_save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Atomiser règlement ventilation et frais
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('noethys/Ctrl/CTRL_Ventilation.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    def Sauvegarde(self, IDreglement=None, DBtemp=None):')
          end=s.index('\n\n# -----------------------------------------------------------------------------------------------------------------------', start)
          new='''    def Sauvegarde(self, IDreglement=None, DBtemp=None):
        """ Sauvegarde des données. Retourne False si une écriture échoue. """
        DB = GestionDB.DB() if DBtemp is None else DBtemp
        commit_local = DBtemp is None

        for ligne in self.listeLignesPrestations :
            IDprestation = ligne.IDprestation
            montant = float(ligne.ventilationActuelle)
            IDventilation = self.dictVentilationInitiale.get(IDprestation)

            if ligne.GetEtat() == True :
                listeDonnees = [
                        ("IDreglement", IDreglement),
                        ("IDcompte_payeur", self.IDcompte_payeur),
                        ("IDprestation", IDprestation),
                        ("montant", montant),
                    ]
                if IDventilation is None :
                    IDventilation = DB.ReqInsert("ventilation", listeDonnees, commit=False)
                    if IDventilation is None:
                        if commit_local:
                            DB.Close()
                        return False
                else:
                    if not DB.ReqMAJ("ventilation", listeDonnees, "IDventilation", IDventilation, commit=False):
                        if commit_local:
                            DB.Close()
                        return False
            elif IDventilation is not None:
                if not DB.ReqDEL("ventilation", "IDventilation", IDventilation, commit=False):
                    if commit_local:
                        DB.Close()
                    return False

        if commit_local:
            DB.Commit()
            DB.Close()
        return True
'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')

          p=Path('noethys/Dlg/DLG_Saisie_reglement.py')
          s=p.read_text(encoding='utf-8')
          old='''        if self.IDreglement == None :
            self.nouveauReglement = True
            self.IDreglement = DB.ReqInsert("reglements", listeDonnees)
        else:
            self.nouveauReglement = False
            DB.ReqMAJ("reglements", listeDonnees, "IDreglement", self.IDreglement)
        
        # --- Sauvegarde de la ventilation ---
        self.ctrl_ventilation.Sauvegarde(self.IDreglement, DB)
'''
          new='''        ancien_IDreglement = self.IDreglement
        if ancien_IDreglement is None :
            self.nouveauReglement = True
            IDreglement = DB.ReqInsert("reglements", listeDonnees, commit=False)
            if IDreglement is None:
                DB.Close()
                return False
        else:
            self.nouveauReglement = False
            IDreglement = ancien_IDreglement
            if not DB.ReqMAJ("reglements", listeDonnees, "IDreglement", IDreglement, commit=False):
                DB.Close()
                return False

        # --- Sauvegarde de la ventilation ---
        if self.ctrl_ventilation.Sauvegarde(IDreglement, DB) == False:
            try:
                DB.connexion.rollback()
            except Exception:
                pass
            DB.Close()
            return False
'''
          if s.count(old)!=1: raise SystemExit('bloc règlement motif inattendu')
          s=s.replace(old,new,1)
          if s.count('(\"reglement_frais\", self.IDreglement),')!=1: raise SystemExit('frais lien inattendu')
          s=s.replace('(\"reglement_frais\", self.IDreglement),','(\"reglement_frais\", IDreglement),',1)
          s=s.replace('                IDprestationFrais = DB.ReqInsert("prestations", listeDonnees)\n','''                IDprestationFrais = DB.ReqInsert("prestations", listeDonnees, commit=False)\n                if IDprestationFrais is None:\n                    DB.Close()\n                    return False\n''',1)
          s=s.replace('                DB.ReqMAJ("prestations", listeDonnees, "IDprestation", IDprestationFrais)\n                DB.ReqDEL("ventilation", "IDprestation", IDprestationFrais)\n','''                if not DB.ReqMAJ("prestations", listeDonnees, "IDprestation", IDprestationFrais, commit=False):\n                    DB.Close()\n                    return False\n                if not DB.ReqDEL("ventilation", "IDprestation", IDprestationFrais, commit=False):\n                    DB.Close()\n                    return False\n''',1)
          s=s.replace('            DB.ReqDEL("prestations", "IDprestation", IDprestationFrais)\n            DB.ReqDEL("ventilation", "IDprestation", IDprestationFrais)\n        \n        DB.Close() \n','''            if not DB.ReqDEL("prestations", "IDprestation", IDprestationFrais, commit=False):\n                DB.Close()\n                return False\n            if not DB.ReqDEL("ventilation", "IDprestation", IDprestationFrais, commit=False):\n                DB.Close()\n                return False\n\n        DB.Commit()\n        DB.Close()\n        self.IDreglement = IDreglement\n''',1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Ctrl/CTRL_Ventilation.py noethys/Dlg/DLG_Saisie_reglement.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          v=Path('noethys/Ctrl/CTRL_Ventilation.py').read_text(encoding='utf-8')
          r=Path('noethys/Dlg/DLG_Saisie_reglement.py').read_text(encoding='utf-8')
          assert 'commit_local = DBtemp is None' in v
          assert 'ReqInsert("ventilation", listeDonnees, commit=False)' in v
          assert 'if self.ctrl_ventilation.Sauvegarde(IDreglement, DB) == False:' in r
          assert 'DB.Commit()\n        DB.Close()\n        self.IDreglement = IDreglement' in r
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ctrl/CTRL_Ventilation.py noethys/Dlg/DLG_Saisie_reglement.py
          git commit -m "fix: atomiser la sauvegarde des reglements"
          git push origin HEAD:master