name: Atomic payment save

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_payment_save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Atomiser règlement ventilation et frais
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('noethys/Ctrl/CTRL_Ventilation.py')
          s=p.read_text(encoding='utf-8')
          old='''    def Sauvegarde(self, IDreglement=None, DBtemp=None):\n        """ Sauvegarde des données """\n        if DBtemp == None :\n            DB = GestionDB.DB()\n        else :\n            DB = DBtemp\n\n        for ligne in self.listeLignesPrestations :\n            IDprestation = ligne.IDprestation\n            montant = float(ligne.ventilationActuelle)\n            \n            if IDprestation in self.dictVentilationInitiale :\n                IDventilation = self.dictVentilationInitiale[IDprestation]\n            else:\n                IDventilation = None\n            \n            if ligne.GetEtat() == True :\n                listeDonnees = [    \n                        ("IDreglement", IDreglement),\n                        ("IDcompte_payeur", self.IDcompte_payeur),\n                        ("IDprestation", IDprestation),\n                        ("montant", montant),\n                    ]\n                if IDventilation == None :\n                    IDventilation = DB.ReqInsert("ventilation", listeDonnees)\n                else:\n                    DB.ReqMAJ("ventilation", listeDonnees, "IDventilation", IDventilation)\n            else :\n                if IDventilation != None :\n                    DB.ReqDEL("ventilation", "IDventilation", IDventilation)\n\n        if DBtemp == None :\n            DB.Close()\n        \n        return True\n'''
          new='''    def Sauvegarde(self, IDreglement=None, DBtemp=None):\n        """ Sauvegarde des données. Retourne False si une écriture échoue. """\n        DB = GestionDB.DB() if DBtemp is None else DBtemp\n        commit_local = DBtemp is None\n\n        for ligne in self.listeLignesPrestations :\n            IDprestation = ligne.IDprestation\n            montant = float(ligne.ventilationActuelle)\n            IDventilation = self.dictVentilationInitiale.get(IDprestation)\n\n            if ligne.GetEtat() == True :\n                listeDonnees = [\n                        ("IDreglement", IDreglement),\n                        ("IDcompte_payeur", self.IDcompte_payeur),\n                        ("IDprestation", IDprestation),\n                        ("montant", montant),\n                    ]\n                if IDventilation is None :\n                    IDventilation = DB.ReqInsert("ventilation", listeDonnees, commit=False)\n                    if IDventilation is None:\n                        if commit_local:\n                            DB.Close()\n                        return False\n                else:\n                    if not DB.ReqMAJ("ventilation", listeDonnees, "IDventilation", IDventilation, commit=False):\n                        if commit_local:\n                            DB.Close()\n                        return False\n            elif IDventilation is not None:\n                if not DB.ReqDEL("ventilation", "IDventilation", IDventilation, commit=False):\n                    if commit_local:\n                        DB.Close()\n                    return False\n\n        if commit_local:\n            DB.Commit()\n            DB.Close()\n        return True\n'''
          if s.count(old)!=1:
              raise SystemExit('CTRL_Ventilation.Sauvegarde motif inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('noethys/Dlg/DLG_Saisie_reglement.py')
          s=p.read_text(encoding='utf-8')
          old='''        if self.IDreglement == None :\n            self.nouveauReglement = True\n            self.IDreglement = DB.ReqInsert("reglements", listeDonnees)\n        else:\n            self.nouveauReglement = False\n            DB.ReqMAJ("reglements", listeDonnees, "IDreglement", self.IDreglement)\n        \n        # --- Sauvegarde de la ventilation ---\n        self.ctrl_ventilation.Sauvegarde(self.IDreglement, DB)\n'''
          new='''        ancien_IDreglement = self.IDreglement\n        if ancien_IDreglement is None :\n            self.nouveauReglement = True\n            IDreglement = DB.ReqInsert("reglements", listeDonnees, commit=False)\n            if IDreglement is None:\n                DB.Close()\n                return False\n        else:\n            self.nouveauReglement = False\n            IDreglement = ancien_IDreglement\n            if not DB.ReqMAJ("reglements", listeDonnees, "IDreglement", IDreglement, commit=False):\n                DB.Close()\n                return False\n\n        # --- Sauvegarde de la ventilation ---\n        if self.ctrl_ventilation.Sauvegarde(IDreglement, DB) == False:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n            DB.Close()\n            return False\n'''
          if s.count(old)!=1:
              raise SystemExit('bloc règlement motif inattendu')
          s=s.replace(old,new,1)
          s=s.replace('(\"reglement_frais\", self.IDreglement),','(\"reglement_frais\", IDreglement),',1)
          s=s.replace('                IDprestationFrais = DB.ReqInsert("prestations", listeDonnees)\n','''                IDprestationFrais = DB.ReqInsert("prestations", listeDonnees, commit=False)\n                if IDprestationFrais is None:\n                    DB.Close()\n                    return False\n''',1)
          s=s.replace('                DB.ReqMAJ("prestations", listeDonnees, "IDprestation", IDprestationFrais)\n                DB.ReqDEL("ventilation", "IDprestation", IDprestationFrais)\n','''                if not DB.ReqMAJ("prestations", listeDonnees, "IDprestation", IDprestationFrais, commit=False):\n                    DB.Close()\n                    return False\n                if not DB.ReqDEL("ventilation", "IDprestation", IDprestationFrais, commit=False):\n                    DB.Close()\n                    return False\n''',1)
          s=s.replace('            DB.ReqDEL("prestations", "IDprestation", IDprestationFrais)\n            DB.ReqDEL("ventilation", "IDprestation", IDprestationFrais)\n        \n        DB.Close() \n','''            if not DB.ReqDEL("prestations", "IDprestation", IDprestationFrais, commit=False):\n                DB.Close()\n                return False\n            if not DB.ReqDEL("ventilation", "IDprestation", IDprestationFrais, commit=False):\n                DB.Close()\n                return False\n\n        DB.Commit()\n        DB.Close()\n        self.IDreglement = IDreglement\n''',1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Ctrl/CTRL_Ventilation.py noethys/Dlg/DLG_Saisie_reglement.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          v=Path('noethys/Ctrl/CTRL_Ventilation.py').read_text(encoding='utf-8')
          r=Path('noethys/Dlg/DLG_Saisie_reglement.py').read_text(encoding='utf-8')
          assert 'commit_local = DBtemp is None' in v
          assert 'ReqInsert("ventilation", listeDonnees, commit=False)' in v
          assert 'if self.ctrl_ventilation.Sauvegarde(IDreglement, DB) == False:' in r
          assert 'DB.Commit()\n        DB.Close()\n        self.IDreglement = IDreglement' in r
          assert '("reglement_frais", IDreglement)' in r
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ctrl/CTRL_Ventilation.py noethys/Dlg/DLG_Saisie_reglement.py
          git commit -m "fix: atomiser la sauvegarde des reglements"
          git push origin HEAD:master