name: Apply last grid eval
on:
  push:
    paths:
      - 'scripts/migrate_last_grid_eval.py'
      - '.github/workflows/apply-last-grid-eval.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/migrate_last_grid_eval.py
      - name: Tester le moteur de grille
        run: |
          PYTHONPATH=noethys python - <<'PY'
          import datetime
          from Utils import UTILS_Expressions
          vars={'a': datetime.timedelta(hours=1), 'b': datetime.timedelta(minutes=30), 'n': 2}
          assert UTILS_Expressions.EvaluerExpression('a+b', variables=vars) == datetime.timedelta(hours=1, minutes=30)
          assert UTILS_Expressions.EvaluerExpression('a*n', variables=vars) == datetime.timedelta(hours=2)
          assert UTILS_Expressions.EvaluerExpression('a>b', variables=vars) is True
          for e in ["__import__('os')", "a.__class__"]:
              try: UTILS_Expressions.EvaluerExpression(e, variables=vars)
              except Exception: pass
              else: raise AssertionError(e)
          PY
      - run: python -m compileall -q -x 'C866CA3A' noethys/
      - run: python scripts/audit_dynamic_import_risks.py --max-import-risks 0
      - name: Committer
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Ctrl/CTRL_Grille.py
          git commit -m "security: supprimer le dernier eval de Noethys"
          git push origin master
