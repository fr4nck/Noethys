name: Apply AUI perspective guard

on:
  push:
    paths:
      - '.github/workflows/_tmp_apply_aui_guard.yml'
      - 'scripts/_tmp_apply_aui_guard.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Appliquer le patch déterministe
        run: python scripts/_tmp_apply_aui_guard.py

      - name: Vérifier le helper AUI
        run: python scripts/smoke_aui_perspective_guard.py

      - name: Compiler les sources modifiées
        run: python -m compileall -q noethys/Noethys.py noethys/Utils/UTILS_Aui.py

      - name: Vérifier le diff
        run: |
          git diff --check
          git diff --stat
          git diff -- noethys/Noethys.py

      - name: Committer le correctif source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Noethys.py
          git commit -m "fix: sécuriser le chargement des perspectives AUI"
          git push
