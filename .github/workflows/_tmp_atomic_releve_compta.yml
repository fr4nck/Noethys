name: Atomic releve compta

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_releve_compta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch releve compta
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Dlg/DLG_Saisie_releve_compta.py')
          s=p.read_text(encoding='utf-8')
          a=s.index('    def Sauvegarde(self):')
          b=s.index('    def Importation(self):',a)
          x=s[a:b]
          old='''        # Sauvegarde\n        DB = GestionDB.DB()\n        \n        # Sauvegarde du relevé\n        listeDonnees = [ \n            ("nom", nom ),\n            ("date_debut", date_debut ),\n            ("date_fin", date_fin ),\n            ("IDcompte_bancaire", IDcompte),\n            ]\n        if self.IDreleve == None :\n            self.IDreleve = DB.ReqInsert("compta_releves", listeDonnees)\n        else :\n            DB.ReqMAJ("compta_releves", listeDonnees, "IDreleve", self.IDreleve)\n            \n        # Sauvegarde des opérations\n        listeIDoperations = []\n        for track in listeOperations :\n            DB.ReqMAJ("compta_operations", [("IDreleve", self.IDreleve),], "IDoperation", track.IDoperation)\n            listeIDoperations.append(track.IDoperation)\n        \n        # Suppression des anciennes opérations cochées\n        req = """SELECT IDoperation, date\n        FROM compta_operations \n        WHERE IDreleve=%d;""" % self.IDreleve\n        DB.ExecuterReq(req)\n        listeTemp = DB.ResultatReq()\n        for IDoperation, date in listeTemp :\n            if IDoperation not in listeIDoperations :\n                DB.ReqMAJ("compta_operations", [("IDreleve", None),], "IDoperation", IDoperation)\n\n        DB.Close()\n\n'''
          new='''        # Sauvegarde transactionnelle du relevé et de ses opérations\n        DB = GestionDB.DB()\n        ok = True\n        nouvelIDreleve = self.IDreleve\n\n        listeDonnees = [\n            ("nom", nom ),\n            ("date_debut", date_debut ),\n            ("date_fin", date_fin ),\n            ("IDcompte_bancaire", IDcompte),\n            ]\n        if nouvelIDreleve == None :\n            nouvelIDreleve = DB.ReqInsert("compta_releves", listeDonnees, commit=False)\n            if nouvelIDreleve is None :\n                ok = False\n        else :\n            if not DB.ReqMAJ("compta_releves", listeDonnees, "IDreleve", nouvelIDreleve, commit=False) :\n                ok = False\n\n        listeIDoperations = []\n        if ok :\n            for track in listeOperations :\n                if not DB.ReqMAJ("compta_operations", [("IDreleve", nouvelIDreleve),], "IDoperation", track.IDoperation, commit=False) :\n                    ok = False\n                    break\n                listeIDoperations.append(track.IDoperation)\n\n        if ok :\n            req = """SELECT IDoperation, date\n            FROM compta_operations\n            WHERE IDreleve=%d;""" % nouvelIDreleve\n            if DB.ExecuterReq(req) != "ok" :\n                ok = False\n            else :\n                listeTemp = DB.ResultatReq()\n                for IDoperation, date in listeTemp :\n                    if IDoperation not in listeIDoperations :\n                        if not DB.ReqMAJ("compta_operations", [("IDreleve", None),], "IDoperation", IDoperation, commit=False) :\n                            ok = False\n                            break\n\n        if ok :\n            DB.Commit()\n        else :\n            try :\n                DB.connexion.rollback()\n            except Exception :\n                pass\n        DB.Close()\n\n        if not ok :\n            dlg = wx.MessageDialog(self, _(u"Une erreur est survenue pendant l'enregistrement du relevé bancaire. Aucune modification n'a été conservée."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n\n        self.IDreleve = nouvelIDreleve\n        return True\n\n'''
          if old not in x:
              raise SystemExit('bloc attendu introuvable')
          x=x.replace(old,new,1)
          s=s[:a]+x+s[b:]
          s='\n'.join(line.rstrip() for line in s.splitlines())+'\n'
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Saisie_releve_compta.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Dlg/DLG_Saisie_releve_compta.py').read_text(encoding='utf-8')
          a=s.index('    def Sauvegarde(self):')
          b=s.index('    def Importation(self):',a)
          x=s[a:b]
          assert 'ReqInsert("compta_releves", listeDonnees, commit=False)' in x
          assert 'ReqMAJ("compta_operations", [("IDreleve", nouvelIDreleve),], "IDoperation", track.IDoperation, commit=False)' in x
          assert 'DB.Commit()' in x and 'rollback()' in x
          assert 'self.IDreleve = nouvelIDreleve' in x
          assert x.index('self.IDreleve = nouvelIDreleve') > x.index('DB.Close()')
          assert 'return False' in x and 'return True' in x
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_releve_compta.py
          git commit -m "fix: atomiser la saisie des relevés comptables"
          git push origin HEAD:master
