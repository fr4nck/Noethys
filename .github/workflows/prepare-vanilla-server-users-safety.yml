name: Prepare Vanilla server/users safety fixes

on:
  push:
    branches:
      - fix/vanilla-server-users-safety

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply minimal historical fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('noethys/Ctrl/CTRL_Serveur_nomade.py')
          text = path.read_text(encoding='utf-8')
          old = '''    except Exception as err:\n        print(("Erreur lancement serveur Nomadhys :", err))\n        log.EcritLog(_(u"Erreur dans le lancement du serveur Nomadhys [factory] :") )\n        log.EcritLog(err)\n\n    try :\n'''
          new = '''    except Exception as err:\n        print(("Erreur lancement serveur Nomadhys :", err))\n        log.EcritLog(_(u"Erreur dans le lancement du serveur Nomadhys [factory] :") )\n        log.EcritLog(err)\n        return\n\n    try :\n'''
          if text.count(old) != 1:
              raise SystemExit(f'{path}: expected server failure block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('noethys/Utils/UTILS_Utilisateurs.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # chargement avatars\n    try :\n'''
          new = '''    # chargement avatars\n    listeAvatars = []\n    try :\n'''
          if text.count(old) != 1:
              raise SystemExit(f'{path}: expected avatar block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Compile changed modules
        run: |
          python -m py_compile noethys/Ctrl/CTRL_Serveur_nomade.py
          python -m py_compile noethys/Utils/UTILS_Utilisateurs.py

      - name: Commit prepared patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/prepare-vanilla-server-users-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Ctrl/CTRL_Serveur_nomade.py noethys/Utils/UTILS_Utilisateurs.py .github/workflows/prepare-vanilla-server-users-safety.yml
          git commit -m "fix(vanilla): stop failed Nomadhys startup and guard avatars"
          git push
