name: Apply FonctionsPerso source encoding cleanup

on:
  push:
    paths:
      - 'scripts/fix_fonctionsperso_source_encoding.py'
      - '.github/workflows/apply-fonctionsperso-source-encoding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer les corrections
        run: python scripts/fix_fonctionsperso_source_encoding.py
      - name: Vérifier la compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Mesurer l'audit UTF-8
        run: python scripts/audit_utf8_boundaries.py
      - name: Committer
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/FonctionsPerso.py
          git commit -m "fix: expliciter UTF-8 pour les sources de FonctionsPerso"
          git push origin master
