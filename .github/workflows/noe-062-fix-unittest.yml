name: Noe-062 fix unittest recipe

on:
  push:
    branches:
      - noe-062-materialisation-interventions
    paths:
      - '.github/workflows/noe-062-fix-unittest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: noe-062-materialisation-interventions
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Adapter la recette au runner unittest
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_noe_062_materialisation_interventions.py')
          text = path.read_text(encoding='utf-8')
          old = 'import pytest\n'
          if old not in text:
              raise SystemExit('import pytest attendu introuvable')
          text = text.replace(old, 'import unittest\n', 1)
          text = text.replace('pytest.raises(', '_raises(')
          helper = '''\n\ndef _raises(exception, match=None):\n    return unittest.TestCase().assertRaisesRegex(exception, match or ".*")\n'''
          anchor = '\n\nROOT = Path(__file__).resolve().parents[1]\n'
          if anchor not in text:
              raise SystemExit('ancre ROOT introuvable')
          text = text.replace(anchor, helper + anchor, 1)
          loader = '''\n\ndef load_tests(loader, tests, pattern):\n    suite = unittest.TestSuite()\n    for nom, fonction in sorted(globals().items()):\n        if nom.startswith("test_") and callable(fonction):\n            suite.addTest(unittest.FunctionTestCase(fonction, description=nom))\n    return suite\n'''
          if 'def load_tests(' not in text:
              text += loader
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tests/test_noe_062_materialisation_interventions.py
          PYTHONPATH="$PWD/noethys:$PWD" python -m unittest tests.test_noe_062_materialisation_interventions -v
      - name: Auto-nettoyer et pousser
        run: |
          rm .github/workflows/noe-062-fix-unittest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_noe_062_materialisation_interventions.py .github/workflows/noe-062-fix-unittest.yml
          git commit -m "Tests: utiliser unittest pour la matérialisation Noe-062E"
          git push origin HEAD:noe-062-materialisation-interventions
