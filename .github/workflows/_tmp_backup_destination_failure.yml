name: Guard backup destination failure

on:
  push:
    paths:
      - '.github/workflows/_tmp_backup_destination_failure.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Faire échouer explicitement une sauvegarde non copiée
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Utils/UTILS_Sauvegarde.py')
          s=p.read_text(encoding='utf-8')
          old='''        try :\n            shutil.copy2(UTILS_Fichiers.GetRepTemp(fichier=nomFichierTemp), fichierDest)\n        except :\n            print("Le repertoire de destination de sauvegarde n\'existe pas.")'''
          new='''        try :\n            shutil.copy2(UTILS_Fichiers.GetRepTemp(fichier=nomFichierTemp), fichierDest)\n        except Exception as err:\n            dlgprogress.Destroy()\n            print(("Echec copie sauvegarde vers %s :" % fichierDest, err))\n            dlgErreur = wx.MessageDialog(None, _(u"La sauvegarde a bien été créée temporairement mais n'a pas pu être copiée vers le répertoire de destination.\\n\\nDestination : %s\\n\\nErreur : %s") % (fichierDest, err), _(u"Erreur de sauvegarde"), wx.OK | wx.ICON_ERROR)\n            dlgErreur.ShowModal()\n            dlgErreur.Destroy()\n            return False'''
          if s.count(old) != 1:
              raise SystemExit(f'Motif attendu trouvé {s.count(old)} fois')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Sauvegarde.py
          python scripts/audit_runtime_patterns.py --json runtime.json
          git diff --check
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Sauvegarde.py
          git commit -m 'fix: signaler les sauvegardes non copiées'
          git push origin HEAD:master