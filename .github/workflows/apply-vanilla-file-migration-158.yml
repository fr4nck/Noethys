name: Apply Vanilla file migration fix 158

on:
  push:
    branches:
      - fix/vanilla-file-migration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vanilla-file-migration
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Appliquer les correctifs de migration
        shell: python
        run: |
          from pathlib import Path
          path = Path("noethys/Utils/UTILS_Fichiers.py")
          text = path.read_text(encoding="utf-8")

          old_xlang = '''            if nomFichier.endswith(".xlang") :\n                print(["deplacement fichier xlang :", fichier, " > ", GetRepLang(nomFichier)])\n                shutil.move(u"Lang/%s" % nomFichier, GetRepLang(nomFichier))'''
          new_xlang = '''            if nomFichier.endswith(".xlang") :\n                source = Chemins.GetMainPath(u"Lang/%s" % nomFichier)\n                print(["deplacement fichier xlang :", source, " > ", GetRepLang(nomFichier)])\n                shutil.move(source, GetRepLang(nomFichier))'''
          if text.count(old_xlang) != 1:
              raise SystemExit(f"xlang: motif attendu une fois, trouvé {text.count(old_xlang)}")
          text = text.replace(old_xlang, new_xlang, 1)

          old_data = '''            if nomFichier.endswith(".dat") and "_" in nomFichier and "EXEMPLE_" not in nomFichier and "_archive.dat" not in nomFichier :\n                # Déplace le fichier vers le répertoire des fichiers de données\n                print(["copie base de donnees :", nomFichier, " > ", GetRepData(nomFichier)])\n                shutil.copy(Chemins.GetMainPath(u"Data/%s" % nomFichier), GetRepData(nomFichier))\n                # Renomme le fichier de données en archive (par sécurité)\n                try :\n                    os.rename(Chemins.GetMainPath(u"Data/%s" % nomFichier), Chemins.GetMainPath(u"Data/%s" % nomFichier.replace(".dat", "_archive.dat")))\n                except :\n                    pass'''
          new_data = '''            if nomFichier.endswith(".dat") and "_" in nomFichier and "EXEMPLE_" not in nomFichier and "_archive.dat" not in nomFichier :\n                source = Chemins.GetMainPath(u"Data/%s" % nomFichier)\n                destination = GetRepData(nomFichier)\n                archive = Chemins.GetMainPath(u"Data/%s" % nomFichier.replace(".dat", "_archive.dat"))\n                print(["copie base de donnees :", nomFichier, " > ", destination])\n                shutil.copy(source, destination)\n                # L'archive marque la migration comme terminée. Un échec ne doit\n                # pas être masqué, sinon la source sera recopiée au démarrage suivant.\n                os.replace(source, archive)'''
          if text.count(old_data) != 1:
              raise SystemExit(f"data: motif attendu une fois, trouvé {text.count(old_data)}")
          text = text.replace(old_data, new_data, 1)
          path.write_text(text, encoding="utf-8")
      - name: Compiler et vérifier les contrats
        run: |
          python -m py_compile noethys/Utils/UTILS_Fichiers.py
          python - <<'PY'
          from pathlib import Path
          text = Path('noethys/Utils/UTILS_Fichiers.py').read_text(encoding='utf-8')
          assert 'source = Chemins.GetMainPath(u"Lang/%s" % nomFichier)' in text
          assert 'shutil.move(source, GetRepLang(nomFichier))' in text
          assert 'os.replace(source, archive)' in text
          assert 'except :\n                    pass' not in text[text.index('# Déplace les fichiers de données'):text.index('def DeplaceExemples')]
          PY
      - name: Committer et retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-vanilla-file-migration-158.yml
          git add noethys/Utils/UTILS_Fichiers.py
          git commit -m "Vanilla: fiabiliser la migration des fichiers (#158)"
          git push origin HEAD:fix/vanilla-file-migration
