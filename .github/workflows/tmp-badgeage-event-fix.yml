name: Temporary badgeage event fix

on:
  push:
    branches:
      - fix/badgeage-evenement-empty

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/badgeage-evenement-empty
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Patch empty event handling
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('noethys/Dlg/DLG_Badgeage_grille.py'); s=p.read_text(encoding='utf-8'); old='        if typeUnite == \"Evenement\":\n            evenement = case.liste_evenements[0] if case.liste_evenements else None\n            conditions = (evenement,)\n        else:\n            conditions = (heure_debut, heure_fin)\n'; new='        evenement = case.liste_evenements[0] if typeUnite == \"Evenement\" and case.liste_evenements else None\n        if typeUnite == \"Evenement\":\n            if evenement is None:\n                return _(u\"Aucun événement disponible à cette date pour cette unité.\")\n            conditions = (evenement,)\n        else:\n            conditions = (heure_debut, heure_fin)\n'; assert s.count(old)==1; s=s.replace(old,new,1); old2='        if typeUnite == \"Evenement\":\n            evenement = case.liste_evenements[0] if case.liste_evenements else None\n            if evenement.conso:\n'; new2='        if typeUnite == \"Evenement\":\n            if not case.liste_evenements:\n                return _(u\"Aucun événement disponible à cette date pour cette unité.\")\n            evenement = case.liste_evenements[0]\n            if evenement.conso:\n'; assert s.count(old2)==1; p.write_text(s.replace(old2,new2,1),encoding='utf-8')"
      - name: Validate targeted regressions
        shell: bash
        run: |
          python -m py_compile noethys/Dlg/DLG_Badgeage_grille.py tests/test_badgeage_evenement_contract.py
          python -m unittest discover -s tests -p 'test_badgeage_evenement_contract.py' -v
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-badgeage-event-fix.yml
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git add noethys/Dlg/DLG_Badgeage_grille.py tests/test_badgeage_evenement_contract.py .github/workflows/tmp-badgeage-event-fix.yml
          git commit -m "Fix: gérer les unités événement sans occurrence"
          git push origin HEAD:fix/badgeage-evenement-empty
