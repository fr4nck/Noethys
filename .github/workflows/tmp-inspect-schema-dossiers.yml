name: tmp inspect schema dossiers
on:
  push:
    paths:
      - '.github/workflows/tmp-inspect-schema-dossiers.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reference tables
        shell: bash
        run: |
          echo '=== table definitions ==='
          grep -n -E '^    "(unites|evenements|categories_tarifs|tarifs|comptes_payeurs|factures|reglements|ventilation)"' noethys/Data/DATA_Tables.py || true
          echo '=== upgrade additions consommations / inscriptions / contrats ==='
          git grep -n -E 'AjoutChamp\("(consommations|inscriptions|contrats|prestations|reglements)"' -- noethys/UpgradeDB.py || true
