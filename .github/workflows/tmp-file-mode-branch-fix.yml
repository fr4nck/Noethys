name: Temporary file mode branch fix

on:
  push:
    branches:
      - fix/file-mode-branch-gaps

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/file-mode-branch-gaps
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Patch exhaustive local/network mode branches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('noethys/Dlg/DLG_Importation_fichier.py'),
              Path('noethys/Dlg/DLG_Ouvrir_fichier.py'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              old = '        # Version RESEAU\n        if modeLocal == False :\n'
              new = '        # Version RESEAU\n        else :\n'
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one local/network branch, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_file_mode_branch_contract.py')
          test_path.write_text('''#!/usr/bin/env python3
# -*- coding: utf-8 -*-

import ast
import types
import unittest
from pathlib import Path

from scripts import audit_branch_assignment_gaps


ROOT = Path(__file__).resolve().parents[1]
TARGETS = (
    ROOT / "noethys" / "Dlg" / "DLG_Importation_fichier.py",
    ROOT / "noethys" / "Dlg" / "DLG_Ouvrir_fichier.py",
)


def load_get_nom_fichier(path):
    tree = ast.parse(path.read_text(encoding="utf-8"))
    method = None
    for node in tree.body:
        if isinstance(node, ast.ClassDef):
            for item in node.body:
                if isinstance(item, ast.FunctionDef) and item.name == "GetNomFichier":
                    method = item
                    break
        if method is not None:
            break
    if method is None:
        raise AssertionError(f"GetNomFichier absent de {path}")
    module = ast.Module(body=[method], type_ignores=[])
    ast.fix_missing_locations(module)
    namespace = {
        "six": types.SimpleNamespace(PY2=False),
        "GestionDB": types.SimpleNamespace(EncodeMdpReseau=lambda value: "ENC:" + value),
    }
    exec(compile(module, str(path), "exec"), namespace)
    return namespace["GetNomFichier"]


class Radio:
    def __init__(self, value):
        self.value = value

    def GetValue(self):
        return self.value


class Files:
    def __init__(self, title):
        self.title = title

    def GetFirstSelected(self):
        return 0

    def GetItemPyData(self, index):
        return {"titre": self.title}


class FakeDialog:
    def __init__(self, mode_local, title="demo"):
        self.radio_local = Radio(mode_local)
        self.ctrl_fichiers = Files(title)

    def GetCodesReseau(self):
        return {
            "port": "3306",
            "hote": "db.example",
            "utilisateur": "user",
            "motdepasse": "secret",
        }


class FileModeBranchContractTests(unittest.TestCase):
    def test_local_mode_preserves_plain_filename(self):
        for path in TARGETS:
            with self.subTest(path=path.name):
                method = load_get_nom_fichier(path)
                self.assertEqual(method(FakeDialog(True, "base_test")), "base_test")

    def test_network_mode_preserves_connection_descriptor(self):
        expected = "3306;db.example;user;ENC:secret[RESEAU]base_test"
        for path in TARGETS:
            with self.subTest(path=path.name):
                method = load_get_nom_fichier(path)
                self.assertEqual(method(FakeDialog(False, "base_test")), expected)

    def test_mode_branch_is_exhaustive(self):
        for path in TARGETS:
            source = path.read_text(encoding="utf-8")
            tree = ast.parse(source)
            method = next(
                item
                for node in tree.body if isinstance(node, ast.ClassDef)
                for item in node.body
                if isinstance(item, ast.FunctionDef) and item.name == "GetNomFichier"
            )
            segment = ast.get_source_segment(source, method)
            self.assertIn("if modeLocal == True", segment)
            self.assertNotIn("if modeLocal == False", segment)

    def test_targeted_branch_assignment_gaps_are_gone(self):
        for path in TARGETS:
            rel = path.relative_to(ROOT / "noethys").as_posix()
            findings = audit_branch_assignment_gaps.scan_file(path, rel)
            targeted = [
                finding for finding in findings
                if finding.get("function") == "GetNomFichier" and finding.get("name") == "nomFichier"
            ]
            self.assertEqual(targeted, [], targeted)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY
      - name: Validate targeted regressions
        shell: bash
        run: |
          python -m py_compile noethys/Dlg/DLG_Importation_fichier.py noethys/Dlg/DLG_Ouvrir_fichier.py tests/test_file_mode_branch_contract.py
          python -m unittest tests.test_file_mode_branch_contract -v
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-file-mode-branch-fix.yml
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git add noethys/Dlg/DLG_Importation_fichier.py noethys/Dlg/DLG_Ouvrir_fichier.py tests/test_file_mode_branch_contract.py .github/workflows/tmp-file-mode-branch-fix.yml
          git commit -m "Fix: rendre exhaustif le choix local ou réseau"
          git push origin HEAD:fix/file-mode-branch-gaps
