name: Temporary file mode branch fix

on:
  push:
    branches:
      - fix/file-mode-branch-gaps

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/file-mode-branch-gaps
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Patch exhaustive local network mode branches
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('noethys/Dlg/DLG_Importation_fichier.py'); s=p.read_text(encoding='utf-8'); old='        # Version RESEAU\\n        if modeLocal == False :\\n'; new='        # Version RESEAU\\n        else :\\n'; assert s.count(old)==1; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('noethys/Dlg/DLG_Ouvrir_fichier.py'); s=p.read_text(encoding='utf-8'); old='        # Version RESEAU\\n        if modeLocal == False :\\n'; new='        # Version RESEAU\\n        else :\\n'; assert s.count(old)==1; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Validate targeted regressions
        shell: bash
        run: |
          python -m py_compile noethys/Dlg/DLG_Importation_fichier.py noethys/Dlg/DLG_Ouvrir_fichier.py tests/test_file_mode_branch_contract.py
          python -m unittest discover -s tests -p 'test_file_mode_branch_contract.py' -v
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-file-mode-branch-fix.yml
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git add noethys/Dlg/DLG_Importation_fichier.py noethys/Dlg/DLG_Ouvrir_fichier.py tests/test_file_mode_branch_contract.py .github/workflows/tmp-file-mode-branch-fix.yml
          git commit -m "Fix: rendre exhaustif le choix local ou réseau"
          git push origin HEAD:fix/file-mode-branch-gaps
