name: NOE-032b postcondition retry

on:
  push:
    branches:
      - fix/noe-032b-backup-integrity
    paths:
      - .github/workflows/noe032b-postcondition-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/noe-032b-backup-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rejouer le patch avec insertion robuste de la postcondition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/noe032b-postcondition-one-shot.yml').read_text(encoding='utf-8')
          code = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          code = textwrap.dedent(code)

          start = code.index("success_anchor = '''")
          end = code.index("\n\nast.parse(source)", start)
          replacement = '''mysql_pos = source.index('if proc.returncode != 0:', source.index('def Restauration('))
          append_token = 'listeFichiersRestaures.append(fichier)'
          append_pos = source.index(append_token, mysql_pos)
          line_start = source.rfind('\\n', 0, append_pos) + 1
          indent = source[line_start:append_pos]
          if "la base restaurée ne contient aucune table ou vue" not in source:
              suite = indent + '# Un code retour nul ne suffit pas : la cible doit contenir au moins une table ou vue.\\n'
              suite += indent + 'if _BaseMySQLContientObjets(dictConnexion, fichier) == False:\\n'
              suite += indent + '    dlgprogress.Destroy()\\n'
              suite += indent + '    dlgErreur = wx.MessageDialog(None, _(u"Le client MySQL n\\\'a signalé aucune erreur, mais la base restaurée ne contient aucune table ou vue."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\\n'
              suite += indent + '    dlgErreur.ShowModal()\\n'
              suite += indent + '    dlgErreur.Destroy()\\n'
              suite += indent + '    fichierZip.close()\\n'
              suite += indent + '    return False\\n\\n'
              source = source[:line_start] + suite + source[line_start:]
          '''
          code = code[:start] + replacement + code[end:]
          exec(compile(code, 'noe032b-postcondition-retry', 'exec'), {'__name__': '__main__'})
          PY
      - name: Vérifier et pousser
        shell: bash
        run: |
          python -m py_compile noethys/Utils/UTILS_Sauvegarde.py tests/test_noe_032_restore_flow.py
          python tests/test_noe_032_restore_flow.py
          python tests/test_noe_032_backup_integrity.py
          python scripts/qualify_branch_assignment_gaps.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/noe032b-postcondition-one-shot.yml .github/workflows/noe032b-postcondition-retry.yml
          git add noethys/Utils/UTILS_Sauvegarde.py tests/test_noe_032_restore_flow.py docs/NOE-032-SAUVEGARDE-RESTAURATION.md
          git diff --cached --check
          git commit -m "Fix: refuser les faux succès de restauration MySQL"
          git push origin HEAD:fix/noe-032b-backup-integrity
