name: Temporary residual review triage 3

on:
  push:
    branches:
      - audit/residual-review-triage-3

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Inspecter les contextes ciblés
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = {
              'Ctrl/CTRL_Locations_tableau.py': [488],
              'Ctrl/CTRL_Synthese_conso.py': [374, 386],
              'Ctrl/CTRL_Synthese_deductions.py': [278],
              'Ctrl/CTRL_Synthese_impayes.py': [409],
              'Ctrl/CTRL_Synthese_locations.py': [229],
              'Ctrl/CTRL_Synthese_modes_reglements.py': [173],
              'Ctrl/CTRL_Synthese_prestations.py': [539],
              'Ctrl/CTRL_Synthese_ventilation.py': [436],
              'Dlg/DLG_Saisie_reglement.py': [472],
              'Ol/OL_Liste_factures_detail.py': [73, 194],
              'Ol/OL_PES_pieces.py': [249],
              'Utils/UTILS_Impression_facture.py': [459],
          }
          root = Path('noethys')
          for rel, lines in targets.items():
              text = (root / rel).read_text(encoding='utf-8').splitlines()
              print('\n' + '=' * 100)
              print(rel)
              for line in lines:
                  start = max(1, line - 18)
                  end = min(len(text), line + 18)
                  print(f'--- context {line} ({start}-{end}) ---')
                  for n in range(start, end + 1):
                      print(f'{n:5d}: {text[n-1]}')
          PY
