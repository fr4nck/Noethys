name: Noe-003 SQL autopatch

on:
  push:
    branches:
      - noe-003-sql-strict
    paths:
      - .github/workflows/noe003-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: noe-003-sql-strict
          fetch-depth: 0

      - name: Apply strict SQL fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("noethys/Dlg/DLG_Export_compta.py")
          text = path.read_text(encoding="utf-8")

          prestations_group = "        GROUP BY prestations.IDprestation\n"
          reglements_group = "        GROUP BY reglements.IDreglement\n"
          depots_group = "        GROUP BY depots.IDdepot, reglements.IDmode\n"

          assert text.count(prestations_group) == 3, text.count(prestations_group)
          assert text.count(reglements_group) == 2, text.count(reglements_group)
          assert text.count(depots_group) == 1, text.count(depots_group)

          # GetVentes(): all joins are by primary key, so the GROUP BY is redundant.
          text = text.replace(prestations_group, "", 1)

          # GetReglements_Modes() and Quadra reglements: all joins are by primary key.
          text = text.replace(reglements_group, "")

          # GetReglements_Depots(): keep the real aggregation, but make every selected
          # non-aggregate column explicit for ONLY_FULL_GROUP_BY compatibility.
          text = text.replace(
              depots_group,
              "        GROUP BY depots.IDdepot, depots.date, depots.nom, depots.code_compta,\n"
              "        reglements.IDmode, modes_reglements.label, modes_reglements.type_comptable,\n"
              "        comptes_bancaires.numero, comptes_bancaires.nom\n",
          )

          assert text.count(prestations_group) == 2
          assert text.count(reglements_group) == 0
          assert depots_group not in text
          path.write_text(text, encoding="utf-8")

      - name: Validate syntax and SQL regression tests
        run: |
          python -m py_compile noethys/Dlg/DLG_Export_compta.py
          python -m unittest tests.test_noe_003_export_compta_sql

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/noe003-autopatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Export_compta.py .github/workflows/noe003-autopatch.yml
          git commit -m "Noe-003: make safe export compta queries strict SQL compatible"
          git push origin noe-003-sql-strict
