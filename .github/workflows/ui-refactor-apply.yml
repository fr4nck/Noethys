name: Apply structural UI refactor

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_ui_shell_refactor.py'
      - '.github/workflows/ui-refactor-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Appliquer la migration UI
        run: python scripts/apply_ui_shell_refactor.py
      - name: Vérifier la syntaxe des fichiers migrés
        run: |
          python -m py_compile noethys/Noethys.py
          python -m py_compile noethys/Ctrl/CTRL_Remplissage.py
      - name: Committer le code produit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Aucune modification à committer.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Noethys.py noethys/Ctrl/CTRL_Remplissage.py
          git commit -m 'Refactor main shell and dashboard layout'
          git push origin HEAD:master
