name: tmp check migration plan
on:
  push:
    paths:
      - 'noethys/Utils/UTILS_Migration_base.py'
      - '.github/workflows/tmp-check-migration-plan.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checks
        run: |
          python -m py_compile noethys/Utils/UTILS_Migration_base.py
          python - <<'PY'
          import importlib.util
          p='noethys/Utils/UTILS_Migration_base.py'
          spec=importlib.util.spec_from_file_location('migration', p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          mp=m.MappingIDs()
          mp.Ajouter('familles',1,101)
          assert mp.Get('familles',1)==101
          assert mp.Existe('familles',1)
          assert 'familles' in m.DEPENDANCES_COEUR
          assert 'ventilation' in m.CLES_PRIMAIRES_COEUR
          assert hasattr(m.PlanMigration, 'Construire')
          assert hasattr(m.PlanMigration, 'Simuler')
          PY
          git diff --check
