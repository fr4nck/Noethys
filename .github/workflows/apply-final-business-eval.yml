name: Apply final business eval

on:
  push:
    paths:
      - 'noethys/Utils/UTILS_Expressions.py'
      - 'scripts/migrate_final_business_eval.py'
      - '.github/workflows/apply-final-business-eval.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer les migrations
        run: python scripts/migrate_final_business_eval.py
      - name: Tester les expressions métier sûres
        run: |
          PYTHONPATH=noethys python - <<'PY'
          import datetime
          from Utils import UTILS_Expressions
          def SI(condition, alors=None, sinon=None):
              return alors if condition else sinon
          class Obj:
              a = 3
              b = 5
          obj = Obj()
          assert UTILS_Expressions.EvaluerExpression('self.a + self.b * 2', variables={'self': obj}) == 13
          assert UTILS_Expressions.EvaluerExpression('SI(self.a < self.b, self.b - self.a, 0)', variables={'self': obj}, fonctions={'SI': SI}) == 2
          duree = datetime.timedelta(hours=2)
          assert UTILS_Expressions.EvaluerExpression('SI(True, duree * 2, duree)', variables={'duree': duree, 'True': True}, fonctions={'SI': SI}) == datetime.timedelta(hours=4)
          for expression in ["self.__class__", "__import__('os')", "open('/etc/passwd')", "self.a.__class__"]:
              try:
                  UTILS_Expressions.EvaluerExpression(expression, variables={'self': obj}, fonctions={'SI': SI})
              except (ValueError, TypeError, SyntaxError, AttributeError):
                  pass
              else:
                  raise AssertionError('Expression dangereuse acceptée: %s' % expression)
          PY
      - name: Vérifier la compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Vérifier la baisse des eval
        run: python scripts/audit_dynamic_import_risks.py --max-import-risks 0
      - name: Committer
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Etat_global.py noethys/Ol/OL_Etat_nomin_resultats.py
          git commit -m "security: sécuriser deux moteurs de formules métier"
          git push origin master
