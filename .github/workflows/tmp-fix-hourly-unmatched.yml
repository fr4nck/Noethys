name: Temporary fix hourly unmatched range

on:
  push:
    branches:
      - audit/grid-family-hourly-unmatched-range

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/grid-family-hourly-unmatched-range
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply targeted correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('noethys/Ctrl/CTRL_Grille.py')
          text = source_path.read_text(encoding='utf-8')

          old = '''        if "nbre_ind" in methode_calcul :\n            montant_tarif = 0.0\n            lignes_calcul = dictTarif["lignes_calcul"]\n            \n            if "montant_unique" in methode_calcul  :\n'''
          new = '''        if "nbre_ind" in methode_calcul :\n            montant_tarif = 0.0\n            lignes_calcul = dictTarif["lignes_calcul"]\n            montant_enfant_1 = None\n            montant_enfant_2 = None\n            montant_enfant_3 = None\n            montant_enfant_4 = None\n            montant_enfant_5 = None\n            montant_enfant_6 = None\n            \n            if "montant_unique" in methode_calcul  :\n'''
          if text.count(old) != 1:
              raise SystemExit(f'nbre_ind anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            if "horaire" in methode_calcul  :\n                tarifFound = False\n\n                # Recherche des heures debut et fin des unités cochées\n'''
          new = '''            if "horaire" in methode_calcul  :\n                tarifFound = False\n                # Les montants d'une ligne précédente ne doivent pas fuir si\n                # aucune tranche horaire ne correspond à la consommation.\n                montant_enfant_1 = None\n                montant_enfant_2 = None\n                montant_enfant_3 = None\n                montant_enfant_4 = None\n                montant_enfant_5 = None\n                montant_enfant_6 = None\n\n                # Recherche des heures debut et fin des unités cochées\n'''
          if text.count(old) != 1:
              raise SystemExit(f'horaire anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                                            # Recherche du tarif à appliquer aux autres individus de la famille\n                                            if ligne_calcul_horaire != None :\n'''
          new = '''                                            # Recherche du tarif à appliquer aux autres individus de la famille\n                                            if "horaire" in methode_calcul and ligne_calcul_horaire == None :\n                                                montantTmp = 0.0\n                                            elif ligne_calcul_horaire != None :\n'''
          if text.count(old) != 1:
              raise SystemExit(f'recalculation anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          source_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_ctrl_grille_family_hourly_recalculation.py')
          test = test_path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          method = '''\n    def test_unmatched_hourly_sibling_recalculates_to_zero(self):\n        facturation = _load_facturation()\n        date = datetime.date(2026, 9, 3)\n\n        family_tariff = {\n            "IDtarif": 200,\n            "methode": "horaire_montant_unique_nbre_ind",\n            "lignes_calcul": [\n                {\n                    "heure_debut_min": "08:00",\n                    "heure_debut_max": "09:00",\n                    "heure_fin_min": "09:00",\n                    "heure_fin_max": "10:00",\n                    "montant_enfant_1": 10.0,\n                    "montant_enfant_2": 20.0,\n                    "montant_enfant_3": None,\n                    "montant_enfant_4": None,\n                    "montant_enfant_5": None,\n                    "montant_enfant_6": None,\n                },\n            ],\n        }\n\n        state = types.SimpleNamespace(\n            dictConsoIndividus={\n                1: {date: {10: [_conso(100)]}},\n                2: {date: {10: [_conso(101, "14:00", "15:00")] }},\n            },\n            dictActivites={1: {"tarifs": {50: [], 99: [family_tariff]}}},\n            dictForfaits={},\n            dictPrestations={\n                100: {\n                    "date": date,\n                    "IDfamille": 10,\n                    "IDtarif": 200,\n                    "IDindividu": 1,\n                },\n                101: {\n                    "date": date,\n                    "IDfamille": 10,\n                    "IDtarif": 200,\n                    "IDindividu": 2,\n                    "montant_initial": 10.0,\n                    "montant": 10.0,\n                },\n            },\n            listePrestationsSupprimees=[],\n            listePrestationsModifiees=[],\n            dictDeductions={},\n            mode="date",\n            TriTarifs2=lambda left, right: 0,\n            TriTarifs=lambda left, right: 0,\n        )\n\n        facturation(\n            state,\n            IDactivite=1,\n            IDindividu=1,\n            IDfamille=10,\n            date=date,\n            IDcategorie_tarif=50,\n        )\n\n        self.assertEqual(state.dictPrestations[101]["montant_initial"], 0.0)\n        self.assertEqual(state.dictPrestations[101]["montant"], 0.0)\n'''
          if 'test_unmatched_hourly_sibling_recalculates_to_zero' not in test:
              if marker not in test:
                  raise SystemExit('test insertion marker missing')
              test = test.replace(marker, method + marker, 1)
              test_path.write_text(test, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/tmp-fix-hourly-unmatched.yml
      - name: Verify targeted regressions
        shell: bash
        run: |
          python -m unittest \
            tests.test_ctrl_grille_family_hourly_unmatched_range \
            tests.test_ctrl_grille_family_hourly_recalculation \
            tests.test_ctrl_grille_family_count_tariffs -v
          python scripts/audit_branch_assignment_gaps.py --summary
          python scripts/qualify_branch_assignment_gaps.py --summary
      - name: Commit targeted correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix: neutraliser les tarifs famille hors tranche horaire"
          git push origin HEAD:audit/grid-family-hourly-unmatched-range
