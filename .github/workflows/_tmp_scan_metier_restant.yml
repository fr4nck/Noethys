name: Scan metier restant

on:
  push:
    paths:
      - '.github/workflows/_tmp_scan_metier_restant.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan operations prestations non controlees
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=(Path('noethys/Dlg'),Path('noethys/Ol'))
          for root in roots:
              for p in root.rglob('*.py'):
                  s=p.read_text(encoding='utf-8',errors='ignore')
                  lines=s.splitlines()
                  hits=[]
                  for i,line in enumerate(lines,1):
                      if ('ReqMAJ("prestations"' in line or 'ReqDEL("prestations"' in line or 'ReqInsert("prestations"' in line) and 'commit=False' not in line:
                          if not line.lstrip().startswith('#'):
                              hits.append((i,line.strip()))
                  if hits:
                      print('\n###',p)
                      for i,line in hits:
                          print(f'{i}: {line}')
          PY
