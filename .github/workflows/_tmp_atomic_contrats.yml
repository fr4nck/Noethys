name: Atomic contrats

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_contrats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch suppression contrats
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Ol/OL_Contrats.py')
          s=p.read_text(encoding='utf-8')
          old='''        if dlg.ShowModal() == wx.ID_YES :\n            DB = GestionDB.DB()\n            DB.ReqDEL("contrats", "IDcontrat", track.IDcontrat)\n            DB.ReqDEL("contrats_tarifs", "IDcontrat", track.IDcontrat)\n            DB.ReqDEL("prestations", "IDcontrat", track.IDcontrat)\n            # Suppression des consommations associées\n            for IDprestation in listeIDprestations :\n                DB.ReqDEL("consommations", "IDprestation", IDprestation)\n            DB.Close() \n            \n##            # Mémorise l'action dans l'historique\n##            UTILS_Historique.InsertActions([{\n##                "IDindividu" : self.IDindividu,\n##                "IDfamille" : IDfamille,\n##                "IDcategorie" : 19, \n##                "action" : _(u"Suppression de l'inscription à l'activité '%s'") % nomActivite\n##                },])\n                \n            # Actualise l'affichage\n            self.MAJ()\n'''
          new='''        if dlg.ShowModal() == wx.ID_YES :\n            DB = GestionDB.DB()\n            ok = True\n\n            # Supprime d'abord les dépendances des prestations\n            for IDprestation in listeIDprestations :\n                for table in ("consommations", "ventilation", "deductions"):\n                    if not DB.ReqDEL(table, "IDprestation", IDprestation, commit=False):\n                        ok = False\n                        break\n                if not ok:\n                    break\n\n            if ok and not DB.ReqDEL("prestations", "IDcontrat", track.IDcontrat, commit=False):\n                ok = False\n            if ok and not DB.ReqDEL("contrats_tarifs", "IDcontrat", track.IDcontrat, commit=False):\n                ok = False\n            if ok and not DB.ReqDEL("contrats", "IDcontrat", track.IDcontrat, commit=False):\n                ok = False\n\n            if ok:\n                DB.Commit()\n            else:\n                try:\n                    DB.connexion.rollback()\n                except Exception:\n                    pass\n            DB.Close()\n\n            if not ok:\n                dlgErreur = wx.MessageDialog(self, _(u"La suppression du contrat a échoué. Aucune modification n'a été validée."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n                dlgErreur.ShowModal()\n                dlgErreur.Destroy()\n                dlg.Destroy()\n                return False\n\n            # Actualise l'affichage uniquement après succès complet\n            self.MAJ()\n'''
          if s.count(old)!=1:
              raise SystemExit('bloc suppression contrat inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Ol/OL_Contrats.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Ol/OL_Contrats.py').read_text(encoding='utf-8')
          b=s[s.index('        if dlg.ShowModal() == wx.ID_YES :'):s.index('        dlg.Destroy()', s.index('        if dlg.ShowModal() == wx.ID_YES :'))+len('        dlg.Destroy()')]
          assert 'for table in ("consommations", "ventilation", "deductions")' in b
          assert 'ReqDEL("prestations", "IDcontrat"' in b and 'commit=False' in b
          assert 'ReqDEL("contrats_tarifs"' in b and 'ReqDEL("contrats"' in b
          assert 'DB.Commit()' in b and 'rollback()' in b
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ol/OL_Contrats.py
          git commit -m "fix: atomiser suppression des contrats"
          git push origin HEAD:master
