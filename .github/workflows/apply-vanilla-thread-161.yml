name: Apply Vanilla thread fix 161

on:
  push:
    branches:
      - fix/vanilla-thread-isalive

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vanilla-thread-isalive
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Corriger les appels Thread.isAlive
        shell: python
        run: |
          from pathlib import Path

          expected = {
              "noethys/Dlg/DLG_Recalculer_prestations.py": 2,
              "noethys/Dlg/DLG_Saisie_lot_conso_global.py": 2,
              "noethys/Dlg/DLG_Saisie_lot_forfaits_credits.py": 2,
              "noethys/Dlg/DLG_Synchronisation_donnees.py": 1,
          }

          for filename, count in expected.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              actual = text.count(".isAlive()")
              if actual != count:
                  raise SystemExit(f"{filename}: attendu {count} isAlive(), trouvé {actual}")
              path.write_text(text.replace(".isAlive()", ".is_alive()"), encoding="utf-8")

      - name: Compiler et vérifier les contrats
        run: |
          python -m py_compile \
            noethys/Dlg/DLG_Recalculer_prestations.py \
            noethys/Dlg/DLG_Saisie_lot_conso_global.py \
            noethys/Dlg/DLG_Saisie_lot_forfaits_credits.py \
            noethys/Dlg/DLG_Synchronisation_donnees.py
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('noethys/Dlg/DLG_Recalculer_prestations.py'),
              Path('noethys/Dlg/DLG_Saisie_lot_conso_global.py'),
              Path('noethys/Dlg/DLG_Saisie_lot_forfaits_credits.py'),
              Path('noethys/Dlg/DLG_Synchronisation_donnees.py'),
          ]
          total = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              assert '.isAlive()' not in text, path
              total += text.count('.is_alive()')
          assert total == 7, total
          PY
      - name: Committer et retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-vanilla-thread-161.yml
          git add \
            noethys/Dlg/DLG_Recalculer_prestations.py \
            noethys/Dlg/DLG_Saisie_lot_conso_global.py \
            noethys/Dlg/DLG_Saisie_lot_forfaits_credits.py \
            noethys/Dlg/DLG_Synchronisation_donnees.py
          git commit -m "Vanilla: corriger les contrôles de threads Python 3 (#161)"
          git push origin HEAD:fix/vanilla-thread-isalive
