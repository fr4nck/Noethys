name: Safe portal request save

on:
  push:
    paths:
      - '.github/workflows/_tmp_portal_request_save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Sécuriser Sauvegarde
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Dlg/DLG_Saisie_portail_demande.py')
          s=p.read_text(encoding='utf-8')
          old='''        # MAJ du track\n        self.track.reponse = reponse\n        self.track.etat = etat\n        self.track.traitement_date = traitement_date\n        self.panel_bandeau.Refresh()\n        self.track.Refresh()\n\n        # Sauvegarde dans la base\n        DB = GestionDB.DB()\n        DB.ReqMAJ("portail_actions", [("etat", etat), ("reponse", reponse), ("traitement_date", traitement_date), ("email_date", self.track.email_date)], "IDaction", self.track.IDaction)\n        DB.Close()\n'''
          new='''        # Sauvegarde dans la base avant de refléter le nouvel état dans l'interface.\n        DB = GestionDB.DB()\n        succes = DB.ReqMAJ("portail_actions", [("etat", etat), ("reponse", reponse), ("traitement_date", traitement_date), ("email_date", self.track.email_date)], "IDaction", self.track.IDaction)\n        DB.Close()\n        if not succes:\n            dlg = wx.MessageDialog(self, _(u"La demande n'a pas pu être enregistrée. Son état précédent a été conservé."), _(u"Erreur d'enregistrement"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n\n        # MAJ du track uniquement après succès de l'écriture.\n        self.track.reponse = reponse\n        self.track.etat = etat\n        self.track.traitement_date = traitement_date\n        self.panel_bandeau.Refresh()\n        self.track.Refresh()\n        return True\n'''
          if s.count(old)!=1:
              raise SystemExit('motif Sauvegarde inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Saisie_portail_demande.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Dlg/DLG_Saisie_portail_demande.py').read_text(encoding='utf-8')
          assert "return False" in s
          assert "MAJ du track uniquement après succès" in s
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_portail_demande.py
          git commit -m "fix: ne valider une demande portail qu'après écriture DB"
          git push origin HEAD:master