name: Noe-003 guarded patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/noe003_apply_patch.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'noe-003-strict-sql'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact guarded patch
        run: |
          if [ ! -f scripts/noe003_apply_patch.py ]; then
            echo 'Patch script already removed; nothing to do.'
            exit 0
          fi
          python scripts/noe003_apply_patch.py
          python -m py_compile noethys/Dlg/DLG_Export_compta.py
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet -- noethys/Dlg/DLG_Export_compta.py; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Export_compta.py
          git commit -m "Noe-003: make Quadra and Cerig exports strict-SQL safe"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
