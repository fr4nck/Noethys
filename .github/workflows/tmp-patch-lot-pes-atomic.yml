name: tmp patch lot PES atomic
on:
  push:
    paths:
      - 'tools/tmp_patch_lot_pes_atomic.py'
      - '.github/workflows/tmp-patch-lot-pes-atomic.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch
        run: python tools/tmp_patch_lot_pes_atomic.py
      - name: Checks
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_lot_tresor_public.py noethys/Ol/OL_PES_pieces.py
          git diff --check
          grep -q 'def Sauvegarde(self, IDlot=None, datePrelevement=None, IDcompte=None, IDmode=None, DB=None, commit=True)' noethys/Ol/OL_PES_pieces.py
          grep -q 'def SauvegardeReglements(self, date=None, IDcompte=None, IDmode=None, DB=None, commit=True)' noethys/Ol/OL_PES_pieces.py
          grep -q 'ReqInsert("pes_lots", listeDonnees, commit=False)' noethys/Dlg/DLG_Saisie_lot_tresor_public.py
          grep -q 'self.IDlot = IDlot' noethys/Dlg/DLG_Saisie_lot_tresor_public.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_lot_tresor_public.py noethys/Ol/OL_PES_pieces.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: atomiser les lots PES et leurs règlements'
          git pull --rebase origin master
          git push origin HEAD:master
