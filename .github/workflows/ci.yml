name: CI

# Déclenché uniquement quand du code Python, le packaging ou les workflows changent.
# Les modifications portant exclusivement sur docs/ ou *.md ne déclenchent
# aucun job Python, Windows ou macOS.
# workflow_dispatch permet aussi une qualification ponctuelle sans modifier le code.
on:
  workflow_dispatch:
  push:
    paths:
      - 'noethys/**'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'setup.py'
      - 'packaging/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'noethys/**'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'setup.py'
      - 'packaging/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  compile:
    name: Compilation + Audit runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compiler les sources (détection d'erreurs de syntaxe)
        run: python -m compileall -q -x 'C866CA3A' noethys/

      - name: Audit des motifs runtime dangereux
        run: python scripts/audit_runtime_patterns.py --fail-on PY2_BUILTINS

      - name: Vérifier les chemins SQLite Unicode natifs
        run: python scripts/modernize_sqlite_unicode_paths.py

      - name: Vérifier ReqInsert et newID
        run: python scripts/modernize_reqinsert_newid.py

      - name: Vérifier les imports des modules métier critiques
        run: python scripts/audit_critical_business_modules.py

      - name: Surveiller les imports dynamiques PyInstaller
        run: python scripts/audit_dynamic_import_risks.py --max-import-risks 7

      - name: Inventorier les parsings de date fragiles
        run: python scripts/audit_fragile_date_parsing.py

      - name: Inventorier les arguments wx numériques fragiles
        run: python scripts/audit_wx_numeric_arguments.py

      - name: Inventorier les frontières bytes/texte
        run: python scripts/audit_bytes_text_boundaries.py

      - name: Inventorier les frontières CSV
        run: python scripts/audit_csv_boundaries.py

      - name: Inventorier les frontières UTF-8
        run: python scripts/audit_utf8_boundaries.py

      - name: Inventorier l'usage réel des dépendances
        run: python scripts/audit_dependency_usage.py

      - name: Vérifier l'absence de migration implicite du schéma
        if: github.event_name == 'pull_request'
        run: python scripts/check_schema_compatibility.py "${{ github.event.pull_request.base.sha }}" HEAD

  windows-smoke:
    name: Smoke test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances minimales
        run: pip install six appdirs python-dateutil pytz wxPython pyttsx3

      - name: Compiler les sources Windows
        run: python -m compileall -q noethys/

      - name: Smoke test imports non-GUI
        run: python tests/smoke_noethys.py

      - name: Smoke test configuration UTF-8 et récupération
        run: python scripts/smoke_config_utf8_recovery.py

      - name: Smoke test compatibilité pyttsx3
        run: python -c "import sys; sys.path.insert(0, 'noethys'); import pyttsx; assert callable(pyttsx.init)"

      - name: Smoke test wx.App
        run: python tests/smoke_wx.py

  macos-smoke:
    name: Smoke test macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances minimales
        run: python -m pip install --upgrade pip && python -m pip install six appdirs python-dateutil pytz wxPython pyttsx3

      - name: Compiler les sources macOS
        run: python -m compileall -q -x 'C866CA3A' noethys/

      - name: Smoke test imports non-GUI
        run: python tests/smoke_noethys.py

      - name: Smoke test configuration UTF-8 et récupération
        run: python scripts/smoke_config_utf8_recovery.py

      - name: Smoke test compatibilité pyttsx3
        run: python -c "import sys; sys.path.insert(0, 'noethys'); import pyttsx; assert callable(pyttsx.init)"

      - name: Smoke test wx.App
        run: python tests/smoke_wx.py
