name: Apply Vanilla nonblocking wx fix 168

on:
  push:
    branches:
      - fix/vanilla-nonblocking-wx

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Supprimer les pauses UI actives
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "noethys/Ctrl/CTRL_Portail_serveur.py": [
                  (
                      '    def OnClose(self, evt):\n        self.serveur.Stop()\n        time.sleep(0.1)\n        self.Destroy()',
                      '    def OnClose(self, evt):\n        self.serveur.Stop()\n        wx.CallLater(100, self.Destroy)',
                  ),
              ],
              "noethys/Dlg/DLG_Transfert_tables.py": [
                  ('import wx.lib.filebrowsebutton as filebrowse\nimport time', 'import wx.lib.filebrowsebutton as filebrowse'),
                  ('            DB.Exportation_vers_base_defaut(nomTable=nomTable, nomFichierdefault=nomFichier)\n            time.sleep(1)', '            DB.Exportation_vers_base_defaut(nomTable=nomTable, nomFichierdefault=nomFichier)'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: motif attendu 1 fois, trouvé {count}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Compiler et vérifier les contrats
        shell: python
        run: |
          import ast
          import py_compile
          from pathlib import Path

          files = [
              "noethys/Ctrl/CTRL_Portail_serveur.py",
              "noethys/Dlg/DLG_Transfert_tables.py",
          ]
          for path in files:
              py_compile.compile(path, doraise=True)

          portail_path = Path(files[0])
          portail = portail_path.read_text(encoding="utf-8")
          assert 'time.sleep(0.1)' not in portail
          tree = ast.parse(portail, filename=str(portail_path))
          onclose = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "OnClose")
          calls = [
              n for n in ast.walk(onclose)
              if isinstance(n, ast.Call)
              and isinstance(n.func, ast.Attribute)
              and isinstance(n.func.value, ast.Name)
              and n.func.value.id == "wx"
              and n.func.attr == "CallLater"
          ]
          assert len(calls) == 1
          assert isinstance(calls[0].args[0], ast.Constant) and calls[0].args[0].value == 100

          transfert = Path(files[1]).read_text(encoding="utf-8")
          assert 'time.sleep(1)' not in transfert
          assert '\nimport time\n' not in transfert
          assert transfert.count('Exportation_vers_base_defaut(nomTable=nomTable, nomFichierdefault=nomFichier)') == 1

      - name: Committer et retirer le workflow temporaire
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Ctrl/CTRL_Portail_serveur.py noethys/Dlg/DLG_Transfert_tables.py
          git commit -m "Vanilla: supprimer les pauses bloquantes wx actives (#168)"
          git rm .github/workflows/apply-vanilla-nonblocking-wx-168.yml
          git commit --amend --no-edit
          git push
