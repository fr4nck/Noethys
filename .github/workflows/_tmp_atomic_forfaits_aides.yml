name: Atomic forfaits aides

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_forfaits_aides.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch forfait writes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Dlg/DLG_Appliquer_forfait.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('                                    # Sauvegarde de la prestation\n')
          end=s.index('                                    nbre_forfaits_saisis += 1', start)+len('                                    nbre_forfaits_saisis += 1\n')
          old=s[start:end]
          new=old
          new=new.replace('IDprestation = DB.ReqInsert("prestations", listeDonnees)', 'IDprestation = DB.ReqInsert("prestations", listeDonnees, commit=False)\n                                    if IDprestation is None:\n                                        DB.Close()\n                                        return False')
          new=new.replace('newIDdeduction = DB.ReqInsert("deductions", listeDonnees)', 'newIDdeduction = DB.ReqInsert("deductions", listeDonnees, commit=False)\n                                        if newIDdeduction is None:\n                                            DB.Close()\n                                            return False')
          new=new.replace('IDconso = DB.ReqInsert("consommations", listeDonnees)', 'IDconso = DB.ReqInsert("consommations", listeDonnees, commit=False)\n                                        if IDconso is None:\n                                            DB.Close()\n                                            return False')
          new=new.replace('                                    # Cloture de la DB\n                                    DB.Close()', '                                    # Validation atomique prestation + déductions + consommations\n                                    DB.Commit()\n                                    DB.Close()')
          if new==old:
              raise SystemExit('aucune modification appliquée')
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Appliquer_forfait.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Dlg/DLG_Appliquer_forfait.py').read_text(encoding='utf-8')
          b=s[s.index('# Sauvegarde de la prestation'):s.index('nbre_forfaits_saisis += 1', s.index('# Sauvegarde de la prestation'))]
          assert 'ReqInsert("prestations", listeDonnees, commit=False)' in b
          assert 'ReqInsert("deductions", listeDonnees, commit=False)' in b
          assert 'ReqInsert("consommations", listeDonnees, commit=False)' in b
          assert 'DB.Commit()' in b
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Appliquer_forfait.py
          git commit -m "fix: atomiser application des forfaits et aides"
          git push origin HEAD:master
