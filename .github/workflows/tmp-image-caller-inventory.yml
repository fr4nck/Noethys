name: TEMP image caller inventory

on:
  push:
    branches:
      - audit/tmp-branch-gap-inventory-20260829

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inventorier les appels couleur
        shell: bash
        run: |
          echo '--- CreationCarreCouleur ---'
          grep -R "CreationCarreCouleur(" -n noethys --include='*.py' || true
          echo '--- ConvertToRVB ---'
          grep -R "ConvertToRVB(" -n noethys --include='*.py' || true
