name: Temporary importation individus contracts

on:
  push:
    branches:
      - fix/importation-individus-contracts
    paths:
      - .github/workflows/tmp-importation-individus-contracts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/importation-individus-contracts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Patch importation contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('noethys/Dlg/DLG_Importation_individus.py')
          text = path.read_text(encoding='utf-8')

          old = '        dlg = wx.SingleChoiceDialog(None, _(u"Veuillez sélectionner le caractère de séparation utilisé dans ce fichier :"), _(u"Sélection du caractère de séparation"), listeLabels, wx.CHOICEDLG_STYLE)\n        if dlg.ShowModal() == wx.ID_OK:\n            separation = listeSeparations[dlg.GetSelection()]'
          new = '        separation = None\n        dlg = wx.SingleChoiceDialog(None, _(u"Veuillez sélectionner le caractère de séparation utilisé dans ce fichier :"), _(u"Sélection du caractère de séparation"), listeLabels, wx.CHOICEDLG_STYLE)\n        if dlg.ShowModal() == wx.ID_OK:\n            separation = listeSeparations[dlg.GetSelection()]'
          if text.count(old) != 1:
              raise SystemExit('bloc separation inattendu: %d' % text.count(old))
          text = text.replace(old, new, 1)

          old = '            format = dictColonnesTemp[code]["format"]\n            if format == "texte" : converter = Formate_texte\n            if format == "date" : converter = Formate_date\n            if format == "telephone" : converter = Formate_telephone\n            if format == "cp" : converter = Formate_cp\n            if format == "ville" : converter = Formate_ville\n            listeColonnes.append(ColumnDefn(label, \'left\', 150, code, stringConverter=converter))'
          new = '            format = dictColonnesTemp[code]["format"]\n            dictConverters = {\n                "texte" : Formate_texte,\n                "date" : Formate_date,\n                "telephone" : Formate_telephone,\n                "cp" : Formate_cp,\n                "codepostal" : Formate_cp,\n                "ville" : Formate_ville,\n            }\n            if format not in dictConverters :\n                raise ValueError("format de colonne inconnu : %s" % format)\n            converter = dictConverters[format]\n            listeColonnes.append(ColumnDefn(label, \'left\', 150, code, stringConverter=converter))'
          if text.count(old) != 1:
              raise SystemExit('bloc converter inattendu: %d' % text.count(old))
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Importation_individus.py
          python - <<'PY'
          from pathlib import Path
          from scripts import audit_branch_assignment_gaps as audit
          findings = audit.scan_file(Path('noethys/Dlg/DLG_Importation_individus.py').resolve(), Path('noethys').resolve())
          print(findings)
          if findings:
              raise SystemExit('DLG_Importation_individus conserve des candidats')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git rm .github/workflows/tmp-importation-individus-contracts.yml
          git add noethys/Dlg/DLG_Importation_individus.py
          git commit -m "Fix: fiabiliser les formats d’importation individus"
          git push origin HEAD:fix/importation-individus-contracts
