name: Noe-031 guarded PMSL testability fix

on:
  pull_request:
    paths:
      - '.github/workflows/noe031-lazy-db-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'noe-031-business-regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rendre GestionDB réellement optionnel avec FakeDB injecté
        run: |
          python - <<'PY'
          from pathlib import Path

          export_path = Path('noethys/Utils/UTILS_PMSL_Export.py')
          text = export_path.read_text(encoding='utf-8')
          old = '''try:\n    from noethys import GestionDB\nexcept ImportError:  # lancement historique depuis le répertoire noethys\n    import GestionDB\n\n\nclass PMSLExportService(object):\n    def __init__(self, db=None):\n        self.db = db or GestionDB.DB()\n        self._owns_db = db is None\n'''
          new = '''def _new_db():\n    try:\n        from noethys import GestionDB\n    except ImportError:  # lancement historique depuis le répertoire noethys\n        import GestionDB\n    return GestionDB.DB()\n\n\nclass PMSLExportService(object):\n    def __init__(self, db=None):\n        self.db = db if db is not None else _new_db()\n        self._owns_db = db is None\n'''
          assert text.count(old) == 1, f'Export: motif inattendu ({text.count(old)})'
          export_path.write_text(text.replace(old, new), encoding='utf-8')

          openings_path = Path('noethys/Utils/UTILS_PMSL_Openings.py')
          text = openings_path.read_text(encoding='utf-8')
          old = '''try:\n    from noethys import GestionDB\n    from noethys.Utils.UTILS_PMSL_NoethysBridge import build_ack_item\nexcept ImportError:  # lancement historique depuis le répertoire noethys\n    import GestionDB\n    from Utils.UTILS_PMSL_NoethysBridge import build_ack_item\n\n\nclass PMSLOpeningError(Exception):\n'''
          new = '''try:\n    from noethys.Utils.UTILS_PMSL_NoethysBridge import build_ack_item\nexcept ImportError:  # lancement historique depuis le répertoire noethys\n    from Utils.UTILS_PMSL_NoethysBridge import build_ack_item\n\n\ndef _new_db():\n    try:\n        from noethys import GestionDB\n    except ImportError:  # lancement historique depuis le répertoire noethys\n        import GestionDB\n    return GestionDB.DB()\n\n\nclass PMSLOpeningError(Exception):\n'''
          assert text.count(old) == 1, f'Openings imports: motif inattendu ({text.count(old)})'
          text = text.replace(old, new)
          old_ctor = '''    def __init__(self, db=None):\n        self.db = db or GestionDB.DB()\n        self._owns_db = db is None\n'''
          new_ctor = '''    def __init__(self, db=None):\n        self.db = db if db is not None else _new_db()\n        self._owns_db = db is None\n'''
          assert text.count(old_ctor) == 1, f'Openings ctor: motif inattendu ({text.count(old_ctor)})'
          openings_path.write_text(text.replace(old_ctor, new_ctor), encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_PMSL_Export.py noethys/Utils/UTILS_PMSL_Openings.py
          PYTHONPATH="$GITHUB_WORKSPACE/noethys:$GITHUB_WORKSPACE" python -m unittest discover -s tests -p 'test_pmsl_*.py' -v
          git diff --check

      - name: Commit
        run: |
          if git diff --quiet -- noethys/Utils/UTILS_PMSL_Export.py noethys/Utils/UTILS_PMSL_Openings.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Utils/UTILS_PMSL_Export.py noethys/Utils/UTILS_PMSL_Openings.py
          git commit -m "Noe-031: lazy-load GestionDB when PMSL services own it"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
