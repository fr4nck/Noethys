name: Harden badge imports

on:
  push:
    paths:
      - '.github/workflows/_tmp_badge_import_hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Corriger les cas limites Excel et CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Dlg/DLG_Badgeage_importation.py')
          s=p.read_text(encoding='utf-8')
          patches=[
          ('''try :\n    import xlrd\nexcept :\n    pass''', '''try:\n    import xlrd\nexcept ImportError:\n    xlrd = None'''),
          ('''        # Lecture du fichier XLS\n        try :\n            classeur = xlrd.open_workbook(nomFichier)\n        except :''', '''        # Lecture du fichier XLS\n        if xlrd is None:\n            dlg = wx.MessageDialog(self, _(u"L'import Excel nécessite le module xlrd, qui n'est pas disponible."), _(u"Erreur"), wx.OK | wx.ICON_EXCLAMATION)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n        try:\n            classeur = xlrd.open_workbook(nomFichier)\n        except Exception:'''),
          ('''            if dlg.ShowModal() == wx.ID_OK:\n                feuille = classeur.sheet_by_index(dlg.GetSelection())\n            dlg.Destroy()\n        \n        # Lecture des données de la feuille''', '''            if dlg.ShowModal() == wx.ID_OK:\n                feuille = classeur.sheet_by_index(dlg.GetSelection())\n            dlg.Destroy()\n            if feuille is None:\n                return False\n        \n        # Lecture des données de la feuille'''),
          ('''                try :\n                    position = texteColonne.index(code)\n                    dictFormat[code] = (indexColonne, position)\n                except :\n                    pass''', '''                try:\n                    position = texteColonne.index(code)\n                    dictFormat[code] = (indexColonne, position)\n                except ValueError:\n                    pass'''),
          ('''        try :\n            fichier = csv.reader(open(nomFichier,"rb"), encoding="utf8", delimiter=delimiteur)\n        except :''', '''        try:\n            fichier_source = open(nomFichier, "rb")\n            fichier = csv.reader(fichier_source, encoding="utf8", delimiter=delimiteur)\n        except (OSError, UnicodeError):'''),
          ('''        except Exception as err :\n            listeDonnees = []\n            dlg = wx.MessageDialog(self, _(u"Noethys n'a pas réussi à lire les données !\\n\\nVérifiez peut-être le format de la ligne.\\n\\nErreur : %s") % err, _(u"Erreur"), wx.OK | wx.ICON_EXCLAMATION)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n        \n        return listeDonnees\n\n    def MemoriseParametres''', '''        except Exception as err:\n            listeDonnees = []\n            dlg = wx.MessageDialog(self, _(u"Noethys n'a pas réussi à lire les données !\\n\\nVérifiez peut-être le format de la ligne.\\n\\nErreur : %s") % err, _(u"Erreur"), wx.OK | wx.ICON_EXCLAMATION)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n        finally:\n            fichier_source.close()\n        \n        return listeDonnees\n\n    def MemoriseParametres'''),
          ]
          for old,new in patches:
              c=s.count(old)
              if c != 1:
                  raise SystemExit(f'Motif attendu 1 fois, trouvé {c}: {old[:100]!r}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Badgeage_importation.py
          python scripts/audit_runtime_patterns.py --json runtime.json
          git diff --check
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Badgeage_importation.py
          git commit -m 'fix: sécuriser les imports Excel et CSV de badgeage'
          git push origin HEAD:master