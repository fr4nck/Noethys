name: Scan portal pages writes

on:
  push:
    paths:
      - '.github/workflows/_tmp_scan_portal_pages.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scanner les modules portail
        run: |
          python - <<'PY'
          from pathlib import Path
          keywords = ('portail_pages', 'portail_bloc', 'portail_page', 'page_portail', 'bloc_portail')
          writes = ('ReqInsert(', 'ReqMAJ(', 'ReqDEL(', 'ExecuterReq(')
          for p in Path('noethys').rglob('*.py'):
              try:
                  lines = p.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              text='\n'.join(lines).lower()
              if 'portail' not in text:
                  continue
              hits=[]
              for i,line in enumerate(lines,1):
                  low=line.lower()
                  if any(k in low for k in keywords) or any(w in line for w in writes):
                      if 'portail' in low or any(w in line for w in writes):
                          hits.append((i,line.strip()))
              if hits:
                  print('\n###', p)
                  for i,line in hits[:120]:
                      print(f'{i}: {line}')
          PY