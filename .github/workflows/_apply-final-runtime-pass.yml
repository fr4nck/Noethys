name: Apply final Vanilla runtime fixes

on:
  push:
    branches:
      - fix/vanilla-final-runtime-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla-final-runtime-pass

      - name: Apply qualified runtime fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, got {count}")
              return text.replace(old, new, 1)

          def replace_in_class(text, class_name, old, new):
              marker = f"class {class_name}("
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"class not found: {class_name}")
              end = text.find("\nclass ", start + len(marker))
              if end < 0:
                  end = len(text)
              block = text[start:end]
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f"{class_name}: expected 1 target, got {count}")
              block = block.replace(old, new, 1)
              return text[:start] + block + text[end:]

          # 1. Saved grid perspectives: keep the menu ID base on the dialog instance.
          path = Path("noethys/Dlg/DLG_Grille.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "        ID_PREMIERE_PERSPECTIVE = 500\n",
              "        ID_PREMIERE_PERSPECTIVE = 500\n        self.ID_PREMIERE_PERSPECTIVE = ID_PREMIERE_PERSPECTIVE\n",
              "DLG_Grille perspective base",
          )
          text = replace_once(
              text,
              "        index = event.GetId() - ID_PREMIERE_PERSPECTIVE\n",
              "        index = event.GetId() - self.ID_PREMIERE_PERSPECTIVE\n",
              "DLG_Grille perspective handler",
          )
          path.write_text(text, encoding="utf-8")

          # 2. Each active grid renderer must clone its own class and preserve the case.
          path = Path("noethys/Ctrl/CTRL_Grille_renderers.py")
          text = path.read_text(encoding="utf-8")
          for class_name in (
              "CaseStandard",
              "CaseMemo",
              "CaseTransports",
              "CaseActivite",
              "CaseMultihoraires",
              "CaseEvenement",
          ):
              text = replace_in_class(
                  text,
                  class_name,
                  "        return RendererCase()\n",
                  f"        return {class_name}(self.case)\n",
              )
          path.write_text(text, encoding="utf-8")

          # 3. Same wx renderer contract in the openings grid.
          path = Path("noethys/Dlg/DLG_Ouvertures.py")
          text = path.read_text(encoding="utf-8")
          text = replace_in_class(
              text,
              "CaseOuvertureRenderer",
              "        return RendererCase()\n",
              "        return CaseOuvertureRenderer(self.case)\n",
          )
          path.write_text(text, encoding="utf-8")

          # 4. Noedoc polygon context menus need concrete wx IDs in their own scope.
          path = Path("noethys/Dlg/DLG_Noedoc.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "            menu = UTILS_Adaptations.Menu()\n            self.point = objet\n",
              "            menu = UTILS_Adaptations.Menu()\n            ID_MENU_SUPPRIMER_POINT = wx.Window.NewControlId()\n            self.point = objet\n",
              "Noedoc delete-point menu ID",
          )
          text = replace_once(
              text,
              "        menu = UTILS_Adaptations.Menu()\n        self.coords = objet.HitCoords\n",
              "        menu = UTILS_Adaptations.Menu()\n        ID_MENU_AJOUTER_POINT = wx.Window.NewControlId()\n        self.coords = objet.HitCoords\n",
              "Noedoc add-point menu ID",
          )
          path.write_text(text, encoding="utf-8")

          # 5. Python 3: translated text is already a text string; unicode() no longer exists.
          path = Path("noethys/Dlg/DLG_Saisie_utilisateur_reseau.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if "txtMessage = unicode(" in line]
          if len(matches) != 1:
              raise SystemExit(f"network-user unicode target count: {len(matches)}")
          i = matches[0]
          line = lines[i]
          prefix, rest = line.split("unicode(", 1)
          newline = "\n" if line.endswith("\n") else ""
          rest = rest.rstrip("\n")
          if not rest.endswith(")"):
              raise SystemExit("network-user unicode target has unexpected shape")
          lines[i] = prefix + rest[:-1] + newline
          path.write_text("".join(lines), encoding="utf-8")

      - name: Validate targeted contracts
        shell: python
        run: |
          import ast
          from pathlib import Path

          files = [
              "noethys/Dlg/DLG_Grille.py",
              "noethys/Ctrl/CTRL_Grille_renderers.py",
              "noethys/Dlg/DLG_Ouvertures.py",
              "noethys/Dlg/DLG_Noedoc.py",
              "noethys/Dlg/DLG_Saisie_utilisateur_reseau.py",
          ]
          texts = {}
          trees = {}
          for filename in files:
              text = Path(filename).read_text(encoding="utf-8")
              texts[filename] = text
              trees[filename] = ast.parse(text, filename=filename)

          # Perspective handler uses the persisted instance value.
          grille = texts["noethys/Dlg/DLG_Grille.py"]
          assert "self.ID_PREMIERE_PERSPECTIVE = ID_PREMIERE_PERSPECTIVE" in grille
          assert "event.GetId() - self.ID_PREMIERE_PERSPECTIVE" in grille

          # Verify Clone() methods structurally, not just by string replacement.
          expected = {
              "CaseStandard",
              "CaseMemo",
              "CaseTransports",
              "CaseActivite",
              "CaseMultihoraires",
              "CaseEvenement",
          }
          tree = trees["noethys/Ctrl/CTRL_Grille_renderers.py"]
          classes = {n.name: n for n in tree.body if isinstance(n, ast.ClassDef)}
          for name in expected:
              clone = next(n for n in classes[name].body if isinstance(n, ast.FunctionDef) and n.name == "Clone")
              ret = next(n for n in clone.body if isinstance(n, ast.Return))
              assert isinstance(ret.value, ast.Call)
              assert isinstance(ret.value.func, ast.Name) and ret.value.func.id == name
              assert len(ret.value.args) == 1
              arg = ret.value.args[0]
              assert isinstance(arg, ast.Attribute) and isinstance(arg.value, ast.Name)
              assert arg.value.id == "self" and arg.attr == "case"
          assert "RendererCase" not in texts["noethys/Ctrl/CTRL_Grille_renderers.py"]

          openings = texts["noethys/Dlg/DLG_Ouvertures.py"]
          assert "return CaseOuvertureRenderer(self.case)" in openings
          assert "return RendererCase()" not in openings

          noedoc = texts["noethys/Dlg/DLG_Noedoc.py"]
          assert "ID_MENU_SUPPRIMER_POINT = wx.Window.NewControlId()" in noedoc
          assert "ID_MENU_AJOUTER_POINT = wx.Window.NewControlId()" in noedoc

          network_user = texts["noethys/Dlg/DLG_Saisie_utilisateur_reseau.py"]
          assert "txtMessage = unicode(" not in network_user
          assert "txtMessage = _(u\"Attention," in network_user

      - name: Compile changed Python files
        run: >-
          python -m py_compile
          noethys/Dlg/DLG_Grille.py
          noethys/Ctrl/CTRL_Grille_renderers.py
          noethys/Dlg/DLG_Ouvertures.py
          noethys/Dlg/DLG_Noedoc.py
          noethys/Dlg/DLG_Saisie_utilisateur_reseau.py

      - name: Commit application fixes and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_apply-final-runtime-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Grille.py noethys/Ctrl/CTRL_Grille_renderers.py noethys/Dlg/DLG_Ouvertures.py noethys/Dlg/DLG_Noedoc.py noethys/Dlg/DLG_Saisie_utilisateur_reseau.py .github/workflows/_apply-final-runtime-pass.yml
          git commit -m "Vanilla: corriger les derniers défauts runtime qualifiés"
          git push origin HEAD:fix/vanilla-final-runtime-pass
