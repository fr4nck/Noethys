name: Fix DB close audit

on:
  push:
    paths:
      - '.github/workflows/_tmp_fix_db_audit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Reconnaître Close et close
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit_runtime_patterns.py')
          s=p.read_text(encoding='utf-8')
          old='        closes = bool(re.search(r"\\bDB[T]?\\.Close\\s*\\(\\)", body))\n'
          new='        closes = bool(re.search(r"\\bDB[T]?\\.(?:Close|close)\\s*\\(\\)", body))\n'
          if s.count(old) != 1:
              raise SystemExit('motif fermeture DB inattendu')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='')
          PY
          python scripts/audit_runtime_patterns.py --json db.json
          python - <<'PY'
          import json
          data=json.load(open('db.json',encoding='utf-8'))
          print('DB_UNCLOSED:',len(data.get('DB_UNCLOSED',[])))
          for item in data.get('DB_UNCLOSED',[]):
              print(f"{item['file']}:{item['line']} {item['function']}")
          PY
          git diff --check
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_runtime_patterns.py
          git commit -m "ci: reconnaître close et Close dans l'audit DB"
          git push
