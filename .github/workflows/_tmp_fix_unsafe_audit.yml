name: Fix unsafe exec audit

on:
  push:
    paths:
      - '.github/workflows/_tmp_fix_unsafe_audit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Corriger le faux positif commentaire inline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit_runtime_patterns.py')
          s = p.read_text(encoding='utf-8')
          old = '        if re.search(r"\\beval\\s*\\(|\\bexec\\s*\\(", raw):\n'
          new = '        code_only = raw.split("#", 1)[0]\n        if re.search(r"\\beval\\s*\\(|\\bexec\\s*\\(", code_only):\n'
          if s.count(old) != 1:
              raise SystemExit('motif UNSAFE_EXEC inattendu')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='')
          PY
          python scripts/audit_runtime_patterns.py --json audit.json
          python - <<'PY'
          import json
          data=json.load(open('audit.json', encoding='utf-8'))
          assert len(data.get('UNSAFE_EXEC', [])) == 0, data.get('UNSAFE_EXEC')
          print('UNSAFE_EXEC: 0')
          PY
          git diff --check
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_runtime_patterns.py
          git commit -m "ci: ignorer les eval exec commentés dans l'audit runtime"
          git push
