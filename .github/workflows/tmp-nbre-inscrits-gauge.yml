name: Temp nbre inscrits gauge patcher

on:
  push:
    branches:
      - fix/nbre-inscrits-gauge-color-contract

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nbre-inscrits-gauge-color-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Appliquer le correctif
        run: python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Valider le correctif
        run: |
          python -m py_compile noethys/Dlg/DLG_Nbre_inscrits.py tests/test_nbre_inscrits_gauge_color_contract.py
          python -m unittest tests.test_nbre_inscrits_gauge_color_contract -v
          python scripts/audit_branch_assignment_gaps.py --json /tmp/branch-gaps.json
      - name: Commit du correctif
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-nbre-inscrits-gauge.yml
          git add -A
          git commit -m 'Fix — clarifier les états couleur de la jauge inscriptions'
          git push origin HEAD:fix/nbre-inscrits-gauge-color-contract
