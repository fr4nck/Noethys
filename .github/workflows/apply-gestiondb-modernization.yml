name: Apply GestionDB modernization

on:
  push:
    paths:
      - '.github/workflows/apply-gestiondb-modernization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Appliquer les codemods ciblés
        run: |
          python scripts/modernize_sqlite_unicode_paths.py --write
          python scripts/modernize_reqinsert_newid.py --write

      - name: Vérifier les corrections
        run: |
          python scripts/modernize_sqlite_unicode_paths.py
          python scripts/modernize_reqinsert_newid.py

      - name: Committer les changements
        run: |
          if git diff --quiet -- noethys/GestionDB.py; then
            echo 'Aucun changement à committer.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/GestionDB.py
          git commit -m 'fix: moderniser les chemins SQLite et ReqInsert'
          git push origin HEAD:master
