name: Atomic questionnaire documents
on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_questionnaire_documents.yml'
      - '.github/_tmp_patch_questionnaire_documents.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch
        run: python .github/_tmp_patch_questionnaire_documents.py
      - name: Verify
        run: |
          python -m py_compile noethys/Ctrl/CTRL_Vignettes_documents.py noethys/Ctrl/CTRL_Questionnaire.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          v=Path('noethys/Ctrl/CTRL_Vignettes_documents.py').read_text(encoding='utf-8')
          a=v.index('    def Sauvegarde(self, ID=None):')
          b=v.index('    def ImportationScanner',a)
          x=v[a:b]
          assert 'ReqInsert("documents", listeDonnees, commit=False)' in x
          assert 'MAJimage(' in x and 'commit=False' in x
          assert 'ReqDEL("documents", "IDdocument", track.IDdocument, commit=False)' in x
          assert 'DB.Commit()' in x and 'rollback()' in x
          assert 'return False' in x
          q=Path('noethys/Ctrl/CTRL_Questionnaire.py').read_text(encoding='utf-8')
          assert 'if nbreDocuments is False:' in q
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ctrl/CTRL_Vignettes_documents.py noethys/Ctrl/CTRL_Questionnaire.py
          git commit -m "fix: atomiser les documents de questionnaire"
          git pull --rebase origin master
          git push origin HEAD:master
