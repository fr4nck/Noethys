name: Temporary qualify portal radio affichage

on:
  push:
    branches:
      - audit/portal-radio-affichage-invariants

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/portal-radio-affichage-invariants
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Qualifier les invariants radio d'affichage portail
        env:
          PYTHONPATH: ${{ github.workspace }}/noethys:${{ github.workspace }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts import audit_branch_assignment_gaps as audit
          from scripts import qualify_branch_assignment_gaps as qualify

          root = Path('noethys')
          specs = (
              ('Dlg/DLG_Saisie_portail_periode.py', 'OnBoutonOk', 'affichage', 'groupe radio affichage de période'),
              ('Dlg/DLG_Activite_portail.py', 'Sauvegarde', 'portail_inscriptions_affichage', 'groupe radio inscriptions portail'),
              ('Dlg/DLG_Activite_portail.py', 'Sauvegarde', 'portail_reservations_affichage', 'groupe radio réservations portail'),
          )

          periode = (root / 'Dlg/DLG_Saisie_portail_periode.py').read_text(encoding='utf-8')
          for token in (
              'self.radio_oui = wx.RadioButton(self, -1, _(u"Toujours afficher"), style=wx.RB_GROUP)',
              'self.radio_dates = wx.RadioButton',
              'self.radio_non = wx.RadioButton',
              'self.radio_oui.SetValue(True)',
              'self.radio_dates.SetValue(True)',
              'self.radio_non.SetValue(True)',
          ):
              if token not in periode:
                  raise SystemExit(f'DLG_Saisie_portail_periode: contrat radio absent: {token}')

          activite = (root / 'Dlg/DLG_Activite_portail.py').read_text(encoding='utf-8')
          for token in (
              'self.radio_inscriptions_non = wx.RadioButton(self, -1, _(u"Ne pas autoriser"), style=wx.RB_GROUP)',
              'self.radio_inscriptions_oui = wx.RadioButton',
              'self.radio_inscriptions_dates = wx.RadioButton',
              'self.radio_reservations_non = wx.RadioButton(self, -1, _(u"Ne pas autoriser"), style=wx.RB_GROUP)',
              'self.radio_reservations_oui = wx.RadioButton',
              'self.radio_inscriptions_non.SetValue(True)',
              'self.radio_inscriptions_oui.SetValue(True)',
              'self.radio_inscriptions_dates.SetValue(True)',
              'self.radio_reservations_non.SetValue(True)',
              'self.radio_reservations_oui.SetValue(True)',
          ):
              if token not in activite:
                  raise SystemExit(f'DLG_Activite_portail: contrat radio absent: {token}')

          entries = []
          test_specs = []
          for relative, function, name, label in specs:
              findings = audit.scan_file(root / relative, root)
              matches = [
                  item for item in findings
                  if item['function'] == function and item['name'] == name
              ]
              if len(matches) != 1:
                  raise SystemExit(f'{relative}::{function}::{name}: {len(matches)} candidat(s), attendu 1')
              item = matches[0]
              key = qualify.qualification_key(item, root)
              if key in qualify.EXPLICIT_SAFE:
                  raise SystemExit(f'{key}: déjà qualifié')
              if relative.endswith('DLG_Saisie_portail_periode.py'):
                  reason = (
                      "radio_oui ouvre un groupe wx.RadioButton et radio_dates/radio_non appartiennent au même groupe ; "
                      "wx conserve exactement un membre actif, le premier est sélectionné par défaut et Importation positionne explicitement "
                      "l'un des trois états, donc OnBoutonOk affecte toujours affichage avant son enregistrement"
                  )
              elif name == 'portail_inscriptions_affichage':
                  reason = (
                      "radio_inscriptions_non ouvre un groupe wx.RadioButton et les variantes oui/dates appartiennent au même groupe ; "
                      "un membre est actif par défaut et Importation restaure explicitement l'un des trois états, donc Sauvegarde affecte toujours "
                      "portail_inscriptions_affichage avant son utilisation"
                  )
              else:
                  reason = (
                      "radio_reservations_non ouvre un groupe wx.RadioButton avec radio_reservations_oui ; un membre est actif par défaut et "
                      "Importation restaure explicitement l'état, donc Sauvegarde affecte toujours portail_reservations_affichage avant son utilisation"
                  )
              entries.append((key, reason))
              test_specs.append((relative, function, name, item['detail']))

          qualifier = Path('scripts/qualify_branch_assignment_gaps.py')
          source = qualifier.read_text(encoding='utf-8')
          marker = '\n}\n\ndef _candidate_fingerprint'
          if source.count(marker) != 1:
              raise SystemExit('Structure du registre EXPLICIT_SAFE inattendue')
          addition = ''.join(
              f'    {key!r}: (\n        {reason!r}\n    ),\n'
              for key, reason in entries
          )
          qualifier.write_text(source.replace(marker, '\n' + addition + '}\n\ndef _candidate_fingerprint', 1), encoding='utf-8')

          test = Path('tests/test_portal_radio_affichage_safe_invariants.py')
          test.write_text(
              'import unittest\nfrom pathlib import Path\n\n'
              'from scripts import audit_branch_assignment_gaps as audit\n'
              'from scripts import qualify_branch_assignment_gaps as qualify\n\n'
              'ROOT = Path(__file__).resolve().parents[1]\nNOETHYS = ROOT / "noethys"\n\n'
              f'SPECS = {tuple(test_specs)!r}\n\n'
              'class PortalRadioAffichageSafeInvariantTests(unittest.TestCase):\n'
              '    def test_candidates_are_exactly_qualified(self):\n'
              '        for relative, function, name, detail in SPECS:\n'
              '            findings = audit.scan_file(NOETHYS / relative, NOETHYS)\n'
              '            matches = [item for item in findings if item["function"] == function and item["name"] == name and item["detail"] == detail]\n'
              '            self.assertEqual(len(matches), 1, (relative, function, name))\n'
              '            self.assertIn(qualify.qualification_key(matches[0], NOETHYS), qualify.EXPLICIT_SAFE)\n\n'
              '    def test_portal_controls_keep_their_radio_group_contracts(self):\n'
              '        periode = (NOETHYS / "Dlg/DLG_Saisie_portail_periode.py").read_text(encoding="utf-8")\n'
              '        activite = (NOETHYS / "Dlg/DLG_Activite_portail.py").read_text(encoding="utf-8")\n'
              '        self.assertIn("self.radio_oui = wx.RadioButton", periode)\n'
              '        self.assertIn("style=wx.RB_GROUP", next(line for line in periode.splitlines() if "self.radio_oui = wx.RadioButton" in line))\n'
              '        self.assertIn("style=wx.RB_GROUP", next(line for line in activite.splitlines() if "self.radio_inscriptions_non = wx.RadioButton" in line))\n'
              '        self.assertIn("style=wx.RB_GROUP", next(line for line in activite.splitlines() if "self.radio_reservations_non = wx.RadioButton" in line))\n\n'
              'if __name__ == "__main__":\n    unittest.main()\n',
              encoding='utf-8'
          )

          temporary = Path('.github/workflows/tmp-qualify-portal-radio-affichage.yml')
          if temporary.exists():
              temporary.unlink()
          PY
      - name: Vérifier les qualifications ciblées
        env:
          PYTHONPATH: ${{ github.workspace }}/noethys:${{ github.workspace }}
        run: python -m unittest tests.test_portal_radio_affichage_safe_invariants -v
      - name: Commit du lot qualifié
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Audit: qualifier les invariants radio affichage portail'
          git push origin HEAD:audit/portal-radio-affichage-invariants
