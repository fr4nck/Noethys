name: NOE-032b precheck order retry

on:
  push:
    branches:
      - fix/noe-032b-backup-integrity
    paths:
      - .github/workflows/noe032b-precheck-order-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/noe-032b-backup-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Déplacer la création DB après le précontrôle SQL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('noethys/Utils/UTILS_Sauvegarde.py')
          source = path.read_text(encoding='utf-8')
          restore = source.index('def Restauration(')
          creation_start = source.index("                # Création de la base si elle n'existe pas\n", restore)
          creation_end = source.index('                # Copie du fichier SQL dans le répertoire Temp / restoretemp\n', creation_start)
          creation_block = source[creation_start:creation_end]
          source = source[:creation_start] + source[creation_end:]

          old_close = '                    DB = GestionDB.DB(suffixe=None, nomFichier=nomFichier, modeCreation=True)\n                    DB.Close()\n'
          new_close = '                    DB = GestionDB.DB(suffixe=None, nomFichier=nomFichier, modeCreation=True)\n                    try:\n                        if getattr(DB, "echec", 1) == 1:\n                            raise RuntimeError(_(u"La base MySQL \'%s\' n\'a pas pu être créée.") % fichier)\n                    finally:\n                        DB.Close()\n'
          if old_close not in creation_block:
              raise SystemExit('fermeture DB de création introuvable')
          creation_block = creation_block.replace(old_close, new_close, 1)
          creation_block = creation_block.replace("# Création de la base si elle n'existe pas", '# Création de la base uniquement après validation de la charge SQL.', 1)

          precheck = source.index('                if _SQLContientChargeRestauratrice(fichierRestore) == False:\n', restore)
          insert_pos = source.index('                # Importation du fichier SQL dans MySQL\n', precheck)
          source = source[:insert_pos] + creation_block + source[insert_pos:]
          ast.parse(source)
          path.write_text(source, encoding='utf-8')

          tests_path = Path('tests/test_noe_032_restore_flow.py')
          tests = tests_path.read_text(encoding='utf-8')
          if 'def test_network_restore_noop_does_not_create_missing_database' not in tests:
              marker = '    def test_network_restore_rejects_mysql_success_without_tables(self):\n'
              if marker not in tests:
                  raise SystemExit('marqueur test postcondition introuvable')
              test = '''    def test_network_restore_noop_does_not_create_missing_database(self):
                  with tempfile.TemporaryDirectory() as root:
                      root = Path(root)
                      data_dir = root / "data"
                      temp_dir = root / "temp"
                      data_dir.mkdir()
                      temp_dir.mkdir()
                      archive = root / "backup.nod"
                      with zipfile.ZipFile(str(archive), "w") as zf:
                          zf.writestr("demo_data.sql", b"SELECT 1;")

                      module = _load_module(data_dir, temp_dir)
                      module.GetListeFichiersReseau = lambda values: []
                      module.GetRepertoireMySQL = lambda values: "/fake/mysql/"
                      module.CreationFichierLoginTemp = lambda **kwargs: Path(kwargs["nomFichier"]).write_text("[client]\\n")
                      params = {"host": "localhost", "port": 3306, "user": "test", "password": "test"}

                      with mock.patch.object(module.GestionDB, "DB") as db, mock.patch.object(module.subprocess, "Popen", return_value=_FakeProcess()) as popen:
                          result = module.Restauration(
                              fichier=str(archive),
                              listeFichiersReseau=["demo_data.sql"],
                              dictConnexion=params,
                          )

                      self.assertFalse(result)
                      db.assert_not_called()
                      popen.assert_not_called()
                      self.assertFalse((temp_dir / "restoretemp").exists())

          '''
              tests = tests.replace(marker, test + marker, 1)
          ast.parse(tests)
          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Vérifier et pousser
        shell: bash
        run: |
          python -m py_compile noethys/Utils/UTILS_Sauvegarde.py tests/test_noe_032_restore_flow.py
          python tests/test_noe_032_restore_flow.py
          python tests/test_noe_032_backup_integrity.py
          python scripts/qualify_branch_assignment_gaps.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/noe032b-precheck-order.yml .github/workflows/noe032b-precheck-order-retry.yml
          git add noethys/Utils/UTILS_Sauvegarde.py tests/test_noe_032_restore_flow.py
          git diff --cached --check
          git commit -m "Fix: valider le SQL avant création de la base"
          git push origin HEAD:fix/noe-032b-backup-integrity
