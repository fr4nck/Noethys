name: PMSL menu hook

on:
  push:
    paths:
      - '.github/workflows/pmsl-menu-hook.yml'

permissions:
  contents: write

jobs:
  patch-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Noethys Tools menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('noethys/Noethys.py')
          text = path.read_text(encoding='utf-8')

          menu_anchor = '''                    {"code" : "connecthys_traiter", "label": _(u"Traiter les demandes du portail"), "infobulle": _(u"Traiter les demandes du portail"), "image": "Images/16x16/Connecthys.png", "action": self.On_outils_connecthys_traiter},\n                    "-",\n'''
          menu_insert = '''                    {"code" : "connecthys_traiter", "label": _(u"Traiter les demandes du portail"), "infobulle": _(u"Traiter les demandes du portail"), "image": "Images/16x16/Connecthys.png", "action": self.On_outils_connecthys_traiter},\n                    "-",\n                    {"code" : "pmsl_synchronisation", "label" : _(u"PMSL Équipe - Synchronisation Noethys"), "infobulle" : _(u"Tester ou appliquer la synchronisation avec PMSL Équipe"), "image" : "Images/16x16/Calendrier.png", "action" : self.On_outils_pmsl_synchronisation},\n                    "-",\n'''

          method_anchor = '''    def On_outils_villes(self, event):\n'''
          method_insert = '''    def On_outils_pmsl_synchronisation(self, event):\n        from Dlg import DLG_PMSL_Synchronisation\n        dlg = DLG_PMSL_Synchronisation.Dialog(self)\n        dlg.ShowModal()\n        dlg.Destroy()\n\n    def On_outils_villes(self, event):\n'''

          if '"pmsl_synchronisation"' not in text:
              if menu_anchor not in text:
                  raise SystemExit('Menu anchor not found; refusing unsafe rewrite')
              text = text.replace(menu_anchor, menu_insert, 1)

          if 'def On_outils_pmsl_synchronisation' not in text:
              if method_anchor not in text:
                  raise SystemExit('Method anchor not found; refusing unsafe rewrite')
              text = text.replace(method_anchor, method_insert, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile noethys/Noethys.py noethys/Dlg/DLG_PMSL_Synchronisation.py noethys/Utils/UTILS_PMSL_Sync.py noethys/Utils/UTILS_PMSL_NoethysBridge.py noethys/Utils/UTILS_PMSL_Openings.py

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/pmsl-menu-hook.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Noethys.py .github/workflows/pmsl-menu-hook.yml
          git commit -m 'feat: expose PMSL Noethys sync in Tools menu'
          git push
