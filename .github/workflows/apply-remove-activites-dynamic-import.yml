name: Apply remove activites dynamic import

on:
  push:
    paths:
      - 'scripts/remove_activites_dynamic_import.py'
      - '.github/workflows/apply-remove-activites-dynamic-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer le correctif ciblé
        run: python scripts/remove_activites_dynamic_import.py
      - name: Vérifier la compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Vérifier les imports dynamiques
        run: python scripts/audit_dynamic_import_risks.py --max-import-risks 0
      - name: Vérifier le diff limité
        run: |
          git diff --stat
          test "$(git diff --name-only | tr -d '\r')" = "noethys/Ol/OL_Activites.py"
      - name: Committer
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Ol/OL_Activites.py
          git commit -m "refactor: supprimer l'import dynamique des assistants activité"
          git push origin master
