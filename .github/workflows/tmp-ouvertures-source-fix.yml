name: Temporary DLG_Ouvertures branch-assignment fixes

on:
  push:
    branches:
      - fix/branch-assignment-ouvertures
    paths:
      - .github/workflows/tmp-ouvertures-source-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-ouvertures
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Patch DLG_Ouvertures safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('noethys/Dlg/DLG_Ouvertures.py')
          text = path.read_text(encoding='utf-8')

          old = '''def CreationImage(largeur, hauteur, couleur=None):\n    \"\"\" couleur peut être RGB ou HEXA \"\"\"\n    if type(couleur) == str : r, v, b = hex_to_rgb(couleur)\n    if type(couleur) == tuple : r, v, b = couleur\n    if 'phoenix' in wx.PlatformInfo:\n'''
          new = '''def CreationImage(largeur, hauteur, couleur=None):\n    \"\"\" couleur peut être RGB ou HEXA \"\"\"\n    if couleur is None:\n        couleur = (255, 255, 255)\n    if isinstance(couleur, str):\n        r, v, b = hex_to_rgb(couleur)\n    elif isinstance(couleur, tuple) and len(couleur) == 3:\n        r, v, b = couleur\n    else:\n        raise ValueError(\"couleur doit être une chaîne HEXA ou un tuple RGB\")\n    if 'phoenix' in wx.PlatformInfo:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'CreationImage block count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        if \"gauche\" in alignement: xRond = 1\n        if \"droite\" in alignement: xRond = taille[0] - largeurRond - 1\n        if \"haut\" in alignement: yRond = 1\n        if \"bas\" in alignement: yRond = taille[1] - hauteurRond - 1\n\n'''
          new = '''        if \"gauche\" in alignement:\n            xRond = 1\n        elif \"droite\" in alignement:\n            xRond = taille[0] - largeurRond - 1\n        else:\n            raise ValueError(\"alignement horizontal invalide : %s\" % alignement)\n        if \"haut\" in alignement:\n            yRond = 1\n        elif \"bas\" in alignement:\n            yRond = taille[1] - hauteurRond - 1\n        else:\n            raise ValueError(\"alignement vertical invalide : %s\" % alignement)\n\n'''
          if text.count(old) != 1:
              raise SystemExit(f'GetImageEvement alignment block count={text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Ouvertures.py
          python scripts/audit_branch_assignment_gaps.py --json /tmp/branch.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/branch.json', encoding='utf-8'))
          items=[x for x in data['findings'] if x['file']=='Dlg/DLG_Ouvertures.py']
          print('DLG_OUVERTURES_FINDINGS', [(x['function'], x['name'], x['detail']) for x in items])
          expected={
              ('Sauvegarde','prochainIDligne','body_only'),
              ('TraitementLot','etat','partial_branches'),
              ('TraitementLot','liste_temp','body_only'),
              ('TraitementLot','nbrePlaces','partial_branches'),
          }
          actual={(x['function'], x['name'], x['detail']) for x in items}
          if actual != expected:
              raise SystemExit(f'unexpected DLG_Ouvertures findings: {actual!r}')
          PY
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git rm .github/workflows/tmp-ouvertures-source-fix.yml
          git add noethys/Dlg/DLG_Ouvertures.py
          git commit -m "Fix: sécuriser les helpers graphiques des ouvertures"
          git push origin HEAD:fix/branch-assignment-ouvertures
