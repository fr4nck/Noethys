name: Inspect questionnaire documents
on:
  push:
    paths:
      - '.github/workflows/_tmp_inspect_questionnaire_documents.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect
        run: |
          grep -R -n "def Sauvegarde(self, IDreponse" noethys > .github/_tmp_inspect_questionnaire_documents.txt || true
          grep -R -n "Sauvegarde(IDreponse" noethys >> .github/_tmp_inspect_questionnaire_documents.txt || true
          grep -R -n "class.*Vignette\|ctrl_vignettes" noethys/Ctrl noethys/Dlg >> .github/_tmp_inspect_questionnaire_documents.txt || true
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/_tmp_inspect_questionnaire_documents.txt
          git commit -m "ci: inspecter temporairement documents questionnaire"
          git pull --rebase origin master
          git push origin HEAD:master
