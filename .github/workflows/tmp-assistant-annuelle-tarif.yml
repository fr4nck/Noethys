name: Temp assistant annuelle tarif
on:
  push:
    branches: [fix/assistant-annuelle-tarif-contract]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/assistant-annuelle-tarif-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Appliquer le correctif et les tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('noethys/Ctrl/CTRL_Assistant_annuelle.py')
          source = path.read_text(encoding='utf-8')
          old = '''        if self.parent.dict_valeurs["recopier_tarifs"] == None :\n            # Nom de tarif\n            if self.parent.dict_valeurs["gratuit"] == False:\n'''
          new = '''        if self.parent.dict_valeurs["recopier_tarifs"] == None :\n            # Nom de tarif\n            IDnom_tarif = None\n            if self.parent.dict_valeurs["gratuit"] == False:\n'''
          if old not in source:
              raise SystemExit('bloc tarification annuelle attendu introuvable')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          Path('tests/test_assistant_annuelle_tarif_contract.py').write_text('''import ast\nimport unittest\nfrom pathlib import Path\nfrom scripts import audit_branch_assignment_gaps\n\nROOT = Path(__file__).resolve().parents[1]\nSOURCE_ROOT = ROOT / "noethys"\nSOURCE_PATH = SOURCE_ROOT / "Ctrl" / "CTRL_Assistant_annuelle.py"\n\nclass AssistantAnnuelleTarifContractTests(unittest.TestCase):\n    def test_idnom_tarif_has_explicit_neutral_default(self):\n        source = SOURCE_PATH.read_text(encoding="utf-8")\n        self.assertIn("IDnom_tarif = None", source)\n        self.assertIn('if self.parent.dict_valeurs["gratuit"] == False:', source)\n\n    def test_idnom_tarif_is_only_consumed_in_paid_tariff_block(self):\n        tree = ast.parse(SOURCE_PATH.read_text(encoding="utf-8"))\n        funcs = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "Suite"]\n        self.assertEqual(len(funcs), 1)\n        target = funcs[0]\n        uses = [n for n in ast.walk(target) if isinstance(n, ast.Name) and n.id == "IDnom_tarif" and isinstance(n.ctx, ast.Load)]\n        self.assertEqual(len(uses), 1)\n\n    def test_branch_assignment_gap_is_gone(self):\n        findings = audit_branch_assignment_gaps.scan_file(SOURCE_PATH, SOURCE_ROOT)\n        targeted = [item for item in findings if item.get("function") == "Suite" and item.get("name") == "IDnom_tarif"]\n        self.assertEqual(targeted, [], targeted)\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Valider le correctif
        run: |
          python -m py_compile noethys/Ctrl/CTRL_Assistant_annuelle.py tests/test_assistant_annuelle_tarif_contract.py
          python -m unittest tests.test_assistant_annuelle_tarif_contract -v
          python scripts/audit_branch_assignment_gaps.py --json /tmp/branch-gaps.json
      - name: Commit du correctif
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-assistant-annuelle-tarif.yml
          git add -A
          git commit -m 'Fix — expliciter le tarif annuel optionnel'
          git push origin HEAD:fix/assistant-annuelle-tarif-contract
