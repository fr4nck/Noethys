name: Temp gap patch 07

on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-07

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Appliquer le patch
        run: python scripts/tmp_patch_gap_batch_07.py
      - name: Valider le lot
        run: |
          python -m unittest tests.test_dialog_selection_branch_contracts
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/gaps.json', encoding='utf-8'))
          print('COUNT', report['count'])
          assert report['count'] == 203, report['count']
          PY
      - name: Nettoyer et committer
        run: |
          git rm scripts/tmp_patch_gap_batch_07.py
          git rm .github/workflows/tmp-gap-patch-07.yml
          git rm .github/workflows/tmp-gap-inventory-07.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_piece.py noethys/Dlg/DLG_Saisie_filtre_listes.py tests/test_dialog_selection_branch_contracts.py
          git commit -m 'Fix — expliciter les sélections optionnelles de formulaires'
          git push
