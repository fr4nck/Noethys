name: Atomic modele contrat

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_modele_contrat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch modele contrat
        run: |
          python - <<'PY'
          from pathlib import Path

          # MAJimage : contrat de retour explicite et commit optionnel rétrocompatible.
          p = Path('noethys/GestionDB.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('    def MAJimage(')
          end = s.index('    def ReqMAJ(', start)
          new = '''    def MAJimage(self, table=None, key=None, IDkey=None, blobImage=None, nomChampBlob="image", commit=True):\n        \"\"\"Enregistre un BLOB et retourne True en cas de succès.\"\"\"\n        try:\n            if self.isNetwork == True:\n                sql = \"UPDATE %s SET %s=%%s WHERE %s=%%s\" % (table, nomChampBlob, key)\n                self.cursor.execute(sql, (blobImage, IDkey))\n            else:\n                sql = \"UPDATE %s SET %s=? WHERE %s=%d\" % (table, nomChampBlob, key, IDkey)\n                self.cursor.execute(sql, [sqlite3.Binary(blobImage),])\n            if commit == True:\n                self.Commit()\n        except Exception as err:\n            print(_(u\"Requete sql de mise a jour BLOB incorrecte :\\n%s\\nErreur detectee:\\n%s\") % (sql, err))\n            try:\n                self.connexion.rollback()\n            except Exception:\n                pass\n            return False\n        return True\n\n'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')

          # Modèle de contrat : ligne + BLOB dans une même transaction.
          p = Path('noethys/Dlg/DLG_Saisie_contrat.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('        if self.mode_modele == True :\n            # Sauvegarde du modèle de contrat')
          end = s.index('        # --------------------------------------------------------------------------------------------------------------------------------\n        else :', start)
          new = '''        if self.mode_modele == True :\n            # Sauvegarde atomique du modèle de contrat et de son BLOB.\n            donneesStr = cPickle.dumps(listePeriodes)\n            DB = GestionDB.DB()\n            ancien_IDmodele = self.IDmodele\n            listeDonnees = [\n                (\"nom\", nom),\n                (\"IDactivite\", self.IDactivite),\n                (\"date_debut\", date_debut),\n                (\"date_fin\", date_fin),\n                (\"observations\", observations),\n                (\"IDtarif\", IDtarif),\n                ]\n            if ancien_IDmodele == None:\n                IDmodele = DB.ReqInsert(\"modeles_contrats\", listeDonnees, commit=False)\n                if IDmodele is None:\n                    DB.Close()\n                    return False\n            else:\n                IDmodele = ancien_IDmodele\n                if not DB.ReqMAJ(\"modeles_contrats\", listeDonnees, \"IDmodele\", IDmodele, commit=False):\n                    DB.Close()\n                    return False\n\n            if not DB.MAJimage(table=\"modeles_contrats\", key=\"IDmodele\", IDkey=IDmodele, blobImage=donneesStr, nomChampBlob=\"donnees\", commit=False):\n                try:\n                    DB.connexion.rollback()\n                except Exception:\n                    pass\n                DB.Close()\n                dlg = wx.MessageDialog(self, _(u\"Le modèle de contrat n'a pas pu être enregistré complètement. Aucune modification n'a été validée.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n                dlg.ShowModal()\n                dlg.Destroy()\n                return False\n\n            DB.Commit()\n            DB.Close()\n            self.IDmodele = IDmodele\n            return True\n\n'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile noethys/GestionDB.py noethys/Dlg/DLG_Saisie_contrat.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          g = Path('noethys/GestionDB.py').read_text(encoding='utf-8')
          c = Path('noethys/Dlg/DLG_Saisie_contrat.py').read_text(encoding='utf-8')
          assert 'nomChampBlob="image", commit=True' in g
          assert 'return True' in g[g.index('    def MAJimage'):g.index('    def ReqMAJ')]
          b = c[c.index('# Sauvegarde atomique du modèle de contrat'):c.index('# Sauvegarde atomique du contrat')]
          assert 'ReqInsert("modeles_contrats", listeDonnees, commit=False)' in b
          assert 'MAJimage(' in b and 'commit=False' in b
          assert 'DB.Commit()' in b
          assert 'self.IDmodele = IDmodele' in b
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/GestionDB.py noethys/Dlg/DLG_Saisie_contrat.py
          git commit -m "fix: atomiser la sauvegarde des modeles de contrat"
          git push origin HEAD:master
