name: Locate unsafe exec

on:
  push:
    paths:
      - '.github/workflows/_tmp_locate_unsafe_exec.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Localiser eval/exec
        run: |
          python scripts/audit_runtime_patterns.py --json unsafe.json
          python - <<'PY'
          import json
          with open('unsafe.json', encoding='utf-8') as f:
              data = json.load(f)
          print(json.dumps(data.get('UNSAFE_EXEC', []), ensure_ascii=False, indent=2))
          PY
