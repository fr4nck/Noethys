name: Scan import export risks

on:
  push:
    paths:
      - '.github/workflows/_tmp_import_export_scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Lister les modules et alertes sensibles
        run: |
          python scripts/audit_runtime_patterns.py --json runtime.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('runtime.json',encoding='utf-8'))
          files=[]
          for p in Path('noethys').rglob('*.py'):
              n=p.name.lower()
              if 'import' in n or 'export' in n:
                  files.append(p)
          print('### MODULES IMPORT/EXPORT')
          for p in sorted(files): print(p)
          print('\n### ALERTES RUNTIME')
          rel={str(p.relative_to('noethys')).replace('\\','/') for p in files}
          for key in ('BARE_EXCEPT','RESULT_UNGUARDED','RESULT_ASSIGN'):
              print('\n',key)
              for x in d[key]:
                  if x['file'] in rel: print(x)
          print('\n### ECRITURES/SUPPRESSIONS/RENOMMAGES')
          needles=('open(', '.write(', 'csv.', 'shutil.', 'os.remove(', 'os.rename(', 'os.replace(', 'unlink(', 'commit(', 'ExecuterReq(')
          for p in sorted(files):
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              hits=[(i,l.strip()) for i,l in enumerate(lines,1) if any(n in l for n in needles)]
              if hits:
                  print('\n--',p)
                  for i,l in hits[:120]: print(f'{i}: {l}')
          PY