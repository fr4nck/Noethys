name: Atomic reglements prelevements

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_reglements_prelevements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnostiquer structures
        run: |
          python - <<'PY'
          from pathlib import Path
          out=[]
          for path in ('noethys/Ol/OL_Prelevements_sepa.py','noethys/Ol/OL_Prelevements_national.py','noethys/Ol/OL_PES_pieces.py'):
              s=Path(path).read_text(encoding='utf-8')
              out.append('\n### '+path)
              marker='    def SauvegardeReglements(self, date=None, IDcompte=None, IDmode=None):'
              out.append('marker='+str(s.count(marker)))
              if marker in s:
                  a=s.index(marker)
                  tail=s[a:a+12000]
                  out.append('sep4='+str('\n\n\n\n# -------------------------------------------------------------------------------------------------------------------------------------------' in tail))
                  out.append('close_history='+str('        DB.Close() \n\n        # Sauvegarde dans historique\n        UTILS_Historique.InsertActions(listeHistoriqueAjouts)' in tail))
                  out.append('close='+str('        DB.Close() ' in tail))
                  out.append('holder_titulaire='+str('("nom", track.titulaire)' in tail))
                  out.append('holder_pes='+str('("nom", track.prelevement_titulaire)' in tail))
                  out.append('reg_insert='+str('track.IDreglement = DB.ReqInsert("reglements", listeDonnees)' in tail))
                  out.append('vent_insert='+str('IDventilation = DB.ReqInsert("ventilation", listeDonnees)' in tail))
          Path('.github/_tmp_diag_reglements_prelevements.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Publier diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/_tmp_diag_reglements_prelevements.txt
          git commit -m "ci: publier diagnostic temporaire règlements prélèvements"
          git push origin HEAD:master
