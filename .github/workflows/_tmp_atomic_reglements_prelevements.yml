name: Atomic reglements prelevements

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_reglements_prelevements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnostic SEPA
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Ol/OL_Prelevements_sepa.py').read_text(encoding='utf-8')
          a=s.index('    def SauvegardeReglements(self, date=None, IDcompte=None, IDmode=None):')
          b=s.index('    def MemoriseReglementHistorique(',a)
          x=s[a:b]
          i=x.rfind('DB.Close')
          txt='TAIL_REPR='+repr(x[max(0,i-200):])+'\n'
          txt+='REFRESH_COUNT='+str(x.count('self.RefreshObject(track)'))+'\n'
          txt+='DELETE_PAIR='+str('DB.ReqDEL("reglements", "IDreglement", track.IDreglement)' in x and 'DB.ReqDEL("ventilation", "IDreglement", track.IDreglement)' in x)+'\n'
          Path('.github/_tmp_diag_sepa_tail.txt').write_text(txt,encoding='utf-8')
          PY
      - name: Publier diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/_tmp_diag_sepa_tail.txt
          git commit -m "ci: publier diagnostic temporaire fin SEPA"
          git push origin HEAD:master
