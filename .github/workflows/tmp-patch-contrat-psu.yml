name: tmp patch contrat PSU
on:
  push:
    paths:
      - 'tools/tmp_patch_contrat_psu.py'
      - '.github/workflows/tmp-patch-contrat-psu.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch
        run: python tools/tmp_patch_contrat_psu.py
      - name: Checks
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_contratpsu.py
          git diff --check
          grep -q 'ReqInsert("contrats", listeDonnees, commit=False)' noethys/Dlg/DLG_Saisie_contratpsu.py
          grep -q 'listeAjouts, commit=False' noethys/Dlg/DLG_Saisie_contratpsu.py
          grep -q 'ReqInsert("contrats_tarifs", listeDonnees, commit=False)' noethys/Dlg/DLG_Saisie_contratpsu.py
          grep -q 'self.IDcontrat = IDcontrat' noethys/Dlg/DLG_Saisie_contratpsu.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_contratpsu.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: atomiser la sauvegarde des contrats PSU'
          git pull --rebase origin master
          git push origin HEAD:master
