name: Atomic prelevements e2e

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_prelevements_e2e.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch prelevements e2e
        run: |
          python - <<'PY'
          from pathlib import Path

          files = (
              'noethys/Ol/OL_Prelevements_sepa.py',
              'noethys/Ol/OL_Prelevements_national.py',
          )

          for path in files:
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              # Signature backward compatible
              old='    def SauvegardeReglements(self, date=None, IDcompte=None, IDmode=None):'
              new='    def SauvegardeReglements(self, date=None, IDcompte=None, IDmode=None, DB=None, commit=True):'
              if old not in s:
                  raise SystemExit('signature introuvable '+path)
              s=s.replace(old,new,1)
              a=s.index(new)
              # Replace local DB initialization only within method
              b=s.find('\n    def ', a+5)
              if b == -1:
                  b=len(s)
              x=s[a:b]
              x=x.replace('        DB = GestionDB.DB()\n        ok = True\n', '        DBexterne = DB is not None\n        if DB is None:\n            DB = GestionDB.DB()\n        ok = True\n',1)
              # Replace transaction tail
              oldtail='''        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        DB.Close()\n        if not ok:\n            return False\n'''
              newtail='''        if not ok:\n            if commit:\n                try:\n                    DB.connexion.rollback()\n                except Exception:\n                    pass\n            if not DBexterne:\n                DB.Close()\n            return False\n        if commit:\n            DB.Commit()\n        if not DBexterne:\n            DB.Close()\n'''
              if oldtail not in x:
                  raise SystemExit('tail SauvegardeReglements inattendu '+path)
              x=x.replace(oldtail,newtail,1)
              s=s[:a]+x+s[b:]

              # Sauvegarde(): keep DB open until reglements succeeds, then one commit.
              a=s.index('    def Sauvegarde(self, IDlot=None, datePrelevement=None, IDcompte=None, IDmode=None):')
              b=s.index('    def SauvegardeReglements(', a)
              x=s[a:b]
              oldphase='''        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        DB.Close()\n\n        if not ok:\n            return False\n\n        for track, IDprelevement in listeMAJPrelevements:\n            track.IDprelevement = IDprelevement\n            self.RefreshObject(track)\n\n        # Sauvegarde des règlements uniquement si le lot est cohérent\n        if self.SauvegardeReglements(date=datePrelevement, IDcompte=IDcompte, IDmode=IDmode) is False:\n            return False\n        return True\n\n\n'''
              newphase='''        if ok:\n            ok = self.SauvegardeReglements(date=datePrelevement, IDcompte=IDcompte, IDmode=IDmode, DB=DB, commit=False) is not False\n\n        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        DB.Close()\n\n        if not ok:\n            return False\n\n        for track, IDprelevement in listeMAJPrelevements:\n            track.IDprelevement = IDprelevement\n            self.RefreshObject(track)\n        return True\n\n\n'''
              if oldphase not in x:
                  raise SystemExit('phase lot inattendue '+path)
              x=x.replace(oldphase,newphase,1)
              s=s[:a]+x+s[b:]
              s='\n'.join(line.rstrip() for line in s.splitlines())+'\n'
              p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Ol/OL_Prelevements_sepa.py noethys/Ol/OL_Prelevements_national.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          for path in ('noethys/Ol/OL_Prelevements_sepa.py','noethys/Ol/OL_Prelevements_national.py'):
              s=Path(path).read_text(encoding='utf-8')
              assert 'def SauvegardeReglements(self, date=None, IDcompte=None, IDmode=None, DB=None, commit=True):' in s
              a=s.index('    def Sauvegarde(self, IDlot=None, datePrelevement=None, IDcompte=None, IDmode=None):')
              b=s.index('    def SauvegardeReglements(',a)
              x=s[a:b]
              assert 'DB=DB, commit=False' in x
              assert x.index('SauvegardeReglements') < x.index('DB.Commit()')
              assert x.index('track.IDprelevement = IDprelevement') > x.index('DB.Close()')
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ol/OL_Prelevements_sepa.py noethys/Ol/OL_Prelevements_national.py
          git commit -m "fix: atomiser prélèvements et règlements de bout en bout"
          git push origin HEAD:master
