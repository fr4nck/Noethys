name: NOE-032b precheck order

on:
  push:
    branches:
      - fix/noe-032b-backup-integrity
    paths:
      - .github/workflows/noe032b-precheck-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/noe-032b-backup-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Corriger l'ordre du précontrôle SQL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('noethys/Utils/UTILS_Sauvegarde.py')
          source = path.read_text(encoding='utf-8')
          creation = '''                # Création de la base si elle n'existe pas
                          if fichier not in listeFichiersExistants :
                              nomFichier = u"%s;%s;%s;%s[RESEAU]%s" % (dictConnexion["port"], dictConnexion["host"], dictConnexion["user"], dictConnexion["password"], fichier)
                              DB = GestionDB.DB(suffixe=None, nomFichier=nomFichier, modeCreation=True)
                              DB.Close()

          '''
          if creation not in source:
              raise SystemExit('bloc création DB introuvable')
          source = source.replace(creation, '', 1)
          anchor = '''                if _SQLContientChargeRestauratrice(fichierRestore) == False:
                          dlgprogress.Destroy()
                          dlgErreur = wx.MessageDialog(None, _(u"Le fichier SQL '%s' ne contient aucune instruction de restauration exploitable.") % fichier, _(u"Erreur"), wx.OK | wx.ICON_ERROR)
                          dlgErreur.ShowModal()
                          dlgErreur.Destroy()
                          fichierZip.close()
                          return False

          '''
          creation_after = anchor + '''                # Création de la base uniquement après validation de la charge SQL.
                          if fichier not in listeFichiersExistants :
                              nomFichier = u"%s;%s;%s;%s[RESEAU]%s" % (dictConnexion["port"], dictConnexion["host"], dictConnexion["user"], dictConnexion["password"], fichier)
                              DB = GestionDB.DB(suffixe=None, nomFichier=nomFichier, modeCreation=True)
                              try:
                                  if getattr(DB, "echec", 1) == 1:
                                      raise RuntimeError(_(u"La base MySQL '%s' n'a pas pu être créée.") % fichier)
                              finally:
                                  DB.Close()

          '''
          if anchor not in source:
              raise SystemExit('ancre précontrôle introuvable')
          source = source.replace(anchor, creation_after, 1)
          ast.parse(source)
          path.write_text(source, encoding='utf-8')

          tests_path = Path('tests/test_noe_032_restore_flow.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace('module.GetListeFichiersReseau = lambda values: ["demo_data"]\n            module.GetRepertoireMySQL = lambda values: "/fake/mysql/"\n            module.CreationFichierLoginTemp = lambda **kwargs: Path(kwargs["nomFichier"]).write_text("[client]\\n")\n            params = {"host": "localhost", "port": 3306, "user": "test", "password": "test"}\n\n            with mock.patch.object(module.subprocess, "Popen", return_value=_FakeProcess()) as popen:\n                result = module.Restauration(', 'module.GetListeFichiersReseau = lambda values: []\n            module.GetRepertoireMySQL = lambda values: "/fake/mysql/"\n            module.CreationFichierLoginTemp = lambda **kwargs: Path(kwargs["nomFichier"]).write_text("[client]\\n")\n            params = {"host": "localhost", "port": 3306, "user": "test", "password": "test"}\n\n            with mock.patch.object(module.GestionDB, "DB") as db, mock.patch.object(module.subprocess, "Popen", return_value=_FakeProcess()) as popen:\n                result = module.Restauration(', 1)
          tests = tests.replace('            self.assertFalse(result)\n            popen.assert_not_called()\n            self.assertFalse((temp_dir / "restoretemp").exists())\n\n    def test_network_restore_rejects_mysql_success_without_tables', '            self.assertFalse(result)\n            db.assert_not_called()\n            popen.assert_not_called()\n            self.assertFalse((temp_dir / "restoretemp").exists())\n\n    def test_network_restore_rejects_mysql_success_without_tables', 1)
          ast.parse(tests)
          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Vérifier et pousser
        shell: bash
        run: |
          python -m py_compile noethys/Utils/UTILS_Sauvegarde.py tests/test_noe_032_restore_flow.py
          python tests/test_noe_032_restore_flow.py
          python tests/test_noe_032_backup_integrity.py
          python scripts/qualify_branch_assignment_gaps.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/noe032b-precheck-order.yml
          git add noethys/Utils/UTILS_Sauvegarde.py tests/test_noe_032_restore_flow.py
          git diff --cached --check
          git commit -m "Fix: valider le SQL avant création de la base"
          git push origin HEAD:fix/noe-032b-backup-integrity
