name: Noe-003 exact SQL patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/noe003-self-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply exact SQL rewrite
        shell: python
        run: |
          from pathlib import Path

          path = Path('noethys/Dlg/DLG_Export_compta.py')
          text = path.read_text(encoding='utf-8')

          old_join = '''        LEFT JOIN cotisations ON cotisations.IDprestation = prestations.IDprestation
        LEFT JOIN types_cotisations ON types_cotisations.IDtype_cotisation = cotisations.IDtype_cotisation
'''
          new_join = '''        LEFT JOIN (
            SELECT IDprestation, MIN(IDcotisation) AS IDcotisation
            FROM cotisations
            WHERE IDprestation IS NOT NULL
            GROUP BY IDprestation
        ) cotisation_unique ON cotisation_unique.IDprestation = prestations.IDprestation
        LEFT JOIN cotisations ON cotisations.IDcotisation = cotisation_unique.IDcotisation
        LEFT JOIN types_cotisations ON types_cotisations.IDtype_cotisation = cotisations.IDtype_cotisation
'''
          old_group = '        GROUP BY prestations.IDprestation\n'

          assert text.count(old_join) == 2, f'expected 2 cotisation joins, found {text.count(old_join)}'
          assert text.count(old_group) == 2, f'expected 2 outer GROUP BY clauses, found {text.count(old_group)}'

          text = text.replace(old_join, new_join)
          text = text.replace(old_group, '')
          path.write_text(text, encoding='utf-8')
      - name: Static checks
        run: |
          python -m py_compile noethys/Dlg/DLG_Export_compta.py
          git diff --check
          test "$(git diff --numstat -- noethys/Dlg/DLG_Export_compta.py | awk '{print $3}')" = "noethys/Dlg/DLG_Export_compta.py"
      - name: Commit exact patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Export_compta.py
          git rm .github/workflows/noe003-self-patch.yml
          git commit -m "Noe-003: make Quadra and Cerig exports strict-SQL safe"
          git push origin HEAD:master
