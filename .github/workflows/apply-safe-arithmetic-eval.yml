name: Apply safe arithmetic eval

on:
  push:
    paths:
      - 'noethys/Utils/UTILS_Expressions.py'
      - 'scripts/migrate_safe_arithmetic_eval.py'
      - '.github/workflows/apply-safe-arithmetic-eval.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer les migrations
        run: python scripts/migrate_safe_arithmetic_eval.py
      - name: Tester l'évaluateur arithmétique
        run: |
          PYTHONPATH=noethys python - <<'PY'
          from Utils import UTILS_Expressions
          tests = {
              "1+2*3": 7,
              "(10-4)/2": 3.0,
              "-5+8": 3,
              "2**3": 8,
              "7//2": 3,
              "7%4": 3,
          }
          for expression, attendu in tests.items():
              obtenu = UTILS_Expressions.EvaluerArithmetique(expression)
              assert obtenu == attendu, (expression, obtenu, attendu)
          for expression in ["__import__('os').system('id')", "(1).__class__", "x+1", "[1][0]"]:
              try:
                  UTILS_Expressions.EvaluerArithmetique(expression)
              except (ValueError, TypeError, SyntaxError):
                  pass
              else:
                  raise AssertionError("Expression dangereuse acceptée: %s" % expression)
          PY
      - name: Vérifier la compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Vérifier la baisse des eval
        run: python scripts/audit_dynamic_import_risks.py --max-import-risks 0
      - name: Committer
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Saisie_formule.py noethys/Ol/OL_Suivi_budget.py
          git commit -m "security: sécuriser deux calculs arithmétiques"
          git push origin master
