name: Harden NoethysWeb finalisation

on:
  push:
    paths:
      - '.github/workflows/_tmp_noethysweb_finalise_hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fiabiliser la création et le résultat de l'archive
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('noethys/Utils/UTILS_Export_noethysweb.py')
          s=p.read_text(encoding='utf-8')
          old='''    def Finaliser(self):\n        # Création du fichier json\n        nom_fichier_json = os.path.join(self.rep, "core.json")\n        with open(nom_fichier_json, 'w', encoding='utf-8') as outfile:\n            json.dump(self.liste_objets, outfile, indent=4, cls=MyEncoder)\n\n        # Création du ZIP\n        fichier_zip = shutil.make_archive(UTILS_Fichiers.GetRepTemp("exportweb"), 'zip', self.rep)\n\n        # Crypte le fichier\n        if self.mdp:\n            UTILS_Cryptage_fichier.CrypterFichier(fichier_zip, self.nom_fichier, self.mdp, ancienne_methode=False)\n        else:\n            shutil.copyfile(fichier_zip, self.nom_fichier)\n\n        # Nettoyage\n        shutil.rmtree(self.rep)\n        os.remove(fichier_zip)\n\n        return True'''
          new='''    def Finaliser(self):\n        fichier_zip = None\n        self.erreur_export = None\n        try:\n            # Création du fichier json\n            nom_fichier_json = os.path.join(self.rep, "core.json")\n            with open(nom_fichier_json, 'w', encoding='utf-8') as outfile:\n                json.dump(self.liste_objets, outfile, indent=4, cls=MyEncoder)\n\n            # Création du ZIP\n            fichier_zip = shutil.make_archive(UTILS_Fichiers.GetRepTemp("exportweb"), 'zip', self.rep)\n\n            # Crypte ou copie le fichier final\n            if self.mdp:\n                UTILS_Cryptage_fichier.CrypterFichier(fichier_zip, self.nom_fichier, self.mdp, ancienne_methode=False)\n            else:\n                shutil.copyfile(fichier_zip, self.nom_fichier)\n            return True\n        except Exception as err:\n            self.erreur_export = str(err)\n            return False\n        finally:\n            # Les temporaires ne doivent pas survivre à une réussite ou à un échec.\n            if os.path.isdir(self.rep):\n                shutil.rmtree(self.rep, ignore_errors=True)\n            if fichier_zip and os.path.isfile(fichier_zip):\n                try:\n                    os.remove(fichier_zip)\n                except OSError:\n                    pass'''
          if s.count(old)!=1: raise SystemExit('Finaliser inattendu')
          s=s.replace(old,new,1)
          old2='''        self.DB.Close()\n        self.Finaliser()'''
          new2='''        self.DB.Close()\n        self.resultat = self.Finaliser()'''
          if s.count(old2)!=1: raise SystemExit('appel Finaliser inattendu')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          p=Path('noethys/Dlg/DLG_Export_noethysweb.py')
          s=p.read_text(encoding='utf-8')
          old='''        UTILS_Export_noethysweb.Export_all(dlg=self, nom_fichier=os.path.join(repertoire, nom + ".nweb"), mdp=motdepasse, options=options)\n        del dlgAttente\n\n        # Confirmation de réussite\n        dlg = wx.MessageDialog(self, _(u"Le fichier a été généré avec succès."), _(u"Confirmation"), wx.OK | wx.ICON_INFORMATION)'''
          new='''        export = UTILS_Export_noethysweb.Export_all(dlg=self, nom_fichier=os.path.join(repertoire, nom + ".nweb"), mdp=motdepasse, options=options)\n        del dlgAttente\n        if not export.resultat:\n            detail = export.erreur_export or _(u"Erreur inconnue")\n            dlg = wx.MessageDialog(self, _(u"Le fichier NoethysWeb n'a pas pu être généré.\\n\\nErreur : %s") % detail, _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n\n        # Confirmation de réussite\n        dlg = wx.MessageDialog(self, _(u"Le fichier a été généré avec succès."), _(u"Confirmation"), wx.OK | wx.ICON_INFORMATION)'''
          if s.count(old)!=1: raise SystemExit('appel dialogue inattendu')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Export_noethysweb.py noethys/Dlg/DLG_Export_noethysweb.py
          git diff --check
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Export_noethysweb.py noethys/Dlg/DLG_Export_noethysweb.py
          git commit -m 'fix: ne plus annoncer un export NoethysWeb en échec comme réussi'
          git push origin HEAD:master