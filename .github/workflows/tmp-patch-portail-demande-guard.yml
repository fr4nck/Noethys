name: tmp patch portail demande guard
on:
  push:
    paths:
      - 'tools/tmp_patch_portail_demande_guard.py'
      - '.github/workflows/tmp-patch-portail-demande-guard.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch
        run: python tools/tmp_patch_portail_demande_guard.py
      - name: Checks
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_portail_demande.py
          git diff --check
          grep -q 'resultat_compte = DB.ResultatReq()' noethys/Dlg/DLG_Saisie_portail_demande.py
          grep -q 'if resultat_compte:' noethys/Dlg/DLG_Saisie_portail_demande.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_portail_demande.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: protéger le compte bancaire des paiements TIPI'
          git pull --rebase origin master
          git push origin HEAD:master
