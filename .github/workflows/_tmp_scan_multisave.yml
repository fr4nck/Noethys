name: Scan multi saves

on:
  push:
    paths:
      - '.github/workflows/_tmp_scan_multisave.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scanner les fonctions sensibles
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          roots=[Path('noethys/Dlg'), Path('noethys/Utils')]
          keywords=('factur','reglement','inscription')
          calls=('ReqInsert','ReqMAJ','ReqDEL','Executermany','ExecuterReq')
          for root in roots:
              for p in root.rglob('*.py'):
                  low=str(p).lower()
                  if not any(k in low for k in keywords):
                      continue
                  try:
                      tree=ast.parse(p.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  for node in ast.walk(tree):
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                          counts={c:0 for c in calls}
                          commits=0
                          rollbacks=0
                          for sub in ast.walk(node):
                              if isinstance(sub,ast.Call):
                                  fn=sub.func
                                  name=fn.attr if isinstance(fn,ast.Attribute) else fn.id if isinstance(fn,ast.Name) else ''
                                  if name in counts: counts[name]+=1
                                  if name=='Commit': commits+=1
                                  if name=='rollback': rollbacks+=1
                          total=sum(counts.values())
                          if total>=2:
                              print(f'{p}:{node.lineno} {node.name} total={total} commits={commits} rollbacks={rollbacks} {counts}')
          PY