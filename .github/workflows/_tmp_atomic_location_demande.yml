name: Atomic location demande
on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_location_demande.yml'
      - '.github/_tmp_patch_location_demande.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch
        run: python .github/_tmp_patch_location_demande.py
      - name: Verify
        run: |
          python -m py_compile noethys/Ctrl/CTRL_Questionnaire.py noethys/Dlg/DLG_Saisie_location_demande.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          q=Path('noethys/Ctrl/CTRL_Questionnaire.py').read_text(encoding='utf-8')
          assert 'DBexterne = DB is not None' in q
          assert 'commit=not DBexterne' in q
          assert 'return True' in q
          s=Path('noethys/Dlg/DLG_Saisie_location_demande.py').read_text(encoding='utf-8')
          a=s.index('        # Sauvegarde transactionnelle de la demande')
          b=s.index('        # Fermeture de la fenêtre',a)
          x=s[a:b]
          assert 'ReqInsert("locations_demandes", listeDonnees, commit=False)' in x
          assert 'questionnaire_filtres' in x and 'commit=False' in x
          assert 'ctrl_questionnaire.Sauvegarde(DB=DB, IDdonnee=nouvelIDdemande)' in x
          assert 'DB.Commit()' in x and 'rollback()' in x
          assert x.index('self.IDdemande = nouvelIDdemande') > x.index('DB.Close()')
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ctrl/CTRL_Questionnaire.py noethys/Dlg/DLG_Saisie_location_demande.py
          git commit -m "fix: atomiser les demandes de location"
          git pull --rebase origin master
          git push origin HEAD:master
