name: Scan deductions restantes

on:
  push:
    paths:
      - '.github/workflows/_tmp_scan_deductions_restantes.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan deduction write paths
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=(Path('noethys/Dlg'),Path('noethys/Ol'),Path('noethys/Ctrl'),Path('noethys/Utils'))
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*.py'):
                  s=p.read_text(encoding='utf-8',errors='ignore')
                  if 'deductions' not in s:
                      continue
                  hits=[]
                  for i,line in enumerate(s.splitlines(),1):
                      if any(x in line for x in ('ReqInsert("deductions"','ReqMAJ("deductions"','ReqDEL("deductions"','DELETE FROM deductions','INSERT INTO deductions','UPDATE deductions')):
                          hits.append((i,line.strip()))
                  if hits:
                      print('\n###',p)
                      for i,line in hits:
                          print(f'{i}: {line}')
          PY
