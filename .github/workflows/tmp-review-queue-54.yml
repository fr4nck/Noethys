name: Temporary review queue 54

on:
  push:
    branches:
      - audit/review-queue-54

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/review-queue-54
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Print review-only inventory
        shell: bash
        run: |
          python - <<'PY'
          from scripts.qualify_branch_assignment_gaps import build_report, qualification_key
          report = build_report()
          review = [item for item in report['findings'] if item['classification'] == 'review']
          print(f'REVIEW_COUNT={len(review)}')
          for index, item in enumerate(review, 1):
              key = qualification_key(item)
              print(f"REVIEW[{index:02d}] {item['file']}:{item['line']} :: {item['function']} :: {item['name']} :: {item['detail']} :: fingerprint={key[-1]}")
          PY
      - name: Self-clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-review-queue-54.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit: retirer l'inventaire temporaire"
          git push origin HEAD:audit/review-queue-54
