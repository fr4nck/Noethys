name: Scan portal sync risks

on:
  push:
    paths:
      - '.github/workflows/_tmp_portal_risk_scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Relever les points sensibles du portail
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Utils/UTILS_Portail_synchro.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=('except:', 'ResultatReq()[', 'ResultatReq()', 'os.remove(', 'shutil.rmtree(', 'tempfile', 'models.py', 'FTP(', 'FTP_TLS(', 'SFTP', 'SSHClient', 'return False', 'return None')
          for i,line in enumerate(lines,1):
              if any(n in line for n in needles):
                  a=max(1,i-2); b=min(len(lines),i+3)
                  print(f'\n--- {a}-{b} ---')
                  for j in range(a,b+1): print(f'{j:5}: {lines[j-1]}')
          PY
          python scripts/audit_runtime_patterns.py --json runtime.json
          python - <<'PY'
          import json
          d=json.load(open('runtime.json',encoding='utf-8'))
          for key in ('BARE_EXCEPT','RESULT_UNGUARDED','RESULT_ASSIGN'):
              print('\n',key)
              for x in d[key]:
                  if x['file']=='Utils/UTILS_Portail_synchro.py': print(x)
          PY