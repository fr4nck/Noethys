name: Atomic national PES

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_national_pes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch PES
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Ol/OL_PES_pieces.py')
          s=p.read_text(encoding='utf-8')
          a=s.index('    def SauvegardeReglements(self, date=None, IDcompte=None, IDmode=None):')
          b=s.index('\n\n\n\n# -------------------------------------------------------------------------------------------------------------------------------------------', a)
          x=s[a:b]
          x=x.replace('        DB = GestionDB.DB()\n', '        DB = GestionDB.DB()\n        ok = True\n        listeMAJTracks = []\n', 1)
          x=x.replace('IDpayeur = DB.ReqInsert("payeurs", [("IDcompte_payeur", track.IDcompte_payeur), ("nom", track.prelevement_titulaire)])', 'IDpayeur = DB.ReqInsert("payeurs", [("IDcompte_payeur", track.IDcompte_payeur), ("nom", track.prelevement_titulaire)], commit=False)\n                        if IDpayeur is None:\n                            ok = False\n                            break')
          x=x.replace('                        track.IDreglement = DB.ReqInsert("reglements", listeDonnees)', '                        IDreglement = DB.ReqInsert("reglements", listeDonnees, commit=False)\n                        if IDreglement is None:\n                            ok = False\n                            break')
          x=x.replace('                        DB.ReqMAJ("reglements", listeDonnees, "IDreglement", track.IDreglement)', '                        IDreglement = track.IDreglement\n                        if not DB.ReqMAJ("reglements", listeDonnees, "IDreglement", IDreglement, commit=False):\n                            ok = False\n                            break')
          x=x.replace('                    track.dateReglement = date', '                    listeMAJTracks.append((track, IDreglement, date))')
          x=x.replace('                                    ("IDreglement", track.IDreglement),', '                                    ("IDreglement", IDreglement),')
          x=x.replace('                            IDventilation = DB.ReqInsert("ventilation", listeDonnees)', '                            IDventilation = DB.ReqInsert("ventilation", listeDonnees, commit=False)\n                            if IDventilation is None:\n                                ok = False\n                                break')
          x=x.replace('''                    DB.ReqDEL("reglements", "IDreglement", track.IDreglement)\n                    DB.ReqDEL("ventilation", "IDreglement", track.IDreglement)''','''                    if not DB.ReqDEL("ventilation", "IDreglement", track.IDreglement, commit=False):\n                        ok = False\n                        break\n                    if not DB.ReqDEL("reglements", "IDreglement", track.IDreglement, commit=False):\n                        ok = False\n                        break''')
          x=x.replace('            self.RefreshObject(track)\n', '')
          x=x.replace('        DB.Close() ', '''        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        DB.Close()\n        if not ok:\n            return False\n        for track, IDreglement, dateReglement in listeMAJTracks:\n            track.IDreglement = IDreglement\n            track.dateReglement = dateReglement\n            self.RefreshObject(track)\n        return True''', 1)
          s=s[:a]+x+s[b:]
          s='\n'.join(line.rstrip() for line in s.splitlines())+'\n'
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Ol/OL_PES_pieces.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Ol/OL_PES_pieces.py').read_text(encoding='utf-8')
          a=s.index('    def SauvegardeReglements(self, date=None, IDcompte=None, IDmode=None):')
          b=s.index('# -------------------------------------------------------------------------------------------------------------------------------------------',a)
          x=s[a:b]
          assert 'ReqInsert("reglements", listeDonnees, commit=False)' in x
          assert 'ReqInsert("ventilation", listeDonnees, commit=False)' in x
          assert 'ReqDEL("ventilation", "IDreglement", track.IDreglement, commit=False)' in x
          assert 'DB.Commit()' in x and 'rollback()' in x and 'return True' in x
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ol/OL_PES_pieces.py
          git commit -m "fix: atomiser règlements PES"
          git push origin HEAD:master
