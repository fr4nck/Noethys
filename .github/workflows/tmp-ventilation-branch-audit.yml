name: Temporary ventilation branch audit
on:
  push:
    branches:
      - fix/ventilation-regroupement-contracts

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Print CTRL_Ventilation branch candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts import audit_branch_assignment_gaps as audit
          path = Path('noethys/Ctrl/CTRL_Ventilation.py')
          findings = audit.scan_file(path)
          print('COUNT=', len(findings))
          for item in findings:
              print(item)
          PY
