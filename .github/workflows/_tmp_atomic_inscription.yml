name: Atomic inscription

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_inscription.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch inscription et historique
        run: |
          python - <<'PY'
          from pathlib import Path

          # Historique : gérer le retour False de Executermany et le propager.
          p=Path('noethys/Utils/UTILS_Historique.py')
          s=p.read_text(encoding='utf-8')
          old='''        try:\n            DB.Executermany(req, listeAjouts, commit=False)\n        except Exception:\n            # Compatibilité avec les anciennes bases sans colonne IDdonnee.\n            req = u"INSERT INTO historique (date, heure, IDutilisateur, IDfamille, IDindividu, IDcategorie, action) VALUES (?, ?, ?, ?, ?, ?, ?)"\n            listeAjoutsCompat = [ligne[:-1] for ligne in listeAjouts]\n            DB.Executermany(req, listeAjoutsCompat, commit=False)\n        if commit:\n            DB.Commit()\n        if not DBexterne:\n            DB.Close()\n'''
          new='''        ok = DB.Executermany(req, listeAjouts, commit=False)\n        if not ok:\n            # Compatibilité avec les anciennes bases sans colonne IDdonnee.\n            req = u"INSERT INTO historique (date, heure, IDutilisateur, IDfamille, IDindividu, IDcategorie, action) VALUES (?, ?, ?, ?, ?, ?, ?)"\n            listeAjoutsCompat = [ligne[:-1] for ligne in listeAjouts]\n            ok = DB.Executermany(req, listeAjoutsCompat, commit=False)\n        if not ok:\n            if not DBexterne:\n                DB.Close()\n            return False\n        if commit:\n            DB.Commit()\n        if not DBexterne:\n            DB.Close()\n    return True\n'''
          if s.count(old)!=1:
              raise SystemExit('historique motif inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Inscription : transaction unique inscription/remboursement/consommations/historique.
          p=Path('noethys/Dlg/DLG_Inscription.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    def Sauvegarde(self):')
          end=s.index('    def GetCompteFamille(', start)
          block=s[start:end]

          block=block.replace('''        if self.parent.mode == "saisie" :\n            listeDonnees.append(("date_inscription", str(datetime.date.today())))\n            self.IDinscription = DB.ReqInsert("inscriptions", listeDonnees)\n        else :\n            DB.ReqMAJ("inscriptions", listeDonnees, "IDinscription", self.IDinscription)\n''','''        ancien_IDinscription = self.IDinscription\n        if self.parent.mode == "saisie" :\n            listeDonnees.append(("date_inscription", str(datetime.date.today())))\n            IDinscription = DB.ReqInsert("inscriptions", listeDonnees, commit=False)\n            if IDinscription is None:\n                DB.Close()\n                return False\n            self.IDinscription = IDinscription\n        else :\n            IDinscription = self.IDinscription\n            if not DB.ReqMAJ("inscriptions", listeDonnees, "IDinscription", IDinscription, commit=False):\n                DB.Close()\n                return False\n''',1)
          block=block.replace('''            DB.ReqInsert("prestations", listeDonnees)\n''','''            if DB.ReqInsert("prestations", listeDonnees, commit=False) is None:\n                self.IDinscription = ancien_IDinscription\n                DB.Close()\n                return False\n''',1)
          block=block.replace('''        if self.action_consommation != None:\n            self.action_consommation(DB, date_desinscription)\n\n        DB.Commit()\n        DB.Close()\n\n        # Mémorise l'action dans l'historique\n''','''        if self.action_consommation != None:\n            if self.action_consommation(DB, date_desinscription) == False:\n                self.IDinscription = ancien_IDinscription\n                try:\n                    DB.connexion.rollback()\n                except Exception:\n                    pass\n                DB.Close()\n                return False\n\n        # Mémorise l'action dans l'historique dans la même transaction.\n''',1)
          oldhist='''        UTILS_Historique.InsertActions([{\n            "IDindividu" : self.parent.IDindividu,\n            "IDfamille" : IDfamille,\n            "IDcategorie" : IDcategorie_historique,\n            "action" : texte_historique,\n            },])\n\n        # Saisie de forfaits auto\n'''
          newhist='''        if UTILS_Historique.InsertActions([{\n            "IDindividu" : self.parent.IDindividu,\n            "IDfamille" : IDfamille,\n            "IDcategorie" : IDcategorie_historique,\n            "action" : texte_historique,\n            }], DB=DB, commit=False) == False:\n            self.IDinscription = ancien_IDinscription\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n            DB.Close()\n            return False\n\n        DB.Commit()\n        DB.Close()\n\n        # Saisie de forfaits auto\n'''
          if block.count(oldhist)!=1:
              raise SystemExit('historique inscription motif inattendu')
          block=block.replace(oldhist,newhist,1)
          s=s[:start]+block+s[end:]

          s=s.replace('''    def SupprimerConsommations(self, db, date_desinscription):\n        req = "DELETE FROM consommations WHERE IDinscription=%d AND date>'%s';" % (self.IDinscription, date_desinscription)\n        db.ExecuterReq(req)\n\n    def PreserverConsommations(self, db, date_desinscription):\n        req = "UPDATE consommations SET IDinscription=NULL WHERE IDinscription=%d AND date>'%s';" % (self.IDinscription, date_desinscription)\n        db.ExecuterReq(req)\n''','''    def SupprimerConsommations(self, db, date_desinscription):\n        req = "DELETE FROM consommations WHERE IDinscription=%d AND date>'%s';" % (self.IDinscription, date_desinscription)\n        return db.ExecuterReq(req) == 1\n\n    def PreserverConsommations(self, db, date_desinscription):\n        req = "UPDATE consommations SET IDinscription=NULL WHERE IDinscription=%d AND date>'%s';" % (self.IDinscription, date_desinscription)\n        return db.ExecuterReq(req) == 1\n''',1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Historique.py noethys/Dlg/DLG_Inscription.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          h=Path('noethys/Utils/UTILS_Historique.py').read_text(encoding='utf-8')
          i=Path('noethys/Dlg/DLG_Inscription.py').read_text(encoding='utf-8')
          assert 'ok = DB.Executermany(req, listeAjouts, commit=False)' in h
          assert 'return True' in h
          b=i[i.index('    def Sauvegarde(self):'):i.index('    def GetCompteFamille(')]
          assert 'DB.ReqInsert("inscriptions", listeDonnees, commit=False)' in b
          assert 'DB.ReqInsert("prestations", listeDonnees, commit=False)' in b
          assert 'DB=DB, commit=False' in b
          assert 'DB.Commit()' in b
          assert 'return db.ExecuterReq(req) == 1' in i
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Historique.py noethys/Dlg/DLG_Inscription.py
          git commit -m "fix: atomiser la sauvegarde des inscriptions"
          git push origin HEAD:master