name: Noe-062 apply recurrence extraction

on:
  push:
    branches:
      - noe-062-recurrence-commune

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: noe-062-recurrence-commune
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Appliquer le remplacement vérifié
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          path = Path('noethys/Dlg/DLG_Saisie_location.py')
          source = path.read_text(encoding='utf-8')

          old_import = 'from Utils import UTILS_Historique\n'
          new_import = old_import + 'from Utils import UTILS_Locations_Recurrence\n'
          if 'from Utils import UTILS_Locations_Recurrence\n' not in source:
              if source.count(old_import) != 1:
                  raise SystemExit('import UTILS_Historique inattendu')
              source = source.replace(old_import, new_import, 1)

          marker = '    def Calcule_occurences(self, dictDonnees={}):'
          start = source.index(marker)
          end = source.index('\n\n\nif __name__', start)
          replacement = (
              '    def Calcule_occurences(self, dictDonnees={}):\n'
              '        """ Calcule les occurences """\n'
              '        return UTILS_Locations_Recurrence.CalculerOccurrences(dictDonnees)\n'
          )
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          py_compile.compile(str(path), doraise=True)

          method = source[start:source.index('\n\n\nif __name__', start)]
          assert 'UTILS_Locations_Recurrence.CalculerOccurrences(dictDonnees)' in method
          assert 'SELECT date_debut, date_fin, nom, annee FROM vacances' not in method
          assert 'SELECT type, nom, jour, mois, annee FROM jours_feries' not in method
          PY
      - name: Auto-nettoyer le workflow temporaire et pousser
        shell: bash
        run: |
          rm .github/workflows/noe-062-apply-recurrence-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Saisie_location.py .github/workflows/noe-062-apply-recurrence-extraction.yml
          git diff --cached --check
          git commit -m "refactor: deleguer recurrence locations au moteur commun"
          git push origin HEAD:noe-062-recurrence-commune
