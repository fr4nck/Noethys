name: Apply Vanilla dons titulaires fix 169

on:
  push:
    branches:
      - fix/vanilla-dons-titulaires

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Corriger les titulaires du reçu
        shell: python
        run: |
          from pathlib import Path

          path = Path("noethys/Dlg/DLG_Impression_don_oeuvres.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '            for IDindividu, nomTitulaire in listeTitulaires[:-2] :',
                  '            for IDindividu, nomTitulaire in listeTitulaires[:-1] :',
              ),
              (
                  '        self.dictDonnees[0] = IDindividu',
                  '        if nbreTitulaires > 0:\n            self.dictDonnees[0] = listeTitulaires[-1][0]',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"motif attendu 1 fois, trouvé {count}: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Compiler et vérifier les contrats
        shell: python
        run: |
          import py_compile
          from pathlib import Path

          path = Path("noethys/Dlg/DLG_Impression_don_oeuvres.py")
          py_compile.compile(str(path), doraise=True)
          text = path.read_text(encoding="utf-8")

          assert 'listeTitulaires[:-2]' not in text
          assert 'listeTitulaires[:-1]' in text
          assert 'self.dictDonnees[0] = IDindividu' not in text
          assert 'if nbreTitulaires > 0:' in text
          assert 'self.dictDonnees[0] = listeTitulaires[-1][0]' in text
          # Préserver le correctif #159 déjà fusionné.
          assert 'date_edition = u""' in text
          assert 'dictDonnees["date_edition"] = u""' not in text

      - name: Committer et retirer le workflow temporaire
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Impression_don_oeuvres.py
          git commit -m "Vanilla: sécuriser les titulaires des reçus Dons (#169)"
          git rm .github/workflows/apply-vanilla-dons-titulaires-169.yml
          git commit --amend --no-edit
          git push
