name: Secure depots cotisations
on:
  push:
    paths:
      - '.github/workflows/_tmp_secure_depots_cotisations.yml'
      - '.github/_tmp_patch_depots_cotisations.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch
        run: python .github/_tmp_patch_depots_cotisations.py
      - name: Verify
        run: |
          python -m py_compile noethys/Ol/OL_Depots.py noethys/Dlg/DLG_Saisie_depot_cotisation.py noethys/Ol/OL_Depots_cotisations.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Dlg/DLG_Saisie_depot_cotisation.py').read_text(encoding='utf-8')
          a=s.index('    def Sauvegarde_depot(self):')
          b=s.index('    def GetIDdepotCotisation(self):', a)
          x=s[a:b]
          assert 'ReqInsert("depots_cotisations", listeDonnees, commit=False)' in x
          assert 'ReqMAJ("depots_cotisations", listeDonnees, "IDdepot_cotisation", nouvelIDdepot, commit=False)' in x
          assert 'Sauvegarde_cotisations(DB=DB, IDdepot_cotisation=nouvelIDdepot, commit=False)' in x
          assert 'ReqMAJ("cotisations", [("IDdepot_cotisation", nouvelleValeur),], "IDcotisation", track.IDcotisation, commit=False)' in x
          assert 'DB.Commit()' in x and 'rollback()' in x
          okblock=s[s.index('    def OnBoutonOk(self, event):'):a]
          assert 'self.Sauvegarde_cotisations()' not in okblock
          for path, table in [('noethys/Ol/OL_Depots.py','depots'),('noethys/Ol/OL_Depots_cotisations.py','depots_cotisations')]:
              y=Path(path).read_text(encoding='utf-8')
              assert 'resultat = DB.ReqDEL("%s"' % table in y
              assert 'if resultat :' in y
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ol/OL_Depots.py noethys/Dlg/DLG_Saisie_depot_cotisation.py noethys/Ol/OL_Depots_cotisations.py
          git commit -m "fix: sécuriser dépôts et cotisations"
          git pull --rebase origin master
          git push origin HEAD:master
