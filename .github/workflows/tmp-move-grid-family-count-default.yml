name: Temporary move grid family-count default

on:
  push:
    branches:
      - audit/grid-family-count-tariffs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/grid-family-count-tariffs
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Move targeted default before correlated branch
        run: python scripts/tmp_move_grid_family_count_default.py
      - name: Run targeted regression
        env:
          PYTHONPATH: ${{ github.workspace }}/noethys:${{ github.workspace }}
        run: python -m unittest tests.test_ctrl_grille_family_count_tariffs -v
      - name: Commit final source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Audit: placer le repli tarif famille avant le branchement"
          git push origin HEAD:audit/grid-family-count-tariffs
