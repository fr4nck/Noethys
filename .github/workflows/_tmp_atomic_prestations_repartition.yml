name: Atomic prestations repartition

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_prestations_repartition.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch suppression prestations repartition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Ol/OL_Prestations_repartition.py')
          s=p.read_text(encoding='utf-8')
          a=s.index('    def Supprimer(self, event):')
          b=s.index('    def CocheTout(self, event=None):', a)
          old=s[a:b]
          new=old
          new=new.replace('            DB = GestionDB.DB()\n            valide = True\n', '            DB = GestionDB.DB()\n            valide = True\n            erreurDB = False\n')
          new=new.replace('                            DB.ReqDEL("consommations", "IDconso", IDconso)', '                            if not DB.ReqDEL("consommations", "IDconso", IDconso, commit=False):\n                                valide = False\n                                erreurDB = True\n                                break')
          new=new.replace('                        DB.ReqMAJ("consommations", listeDonnees, "IDconso", IDconso)', '                        if not DB.ReqMAJ("consommations", listeDonnees, "IDconso", IDconso, commit=False):\n                            valide = False\n                            erreurDB = True\n                            break')
          old_tail='''            # Suppression de la prestation\n            if valide == True :\n                DB.ReqDEL("prestations", "IDprestation", track.IDprestation)\n                DB.ReqDEL("ventilation", "IDprestation", track.IDprestation)\n                DB.ReqDEL("deductions", "IDprestation", track.IDprestation)\n                listeSuppressions.append(track)\n            \n            # MAJ du listeView\n            self.MAJ() \n            \n        DB.Close() \n        \n        # Confirmation de suppression\n'''
          new_tail='''            # Suppression atomique de la prestation et de ses dépendances\n            if valide == True :\n                for table in ("ventilation", "deductions", "prestations"):\n                    if not DB.ReqDEL(table, "IDprestation", track.IDprestation, commit=False):\n                        valide = False\n                        erreurDB = True\n                        break\n\n            if valide == True :\n                DB.Commit()\n                listeSuppressions.append(track)\n            else:\n                try:\n                    DB.connexion.rollback()\n                except Exception:\n                    pass\n            DB.Close()\n\n            if erreurDB:\n                dlg = wx.MessageDialog(self, _(u"La prestation n°%d n'a pas pu être supprimée complètement. Aucune modification n'a été validée pour cette prestation.") % track.IDprestation, _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n                dlg.ShowModal()\n                dlg.Destroy()\n\n        # MAJ du listeView\n        self.MAJ()\n\n        # Confirmation de suppression\n'''
          if old_tail not in new:
              raise SystemExit('bloc final suppression inattendu')
          new=new.replace(old_tail,new_tail,1)
          if new==old:
              raise SystemExit('aucune modification')
          s=s[:a]+new+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Ol/OL_Prestations_repartition.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Ol/OL_Prestations_repartition.py').read_text(encoding='utf-8')
          b=s[s.index('    def Supprimer(self, event):'):s.index('    def CocheTout(self, event=None):')]
          assert 'erreurDB = False' in b
          assert 'ReqDEL("consommations", "IDconso", IDconso, commit=False)' in b
          assert 'ReqMAJ("consommations", listeDonnees, "IDconso", IDconso, commit=False)' in b
          assert 'for table in ("ventilation", "deductions", "prestations")' in b
          assert 'DB.Commit()' in b and 'rollback()' in b
          assert b.count('DB.Close()') >= 1
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ol/OL_Prestations_repartition.py
          git commit -m "fix: atomiser suppression prestations repartition"
          git push origin HEAD:master
