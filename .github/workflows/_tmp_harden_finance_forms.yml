name: Harden finance forms

on:
  push:
    paths:
      - '.github/workflows/_tmp_harden_finance_forms.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch formulaires
        run: |
          python - <<'PY'
          from pathlib import Path

          # Mode de règlement
          p=Path('noethys/Dlg/DLG_Saisie_mode_reglement.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''        if self.IDmode == None :\n            self.IDmode = DB.ReqInsert("modes_reglements", listeDonnees)\n        else:\n            DB.ReqMAJ("modes_reglements", listeDonnees, "IDmode", self.IDmode)\n        DB.Close()\n        \n        # Sauvegarde de l'image\n        self.ctrl_image.IDkey = self.IDmode\n''','''        ancien_IDmode = self.IDmode\n        if ancien_IDmode == None :\n            IDmode = DB.ReqInsert("modes_reglements", listeDonnees)\n            if IDmode is None:\n                DB.Close()\n                dlg = wx.MessageDialog(self, _(u"Le mode de règlement n'a pas pu être enregistré."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n                dlg.ShowModal()\n                dlg.Destroy()\n                return\n            self.IDmode = IDmode\n        else:\n            if not DB.ReqMAJ("modes_reglements", listeDonnees, "IDmode", ancien_IDmode):\n                DB.Close()\n                dlg = wx.MessageDialog(self, _(u"Le mode de règlement n'a pas pu être modifié."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n                dlg.ShowModal()\n                dlg.Destroy()\n                return\n        DB.Close()\n        \n        # Sauvegarde de l'image\n        self.ctrl_image.IDkey = self.IDmode\n''',1)
          s=s.replace('''            except :\n                dlg = wx.MessageDialog(self, _(u"Le pourcentage que vous avez saisi pour les frais de gestion n'est pas valide !"),''','''            except (TypeError, ValueError):\n                dlg = wx.MessageDialog(self, _(u"Le pourcentage que vous avez saisi pour les frais de gestion n'est pas valide !"),''',1)
          p.write_text(s,encoding='utf-8')

          # Régie facture
          p=Path('noethys/Dlg/DLG_Saisie_regie_facture.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''        if self.IDregie == None :\n            self.IDregie = DB.ReqInsert("factures_regies", listeDonnees)\n        else :\n            DB.ReqMAJ("factures_regies", listeDonnees, "IDregie", self.IDregie)\n        DB.Close()\n\n    def Importation(self):\n''','''        ancien_IDregie = self.IDregie\n        if ancien_IDregie == None :\n            IDregie = DB.ReqInsert("factures_regies", listeDonnees)\n            if IDregie is None:\n                DB.Close()\n                return False\n            self.IDregie = IDregie\n        else :\n            if not DB.ReqMAJ("factures_regies", listeDonnees, "IDregie", ancien_IDregie):\n                DB.Close()\n                return False\n        DB.Close()\n        return True\n\n    def Importation(self):\n''',1)
          p.write_text(s,encoding='utf-8')

          # Préfixe facture
          p=Path('noethys/Dlg/DLG_Saisie_prefixe_facture.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''        if self.IDprefixe == None :\n            self.IDprefixe = DB.ReqInsert("factures_prefixes", listeDonnees)\n        else :\n            DB.ReqMAJ("factures_prefixes", listeDonnees, "IDprefixe", self.IDprefixe)\n        DB.Close()\n\n    def Importation(self):\n''','''        ancien_IDprefixe = self.IDprefixe\n        if ancien_IDprefixe == None :\n            IDprefixe = DB.ReqInsert("factures_prefixes", listeDonnees)\n            if IDprefixe is None:\n                DB.Close()\n                return False\n            self.IDprefixe = IDprefixe\n        else :\n            if not DB.ReqMAJ("factures_prefixes", listeDonnees, "IDprefixe", ancien_IDprefixe):\n                DB.Close()\n                return False\n        DB.Close()\n        return True\n\n    def Importation(self):\n''',1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Saisie_mode_reglement.py noethys/Dlg/DLG_Saisie_regie_facture.py noethys/Dlg/DLG_Saisie_prefixe_facture.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          m=Path('noethys/Dlg/DLG_Saisie_mode_reglement.py').read_text(encoding='utf-8')
          r=Path('noethys/Dlg/DLG_Saisie_regie_facture.py').read_text(encoding='utf-8')
          p=Path('noethys/Dlg/DLG_Saisie_prefixe_facture.py').read_text(encoding='utf-8')
          assert 'if IDmode is None:' in m
          assert 'except (TypeError, ValueError):' in m
          assert 'return True\n\n    def Importation' in r
          assert 'return True\n\n    def Importation' in p
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_mode_reglement.py noethys/Dlg/DLG_Saisie_regie_facture.py noethys/Dlg/DLG_Saisie_prefixe_facture.py
          git commit -m "fix: vérifier les sauvegardes des paramètres financiers"
          git push origin HEAD:master
