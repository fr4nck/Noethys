name: Scan suppression aides

on:
  push:
    paths:
      - '.github/workflows/_tmp_scan_suppression_aides.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate aide deletion paths
        run: |
          python - <<'PY'
          from pathlib import Path
          for root in (Path('noethys/Dlg'), Path('noethys/Ol'), Path('noethys/Ctrl'), Path('noethys/Utils')):
              if not root.exists():
                  continue
              for p in root.rglob('*.py'):
                  s=p.read_text(encoding='utf-8',errors='ignore')
                  if any(x in s for x in ('aides_beneficiaires','aides_montants','aides_combinaisons','aides_combi_unites')):
                      print('\n###', p)
                      for i,line in enumerate(s.splitlines(),1):
                          if ('ReqDEL(' in line or 'DELETE FROM aides' in line or 'def Supprimer' in line or 'aides_' in line and 'DELETE' in line):
                              print(f'{i}: {line}')
          PY
