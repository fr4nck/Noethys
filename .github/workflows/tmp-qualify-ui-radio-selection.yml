name: Temporary qualify UI radio selection invariants

on:
  push:
    branches:
      - audit/ui-radio-selection-invariants

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/ui-radio-selection-invariants
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Qualifier les invariants de sélection radio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          from scripts import audit_branch_assignment_gaps as audit
          from scripts import qualify_branch_assignment_gaps as qualify

          root = Path('noethys')
          specs = (
              ('Dlg/DLG_Liste_deductions.py', 'GetActivites', 'listeActivites', 'body_only'),
              ('Dlg/DLG_Synthese_modes_reglements.py', 'GetActivites', 'listeActivites', 'body_only'),
              ('Dlg/DLG_Badgeage_saisie_procedure.py', 'Sauvegarde', 'systeme', 'body_only'),
              ('Dlg/DLG_Saisie_utilisateur.py', 'Sauvegarde', 'profil', 'body_only'),
              ('Dlg/DLG_Saisie_utilisateur_reseau.py', 'RechercheAutorisation', 'hote', 'body_only'),
              ('Dlg/DLG_Saisie_utilisateur_reseau.py', 'Sauvegarde', 'hote', 'body_only'),
              ('Dlg/DLG_Releve_prestations_saisie.py', 'GetOptions', 'dictOptions', 'body_only'),
              ('Dlg/DLG_Releve_prestations_saisie.py', 'GetPeriode', 'parametres', 'body_only'),
          )
          reasons = {
              ('Dlg/DLG_Liste_deductions.py', 'GetActivites'): "les trois choix d'activité forment un unique groupe wx.RadioButton ouvert par wx.RB_GROUP ; un membre est donc actif avant le retour de listeActivites",
              ('Dlg/DLG_Synthese_modes_reglements.py', 'GetActivites'): "les trois choix d'activité forment un unique groupe wx.RadioButton ouvert par wx.RB_GROUP ; un membre est donc actif avant le retour de listeActivites",
              ('Dlg/DLG_Badgeage_saisie_procedure.py', 'Sauvegarde'): "les trois systèmes d'identification appartiennent au même groupe wx.RadioButton ouvert par radio_barre avec wx.RB_GROUP ; un système est donc sélectionné avant la construction de listeDonnees",
              ('Dlg/DLG_Saisie_utilisateur.py', 'Sauvegarde'): "les trois profils de droits appartiennent au même groupe wx.RadioButton ouvert par radio_droits_admin avec wx.RB_GROUP ; un profil est donc sélectionné avant la sauvegarde",
              ('Dlg/DLG_Saisie_utilisateur_reseau.py', 'RechercheAutorisation'): "les trois hôtes appartiennent au même groupe wx.RadioButton ouvert par radio_1 avec wx.RB_GROUP et le constructeur restaure explicitement l'un d'eux ; hote est donc affecté avant la requête",
              ('Dlg/DLG_Saisie_utilisateur_reseau.py', 'Sauvegarde'): "les trois hôtes appartiennent au même groupe wx.RadioButton ouvert par radio_1 avec wx.RB_GROUP et le constructeur restaure explicitement l'un d'eux ; hote est donc affecté avant la requête",
              ('Dlg/DLG_Releve_prestations_saisie.py', 'GetOptions'): "les deux types de relevé appartiennent au même groupe wx.RadioButton ouvert par radio_type_prestations avec wx.RB_GROUP ; GetType retourne donc prestations ou factures et l'une des deux branches affecte dictOptions",
              ('Dlg/DLG_Releve_prestations_saisie.py', 'GetPeriode'): "les sept périodes appartiennent au même groupe wx.RadioButton ouvert par radio_tout avec wx.RB_GROUP ; un membre est donc actif et la branche correspondante affecte parametres avant le retour",
          }

          entries = []
          for relative, function, name, detail in specs:
              findings = audit.scan_file(root / relative, root)
              matches = [item for item in findings if item['function'] == function and item['name'] == name and item['detail'] == detail]
              if len(matches) != 1:
                  raise SystemExit(f'{relative}::{function}::{name}: {len(matches)} candidat(s), attendu 1')
              key = qualify.qualification_key(matches[0], root)
              if key is None:
                  raise SystemExit(f'Empreinte impossible pour {relative}::{function}::{name}')
              reason = reasons[(relative, function)]
              entries.append(f'    {key!r}: (\n        {reason!r}\n    ),\n')

          qualifier = Path('scripts/qualify_branch_assignment_gaps.py')
          source = qualifier.read_text(encoding='utf-8')
          marker = '\n}\n\ndef _candidate_fingerprint'
          if source.count(marker) != 1:
              raise SystemExit('Structure du registre EXPLICIT_SAFE inattendue')
          for entry, spec in zip(entries, specs):
              relative, function, name, detail = spec
              signature = repr((relative, function, name, detail))[:-1] + ','
              if signature not in source:
                  source = source.replace(marker, '\n' + entry + '}\n\ndef _candidate_fingerprint', 1)
          qualifier.write_text(source, encoding='utf-8')

          test = Path('tests/test_ui_radio_selection_safe_invariants.py')
          test.write_text('''import unittest\nfrom pathlib import Path\n\nfrom scripts import audit_branch_assignment_gaps as audit\nfrom scripts import qualify_branch_assignment_gaps as qualify\n\nROOT = Path(__file__).resolve().parents[1]\nNOETHYS = ROOT / "noethys"\n\nSPECS = (\n    ("Dlg/DLG_Liste_deductions.py", "GetActivites", "listeActivites", "body_only"),\n    ("Dlg/DLG_Synthese_modes_reglements.py", "GetActivites", "listeActivites", "body_only"),\n    ("Dlg/DLG_Badgeage_saisie_procedure.py", "Sauvegarde", "systeme", "body_only"),\n    ("Dlg/DLG_Saisie_utilisateur.py", "Sauvegarde", "profil", "body_only"),\n    ("Dlg/DLG_Saisie_utilisateur_reseau.py", "RechercheAutorisation", "hote", "body_only"),\n    ("Dlg/DLG_Saisie_utilisateur_reseau.py", "Sauvegarde", "hote", "body_only"),\n    ("Dlg/DLG_Releve_prestations_saisie.py", "GetOptions", "dictOptions", "body_only"),\n    ("Dlg/DLG_Releve_prestations_saisie.py", "GetPeriode", "parametres", "body_only"),\n)\n\n\nclass UiRadioSelectionSafeInvariantTests(unittest.TestCase):\n    def test_candidates_are_exactly_qualified(self):\n        for relative, function, name, detail in SPECS:\n            findings = audit.scan_file(NOETHYS / relative, NOETHYS)\n            matches = [item for item in findings if item["function"] == function and item["name"] == name and item["detail"] == detail]\n            self.assertEqual(len(matches), 1, (relative, function, name))\n            self.assertIn(qualify.qualification_key(matches[0], NOETHYS), qualify.EXPLICIT_SAFE)\n\n    def test_radio_groups_remain_explicit(self):\n        expected = {\n            "Dlg/DLG_Liste_deductions.py": "self.radio_toutes = wx.RadioButton",\n            "Dlg/DLG_Synthese_modes_reglements.py": "self.radio_toutes = wx.RadioButton",\n            "Dlg/DLG_Badgeage_saisie_procedure.py": "self.radio_barre = wx.RadioButton",\n            "Dlg/DLG_Saisie_utilisateur.py": "self.radio_droits_admin = wx.RadioButton",\n            "Dlg/DLG_Saisie_utilisateur_reseau.py": "self.radio_1 = wx.RadioButton",\n            "Dlg/DLG_Releve_prestations_saisie.py": "self.radio_type_prestations = wx.RadioButton",\n        }\n        for relative, first_radio in expected.items():\n            text = (NOETHYS / relative).read_text(encoding="utf-8")\n            line = next(line for line in text.splitlines() if first_radio in line)\n            self.assertIn("style=wx.RB_GROUP", line, relative)\n        releve = (NOETHYS / "Dlg/DLG_Releve_prestations_saisie.py").read_text(encoding="utf-8")\n        period_line = next(line for line in releve.splitlines() if "self.radio_tout = wx.RadioButton" in line)\n        self.assertIn("style=wx.RB_GROUP", period_line)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          temporary = Path('.github/workflows/tmp-qualify-ui-radio-selection.yml')
          if temporary.exists():
              temporary.unlink()
          PY
      - name: Vérifier les qualifications ciblées
        env:
          PYTHONPATH: ${{ github.workspace }}/noethys:${{ github.workspace }}
        run: python -m unittest tests.test_ui_radio_selection_safe_invariants -v
      - name: Commit du lot qualifié
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Audit: qualifier les invariants de sélection radio UI'
          git push origin HEAD:audit/ui-radio-selection-invariants
