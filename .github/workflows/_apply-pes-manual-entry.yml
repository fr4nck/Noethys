name: Apply PES manual entry repair

on:
  push:
    branches:
      - fix/vanilla-pes-manual-entry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla-pes-manual-entry
          fetch-depth: 0

      - name: Repair manual PES-piece creation
        shell: python
        run: |
          from pathlib import Path

          ol_path = Path("noethys/Ol/OL_PES_pieces.py")
          ol = ol_path.read_text(encoding="utf-8")

          marker = '\n\nclass Track(object):\n'
          if ol.count(marker) != 1:
              raise SystemExit(f"Track marker count: {ol.count(marker)}")
          factory = '''
          def GetDonneesTrackManuel(IDlot=None):
              """Retourne les données minimales cohérentes d'une nouvelle pièce PES manuelle."""
              return {
                  "IDpiece": None,
                  "IDlot": IDlot,
                  "IDfamille": None,
                  "IDcompte_payeur": None,
                  "prelevement": 0,
                  "prelevement_iban": "",
                  "prelevement_bic": "",
                  "prelevement_rum": "",
                  "prelevement_date_mandat": None,
                  "prelevement_IDmandat": None,
                  "prelevement_sequence": "",
                  "prelevement_titulaire": "",
                  "prelevement_statut": "attente",
                  "type": "manuel",
                  "IDfacture": None,
                  "numero": "",
                  "libelle": "",
                  "montant": 0.00,
                  "IDreglement": None,
                  "dateReglement": None,
                  "IDdepot": None,
                  "titulaire_helios": None,
                  "tiers_solidaire": None,
                  "dictAutresDonnees": {},
                  "etat": "ajout",
              }

          class Track(object):
          '''
          ol = ol.replace(marker, '\n' + factory, 1)

          old_code_tiers = '        # Code tiers de la famille\n        self.code_tiers = u"FAM%06d" % self.IDfamille\n'
          new_code_tiers = (
              '        # Code tiers de la famille\n'
              '        if self.IDfamille == None:\n'
              '            self.code_tiers = ""\n'
              '        else:\n'
              '            self.code_tiers = u"FAM%06d" % self.IDfamille\n'
          )
          if ol.count(old_code_tiers) != 1:
              raise SystemExit(f"code_tiers block count: {ol.count(old_code_tiers)}")
          ol = ol.replace(old_code_tiers, new_code_tiers, 1)

          method_marker = (
              '    def InitNomsTitulaires(self):\n'
              '        if self.IDfamille != None :\n'
              '            self.titulaires = self.dictTitulaires[self.IDfamille]["titulairesSansCivilite"]\n'
              '    \n'
              '    def AnalysePiece(self):\n'
          )
          method_replacement = (
              '    def InitNomsTitulaires(self):\n'
              '        if self.IDfamille != None :\n'
              '            self.titulaires = self.dictTitulaires[self.IDfamille]["titulairesSansCivilite"]\n'
              '\n'
              '    def SetFamille(self, IDfamille):\n'
              '        """Affecte la famille d\'un brouillon manuel et recharge ses données Hélios."""\n'
              '        self.IDfamille = IDfamille\n'
              '        self.InitNomsTitulaires()\n'
              '        self.code_tiers = u"FAM%06d" % IDfamille\n'
              '\n'
              '        dictAutresDonnees = GetDictAutresDonnees().get(IDfamille, {})\n'
              '        self.idtiers_helios = dictAutresDonnees.get("idtiers_helios") or ""\n'
              '        natidtiers_helios = dictAutresDonnees.get("natidtiers_helios")\n'
              '        if natidtiers_helios in (9999, None):\n'
              '            self.natidtiers_helios = ""\n'
              '        else:\n'
              '            self.natidtiers_helios = "0%d" % natidtiers_helios\n'
              '        self.reftiers_helios = dictAutresDonnees.get("reftiers_helios") or ""\n'
              '        cattiers_helios = dictAutresDonnees.get("cattiers_helios")\n'
              '        if cattiers_helios == None:\n'
              '            self.cattiers_helios = "01"\n'
              '        else:\n'
              '            self.cattiers_helios = "%02d" % cattiers_helios\n'
              '        natjur_helios = dictAutresDonnees.get("natjur_helios")\n'
              '        if natjur_helios == None:\n'
              '            self.natjur_helios = "01"\n'
              '        else:\n'
              '            self.natjur_helios = "%02d" % natjur_helios\n'
              '        self.code_compta = dictAutresDonnees.get("code_compta") or ""\n'
              '\n'
              '    def AnalysePiece(self):\n'
          )
          if ol.count(method_marker) != 1:
              raise SystemExit(f"InitNomsTitulaires marker count: {ol.count(method_marker)}")
          ol = ol.replace(method_marker, method_replacement, 1)

          start_marker = '    def Saisie_manuelle(self, event=None):\n'
          end_marker = '    def Saisie_factures(self, event=None):\n'
          if ol.count(start_marker) != 1 or ol.count(end_marker) != 1:
              raise SystemExit("Unable to locate Saisie_manuelle block")
          start = ol.index(start_marker)
          end = ol.index(end_marker, start)
          new_manual = (
              '    def Saisie_manuelle(self, event=None):\n'
              '        """ Saisie manuelle """\n'
              '        dictTitulaires = UTILS_Titulaires.GetTitulaires()\n'
              '        track = Track(GetDonneesTrackManuel(self.IDlot), dictTitulaires, self.dictIndividus)\n'
              '        dlg = DLG_Saisie_pes_piece.Dialog(self, track=track)\n'
              '        if dlg.ShowModal() == wx.ID_OK:\n'
              '            track = dlg.GetTrack()\n'
              '            self.AddObject(track)\n'
              '            self.MAJtotaux()\n'
              '        dlg.Destroy()\n'
              '\n'
          )
          ol = ol[:start] + new_manual + ol[end:]
          ol_path.write_text(ol, encoding="utf-8")

          dlg_path = Path("noethys/Dlg/DLG_Saisie_pes_piece.py")
          dlg = dlg_path.read_text(encoding="utf-8")

          start_marker = '    def OnChoixFamille(self, event):\n'
          end_marker = '    def OnSaisieIBAN(self, event):\n'
          if dlg.count(start_marker) != 1 or dlg.count(end_marker) != 1:
              raise SystemExit("Unable to locate OnChoixFamille block")
          start = dlg.index(start_marker)
          end = dlg.index(end_marker, start)
          new_choice = (
              '    def OnChoixFamille(self, event):\n'
              '        IDfamille = self.ctrl_famille.GetIDfamille()\n'
              '        self.ctrl_titulaire_helios.MAJ(IDfamille)\n'
              '        self.ctrl_tiers_solidaire.MAJ(IDfamille)\n'
              '\n'
          )
          dlg = dlg[:start] + new_choice + dlg[end:]

          old_importation = (
              '        self.ctrl_famille.SetIDfamille(self.track.IDfamille)\n'
              '        self.ctrl_famille.Enable(False) \n'
              '        self.ctrl_titulaire_helios.MAJ(self.track.IDfamille)\n'
          )
          new_importation = (
              '        self.ctrl_famille.SetIDfamille(self.track.IDfamille)\n'
              '        if self.track.IDfamille != None:\n'
              '            self.ctrl_famille.Enable(False)\n'
              '        self.ctrl_titulaire_helios.MAJ(self.track.IDfamille)\n'
          )
          if dlg.count(old_importation) != 1:
              raise SystemExit(f"Importation family block count: {dlg.count(old_importation)}")
          dlg = dlg.replace(old_importation, new_importation, 1)

          old_family_update = (
              '        track = self.track\n'
              '        track.IDfamille = IDfamille\n'
              '        track.InitNomsTitulaires() \n'
              '        \n'
              '        track.titulaire_helios = titulaire_helios\n'
          )
          new_family_update = (
              '        track = self.track\n'
              '        if track.IDfamille != IDfamille:\n'
              '            track.SetFamille(IDfamille)\n'
              '        else:\n'
              '            track.InitNomsTitulaires()\n'
              '        \n'
              '        track.titulaire_helios = titulaire_helios\n'
          )
          if dlg.count(old_family_update) != 1:
              raise SystemExit(f"GetTrack family update count: {dlg.count(old_family_update)}")
          dlg = dlg.replace(old_family_update, new_family_update, 1)
          dlg_path.write_text(dlg, encoding="utf-8")

      - name: Test manual Track contract
        shell: python
        run: |
          import ast
          from pathlib import Path

          ol_text = Path("noethys/Ol/OL_PES_pieces.py").read_text(encoding="utf-8")
          dlg_text = Path("noethys/Dlg/DLG_Saisie_pes_piece.py").read_text(encoding="utf-8")
          ol_tree = ast.parse(ol_text)
          ast.parse(dlg_text)

          factory_node = next(node for node in ol_tree.body if isinstance(node, ast.FunctionDef) and node.name == "GetDonneesTrackManuel")
          track_node = next(node for node in ol_tree.body if isinstance(node, ast.ClassDef) and node.name == "Track")
          init_node = next(node for node in track_node.body if isinstance(node, ast.FunctionDef) and node.name == "__init__")

          required = set()
          for node in ast.walk(init_node):
              if isinstance(node, ast.Subscript) and isinstance(node.value, ast.Name) and node.value.id == "donnees":
                  if isinstance(node.slice, ast.Constant) and isinstance(node.slice.value, str):
                      required.add(node.slice.value)

          module = ast.Module(body=[factory_node, track_node], type_ignores=[])
          ast.fix_missing_locations(module)
          namespace = {"_": lambda value: value, "GetDictAutresDonnees": lambda: {}}
          exec(compile(module, "pes_manual_contract", "exec"), namespace)

          draft = namespace["GetDonneesTrackManuel"](42)
          assert not (required - set(draft)), "Missing Track keys: %s" % sorted(required - set(draft))
          track = namespace["Track"](draft, {}, {})
          assert track.IDpiece is None and track.IDlot == 42
          assert track.IDfamille is None and track.code_tiers == ""
          assert track.type == "manuel" and track.etat == "ajout"

          track.dictTitulaires = {7: {"titulairesSansCivilite": "Famille Test"}}
          namespace["GetDictAutresDonnees"] = lambda: {7: {
              "idtiers_helios": "ABC", "natidtiers_helios": 1,
              "reftiers_helios": "REF", "cattiers_helios": 2,
              "natjur_helios": 3, "code_compta": "411",
          }}
          track.SetFamille(7)
          assert track.code_tiers == "FAM000007"
          assert track.titulaires == "Famille Test"
          assert (track.idtiers_helios, track.natidtiers_helios, track.reftiers_helios) == ("ABC", "01", "REF")
          assert (track.cattiers_helios, track.natjur_helios, track.code_compta) == ("02", "03", "411")

          assert "DLG_Saisie_prelevement.Dialog" not in ol_text
          assert "DLG_Saisie_pes_piece.Dialog(self, track=track)" in ol_text
          assert "self.ctrl_titulaire_helios.MAJ(IDfamille)" in dlg_text
          assert "self.ctrl_tiers_solidaire.MAJ(IDfamille)" in dlg_text
          assert "track.SetFamille(IDfamille)" in dlg_text

      - name: Compile changed Python files
        run: python -m py_compile noethys/Ol/OL_PES_pieces.py noethys/Dlg/DLG_Saisie_pes_piece.py

      - name: Commit application fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_apply-pes-manual-entry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Ol/OL_PES_pieces.py noethys/Dlg/DLG_Saisie_pes_piece.py .github/workflows/_apply-pes-manual-entry.yml
          git commit -m "Vanilla: réparer la saisie manuelle d'une pièce PES"
          git push origin HEAD:fix/vanilla-pes-manual-entry
