name: Atomic badgeage procedure

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_badgeage_procedure.yml'
      - '.github/_tmp_patch_badgeage_procedure.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch
        run: python .github/_tmp_patch_badgeage_procedure.py
      - name: Verify
        run: |
          python -m py_compile noethys/Dlg/DLG_Badgeage_saisie_procedure.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Dlg/DLG_Badgeage_saisie_procedure.py').read_text(encoding='utf-8')
          a=s.index('    def Sauvegarde(self):')
          b=s.index('    def GetIDprocedure(self):', a)
          x=s[a:b]
          assert 'ReqInsert("badgeage_procedures", listeDonnees, commit=False)' in x
          assert 'ReqInsert("badgeage_actions", listeDonnees, commit=False)' in x
          assert 'badgeage_messages' in x and 'commit=False' in x
          assert x.index('ReqDEL("badgeage_messages"') < x.index('ReqDEL("badgeage_actions"')
          assert 'DB.Commit()' in x and 'rollback()' in x
          assert x.index('self.IDprocedure = nouvelIDprocedure') > x.index('DB.Close()')
          assert 'return False' in x and 'return True' in x
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Badgeage_saisie_procedure.py
          git commit -m "fix: atomiser les procédures de badgeage"
          git pull --rebase origin master
          git push origin HEAD:master
