name: Apply agenda cancel fix

on:
  push:
    branches:
      - fix/vanilla-agenda-cancel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla-agenda-cancel
          fetch-depth: 0

      - name: Apply exact fix
        shell: python
        run: |
          from pathlib import Path
          p = Path("noethys/Ctrl/CTRL_Agenda.py")
          text = p.read_text(encoding="utf-8")
          old = '''        dlg = DLG_Recherche_date(self)\n        if dlg.ShowModal():\n            newDate = dlg.GetDate()\n        dlg.Destroy()\n        self.parent.ctrl_planning.SetDate(newDate)\n'''
          new = '''        dlg = DLG_Recherche_date(self)\n        if dlg.ShowModal() == wx.ID_OK:\n            newDate = dlg.GetDate()\n            self.parent.ctrl_planning.SetDate(newDate)\n        dlg.Destroy()\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one occurrence, got {text.count(old)}")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify and compile
        shell: python
        run: |
          from pathlib import Path
          import py_compile
          text = Path("noethys/Ctrl/CTRL_Agenda.py").read_text(encoding="utf-8")
          assert "if dlg.ShowModal() == wx.ID_OK:" in text
          py_compile.compile("noethys/Ctrl/CTRL_Agenda.py", doraise=True)

      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-agenda-cancel.yml
          git add noethys/Ctrl/CTRL_Agenda.py
          git commit -m "Vanilla: respecter Annuler dans la recherche de date"
          git push origin HEAD:fix/vanilla-agenda-cancel
