name: Scan aides CAF

on:
  push:
    paths:
      - '.github/workflows/_tmp_scan_aides_caf.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Scan
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path('noethys/Dlg'),Path('noethys/Ctrl'),Path('noethys/Ol'),Path('noethys/Utils')]
          terms=('aide','caf','allocation','deduction','quotient','prestation')
          rows=[]
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*.py'):
                  low=p.name.lower()
                  s=p.read_text(encoding='utf-8',errors='ignore')
                  if not (any(t in low for t in terms) or any(t in s.lower() for t in ('aides','caf'))):
                      continue
                  writes=sum(s.count(x) for x in ('ReqInsert(','ReqMAJ(','ReqDEL(','Executermany('))
                  if writes:
                      rows.append((writes,str(p)))
          for n,p in sorted(rows, reverse=True)[:80]:
              print('%3d | %s' % (n,p))
          PY
