name: Temporary portal branch-candidate fixes

on:
  push:
    branches:
      - fix/branch-assignment-candidates-pass-1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-candidates-pass-1
          fetch-depth: 0

      - name: Patch portal payment parsing and reservation error context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('noethys/Dlg/DLG_Saisie_portail_demande.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'SYMBOLE = UTILS_Config.GetParametre("monnaie_symbole", u"€")\n'
          helper = '''SYMBOLE = UTILS_Config.GetParametre("monnaie_symbole", u"€")\n\n\ndef ParseVentilationPaiement(ventilation):\n    """Décode la ventilation Connecthys d'un paiement en ligne.\n\n    Le format historique est une liste séparée par des virgules : ``F<ID>#<montant>``\n    pour une facture et ``P<ID>#<montant>`` pour une période. Une entrée inconnue\n    ou incomplète est rejetée explicitement afin de ne jamais réutiliser le type\n    de l'élément précédent. Les segments vides périphériques sont tolérés pour\n    rester compatibles avec une éventuelle virgule finale historique.\n    """\n    dict_paiements = {"facture": {}, "periode": {}}\n    if ventilation is None or (u"%s" % ventilation).strip() == "":\n        raise ValueError(u"ventilation vide")\n\n    types = {"F": "facture", "P": "periode"}\n    nbre_elements = 0\n    for valeur in (u"%s" % ventilation).split(","):\n        valeur = valeur.strip()\n        if not valeur:\n            continue\n        type_impaye = types.get(valeur[0])\n        if type_impaye is None:\n            raise ValueError(u"type de ventilation inconnu : %s" % valeur[0])\n\n        morceaux = valeur[1:].split("#")\n        if len(morceaux) != 2 or not morceaux[0] or not morceaux[1]:\n            raise ValueError(u"entrée de ventilation invalide : %s" % valeur)\n        try:\n            ID = int(morceaux[0])\n            montant = float(morceaux[1])\n        except (TypeError, ValueError):\n            raise ValueError(u"entrée de ventilation invalide : %s" % valeur)\n\n        dict_paiements[type_impaye][ID] = montant\n        nbre_elements += 1\n\n    if nbre_elements == 0:\n        raise ValueError(u"ventilation vide")\n    return dict_paiements\n'''
          if anchor not in text:
              raise SystemExit('Anchor SYMBOLE introuvable')
          text = text.replace(anchor, helper, 1)

          old1 = '''            # Analyse de la ventilation\n            dict_paiements = {"facture": {}, "periode": {}}\n            for texte in self.track.ventilation.split(","):\n                if texte[0] == "F": type_impaye = "facture"\n                if texte[0] == "P": type_impaye = "periode"\n                ID, montant = texte[1:].split("#")\n                dict_paiements[type_impaye][int(ID)] = float(montant)\n'''
          new1 = '''            # Analyse de la ventilation\n            try:\n                dict_paiements = ParseVentilationPaiement(self.track.ventilation)\n            except ValueError:\n                self.ctrl_informations.SetTexte(_(u"Ventilation du paiement en ligne invalide."))\n                return\n'''
          if old1 not in text:
              raise SystemExit('Premier bloc ventilation introuvable')
          text = text.replace(old1, new1, 1)

          old2 = '''        # Analyse de la ventilation\n        dict_paiements = {"facture": {}, "periode": {}}\n        for texte in ventilation.split(","):\n            if texte[0] == "F": type_impaye = "facture"\n            if texte[0] == "P": type_impaye = "periode"\n            ID, montant = texte[1:].split("#")\n            dict_paiements[type_impaye][int(ID)] = float(montant)\n'''
          new2 = '''        # Analyse de la ventilation\n        try:\n            dict_paiements = ParseVentilationPaiement(ventilation)\n        except ValueError as err:\n            self.EcritLog(_(u"[ERREUR] Ventilation du paiement en ligne invalide : %s") % err)\n            return False\n'''
          if old2 not in text:
              raise SystemExit('Second bloc ventilation introuvable')
          text = text.replace(old2, new2, 1)

          old3 = '''                        else :\n                            resultat = _(u"L'unité ID%d est inconnue. Vérifiez le paramétrage des unités de réservation." % IDunite)\n\n                        if resultat != True :\n'''
          new3 = '''                        else :\n                            texte = _(u"Saisie de l'unité ID%d du %s en mode %s") % (IDunite, UTILS_Dates.DateDDEnFr(date), mode_label)\n                            resultat = _(u"L'unité ID%d est inconnue. Vérifiez le paramétrage des unités de réservation." % IDunite)\n\n                        if resultat != True :\n'''
          if old3 not in text:
              raise SystemExit('Bloc unité inconnue introuvable')
          text = text.replace(old3, new3, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile and check targeted audit
        shell: bash
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_portail_demande.py
          python -m py_compile scripts/qualify_branch_assignment_gaps.py
          python scripts/qualify_branch_assignment_gaps.py --json /tmp/qualified.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/qualified.json', encoding='utf-8'))
          bad = [
              item for item in report['findings']
              if item['file'] == 'Dlg/DLG_Saisie_portail_demande.py'
              and (
                  (item['name'] == 'type_impaye' and item['function'] in {'MAJ_informations', 'Traitement_paiement_en_ligne'})
                  or (item['name'] == 'texte' and item['function'] == 'Appliquer_reservations')
              )
          ]
          if bad:
              raise SystemExit('Candidats portail réels encore présents: %r' % bad)
          registry = report['explicit_safe_registry']
          if registry['unmatched'] or registry['ambiguous']:
              raise SystemExit('Registre de qualification incohérent: %r' % registry)
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-portail-branch-candidates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Saisie_portail_demande.py .github/workflows/tmp-fix-portail-branch-candidates.yml
          git commit -m "Fix: durcir la ventilation et les erreurs du portail"
          git push origin HEAD:fix/branch-assignment-candidates-pass-1
