name: Atomic depots reglements
on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_depots_reglements.yml'
      - '.github/_tmp_patch_depots_reglements.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch
        run: python .github/_tmp_patch_depots_reglements.py
      - name: Verify
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_depot.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Dlg/DLG_Saisie_depot.py').read_text(encoding='utf-8')
          a=s.index('    def Sauvegarde_depot(self):')
          b=s.index('    def GetIDdepot(self):', a)
          x=s[a:b]
          assert 'ReqInsert("depots", listeDonnees, commit=False)' in x
          assert 'ReqMAJ("depots", listeDonnees, "IDdepot", nouvelIDdepot, commit=False)' in x
          assert 'Sauvegarde_reglements(DB=DB, IDdepot=nouvelIDdepot, commit=False)' in x
          assert 'ReqMAJ("reglements", [("IDdepot", nouvelleValeur),], "IDreglement", track.IDreglement, commit=False)' in x
          assert 'DB.Commit()' in x and 'rollback()' in x
          assert x.index('self.IDdepot = nouvelIDdepot') > x.index('DB.Close()')
          okblock=s[s.index('    def OnBoutonOk(self, event):'):a]
          assert 'self.Sauvegarde_reglements()' not in okblock
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_depot.py
          git commit -m "fix: atomiser dépôts et règlements"
          git pull --rebase origin master
          git push origin HEAD:master
