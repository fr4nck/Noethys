name: NOE-032b retry patch

on:
  push:
    branches:
      - fix/noe-032b-backup-integrity
    paths:
      - .github/workflows/noe032b-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/noe-032b-backup-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exécuter le patch corrigé
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/noe032b-one-shot.yml').read_text(encoding='utf-8')
          code = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          code = textwrap.dedent(code)

          old = '''for name, fingerprint in fingerprints.items():
              pattern = re.compile(r"(\\('Utils/UTILS_Sauvegarde\\.py', 'Sauvegarde', '" + re.escape(name) + r"', 'body_only', ')[0-9a-f]{64}('):)")
              qualify, count = pattern.subn(r'\\g<1>' + fingerprint + r'\\g<2>', qualify, count=1)
              if count != 1:
                  raise SystemExit('qualification introuvable pour %s' % name)
          '''
          new = '''for name, fingerprint in fingerprints.items():
              prefix = "('Utils/UTILS_Sauvegarde.py', 'Sauvegarde', '%s', 'body_only', '" % name
              start = qualify.find(prefix)
              if start < 0:
                  raise SystemExit('qualification introuvable pour %s' % name)
              hash_start = start + len(prefix)
              current = qualify[hash_start:hash_start + 64]
              if len(current) != 64 or any(c not in '0123456789abcdef' for c in current):
                  raise SystemExit('empreinte invalide pour %s' % name)
              qualify = qualify[:hash_start] + fingerprint + qualify[hash_start + 64:]
          '''
          if old not in code:
              raise SystemExit('bloc regex à corriger introuvable')
          code = code.replace(old, new, 1)

          docs_start = code.index("docs_path = Path('docs/NOE-032-SAUVEGARDE-RESTAURATION.md')")
          print_start = code.index("print('fingerprints'", docs_start)
          docs_code = '''docs_path = Path('docs/NOE-032-SAUVEGARDE-RESTAURATION.md')
          docs = docs_path.read_text(encoding='utf-8')
          addition = """\n### Durcissement des processus MySQL\n\nLe flux réseau garantit désormais le nettoyage de `savetemp` et `restoretemp` même si `Popen`, `communicate()`, la création du fichier de connexion ou l’extraction SQL lève une exception. La commande `mysqldump` applique `--opt --single-transaction --skip-lock-tables`, afin que l’option groupée `--opt` ne réactive pas le verrouillage des tables après l’activation du mode transactionnel.\n"""
          if addition not in docs:
              docs += addition
          docs_path.write_text(docs, encoding='utf-8')

          '''
          code = code[:docs_start] + docs_code + code[print_start:]
          exec(compile(code, 'noe032b-one-shot-patched', 'exec'), {'__name__': '__main__'})
          PY
      - name: Vérifier et pousser
        shell: bash
        run: |
          python -m py_compile noethys/Utils/UTILS_Sauvegarde.py tests/test_noe_032_backup_integrity.py scripts/qualify_branch_assignment_gaps.py
          python tests/test_noe_032_backup_integrity.py
          python scripts/qualify_branch_assignment_gaps.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Utils/UTILS_Sauvegarde.py tests/test_noe_032_backup_integrity.py scripts/qualify_branch_assignment_gaps.py docs/NOE-032-SAUVEGARDE-RESTAURATION.md
          git diff --cached --check
          git commit -m "Fix: durcir les appels mysql et mysqldump"
          git push origin HEAD:fix/noe-032b-backup-integrity
