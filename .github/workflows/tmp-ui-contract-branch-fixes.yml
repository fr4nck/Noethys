name: Temporary UI contract branch-assignment fixes

on:
  push:
    branches:
      - fix/branch-assignment-ui-contracts
    paths:
      - .github/workflows/tmp-ui-contract-branch-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-ui-contracts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Patch targeted UI contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          timeline = Path('noethys/Ctrl/CTRL_Timeline.py')
          text = timeline.read_text(encoding='utf-8')
          old = '''        if afficheToolbar == True :\n            if positionToolbar in (\"gauche\", \"droite\") : orientationTB = wx.TB_VERTICAL ; orientationSizer = wx.HORIZONTAL\n            if positionToolbar in (\"haut\", \"bas\") : orientationTB = wx.TB_HORIZONTAL ; orientationSizer = wx.VERTICAL\n            self.toolBar = ToolBar(self, style= orientationTB | wx.TB_FLAT | wx.TB_TEXT)\n'''
          new = '''        if afficheToolbar == True :\n            if positionToolbar in (\"gauche\", \"droite\") :\n                orientationTB = wx.TB_VERTICAL\n                orientationSizer = wx.HORIZONTAL\n            elif positionToolbar in (\"haut\", \"bas\") :\n                orientationTB = wx.TB_HORIZONTAL\n                orientationSizer = wx.VERTICAL\n            else :\n                raise ValueError(\"positionToolbar invalide : %s\" % positionToolbar)\n            self.toolBar = ToolBar(self, style= orientationTB | wx.TB_FLAT | wx.TB_TEXT)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'CTRL_Timeline block count={text.count(old)}')
          timeline.write_text(text.replace(old, new, 1), encoding='utf-8')

          msg = Path('noethys/Dlg/DLG_Messagebox.py')
          text = msg.read_text(encoding='utf-8')
          old = '''        if icone :\n            if not isinstance(icone, wx.Bitmap) :\n                if icone == wx.ICON_ERROR : artid = wx.ART_ERROR\n                if icone == wx.ICON_EXCLAMATION : artid = wx.ART_WARNING\n                if icone == wx.ICON_QUESTION : artid = wx.ART_QUESTION\n                if icone == wx.ICON_INFORMATION : artid = wx.ART_INFORMATION\n                icone = wx.ArtProvider.GetBitmap(artid, wx.ART_MESSAGE_BOX, self.taille_icone)\n            image = wx.StaticBitmap(self, -1, icone)\n'''
          new = '''        if icone :\n            if not isinstance(icone, wx.Bitmap) :\n                dict_artid = {\n                    wx.ICON_ERROR : wx.ART_ERROR,\n                    wx.ICON_EXCLAMATION : wx.ART_WARNING,\n                    wx.ICON_QUESTION : wx.ART_QUESTION,\n                    wx.ICON_INFORMATION : wx.ART_INFORMATION,\n                }\n                if icone not in dict_artid :\n                    raise ValueError(\"icone de message inconnue : %r\" % (icone,))\n                artid = dict_artid[icone]\n                icone = wx.ArtProvider.GetBitmap(artid, wx.ART_MESSAGE_BOX, self.taille_icone)\n            image = wx.StaticBitmap(self, -1, icone)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'DLG_Messagebox block count={text.count(old)}')
          msg.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile noethys/Ctrl/CTRL_Timeline.py noethys/Dlg/DLG_Messagebox.py
          python - <<'PY'
          from pathlib import Path
          from scripts import audit_branch_assignment_gaps as a
          checks = [
              (Path('noethys/Ctrl/CTRL_Timeline.py'), 'orientationTB'),
              (Path('noethys/Dlg/DLG_Messagebox.py'), 'artid'),
          ]
          for path, name in checks:
              findings = a.scan_file(path.resolve(), Path('noethys').resolve())
              print(path, [(x['function'], x['name'], x['detail']) for x in findings])
              leftovers = [x for x in findings if x['name'] == name]
              if leftovers:
                  raise SystemExit(f'{path}: target finding remains: {leftovers!r}')
          PY
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git rm .github/workflows/tmp-ui-contract-branch-fixes.yml
          git add noethys/Ctrl/CTRL_Timeline.py noethys/Dlg/DLG_Messagebox.py
          git commit -m "Fix: valider les contrats UI avant usage"
          git push origin HEAD:fix/branch-assignment-ui-contracts
