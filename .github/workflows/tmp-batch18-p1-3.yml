name: tmp batch18 P1-3
on:
  push:
    branches: [fix/branch-assignment-gap-batch-18]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/branch-assignment-gap-batch-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch MAJ transactionally
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Ctrl/CTRL_Questionnaire.py')
          s=p.read_text(encoding='utf-8')
          old='''        try:\n            self.DeleteAllItems()\n            # Création de la racine\n            self.root = self.AddRoot(_(u"Racine"))\n            if importation == True :\n                self.Importation()\n            # Création des contrôles\n            self.Remplissage(selection=selection)\n'''
          new='''        try:\n            if importation == True :\n                ancien_modele = (self.dictCategories, self.listeIDcategorie, self.dictValeursInitiales, self.dictReponses)\n                try:\n                    self.Importation()\n                    controles_valides = {\n                        None, "ligne_texte", "bloc_texte", "entier", "decimal", "montant",\n                        "liste_deroulante", "liste_coches", "case_coche", "date", "slider",\n                        "couleur", "documents", "codebarres", "rfid",\n                    }\n                    for IDcategorie in self.listeIDcategorie:\n                        for track in self.dictCategories[IDcategorie]["questions"]:\n                            if track.controle not in controles_valides:\n                                raise ValueError("Type de contrôle de questionnaire inconnu : %s" % track.controle)\n                except Exception:\n                    self.dictCategories, self.listeIDcategorie, self.dictValeursInitiales, self.dictReponses = ancien_modele\n                    raise\n            self.DeleteAllItems()\n            # Création de la racine\n            self.root = self.AddRoot(_(u"Racine"))\n            # Création des contrôles\n            self.Remplissage(selection=selection)\n'''
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Add regression source test
        run: |
          cat >> tests/test_branch_contracts_batch_18.py <<'PY'

          def test_maj_validates_import_before_clearing_tree_and_restores_model_on_failure(self):
              source = SOURCE_PATH.read_text(encoding="utf-8")
              maj = source[source.index("    def MAJ("):source.index("    def Importation(")]
              self.assertLess(maj.index("self.Importation()"), maj.index("self.DeleteAllItems()"))
              self.assertIn("ancien_modele", maj)
              self.assertIn("= ancien_modele", maj)
              self.assertLess(maj.index("Type de contrôle de questionnaire inconnu"), maj.index("self.DeleteAllItems()"))
          PY
      - name: Targeted tests and audit
        run: |
          python -m unittest tests.test_branch_contracts_batch_18
          python scripts/audit_branch_assignment_gaps.py --json /tmp/audit.json | tee /tmp/audit.txt
          python - <<'PY'
          import json,re
          t=open('/tmp/audit.txt',encoding='utf-8').read()
          m=re.search(r'trouvés=(\d+), lus=(\d+), parsés=(\d+)',t)
          assert m and len(set(m.groups()))==1, m.groups() if m else t
          data=json.load(open('/tmp/audit.json',encoding='utf-8'))
          findings=data if isinstance(data,list) else data.get('findings',data.get('results',[]))
          assert len(findings)==160, len(findings)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-batch18-p1-3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ctrl/CTRL_Questionnaire.py tests/test_branch_contracts_batch_18.py
          git commit -m 'fix: preserve questionnaire state on invalid imported controls'
          git push origin HEAD:fix/branch-assignment-gap-batch-18
