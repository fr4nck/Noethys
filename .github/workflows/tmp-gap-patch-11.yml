name: tmp gap patch 11
on:
  push:
    branches: [fix/branch-assignment-gap-batch-11]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-gap-batch-11
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply controlled patch
        run: python scripts/tmp_patch_gap_batch_11.py
      - name: Targeted tests
        run: python -m unittest tests.test_small_ui_branch_contracts_batch_11 -v
      - name: Audit exact count and coverage
        run: |
          python scripts/audit_branch_assignment_gaps.py --json > /tmp/gaps.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/gaps.json', encoding='utf-8'))
          findings=data if isinstance(data, list) else data.get('findings', [])
          count=len(findings)
          print('branch_assignment_gap count:', count)
          assert count == 181, count
          PY
      - name: Remove temporary infrastructure and commit
        run: |
          git rm scripts/tmp_patch_gap_batch_11.py .github/workflows/tmp-gap-patch-11.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add noethys/Ctrl/CTRL_Saisie_pays.py noethys/Ctrl/CTRL_Editeur_email.py noethys/Dlg/DLG_Saisie_texte_rappel.py noethys/Dlg/DLG_Planning_transports.py noethys/Dlg/DLG_Portail_renseignements.py tests/test_small_ui_branch_contracts_batch_11.py
          git commit -m "fix: expliciter cinq contrats UI"
          git push
