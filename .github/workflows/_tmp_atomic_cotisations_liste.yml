name: Atomic cotisations liste

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_cotisations_liste.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch suppression cotisations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Ol/OL_Liste_cotisations.py')
          s=p.read_text(encoding='utf-8')
          old='''        # Suppression\n        DB = GestionDB.DB()\n        for track in listeSelections:\n            DB.ReqDEL("cotisations", "IDcotisation", track.IDcotisation)\n            if track.IDprestation != None:\n                DB.ReqDEL("prestations", "IDprestation", track.IDprestation)\n\n            # Mémorise l'action dans l'historique\n            UTILS_Historique.InsertActions([{\n                "IDindividu": track.IDindividu,\n                "IDfamille": track.IDfamille,\n                "IDcategorie": 23,\n                "action": _(u"Suppression de la cotisation ID%d '%s' pour la période du %s au %s") % (track.IDcotisation, track.nomCotisation, UTILS_Dates.DateEngFr(str(track.date_debut)), UTILS_Dates.DateEngFr(str(track.date_fin))),\n            },])\n\n            # Actualisation de l'affichage\n            self.MAJ()\n\n        DB.Close()\n        dlg.Destroy()\n'''
          new='''        # Suppression atomique\n        DB = GestionDB.DB()\n        ok = True\n        for track in listeSelections:\n            if track.IDprestation != None:\n                for table in ("ventilation", "deductions", "prestations"):\n                    if not DB.ReqDEL(table, "IDprestation", track.IDprestation, commit=False):\n                        ok = False\n                        break\n                if not ok:\n                    break\n            if not DB.ReqDEL("cotisations", "IDcotisation", track.IDcotisation, commit=False):\n                ok = False\n                break\n\n            # Mémorise l'action dans l'historique dans la même transaction\n            if not UTILS_Historique.InsertActions([{\n                "IDindividu": track.IDindividu,\n                "IDfamille": track.IDfamille,\n                "IDcategorie": 23,\n                "action": _(u"Suppression de la cotisation ID%d '%s' pour la période du %s au %s") % (track.IDcotisation, track.nomCotisation, UTILS_Dates.DateEngFr(str(track.date_debut)), UTILS_Dates.DateEngFr(str(track.date_fin))),\n            },], DB=DB, commit=False):\n                ok = False\n                break\n\n        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        DB.Close()\n\n        if not ok:\n            dlg = wx.MessageDialog(self, _(u"La suppression des cotisations a échoué. Aucune modification n'a été validée."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n\n        # Actualisation de l'affichage après succès global\n        self.MAJ()\n        dlg.Destroy()\n'''
          if s.count(old)!=1:
              raise SystemExit('bloc suppression cotisations inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Ol/OL_Liste_cotisations.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Ol/OL_Liste_cotisations.py').read_text(encoding='utf-8')
          b=s[s.index('# Suppression atomique'):s.index('    def OuvrirFicheFamille', s.index('# Suppression atomique'))]
          assert 'for table in ("ventilation", "deductions", "prestations")' in b
          assert 'ReqDEL("cotisations"' in b and 'commit=False' in b
          assert 'DB=DB, commit=False' in b
          assert 'DB.Commit()' in b and 'rollback()' in b
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ol/OL_Liste_cotisations.py
          git commit -m "fix: atomiser suppression des cotisations liste"
          git push origin HEAD:master
