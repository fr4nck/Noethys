name: Tighten facturation exceptions

on:
  push:
    paths:
      - '.github/workflows/_tmp_facturation_exceptions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Remplacer uniquement les quatre bare-except de facturation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('noethys/Utils/UTILS_Facturation.py')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r'(?m)^(?P<indent>\s*)except:\n(?P=indent)    pass$')
          matches=list(pattern.finditer(s))
          print('motifs:', len(matches))
          if len(matches) != 4:
              raise SystemExit(f'Attendu 4 motifs, trouvé {len(matches)}')
          s=pattern.sub(lambda m: f"{m.group('indent')}except Exception:\n{m.group('indent')}    pass", s)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Facturation.py
          python scripts/audit_runtime_patterns.py --json runtime.json
          python - <<'PY'
          import json
          d=json.load(open('runtime.json',encoding='utf-8'))
          x=[i for i in d['BARE_EXCEPT'] if i['file']=='Utils/UTILS_Facturation.py']
          print('BARE_EXCEPT facturation:',len(x),x)
          if x:
              raise SystemExit(1)
          PY
          git diff --check
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Facturation.py
          git commit -m 'fix: resserrer les exceptions de facturation'
          git push origin HEAD:master