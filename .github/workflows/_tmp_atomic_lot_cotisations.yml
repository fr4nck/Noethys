name: Atomic lot cotisations
on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_lot_cotisations.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch
        run: python .github/_tmp_patch_lot_cotisations.py
      - name: Verify
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_lot_cotisations.py
          python - <<'PY'
          from pathlib import Path
          t=Path('noethys/Dlg/DLG_Saisie_lot_cotisations.py').read_text(encoding='utf-8')
          assert 'DB.ReqInsert("cotisations", listeDonnees, commit=False)' in t
          assert 'DB.ReqInsert("prestations", listeDonnees, commit=False)' in t
          assert '"IDcotisation", IDcotisation, commit=False' in t
          assert 'DB.connexion.rollback()' in t
          PY
          git diff --check
          git diff -- noethys/Dlg/DLG_Saisie_lot_cotisations.py
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_lot_cotisations.py
          git commit -m 'fix: atomiser la création des cotisations par lot'
          git push origin master
