name: Atomic depannage

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_depannage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch depannage
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('noethys/Utils/UTILS_Depannage.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''        DB.ReqDEL("cotisations", "IDcotisation", IDcotisation)\n        if IDprestation != None :\n            DB.ReqDEL("prestations", "IDprestation", IDprestation)\n            DB.ReqDEL("ventilation", "IDprestation", IDprestation)\n        self.corrige = True\n''','''        ok = True\n        if IDprestation != None :\n            for table in ("ventilation", "deductions", "prestations"):\n                if not DB.ReqDEL(table, "IDprestation", IDprestation, commit=False):\n                    ok = False\n                    break\n        if ok and not DB.ReqDEL("cotisations", "IDcotisation", IDcotisation, commit=False):\n            ok = False\n        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        self.corrige = ok\n''',2)
          s=s.replace('''        DB.ReqDEL("prestations", "IDprestation", IDprestation)\n        DB.ReqDEL("ventilation", "IDprestation", IDprestation)\n        self.corrige = True\n''','''        ok = True\n        for table in ("ventilation", "deductions", "prestations"):\n            if not DB.ReqDEL(table, "IDprestation", IDprestation, commit=False):\n                ok = False\n                break\n        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        self.corrige = ok\n''',1)
          p.write_text(s,encoding='utf-8')

          p=Path('noethys/Utils/UTILS_Procedures.py')
          s=p.read_text(encoding='utf-8')
          old='''        DB = GestionDB.DB()\n        for index in selections:\n            texte, label, listePrestationsTemp = listeDonnees[index]\n            for IDprestation in listePrestationsTemp:\n                DB.ReqDEL("prestations", "IDprestation", IDprestation)\n        DB.Close()\n'''
          new='''        DB = GestionDB.DB()\n        ok = True\n        for index in selections:\n            texte, label, listePrestationsTemp = listeDonnees[index]\n            for IDprestation in listePrestationsTemp:\n                for table in ("ventilation", "deductions", "prestations"):\n                    if not DB.ReqDEL(table, "IDprestation", IDprestation, commit=False):\n                        ok = False\n                        break\n                if not ok:\n                    break\n            if not ok:\n                break\n        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        DB.Close()\n        if not ok:\n            dlgErreur = wx.MessageDialog(None, _(u"La procédure de suppression a échoué. Aucune prestation sélectionnée n'a été supprimée."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n            dlgErreur.ShowModal()\n            dlgErreur.Destroy()\n'''
          if s.count(old)!=1:
              raise SystemExit('bloc E4072 inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Depannage.py noethys/Utils/UTILS_Procedures.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Utils/UTILS_Depannage.py').read_text(encoding='utf-8')
          assert s.count('for table in ("ventilation", "deductions", "prestations")') >= 3
          assert s.count('self.corrige = ok') >= 3
          p=Path('noethys/Utils/UTILS_Procedures.py').read_text(encoding='utf-8')
          b=p[p.index('def E4072():'):p.index('def X0202():')]
          assert 'commit=False' in b and 'rollback()' in b and 'DB.Commit()' in b
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Depannage.py noethys/Utils/UTILS_Procedures.py
          git commit -m "fix: atomiser les suppressions de dépannage"
          git push origin HEAD:master
