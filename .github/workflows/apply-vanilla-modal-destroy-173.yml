name: Apply Vanilla modal destroy fixes 173

on:
  push:
    branches:
      - fix/vanilla-modal-destroy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Fermer les dialogues modaux qualifiés
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "noethys/Ctrl/CTRL_Editeur_email.py": [
                  ('        dlg.ShowModal()\n\n        handler.DeleteTemporaryImages()', '        dlg.ShowModal()\n        dlg.Destroy()\n\n        handler.DeleteTemporaryImages()'),
              ],
              "noethys/Ctrl/CTRL_Timeline.py": [
                  ('    dial = wx.MessageDialog(parent, message, "Error", wx.OK | wx.ICON_ERROR)\n    dial.ShowModal()\n\n\ndef _ask_question', '    dial = wx.MessageDialog(parent, message, "Error", wx.OK | wx.ICON_ERROR)\n    dial.ShowModal()\n    dial.Destroy()\n\n\ndef _ask_question'),
              ],
              "noethys/Dlg/DLG_Mailer.py": [
                  ('            dlgErreur = wx.MessageDialog(self, message, _(u"Anomalies"), wx.YES_NO|wx.NO_DEFAULT|wx.CANCEL|wx.ICON_EXCLAMATION)\n            if dlgErreur.ShowModal() == wx.ID_YES :', '            dlgErreur = wx.MessageDialog(self, message, _(u"Anomalies"), wx.YES_NO|wx.NO_DEFAULT|wx.CANCEL|wx.ICON_EXCLAMATION)\n            reponse = dlgErreur.ShowModal()\n            dlgErreur.Destroy()\n            if reponse == wx.ID_YES :'),
              ],
              "noethys/Dlg/DLG_Nbre_inscrits.py": [
                  ('        dlg = DLG_Parametres_nbre_inscrits.Dialog(self)\n        reponse = dlg.ShowModal()\n        if reponse == wx.ID_OK :', '        dlg = DLG_Parametres_nbre_inscrits.Dialog(self)\n        reponse = dlg.ShowModal()\n        dlg.Destroy()\n        if reponse == wx.ID_OK :'),
              ],
              "noethys/Dlg/DLG_Nbre_inscrits_2.py": [
                  ('        dlg = DLG_Parametres_nbre_inscrits.Dialog(self)\n        reponse = dlg.ShowModal()\n        if reponse == wx.ID_OK :', '        dlg = DLG_Parametres_nbre_inscrits.Dialog(self)\n        reponse = dlg.ShowModal()\n        dlg.Destroy()\n        if reponse == wx.ID_OK :'),
              ],
              "noethys/Noethys.py": [
                  ('        dlg = wx.lib.dialogs.ScrolledMessageDialog(self, msg, _(u"Licence"), size=(500, 500))\n        dlg.ShowModal()\n\n    def On_propos_soutenir', '        dlg = wx.lib.dialogs.ScrolledMessageDialog(self, msg, _(u"Licence"), size=(500, 500))\n        dlg.ShowModal()\n        dlg.Destroy()\n\n    def On_propos_soutenir'),
              ],
              "noethys/Utils/UTILS_Procedures.py": [
                  ('    reponse = dlg.ShowModal()\n    parametres = dlg.GetValue()\n    if reponse != wx.ID_OK:', '    reponse = dlg.ShowModal()\n    parametres = dlg.GetValue()\n    dlg.Destroy()\n    if reponse != wx.ID_OK:'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: motif attendu 1 fois, trouvé {count}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Compiler et vérifier l'ordre de destruction
        shell: python
        run: |
          import ast
          import py_compile
          from pathlib import Path

          cases = (
              ("noethys/Ctrl/CTRL_Editeur_email.py", "OnFileViewHTML", "dlg", None),
              ("noethys/Ctrl/CTRL_Timeline.py", "_display_error_message", "dial", None),
              ("noethys/Dlg/DLG_Mailer.py", "VerifieFusion", "dlgErreur", None),
              ("noethys/Dlg/DLG_Nbre_inscrits.py", "OnBoutonParametres", "dlg", None),
              ("noethys/Dlg/DLG_Nbre_inscrits_2.py", "OnBoutonParametres", "dlg", None),
              ("noethys/Noethys.py", "On_propos_licence", "dlg", None),
              ("noethys/Utils/UTILS_Procedures.py", "A9062", "dlg", "GetValue"),
          )

          def function(path, name):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              matches = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == name]
              if len(matches) != 1:
                  raise AssertionError((path, name, len(matches)))
              return matches[0]

          def calls(fn, variable, method):
              return sorted(
                  n.lineno for n in ast.walk(fn)
                  if isinstance(n, ast.Call)
                  and isinstance(n.func, ast.Attribute)
                  and n.func.attr == method
                  and isinstance(n.func.value, ast.Name)
                  and n.func.value.id == variable
              )

          for path, name, variable, useful_read in cases:
              py_compile.compile(path, doraise=True)
              fn = function(path, name)
              shows = calls(fn, variable, "ShowModal")
              destroys = calls(fn, variable, "Destroy")
              assert shows and destroys, (path, name, shows, destroys)
              assert shows[-1] < destroys[0], (path, name)
              if useful_read:
                  reads = calls(fn, variable, useful_read)
                  assert reads and reads[-1] < destroys[0], (path, name, useful_read)

          mailer = Path("noethys/Dlg/DLG_Mailer.py").read_text(encoding="utf-8")
          assert 'if dlgErreur.ShowModal() == wx.ID_YES' not in mailer
          assert 'reponse = dlgErreur.ShowModal()' in mailer

      - name: Committer et retirer le workflow temporaire
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Ctrl/CTRL_Editeur_email.py noethys/Ctrl/CTRL_Timeline.py noethys/Dlg/DLG_Mailer.py noethys/Dlg/DLG_Nbre_inscrits.py noethys/Dlg/DLG_Nbre_inscrits_2.py noethys/Noethys.py noethys/Utils/UTILS_Procedures.py
          git commit -m "Vanilla: détruire les dialogues modaux qualifiés (#173)"
          git rm .github/workflows/apply-vanilla-modal-destroy-173.yml
          git commit --amend --no-edit
          git push
