name: Atomic refund

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_refund.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch remboursement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Dlg/DLG_Saisie_remboursement.py')
          s=p.read_text(encoding='utf-8')

          # Les validations compte/payeur doivent interrompre le flux.
          old='''            dlg.Destroy()\n            self.ctrl_compte.SetFocus()\n\n        IDpayeur = self.ctrl_payeur.GetID()'''
          new='''            dlg.Destroy()\n            self.ctrl_compte.SetFocus()\n            return\n\n        IDpayeur = self.ctrl_payeur.GetID()'''
          if s.count(old)!=1: raise SystemExit('validation compte inattendue')
          s=s.replace(old,new,1)
          old='''            dlg.Destroy()\n            self.ctrl_payeur.SetFocus()\n\n        IDmode = self.ctrl_mode.GetID()'''
          new='''            dlg.Destroy()\n            self.ctrl_payeur.SetFocus()\n            return\n\n        IDmode = self.ctrl_mode.GetID()'''
          if s.count(old)!=1: raise SystemExit('validation payeur inattendue')
          s=s.replace(old,new,1)

          # Recherche famille protégée.
          old='''        DB.ExecuterReq(req)\n        IDfamille = DB.ResultatReq()[0][0]\n\n        # Enregistrement de la prestation positive'''
          new='''        if DB.ExecuterReq(req) != 1:\n            DB.Close()\n            dlg = wx.MessageDialog(self, _(u\"Impossible de retrouver la famille associée au compte payeur.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return\n        listeFamilles = DB.ResultatReq()\n        if not listeFamilles:\n            DB.Close()\n            dlg = wx.MessageDialog(self, _(u\"Aucune famille n'est associée à ce compte payeur.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return\n        IDfamille = listeFamilles[0][0]\n\n        # Enregistrement de la prestation positive'''
          if s.count(old)!=1: raise SystemExit('recherche famille inattendue')
          s=s.replace(old,new,1)

          # Toutes les écritures financières utilisent commit=False et sont vérifiées.
          old='''        IDprestation_positive = DB.ReqInsert("prestations", listeDonnees)\n\n        # Ventiler la prestation positive avec l'avoir\n        VentilationAuto(self.IDcompte_payeur)\n\n\n        # Enregistrement de la prestation négative'''
          new='''        IDprestation_positive = DB.ReqInsert("prestations", listeDonnees, commit=False)\n        if IDprestation_positive is None:\n            DB.Close()\n            dlg = wx.MessageDialog(self, _(u\"Le remboursement n'a pas pu être enregistré. Aucune écriture n'a été validée.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return\n\n        # Enregistrement de la prestation négative'''
          if s.count(old)!=1: raise SystemExit('prestation positive inattendue')
          s=s.replace(old,new,1)

          s=s.replace('''        IDprestation_negative = DB.ReqInsert("prestations", listeDonnees)\n''','''        IDprestation_negative = DB.ReqInsert("prestations", listeDonnees, commit=False)\n        if IDprestation_negative is None:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n            DB.Close()\n            dlg = wx.MessageDialog(self, _(u\"Le remboursement n'a pas pu être enregistré. Aucune écriture n'a été validée.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return\n''',1)
          s=s.replace('''        IDreglement = DB.ReqInsert("reglements", listeDonnees)\n''','''        IDreglement = DB.ReqInsert("reglements", listeDonnees, commit=False)\n        if IDreglement is None:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n            DB.Close()\n            dlg = wx.MessageDialog(self, _(u\"Le remboursement n'a pas pu être enregistré. Aucune écriture n'a été validée.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return\n''',1)
          old='''        IDventilation = DB.ReqInsert("ventilation", listeDonnees)\n\n        DB.Close()\n\n        # Fermeture'''
          new='''        IDventilation = DB.ReqInsert("ventilation", listeDonnees, commit=False)\n        if IDventilation is None:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n            DB.Close()\n            dlg = wx.MessageDialog(self, _(u\"Le remboursement n'a pas pu être enregistré. Aucune écriture n'a été validée.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return\n\n        DB.Commit()\n        DB.Close()\n\n        # La ventilation automatique intervient seulement après validation du remboursement.\n        VentilationAuto(self.IDcompte_payeur)\n\n        # Fermeture'''
          if s.count(old)!=1: raise SystemExit('ventilation finale inattendue')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Saisie_remboursement.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Dlg/DLG_Saisie_remboursement.py').read_text(encoding='utf-8')
          b=s[s.index('    def OnBoutonOk(self, event):'):]
          assert b.count('commit=False') >= 4
          assert 'DB.ResultatReq()[0][0]' not in b
          assert 'DB.Commit()' in b
          assert b.index('DB.Commit()') < b.index('VentilationAuto(self.IDcompte_payeur)')
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_remboursement.py
          git commit -m "fix: atomiser la saisie des remboursements"
          git push origin HEAD:master
