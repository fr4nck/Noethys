name: Temp batch21 etat nominatif questionnaires

on:
  push:
    branches:
      - fix/etat-nomin-questionnaires-batch-21

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch questionnaire contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('noethys/Ol/OL_Etat_nomin_champs.py')
          s = p.read_text(encoding='utf-8')
          old = '''        for IDquestion, label, type, controle in listeQuestions :\n            if type == "individu" : categorie = _(u"Individu")\n            if type == "famille" : categorie = _(u"Famille")\n            dictTemp = {"IDchamp":None, "code":"QUESTION%d" % IDquestion, "label":label, "type":"QUESTION", "categorie":categorie, "titre":label, "formule":None}\n            listeListeView.append(Track(dictTemp))\n'''
          new = '''        for IDquestion, label, type, controle in listeQuestions :\n            if type == "individu" :\n                categorie = _(u"Individu")\n            elif type == "famille" :\n                categorie = _(u"Famille")\n            else :\n                # Un état nominatif ne sait résoudre les réponses que pour un individu ou une famille.\n                continue\n            dictTemp = {"IDchamp":None, "code":"QUESTION%d" % IDquestion, "label":label, "type":"QUESTION", "categorie":categorie, "titre":label, "formule":None}\n            listeListeView.append(Track(dictTemp))\n'''
          if old not in s:
              raise SystemExit('pattern champs not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('noethys/Ol/OL_Etat_nomin_resultats.py')
          s = p.read_text(encoding='utf-8')
          old = '''        for champ in listeChamps :\n            if champ.type == "QUESTION" :\n                IDquestion = int(champ.code[len(champ.type):])\n                if champ.categorie == "Individu" : IDtemp = IDindividu\n                if champ.categorie == "Famille" : IDtemp = IDfamille\n                setattr(self, champ.code, GetReponse(IDquestion, IDtemp))\n'''
          new = '''        for champ in listeChamps :\n            if champ.type == "QUESTION" :\n                IDquestion = int(champ.code[len(champ.type):])\n                if champ.categorie == _(u"Individu") :\n                    IDtemp = IDindividu\n                elif champ.categorie == _(u"Famille") :\n                    IDtemp = IDfamille\n                else :\n                    # Garde-fou pour un ancien champ ou une catégorie non supportée.\n                    continue\n                setattr(self, champ.code, GetReponse(IDquestion, IDtemp))\n'''
          if old not in s:
              raise SystemExit('pattern resultats not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/test_branch_contracts_batch_21.py <<'PY'
          from pathlib import Path
          import importlib.util

          ROOT = Path(__file__).resolve().parents[1]
          CHAMPS = ROOT / 'noethys' / 'Ol' / 'OL_Etat_nomin_champs.py'
          RESULTATS = ROOT / 'noethys' / 'Ol' / 'OL_Etat_nomin_resultats.py'

          def test_etat_nominatif_ignore_questionnaire_types_not_supported():
              source = CHAMPS.read_text(encoding='utf-8')
              assert 'elif type == "famille"' in source
              assert 'continue' in source[source.index('for IDquestion, label, type, controle in listeQuestions'):source.index('# Quantité UNITES')]

          def test_etat_nominatif_uses_localized_question_categories_and_guard():
              source = RESULTATS.read_text(encoding='utf-8')
              block = source[source.index('# Questionnaires'):source.index('# Regroupement des conso')]
              assert 'champ.categorie == _(u"Individu")' in block
              assert 'champ.categorie == _(u"Famille")' in block
              assert 'else :' in block and 'continue' in block

          def test_targeted_branch_gap_findings_disappear():
              spec = importlib.util.spec_from_file_location('audit_branch_assignment_gaps', ROOT / 'scripts' / 'audit_branch_assignment_gaps.py')
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              findings = []
              for path in (CHAMPS, RESULTATS):
                  findings.extend(mod.scan_file(path, ROOT / 'noethys'))
              targeted = [f for f in findings if f.get('name') in {'categorie', 'IDtemp'}]
              assert targeted == [], targeted
          PY

      - name: Validate
        shell: bash
        run: |
          python -m compileall -q noethys/Ol/OL_Etat_nomin_champs.py noethys/Ol/OL_Etat_nomin_resultats.py
          python -m pytest -q tests/test_branch_contracts_batch_21.py
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/gaps.json', encoding='utf-8'))
          findings=data.get('findings', data.get('results', [])) if isinstance(data, dict) else data
          print('BRANCH_ASSIGNMENT_GAPS=', len(findings))
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tmp-batch21.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ol/OL_Etat_nomin_champs.py noethys/Ol/OL_Etat_nomin_resultats.py tests/test_branch_contracts_batch_21.py
          git commit -m 'fix: fiabiliser les questions des états nominatifs'
          git push origin HEAD:fix/etat-nomin-questionnaires-batch-21
