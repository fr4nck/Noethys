name: Temporary filter review fix

on:
  push:
    branches:
      - fix/archive-internet-filter-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/archive-internet-filter-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Preserve previous filter on incoherent radio state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in (
              Path('noethys/Dlg/DLG_Archivage.py'),
              Path('noethys/Dlg/DLG_Comptes_internet.py'),
          ):
              text = path.read_text(encoding='utf-8')
              old = '            else :\n                self.ctrl_listview.SetFiltre(None)\n                return\n'
              new = '            else :\n                return\n'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: repli radio attendu absent ou ambigu')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_activity_filter_branch_contract.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              '    def test_no_selected_radio_falls_back_to_no_filter(self):\n',
              '    def test_no_selected_radio_preserves_previous_filter(self):\n',
              1,
          )
          old = '                page = FakePage()\n                load_method(path)(page)\n                self.assertEqual(page.ctrl_listview.filters, [None])\n'
          new = '                page = FakePage()\n                page.ctrl_listview.filters.append(("sans", "existing"))\n                load_method(path)(page)\n                self.assertEqual(page.ctrl_listview.filters, [("sans", "existing")])\n'
          if text.count(old) != 1:
              raise SystemExit('test: scénario radio incohérent attendu absent ou ambigu')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate targeted regressions
        shell: bash
        run: |
          python -m py_compile noethys/Dlg/DLG_Archivage.py noethys/Dlg/DLG_Comptes_internet.py tests/test_activity_filter_branch_contract.py
          python -m unittest discover -s tests -p 'test_activity_filter_branch_contract.py' -v
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-filter-review-fix.yml
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git add noethys/Dlg/DLG_Archivage.py noethys/Dlg/DLG_Comptes_internet.py tests/test_activity_filter_branch_contract.py .github/workflows/tmp-filter-review-fix.yml
          git commit -m "Fix: préserver le filtre sur état radio incohérent"
          git push origin HEAD:fix/archive-internet-filter-contract
