name: Apply remaining date patterns

on:
  push:
    paths:
      - 'scripts/modernize_remaining_date_patterns.py'
      - '.github/workflows/apply-remaining-date-patterns.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer les motifs restants
        run: python scripts/modernize_remaining_date_patterns.py
      - name: Vérifier la compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Mesurer l'audit dates
        run: python scripts/audit_fragile_date_parsing.py || true
      - name: Committer si nécessaire
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/
          git commit -m "fix: moderniser les derniers motifs de dates simples"
          git push origin master
