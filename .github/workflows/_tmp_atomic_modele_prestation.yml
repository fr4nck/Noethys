name: Atomic modele prestation

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_modele_prestation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch
        run: python .github/_tmp_patch_modele_prestation.py
      - name: Verify
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_modele_prestation.py
          git diff --check
          python -c "from pathlib import Path; s=Path('noethys/Dlg/DLG_Saisie_modele_prestation.py').read_text(encoding='utf-8'); a=s.index('        # Sauvegarde transactionnelle du modèle'); b=s.index('        # Fermeture de la fenêtre',a); x=s[a:b]; assert 'commit=False' in x; assert 'DB.Commit()' in x; assert 'rollback()' in x; assert x.index('self.IDmodele = nouvelIDmodele') > x.index('DB.Close()')"
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Saisie_modele_prestation.py
          git commit -m "fix: atomiser les modèles de prestations"
          git pull --rebase origin master
          git push origin HEAD:master
