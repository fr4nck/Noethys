name: Temp composition filiation patcher

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'fix/composition-filiation-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/composition-filiation-layout
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Appliquer le correctif
        run: python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Valider le correctif
        run: |
          python -m py_compile noethys/Ctrl/CTRL_Composition.py tests/test_composition_filiation_layout.py
          python -m unittest tests.test_composition_filiation_layout -v
          python scripts/audit_branch_assignment_gaps.py --json /tmp/branch-gaps.json
      - name: Commit du correctif
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .tmp-composition-filiation-trigger
          rm -f .github/workflows/tmp-composition-filiation-patcher.yml
          git add -A
          git commit -m 'Fix — généraliser le placement des filiations'
          git push origin HEAD:fix/composition-filiation-layout
