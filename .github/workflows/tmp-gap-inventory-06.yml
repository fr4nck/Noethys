name: Temp gap batch 06 patch

on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-06

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Appliquer le patch
        run: python scripts/tmp_patch_gap_batch_06.py
      - name: Tests cibles
        run: python -m unittest tests.test_small_ui_branch_contracts -v
      - name: Audit complet
        run: |
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json
          python -c "import json; r=json.load(open('/tmp/gaps.json', encoding='utf-8')); print('BRANCH_ASSIGNMENT_GAPS', r['count']); assert r['count'] == 209, r['count']"
      - name: Committer le lot final
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-gap-inventory-06.yml scripts/tmp_patch_gap_batch_06.py
          git add noethys/Dlg/DLG_Saisie_typesVaccins.py noethys/Dlg/DLG_Envoi_sms.py noethys/Dlg/DLG_Selection_mails.py tests/test_small_ui_branch_contracts.py
          git commit -m 'Fix — expliciter plusieurs contrats UI conditionnels'
          git push origin HEAD:fix/branch-assignment-gap-batch-06
