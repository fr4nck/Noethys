name: Package Windows master

# Qualification lourde uniquement après intégration d'un changement qui peut
# réellement affecter le package Windows. Le build reste implémenté une seule
# fois dans windows-package.yml.
on:
  push:
    branches:
      - master
    paths:
      - 'noethys/Utils/UTILS_Fichiers.py'
      - 'noethys/Utils/UTILS_Config.py'
      - 'noethys/Ctrl/CTRL_Recherche_individus.py'
      - 'noethys/Dlg/DLG_Echelle_interface.py'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'tests/test_noe_041_portable_paths.py'
      - '.github/workflows/windows-package.yml'
      - '.github/workflows/windows-package-master.yml'

permissions:
  contents: read

jobs:
  package:
    name: Qualifier le packaging Windows du master exact
    uses: ./.github/workflows/windows-package.yml