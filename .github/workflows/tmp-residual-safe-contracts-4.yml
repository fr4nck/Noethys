name: Temporary residual safe contracts 4

on:
  push:
    branches:
      - audit/residual-safe-contracts-4

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Ajouter les qualifications démontrées
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts import qualify_branch_assignment_gaps as qualify

          targets = [
              ('Ctrl/CTRL_Informations.py', 'GetRenseignements', 'dictDonneesFamille', "dictDonneesFamille est créé dès que self.IDfamille est renseigné ; toutes les lectures famille signalées sont elles-mêmes gardées par self.IDfamille != None"),
              ('Ctrl/CTRL_Tarification_calcul.py', 'Sauvegarde', 'DB', "DB n'existe qu'en mode sans track_tarif et chaque accès base de la méthode est protégé par ce même test self.track_tarif == None"),
              ('Ctrl/CTRL_Tarification_forfait.py', 'Sauvegarde', 'options', "les trois boutons radio forment un groupe wx exhaustif ; chacun des trois états affecte options avant la sauvegarde"),
              ('Dlg/DLG_Appliquer_forfait.py', 'Applique_forfait', 'IDgroupe', "IDgroupe est affecté en même temps que IDcategorie_tarif_temp ; le flot aval ne l'utilise que sous le garde IDcategorie_tarif_temp != None"),
              ('Dlg/DLG_Appliquer_forfait.py', 'Applique_forfait', 'IDinscription', "IDinscription est affecté en même temps que IDcategorie_tarif_temp ; les consommations ne sont créées que dans le flot gardé par IDcategorie_tarif_temp != None"),
              ('Dlg/DLG_Nbre_inscrits_2.py', 'MAJ', 'dictGroupeParActivite', "dictGroupeParActivite est créé lorsque regroupement_groupe_activites == 1 et sa lecture est dans le second opérande d'un and portant exactement le même test"),
              ('Ol/OL_PES_pieces.py', 'GetTracks', 'criteres', "si IDlot et IDmandat sont tous deux None la fonction retourne immédiatement ; sinon au moins une des deux branches affecte criteres avant la requête"),
              ('Utils/UTILS_Portail_synchro.py', 'Upload_data', 'IDfamille', "profil parcourt littéralement famille/utilisateur ; les deux branches affectent IDfamille avant toute lecture"),
              ('Utils/UTILS_Portail_synchro.py', 'Upload_data', 'IDutilisateur', "profil parcourt littéralement famille/utilisateur ; les deux branches affectent IDutilisateur avant la création du compte"),
              ('Utils/UTILS_Portail_synchro.py', 'Upload_data', 'nomDossier', "profil parcourt littéralement famille/utilisateur et chacune des deux valeurs affecte nomDossier avant anonymisation ou création du compte"),
              ('Utils/UTILS_Portail_synchro.py', 'Download_data', 'listeRefExistantes', "listeRefExistantes est construite sous full_synchro == True et sa seule lecture signalée est protégée par le même garde"),
          ]

          report = qualify.build_report()
          review = [item for item in report['findings'] if item['classification'] == 'review']
          entries = []
          for file, function, name, reason in targets:
              matches = [item for item in review if (item['file'], item['function'], item['name']) == (file, function, name)]
              assert len(matches) == 1, (file, function, name, matches)
              key = qualify.qualification_key(matches[0])
              assert key[-1], key
              entries.append((key, reason))

          path = Path('scripts/qualify_branch_assignment_gaps.py')
          text = path.read_text(encoding='utf-8')
          existing = set(qualify.EXPLICIT_SAFE)
          blocks = []
          for key, reason in entries:
              if key in existing:
                  continue
              blocks.append(f"    {key!r}: (\n        {reason!r}\n    ),\n")
          if blocks:
              marker = "\n}\n\ndef _candidate_fingerprint"
              assert marker in text
              text = text.replace(marker, "\n" + "".join(blocks) + marker, 1)
              path.write_text(text, encoding='utf-8')

          test = Path('tests/test_residual_safe_contracts_4.py')
          test.write_text('''from pathlib import Path\n\nfrom scripts import qualify_branch_assignment_gaps as qualify\n\nTARGETS = {\n    ("Ctrl/CTRL_Informations.py", "GetRenseignements", "dictDonneesFamille"),\n    ("Ctrl/CTRL_Tarification_calcul.py", "Sauvegarde", "DB"),\n    ("Ctrl/CTRL_Tarification_forfait.py", "Sauvegarde", "options"),\n    ("Dlg/DLG_Appliquer_forfait.py", "Applique_forfait", "IDgroupe"),\n    ("Dlg/DLG_Appliquer_forfait.py", "Applique_forfait", "IDinscription"),\n    ("Dlg/DLG_Nbre_inscrits_2.py", "MAJ", "dictGroupeParActivite"),\n    ("Ol/OL_PES_pieces.py", "GetTracks", "criteres"),\n    ("Utils/UTILS_Portail_synchro.py", "Upload_data", "IDfamille"),\n    ("Utils/UTILS_Portail_synchro.py", "Upload_data", "IDutilisateur"),\n    ("Utils/UTILS_Portail_synchro.py", "Upload_data", "nomDossier"),\n    ("Utils/UTILS_Portail_synchro.py", "Download_data", "listeRefExistantes"),\n}\n\n\ndef test_targets_are_exactly_explicit_safe():\n    report = qualify.build_report()\n    registry = report["explicit_safe_registry"]\n    assert registry["unmatched"] == []\n    assert registry["ambiguous"] == []\n    for target in TARGETS:\n        matches = [item for item in report["findings"] if (item["file"], item["function"], item["name"]) == target]\n        assert len(matches) == 1, (target, matches)\n        assert matches[0]["classification"] == "explicit_safe"\n\n\ndef test_source_contracts_remain_visible():\n    root = Path("noethys")\n    infos = (root / "Ctrl/CTRL_Informations.py").read_text(encoding="utf-8")\n    assert "if self.IDfamille != None :\\n            req =" in infos\n    assert "IDtype_renseignement == 7 and self.IDfamille != None" in infos\n\n    calcul = (root / "Ctrl/CTRL_Tarification_calcul.py").read_text(encoding="utf-8")\n    assert "if self.track_tarif == None :\\n            DB = GestionDB.DB()" in calcul\n    assert "if self.track_tarif == None :\\n                    DB.ReqDEL" in calcul\n    assert "if self.track_tarif == None :\\n            DB.Close()" in calcul\n\n    forfait = (root / "Ctrl/CTRL_Tarification_forfait.py").read_text(encoding="utf-8")\n    assert "style=wx.RB_GROUP" in forfait\n    assert "if self.radio_conso_sans.GetValue() == True :\\n            options = None" in forfait\n    assert "if self.radio_conso_ouvertures.GetValue() == True :\\n            options = None" in forfait\n    assert "if self.radio_conso_perso.GetValue() == True :\\n            options = None" in forfait\n\n    applique = (root / "Dlg/DLG_Appliquer_forfait.py").read_text(encoding="utf-8")\n    assert 'IDinscription = dictInscription["IDinscription"]' in applique\n    assert 'IDgroupe = dictInscription["IDgroupe"]' in applique\n    assert "if IDcategorie_tarif_temp != None :" in applique\n\n    inscrits = (root / "Dlg/DLG_Nbre_inscrits_2.py").read_text(encoding="utf-8")\n    assert "if self.regroupement_groupe_activites == 1 :" in inscrits\n    assert "self.regroupement_groupe_activites == 1 and IDactivite in dictGroupeParActivite" in inscrits\n\n    pes = (root / "Ol/OL_PES_pieces.py").read_text(encoding="utf-8")\n    assert "if IDlot == None and IDmandat == None :\\n        return []" in pes\n\n    portail = (root / "Utils/UTILS_Portail_synchro.py").read_text(encoding="utf-8")\n    assert 'for profil, listeDonnees in [("famille", listeFamilles), ("utilisateur", listeUtilisateurs)]:' in portail\n    assert "if full_synchro == True :\\n            # Demande à récupérer toutes les actions du portail" in portail\n    assert 'if full_synchro == True:\\n                    if action["ref_unique"] in listeRefExistantes' in portail\n''', encoding='utf-8')
          PY
      - name: Vérifier le lot ciblé
        run: |
          python -m unittest tests.test_residual_safe_contracts_4
          python scripts/qualify_branch_assignment_gaps.py
      - name: Commit du lot
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucun changement à committer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qualify_branch_assignment_gaps.py tests/test_residual_safe_contracts_4.py
          git commit -m "Audit: qualifier onze contrats résiduels sûrs"
          git push
