name: Temp gap inventory 07

on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-07

permissions:
  contents: read

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inventorier les gaps
        run: |
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json
          python - <<'PY'
          import json
          from collections import Counter
          with open('/tmp/gaps.json', encoding='utf-8') as fh:
              report = json.load(fh)
          print('COUNT', report['count'])
          print('TOP_FILES')
          for path, count in Counter(item['file'] for item in report['findings']).most_common(25):
              print(count, path)
          print('FIRST_FINDINGS')
          for item in report['findings'][:160]:
              print(item['file'], item['function'], item['name'], item['line'], item['if_line'], item['detail'])
          PY
