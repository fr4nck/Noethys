name: tmp inspect migration referentiels
on:
  push:
    paths:
      - '.github/workflows/tmp-inspect-migration-referentiels.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect referential schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('noethys/Data/DATA_Tables.py')
          s=p.read_text(encoding='utf-8')
          targets=['secteurs','nationalites','pays','types_sieste','categories_travail','medecins','utilisateurs','restaurateurs','caisses','banques']
          for t in targets:
              m=re.search(r'^[ ]{4}["\']'+re.escape(t)+r'["\']\s*:', s, re.M)
              print(t, 'TABLE' if m else 'ABSENT')
          # Print relevant schema lines for family/individual references.
          for term in ['IDcivilite','IDnationalite','IDpays_naiss','IDsecteur','IDcategorie_travail','IDmedecin','IDtype_sieste','IDcaisse','allocataire','prelevement_banque','prelevement_individu','titulaire_helios','tiers_solidaire','adresse_auto']:
              print('\n###', term)
              for i,line in enumerate(s.splitlines(),1):
                  if term in line:
                      print(i, line.strip())
          PY
