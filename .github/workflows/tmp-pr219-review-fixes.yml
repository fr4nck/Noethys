name: Temporary PR219 review fixes

on:
  push:
    branches:
      - fix/branch-assignment-candidates-pass-1
    paths:
      - .github/workflows/tmp-pr219-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-candidates-pass-1
          fetch-depth: 0
      - name: Patch parser and explicit-safe fingerprints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import tokenize

          portal = Path('noethys/Dlg/DLG_Saisie_portail_demande.py')
          text = portal.read_text(encoding='utf-8')
          old = '''    types = {"F": "facture", "P": "periode"}\n    nbre_elements = 0\n    for valeur in (u"%s" % ventilation).split(","):\n        valeur = valeur.strip()\n        if not valeur:\n            continue\n        type_impaye = types.get(valeur[0])\n'''
          new = '''    types = {"F": "facture", "P": "periode"}\n    nbre_elements = 0\n    valeurs = (u"%s" % ventilation).split(",")\n    for index, valeur in enumerate(valeurs):\n        valeur = valeur.strip()\n        if not valeur:\n            # Compatibilité historique : une unique virgule finale est tolérée.\n            # Un segment vide en tête ou au milieu est en revanche une donnée\n            # malformée et doit interrompre le traitement du paiement.\n            if index == len(valeurs) - 1 and index > 0:\n                continue\n            raise ValueError(u"entrée de ventilation vide")\n        type_impaye = types.get(valeur[0])\n'''
          if old not in text:
              raise SystemExit('parser block not found')
          portal.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Calcule une empreinte structurelle des quatre qualifications sûres
          # avant de les enregistrer. L'algorithme est dupliqué dans le qualificateur.
          import sys
          sys.path.insert(0, str(Path.cwd()))
          from scripts import audit_branch_assignment_gaps as base

          base_keys = [
              ("Dlg/DLG_Saisie_portail_demande.py", "MAJ_informations", "dict_periodes", "body_only"),
              ("Dlg/DLG_Saisie_portail_demande.py", "MAJ_informations", "dict_factures", "body_only"),
              ("Dlg/DLG_Saisie_portail_demande.py", "Traitement_recus", "reponse", "body_only"),
              ("Dlg/DLG_Saisie_portail_demande.py", "Traitement_factures", "reponse", "body_only"),
          ]

          def fingerprint(root, item):
              path = Path(root) / item['file']
              with tokenize.open(path) as stream:
                  tree = ast.parse(stream.read(), filename=str(path))
              functions = [
                  node for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == item['function']
              ]
              for function in functions:
                  if_node = next((
                      node for node in ast.walk(function)
                      if isinstance(node, ast.If) and getattr(node, 'lineno', None) == item['if_line']
                  ), None)
                  if if_node is None:
                      continue
                  candidates = []
                  for node in ast.walk(function):
                      if not isinstance(node, ast.stmt):
                          continue
                      found = any(
                          isinstance(child, ast.Name)
                          and child.id == item['name']
                          and getattr(child, 'lineno', None) == item['line']
                          and isinstance(child.ctx, (ast.Load, ast.Del))
                          for child in ast.walk(node)
                      )
                      if found:
                          start = getattr(node, 'lineno', item['line'])
                          end = getattr(node, 'end_lineno', start)
                          candidates.append((end - start, len(list(ast.walk(node))), node))
                  if not candidates:
                      continue
                  event_node = min(candidates, key=lambda entry: (entry[0], entry[1]))[2]
                  payload = '|'.join((
                      item['function'], item['name'], item['detail'],
                      ast.dump(if_node, include_attributes=False),
                      ast.dump(event_node, include_attributes=False),
                  ))
                  return hashlib.sha256(payload.encode('utf-8')).hexdigest()
              return None

          raw = base.build_report(Path('noethys'))
          by_key = {}
          for item in raw['findings']:
              key = (item['file'], item['function'], item['name'], item['detail'])
              by_key.setdefault(key, []).append(item)

          fingerprints = {}
          for key in base_keys:
              matches = by_key.get(key, [])
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one raw candidate for {key}, got {len(matches)}')
              fp = fingerprint(Path('noethys'), matches[0])
              if not fp:
                  raise SystemExit(f'could not fingerprint {key}')
              fingerprints[key] = fp

          qualifier = Path('scripts/qualify_branch_assignment_gaps.py')
          q = qualifier.read_text(encoding='utf-8')
          q = q.replace('import argparse\nimport json\n', 'import argparse\nimport ast\nimport hashlib\nimport json\nimport tokenize\n', 1)
          start = q.index('EXPLICIT_SAFE = {')
          end = q.index('\n\n\ndef qualification_key', start)

          reasons = {
              base_keys[0]: "la lecture n'est atteinte qu'en itérant des paiements de type période ; ce même ensemble non vide initialise dict_periodes juste avant",
              base_keys[1]: "la lecture n'est atteinte qu'en itérant des paiements de type facture ; ce même ensemble non vide initialise dict_factures juste avant",
              base_keys[2]: "les chemins continuants sont couverts par methode_envoi != 'email' ou methode_envoi == 'email' ; chacun définit reponse avant le retour",
              base_keys[3]: "les chemins continuants sont couverts par methode_envoi != 'email' ou methode_envoi == 'email' ; chacun définit reponse avant le retour",
          }
          lines = ['EXPLICIT_SAFE = {']
          for key in base_keys:
              full_key = key + (fingerprints[key],)
              lines.append(f'    {full_key!r}: (')
              lines.append(f'        {reasons[key]!r}')
              lines.append('    ),')
          lines.append('}')
          registry = '\n'.join(lines)

          helper = r'''

def _candidate_fingerprint(root, item):
    """Empreinte la structure AST qui justifie une qualification explicite.

    Les numéros de ligne servent uniquement à retrouver les nœuds signalés par
    le scanner. Ils ne participent pas à l'empreinte : un déplacement de code
    reste donc stable, tandis qu'une modification du branchement ou de la
    lecture rend automatiquement l'entrée de registre obsolète.
    """
    path = Path(root) / item["file"]
    try:
        with tokenize.open(path) as stream:
            tree = ast.parse(stream.read(), filename=str(path))
    except (OSError, SyntaxError, UnicodeError):
        return None

    functions = [
        node for node in ast.walk(tree)
        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
        and node.name == item["function"]
    ]
    for function in functions:
        if_node = next((
            node for node in ast.walk(function)
            if isinstance(node, ast.If)
            and getattr(node, "lineno", None) == item["if_line"]
        ), None)
        if if_node is None:
            continue

        candidates = []
        for node in ast.walk(function):
            if not isinstance(node, ast.stmt):
                continue
            found = any(
                isinstance(child, ast.Name)
                and child.id == item["name"]
                and getattr(child, "lineno", None) == item["line"]
                and isinstance(child.ctx, (ast.Load, ast.Del))
                for child in ast.walk(node)
            )
            if found:
                start = getattr(node, "lineno", item["line"])
                end = getattr(node, "end_lineno", start)
                candidates.append((end - start, len(list(ast.walk(node))), node))
        if not candidates:
            continue

        event_node = min(candidates, key=lambda entry: (entry[0], entry[1]))[2]
        payload = "|".join((
            item["function"],
            item["name"],
            item["detail"],
            ast.dump(if_node, include_attributes=False),
            ast.dump(event_node, include_attributes=False),
        ))
        return hashlib.sha256(payload.encode("utf-8")).hexdigest()
    return None


def qualification_key(item, root=ROOT):
    return (
        item["file"],
        item["function"],
        item["name"],
        item["detail"],
        _candidate_fingerprint(root, item),
    )
'''
          old_func_start = end + 3
          build_start = q.index('\n\ndef build_report', old_func_start)
          q = q[:start] + registry + helper + q[build_start:]
          q = q.replace('qualification_key(item) for item in raw["findings"]', 'qualification_key(item, root) for item in raw["findings"]')
          q = q.replace('key = qualification_key(item)', 'key = qualification_key(item, root)')
          qualifier.write_text(q, encoding='utf-8')

          tests = Path('tests/test_portail_payment_ventilation_contract.py')
          t = tests.read_text(encoding='utf-8')
          anchor = '''    def test_unknown_prefix_is_rejected_instead_of_reusing_previous_type(self):\n'''
          addition = '''    def test_leading_and_interior_empty_segments_are_rejected(self):\n        for value in (",F12#10.50", "F12#10.50,,P7#3.25", "F12#10.50,,"):\n            with self.subTest(value=value):\n                with self.assertRaises(ValueError):\n                    self.parse(value)\n\n'''
          if addition not in t:
              if anchor not in t:
                  raise SystemExit('portal test anchor not found')
              t = t.replace(anchor, addition + anchor, 1)
              tests.write_text(t, encoding='utf-8')

          qtests = Path('tests/test_branch_assignment_gap_qualification.py')
          qt = qtests.read_text(encoding='utf-8')
          anchor2 = '''    def test_repository_qualification_is_exported_without_hidden_candidates(self):\n'''
          addition2 = '''    def test_stale_explicit_safe_structure_is_not_downgraded(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            target = root / "Dlg" / "DLG_Saisie_portail_demande.py"\n            target.parent.mkdir(parents=True)\n            target.write_text(textwrap.dedent(\"\"\"\n                def MAJ_informations(flag):\n                    if flag:\n                        dict_periodes = {}\n                    return dict_periodes\n            \"\"\"), encoding="utf-8")\n            report = audit.build_report(root)\n\n        candidate = next(\n            item for item in report["findings"]\n            if item["function"] == "MAJ_informations" and item["name"] == "dict_periodes"\n        )\n        self.assertEqual(candidate["classification"], "review")\n        self.assertEqual(candidate["priority"], "high")\n\n'''
          if addition2 not in qt:
              if anchor2 not in qt:
                  raise SystemExit('qualification test anchor not found')
              qt = qt.replace(anchor2, addition2 + anchor2, 1)
              qtests.write_text(qt, encoding='utf-8')
          PY
      - name: Compile and test review fixes
        shell: bash
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_portail_demande.py scripts/qualify_branch_assignment_gaps.py
          python -m unittest tests.test_portail_payment_ventilation_contract tests.test_branch_assignment_gap_qualification
          python scripts/qualify_branch_assignment_gaps.py --json tmp/pr219-qualified.json
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-pr219-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Saisie_portail_demande.py scripts/qualify_branch_assignment_gaps.py tests/test_portail_payment_ventilation_contract.py tests/test_branch_assignment_gap_qualification.py .github/workflows/tmp-pr219-review-fixes.yml
          git commit -m "Fix: verrouiller le parsing et les qualifications explicites"
          git push origin HEAD:fix/branch-assignment-candidates-pass-1
