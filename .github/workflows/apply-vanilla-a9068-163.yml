name: Apply Vanilla A9068 safety fix 163

on:
  push:
    branches:
      - fix/vanilla-a9068-safety

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vanilla-a9068-safety
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Sécuriser A9068
        shell: python
        run: |
          from pathlib import Path
          path = Path("noethys/Utils/UTILS_Procedures.py")
          text = path.read_text(encoding="utf-8")

          old_selection = '''    if dlg.ShowModal() == wx.ID_OK:\n        listeIDinscription = [listeInscriptions[index][0]\n                              for index in dlg.GetSelections()]\n        dlg.Destroy()\n    else:'''
          new_selection = '''    if dlg.ShowModal() == wx.ID_OK:\n        listeIDinscription = [listeInscriptions[index][0]\n                              for index in dlg.GetSelections()]\n        dlg.Destroy()\n        if not listeIDinscription:\n            DB.Close()\n            return\n    else:'''
          if text.count(old_selection) != 1:
              raise SystemExit(f"selection: motif attendu une fois, trouvé {text.count(old_selection)}")
          text = text.replace(old_selection, new_selection, 1)

          old_date = '''    from Utils import UTILS_Dates\n    date_erreur = False\n    try:\n        date_desinscription = UTILS_Dates.DateFrEng(date)'''
          new_date = '''    from Utils import UTILS_Dates\n    date_erreur = False\n    date_desinscription = None\n    try:\n        date_desinscription = UTILS_Dates.DateFrEng(date)'''
          if text.count(old_date) != 1:
              raise SystemExit(f"date: motif attendu une fois, trouvé {text.count(old_date)}")
          text = text.replace(old_date, new_date, 1)

          old_condition = '''    if len(listeIDinscription) == 0:\n        condition = "IDinscription > 0"\n    elif len(listeIDinscription) == 1:\n        condition = "IDinscription IN (%d)" % listeIDinscription[0]\n    else:\n        condition = "IDinscription IN %s" % str(tuple(listeIDinscription))'''
          new_condition = '''    if len(listeIDinscription) == 1:\n        condition = "IDinscription IN (%d)" % listeIDinscription[0]\n    else:\n        condition = "IDinscription IN %s" % str(tuple(listeIDinscription))'''
          if text.count(old_condition) != 1:
              raise SystemExit(f"condition: motif attendu une fois, trouvé {text.count(old_condition)}")
          text = text.replace(old_condition, new_condition, 1)

          path.write_text(text, encoding="utf-8")

      - name: Compiler et vérifier les contrats de sécurité
        run: |
          python -m py_compile noethys/Utils/UTILS_Procedures.py
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('noethys/Utils/UTILS_Procedures.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)
          fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'A9068')
          segment = ast.get_source_segment(text, fn)
          assert 'condition = "IDinscription > 0"' not in segment
          assert 'if not listeIDinscription:' in segment
          assert 'date_desinscription = None' in segment
          assert segment.count('UPDATE inscriptions SET date_desinscription') == 1
          PY
      - name: Committer et retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-vanilla-a9068-163.yml
          git add noethys/Utils/UTILS_Procedures.py
          git commit -m "Vanilla: sécuriser la désinscription par lot A9068 (#163)"
          git push origin HEAD:fix/vanilla-a9068-safety
