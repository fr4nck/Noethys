name: Inspect modele prestation

on:
  push:
    paths:
      - '.github/workflows/_tmp_inspect_modele_prestation.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecter Sauvegarde tarification
        run: |
          python - <<'PY' > .github/_tmp_inspect_modele_prestation.txt
          from pathlib import Path
          p=Path('noethys/Ctrl/CTRL_Tarification_calcul.py')
          s=p.read_text(encoding='utf-8',errors='ignore').splitlines()
          for i,line in enumerate(s):
              if 'def Sauvegarde' in line:
                  print('DEF',i+1,line)
                  for j in range(i,min(len(s),i+120)):
                      print(f'{j+1}: {s[j]}')
          PY
      - name: Publier rapport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/_tmp_inspect_modele_prestation.txt
          git commit -m "ci: publier inspection tarification modèle"
          git pull --rebase origin master
          git push origin HEAD:master
