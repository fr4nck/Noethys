name: Temporary PR218 deletion-flow fix

on:
  push:
    branches:
      - audit/branch-assignment-flow-hardening
    paths:
      - .github/workflows/tmp-pr218-delete-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/branch-assignment-flow-hardening
      - name: Fix deletion flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit_branch_assignment_gaps.py')
          s = p.read_text(encoding='utf-8')

          a = s.index('def assigned_names(statements):')
          b = s.index('\ndef target_names(target):', a)
          chunk = s[a:b]
          old = 'if isinstance(node.ctx, ast.Store):'
          if old not in chunk:
              raise SystemExit('assigned_names store check not found')
          chunk = chunk.replace(old, 'if isinstance(node.ctx, (ast.Store, ast.Del)):', 1)
          s = s[:a] + chunk + s[b:]

          marker = 'def direct_definitions(statement):'
          helper_lines = [
              'def deleted_names_in_sequence(statements):',
              '    names = set()',
              '',
              '    class Deletes(ast.NodeVisitor):',
              '        def visit_Name(self, node):',
              '            if isinstance(node.ctx, ast.Del):',
              '                names.add(node.id)',
              '',
              '        def visit_FunctionDef(self, node):',
              '            return',
              '',
              '        def visit_AsyncFunctionDef(self, node):',
              '            return',
              '',
              '        def visit_Lambda(self, node):',
              '            return',
              '',
              '        def visit_ClassDef(self, node):',
              '            return',
              '',
              '    visitor = Deletes()',
              '    for statement in statements:',
              '        visitor.visit(statement)',
              '    return names',
              '',
              '',
          ]
          helper = '\n'.join(helper_lines)
          if 'def deleted_names_in_sequence(statements):' not in s:
              s = s.replace(marker, helper + marker, 1)

          w = s.index('def _with_continuing_definitions(statement, predefined):')
          g = s.index('\ndef guaranteed_definitions(statements, predefined):', w)
          wchunk = s[w:g]
          oldw = '        if isinstance(first.optional_vars, ast.Name):\n            defined.add(first.optional_vars.id)'
          neww = '        if isinstance(first.optional_vars, ast.Name):\n            name = first.optional_vars.id\n            if name not in deleted_names_in_sequence(statement.body):\n                defined.add(name)'
          if oldw not in wchunk:
              raise SystemExit('with target block not found')
          wchunk = wchunk.replace(oldw, neww, 1)
          s = s[:w] + wchunk + s[g:]

          start = s.index('def guaranteed_definitions(statements, predefined):')
          stop = s.index('\ndef scan_sequence(statements, predefined, relpath, function_name, findings):', start)
          gchunk = s[start:stop]
          needle = '                else:\n                    return defined\n\n        elif isinstance(statement, ast.Try):'
          replacement = '                else:\n                    return defined\n            elif not body_terminates:\n                defined = body_defined & defined\n\n        elif isinstance(statement, ast.Try):'
          if needle not in gchunk:
              raise SystemExit('implicit else merge point not found')
          gchunk = gchunk.replace(needle, replacement, 1)
          s = s[:start] + gchunk + s[stop:]

          oldskip = '                if name in defined or name in guaranteed_after_if or whole_if_terminates:'
          if oldskip not in s:
              raise SystemExit('candidate skip guard not found')
          s = s.replace(oldskip, '                if name in guaranteed_after_if or whole_if_terminates:', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile and targeted tests
        run: |
          python -m py_compile scripts/audit_branch_assignment_gaps.py
          python -m unittest tests.test_branch_assignment_gaps_audit tests.test_branch_assignment_comprehension_scope -v
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-pr218-delete-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/audit_branch_assignment_gaps.py .github/workflows/tmp-pr218-delete-fix.yml
          git commit -m "Audit: model conditional deletions conservatively"
          git push origin HEAD:audit/branch-assignment-flow-hardening
