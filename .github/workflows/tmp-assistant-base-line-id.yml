name: Temp assistant base line id
on:
  push:
    branches: [fix/assistant-base-line-id-contract]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/assistant-base-line-id-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Appliquer le correctif et les tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('noethys/Ctrl/CTRL_Assistant_base.py')
          source = path.read_text(encoding='utf-8')
          old = '''        prochainIDtarif = DB.GetProchainID("tarifs")\n        if DB.isNetwork == False:\n'''
          new = '''        prochainIDtarif = DB.GetProchainID("tarifs")\n        prochainIDligne = None\n        if DB.isNetwork == False:\n'''
          if old not in source:
              raise SystemExit('bloc Sauvegarde_tarifs attendu introuvable')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = '''import ast\nimport unittest\nfrom pathlib import Path\nfrom scripts import audit_branch_assignment_gaps\n\nROOT = Path(__file__).resolve().parents[1]\nSOURCE_ROOT = ROOT / "noethys"\nSOURCE_PATH = SOURCE_ROOT / "Ctrl" / "CTRL_Assistant_base.py"\n\nclass AssistantBaseLineIdContractTests(unittest.TestCase):\n    def test_line_identifier_has_explicit_neutral_default(self):\n        source = SOURCE_PATH.read_text(encoding="utf-8")\n        expected = (\n            'prochainIDtarif = DB.GetProchainID("tarifs")\\n'\n            '        prochainIDligne = None\\n'\n            '        if DB.isNetwork == False:'\n        )\n        self.assertIn(expected, source)\n\n    def test_line_identifier_is_consumed_only_in_local_database_branch(self):\n        tree = ast.parse(SOURCE_PATH.read_text(encoding="utf-8"))\n        methods = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "Sauvegarde_tarifs"]\n        self.assertEqual(len(methods), 1)\n        method = methods[0]\n        local_if_nodes = [\n            n for n in ast.walk(method)\n            if isinstance(n, ast.If) and "DB.isNetwork == False" in ast.unparse(n.test)\n        ]\n        self.assertGreaterEqual(len(local_if_nodes), 2)\n        loads = [n for n in ast.walk(method) if isinstance(n, ast.Name) and n.id == "prochainIDligne" and isinstance(n.ctx, ast.Load)]\n        self.assertEqual(len(loads), 2)\n        for load in loads:\n            self.assertTrue(any(load in list(ast.walk(node)) for node in local_if_nodes))\n\n    def test_branch_assignment_gap_is_gone(self):\n        findings = audit_branch_assignment_gaps.scan_file(SOURCE_PATH, SOURCE_ROOT)\n        targeted = [item for item in findings if item.get("function") == "Sauvegarde_tarifs" and item.get("name") == "prochainIDligne"]\n        self.assertEqual(targeted, [], targeted)\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          Path('tests/test_assistant_base_line_id_contract.py').write_text(test, encoding='utf-8')
          PY
      - name: Valider le correctif
        run: |
          python -m py_compile noethys/Ctrl/CTRL_Assistant_base.py tests/test_assistant_base_line_id_contract.py
          python -m unittest tests.test_assistant_base_line_id_contract -v
          python scripts/audit_branch_assignment_gaps.py --json /tmp/branch-gaps.json | tee /tmp/audit.txt
          grep -q 'Couverture sources: trouvés=1043, lus=1043, parsés=1043 — OK' /tmp/audit.txt
          grep -q 'BRANCH_ASSIGNMENT_GAPS=241' /tmp/audit.txt
      - name: Commit du correctif
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-assistant-base-line-id.yml
          git add -A
          git commit -m 'Fix — expliciter l’identifiant local des lignes tarifaires'
          git push origin HEAD:fix/assistant-base-line-id-contract
