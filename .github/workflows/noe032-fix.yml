name: Noe-032 guarded restore fix

on:
  pull_request:
    paths:
      - '.github/workflows/noe032-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'noe-032-backup-restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Corriger les retours inconditionnels de Restauration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('noethys/Utils/UTILS_Sauvegarde.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''            if reponse != wx.ID_YES :\n                fichierZip.close()\n                fichierZip.close()\n            return False\n''',
                  '''            if reponse != wx.ID_YES :\n                fichierZip.close()\n                return False\n''',
                  2,
                  'confirmations de remplacement',
              ),
              (
                  '''                fichierZip.close()\n                fichierZip.close()\n            return False\n            \n            listeFichiersRestaures.append(fichier[:-4])\n''',
                  '''                fichierZip.close()\n                return False\n            \n            listeFichiersRestaures.append(fichier[:-4])\n''',
                  1,
                  'erreur extraction SQLite',
              ),
              (
                  '''                dlgErreur.Destroy()\n                fichierZip.close()\n                fichierZip.close()\n            return False\n            \n            listeFichiersRestaures.append(fichier)\n''',
                  '''                dlgErreur.Destroy()\n                fichierZip.close()\n                return False\n            \n            listeFichiersRestaures.append(fichier)\n''',
                  1,
                  'erreur import MySQL',
              ),
          ]

          for old, new, expected, label in replacements:
              count = text.count(old)
              assert count == expected, f'{label}: attendu {expected}, trouvé {count}'
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile noethys/Utils/UTILS_Sauvegarde.py
          python -m unittest tests.test_noe_032_restore_flow -v
          git diff --check

      - name: Commit
        run: |
          if git diff --quiet -- noethys/Utils/UTILS_Sauvegarde.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Utils/UTILS_Sauvegarde.py
          git commit -m "Noe-032: fix restore control flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
