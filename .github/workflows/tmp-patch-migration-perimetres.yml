name: tmp patch migration perimetres
on:
  push:
    paths:
      - 'tools/tmp_patch_migration_perimetres.py'
      - '.github/workflows/tmp-patch-migration-perimetres.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch
        run: python tools/tmp_patch_migration_perimetres.py
      - name: Checks
        run: |
          python -m py_compile noethys/Utils/UTILS_Migration_base.py
          git diff --check
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('m','noethys/Utils/UTILS_Migration_base.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert 'dossiers' in m.PERIMETRES_MIGRATION
          assert 'factures' in m.DEPENDANCES_COEUR['prestations']
          class A:
              def Inventaire(self, inclure_vides=False):
                  return [{'table':t,'nbre':1,'champs':['IDx']} for t in ['familles','individus','comptes_payeurs','rattachements','activites','groupes','inscriptions','consommations','contrats','contrats_tarifs','questionnaire_reponses','cotisations']]
              def ComparerSchemas(self):
                  tabs=[x['table'] for x in self.Inventaire()]
                  return {'tables_cible':tabs,'champs':{t:{'source_uniquement':[]} for t in tabs}}
          p=m.PlanMigration(A(), tables='dossiers')
          assert 'familles' in p.tables and 'inscriptions' in p.tables and 'consommations' in p.tables
          assert 'prestations' not in p.tables
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Utils/UTILS_Migration_base.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: ajouter des périmètres contrôlés de migration'
          git pull --rebase origin master
          git push origin HEAD:master
