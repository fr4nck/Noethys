name: tmp gap patch 10

on:
  push:
    branches:
      - fix/branch-assignment-gap-batch-10

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Appliquer et valider
        run: |
          python scripts/tmp_patch_gap_batch_10.py
          python -m unittest tests.test_impression_menu_branch_contract
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json
          python - <<'PY'
          import json
          with open('/tmp/gaps.json', encoding='utf-8') as fh:
              report = json.load(fh)
          print('COUNT', report['count'])
          assert report['count'] == 186, report['count']
          PY
      - name: Nettoyer et pousser
        run: |
          git rm scripts/tmp_patch_gap_batch_10.py .github/workflows/tmp-gap-patch-10.yml
          git add noethys/Utils/UTILS_Impression_menu.py tests/test_impression_menu_branch_contract.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: expliciter les contrats d'impression des menus"
          git push
