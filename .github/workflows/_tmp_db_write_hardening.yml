name: Harden DB writes

on:
  push:
    paths:
      - '.github/workflows/_tmp_db_write_hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fiabiliser insert update delete
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/GestionDB.py')
          s=p.read_text(encoding='utf-8')
          old='''        except Exception as err:\n            print("Requete sql d'INSERT incorrecte :\\n%s\\nErreur detectee:\\n%s" % (req, err))\n        # Retourne l'ID de l'enregistrement créé\n        return newID\n'''
          new='''        except Exception as err:\n            print("Requete sql d'INSERT incorrecte :\\n%s\\nErreur detectee:\\n%s" % (req, err))\n            try:\n                self.connexion.rollback()\n            except Exception:\n                pass\n            return None\n        # Retourne l'ID de l'enregistrement créé\n        return newID\n'''
          if s.count(old)!=1: raise SystemExit('ReqInsert motif inattendu')
          s=s.replace(old,new,1)
          old='''        except Exception as err:\n            print(_(u"Requete sql de mise a jour incorrecte :\\n%s\\nErreur detectee:\\n%s") % (req, err))\n        \n    def ReqDEL'''
          new='''        except Exception as err:\n            print(_(u"Requete sql de mise a jour incorrecte :\\n%s\\nErreur detectee:\\n%s") % (req, err))\n            try:\n                self.connexion.rollback()\n            except Exception:\n                pass\n            return False\n        return True\n        \n    def ReqDEL'''
          if s.count(old)!=1: raise SystemExit('ReqMAJ motif inattendu')
          s=s.replace(old,new,1)
          old='''        except Exception as err:\n            print(_(u"Requete sql de suppression incorrecte :\\n%s\\nErreur detectee:\\n%s") % (req, err))\n        \n    def Modifier'''
          new='''        except Exception as err:\n            print(_(u"Requete sql de suppression incorrecte :\\n%s\\nErreur detectee:\\n%s") % (req, err))\n            try:\n                self.connexion.rollback()\n            except Exception:\n                pass\n            return False\n        return True\n        \n    def Modifier'''
          if s.count(old)!=1: raise SystemExit('ReqDEL motif inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/GestionDB.py
          git diff --check
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/GestionDB.py
          git commit -m 'fix: rollback sur échec des écritures DB critiques'
          git push origin HEAD:master