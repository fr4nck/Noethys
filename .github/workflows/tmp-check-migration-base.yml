name: tmp check migration base
on:
  push:
    paths:
      - 'noethys/Utils/UTILS_Migration_base.py'
      - '.github/workflows/tmp-check-migration-base.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile noethys/Utils/UTILS_Migration_base.py
          python - <<'PY'
          from pathlib import Path
          s = Path('noethys/Utils/UTILS_Migration_base.py').read_text(encoding='utf-8')
          assert 'class AnalyseMigration' in s
          assert 'def Inventaire' in s
          assert 'def ComparerSchemas' in s
          assert 'SELECT COUNT(*)' in s
          PY
