name: Temporary lot inscriptions mode fix

on:
  push:
    branches:
      - fix/lot-inscriptions-mode-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/lot-inscriptions-mode-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Patch mode contract
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('noethys/Dlg/DLG_Saisie_lot_inscriptions.py'); s=p.read_text(encoding='utf-8'); old='        self.listeID = []\n        DB = GestionDB.DB()\n        if IDactivite == None :\n            IDactivite = 0\n        if self.mode == \"activites\" : req = \"\"\"SELECT IDactivite, nom FROM activites ORDER BY date_fin DESC;\"\"\"\n        if self.mode == \"groupes\" : req = \"\"\"SELECT IDgroupe, nom FROM groupes WHERE IDactivite=%d ORDER BY ordre;\"\"\" % IDactivite\n        if self.mode == \"categories\" : req = \"\"\"SELECT IDcategorie_tarif, nom FROM categories_tarifs WHERE IDactivite=%d ORDER BY nom;\"\"\" % IDactivite\n        DB.ExecuterReq(req)\n'; new='        self.listeID = []\n        if IDactivite == None :\n            IDactivite = 0\n        if self.mode == \"activites\" :\n            req = \"\"\"SELECT IDactivite, nom FROM activites ORDER BY date_fin DESC;\"\"\"\n        elif self.mode == \"groupes\" :\n            req = \"\"\"SELECT IDgroupe, nom FROM groupes WHERE IDactivite=%d ORDER BY ordre;\"\"\" % IDactivite\n        elif self.mode == \"categories\" :\n            req = \"\"\"SELECT IDcategorie_tarif, nom FROM categories_tarifs WHERE IDactivite=%d ORDER BY nom;\"\"\" % IDactivite\n        else :\n            raise ValueError(\"Mode de sélection inconnu : %s\" % self.mode)\n        DB = GestionDB.DB()\n        DB.ExecuterReq(req)\n'; assert s.count(old)==1; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Validate targeted regressions
        shell: bash
        run: |
          python -m py_compile noethys/Dlg/DLG_Saisie_lot_inscriptions.py tests/test_lot_inscriptions_mode_contract.py
          python -m unittest discover -s tests -p 'test_lot_inscriptions_mode_contract.py' -v
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-lot-inscriptions-mode-fix.yml
          git config user.name "fr4nck"
          git config user.email "f.bellardie@gmail.com"
          git add noethys/Dlg/DLG_Saisie_lot_inscriptions.py tests/test_lot_inscriptions_mode_contract.py .github/workflows/tmp-lot-inscriptions-mode-fix.yml
          git commit -m "Fix: valider le mode du lot d’inscriptions"
          git push origin HEAD:fix/lot-inscriptions-mode-contract
