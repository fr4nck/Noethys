name: Apply FTPS compatibility

on:
  push:
    paths:
      - 'scripts/add_ftps_compat.py'
      - '.github/workflows/apply-ftps-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer FTPS
        run: python scripts/add_ftps_compat.py
      - name: Vérifier compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Vérifier compatibilité par défaut
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('noethys/Dlg/DLG_Portail_config.py').read_text(encoding='utf-8')
          assert '"ftp_tls" : False' in t
          t = Path('noethys/Utils/UTILS_Portail_synchro.py').read_text(encoding='utf-8')
          assert 'self.dict_parametres.get("ftp_tls", False)' in t
          assert 'ftplib.FTP_TLS()' in t and 'ftp.prot_p()' in t
          PY
      - name: Vérifier les risques dynamiques
        run: python scripts/audit_dynamic_import_risks.py --max-import-risks 0
      - name: Committer
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/Dlg/DLG_Portail_config.py noethys/Utils/UTILS_Portail_synchro.py
          git commit -m "security: ajouter FTPS sans casser les configurations FTP"
          git push origin master
