name: PSU save guard

on:
  push:
    paths:
      - '.github/workflows/_tmp_psu_save_guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch PSU save
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noethys/Dlg/DLG_Activite.py')
          s=p.read_text(encoding='utf-8')

          old='''    def Sauvegarde(self):\n        \"\"\" Sauvegarde des paramètres \"\"\"\n        listeDonnees = [\n            (\"psu_activation\", self.GetValeur(\"psu_activation\", 0)),\n            (\"psu_unite_prevision\", self.GetValeur(\"psu_unite_prevision\", None)),\n            (\"psu_unite_presence\", self.GetValeur(\"psu_unite_presence\", None)),\n            (\"psu_tarif_forfait\", self.GetValeur(\"psu_tarif_forfait\", None)),\n            (\"psu_etiquette_rtt\", self.GetValeur(\"psu_etiquette_rtt\", None)),\n            ]\n        DB = GestionDB.DB()\n        DB.ReqMAJ(\"activites\", listeDonnees, \"IDactivite\", self.IDactivite)\n        DB.Close()\n'''
          new='''    def Sauvegarde(self):\n        \"\"\"Sauvegarde les paramètres PSU et retourne True en cas de succès.\"\"\"\n        listeDonnees = [\n            (\"psu_activation\", self.GetValeur(\"psu_activation\", 0)),\n            (\"psu_unite_prevision\", self.GetValeur(\"psu_unite_prevision\", None)),\n            (\"psu_unite_presence\", self.GetValeur(\"psu_unite_presence\", None)),\n            (\"psu_tarif_forfait\", self.GetValeur(\"psu_tarif_forfait\", None)),\n            (\"psu_etiquette_rtt\", self.GetValeur(\"psu_etiquette_rtt\", None)),\n            ]\n        DB = GestionDB.DB()\n        resultat = DB.ReqMAJ(\"activites\", listeDonnees, \"IDactivite\", self.IDactivite)\n        DB.Close()\n        return bool(resultat)\n'''
          if s.count(old)!=1: raise SystemExit('ClsParametres.Sauvegarde inattendue')
          s=s.replace(old,new,1)

          old='''        # Sauvegardes des autres paramètres\n        self.clsParametres.Sauvegarde()\n        # Fermeture\n        self.EndModal(wx.ID_OK)\n'''
          new='''        # Sauvegardes des autres paramètres\n        if self.clsParametres.Sauvegarde() == False:\n            dlg = wx.MessageDialog(self, _(u\"Les paramètres P.S.U. n'ont pas pu être enregistrés. La fenêtre reste ouverte.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n        # Fermeture\n        self.EndModal(wx.ID_OK)\n'''
          if s.count(old)!=1: raise SystemExit('Assistant.Terminer inattendu')
          s=s.replace(old,new,1)

          old='''        # Sauvegardes des autres paramètres\n        self.clsParametres.Sauvegarde()\n        return True\n'''
          new='''        # Sauvegardes des autres paramètres\n        if self.clsParametres.Sauvegarde() == False:\n            return False\n        return True\n'''
          if s.count(old)!=1: raise SystemExit('Notebook.Sauvegarde inattendu')
          s=s.replace(old,new,1)

          old='''        # Sauvegarde\n        self.ctrl_notebook.Sauvegarde()\n        # Fermeture\n        self.EndModal(wx.ID_OK) \n'''
          new='''        # Sauvegarde\n        if self.ctrl_notebook.Sauvegarde() == False:\n            dlg = wx.MessageDialog(self, _(u\"Les paramètres P.S.U. n'ont pas pu être enregistrés. La fenêtre reste ouverte.\"), _(u\"Erreur\"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n        # Fermeture\n        self.EndModal(wx.ID_OK) \n'''
          if s.count(old)!=1: raise SystemExit('Dialog.OnBoutonOk inattendu')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Activite.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('noethys/Dlg/DLG_Activite.py').read_text(encoding='utf-8')
          assert 'resultat = DB.ReqMAJ("activites", listeDonnees, "IDactivite", self.IDactivite)' in s
          assert 'return bool(resultat)' in s
          assert s.count('if self.clsParametres.Sauvegarde() == False:') == 2
          assert 'if self.ctrl_notebook.Sauvegarde() == False:' in s
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Activite.py
          git commit -m "fix: vérifier la sauvegarde des paramètres PSU"
          git push origin HEAD:master
