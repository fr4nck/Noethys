name: Apply last date cases

on:
  push:
    paths:
      - 'scripts/modernize_last_date_cases.py'
      - '.github/workflows/apply-last-date-cases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Appliquer les derniers correctifs de dates
        run: python scripts/modernize_last_date_cases.py
      - name: Vérifier la compilation
        run: python -m compileall -q -x 'C866CA3A' noethys/
      - name: Exiger un audit dates à zéro
        run: |
          output="$(python scripts/audit_fragile_date_parsing.py)"
          echo "$output"
          echo "$output" | grep -q '0 occurrence(s) de parsing de date fragile détectée(s).'
      - name: Committer
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noethys/
          git commit -m "fix: terminer la modernisation des parsings de dates"
          git push origin master
