name: Guard critical DB result rows

on:
  push:
    paths:
      - '.github/workflows/_tmp_guard_result_rows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Protéger les accès ResultatReq critiques
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
            'noethys/Dlg/DLG_Famille_reglements.py': [
              ('''        temp, activation = listeDonnees[0]\n        if activation == 1 :''', '''        activation = listeDonnees[0][1] if listeDonnees else None\n        if activation == 1 :'''),
              ('''        if listeDonnees[0][1] != None :\n            self.ctrl_image.SetBitmap(self.image_valide)''', '''        if listeDonnees and listeDonnees[0][1] != None :\n            self.ctrl_image.SetBitmap(self.image_valide)'''),
              ('''            self.IDcompte_payeur = listeDonnees[0][0]\n            self.ctrl_reglements.SetIDcompte_payeur(self.IDcompte_payeur)''', '''            if not listeDonnees:\n                return\n            self.IDcompte_payeur = listeDonnees[0][0]\n            self.ctrl_reglements.SetIDcompte_payeur(self.IDcompte_payeur)'''),
            ],
            'noethys/Dlg/DLG_Saisie_reglement.py': [
              ('''            listeDonnees = DB.ResultatReq()\n            self.IDcompte_payeur = listeDonnees[0][0]\n            \n            # Recherche si reçu édité''', '''            listeDonnees = DB.ResultatReq()\n            if not listeDonnees:\n                DB.Close()\n                raise ValueError("Règlement introuvable : %s" % self.IDreglement)\n            self.IDcompte_payeur = listeDonnees[0][0]\n            \n            # Recherche si reçu édité'''),
              ('''        DB.ExecuterReq(req)\n        IDfamille = DB.ResultatReq()[0][0]\n\n        # Récupère des frais de gestion''', '''        DB.ExecuterReq(req)\n        listeDonnees = DB.ResultatReq()\n        if not listeDonnees:\n            DB.Close()\n            return False\n        IDfamille = listeDonnees[0][0]\n\n        # Récupère des frais de gestion'''),
            ],
            'noethys/Dlg/DLG_Saisie_prestation.py': [
              ('''        listeDonnees = DB.ResultatReq()\n        DB.Close()\n        self.IDcompte_payeur = listeDonnees[0][0]\n        \n        if self.IDprestation == None :''', '''        listeDonnees = DB.ResultatReq()\n        DB.Close()\n        if not listeDonnees:\n            raise ValueError("Compte payeur introuvable pour la famille %s" % self.IDfamille)\n        self.IDcompte_payeur = listeDonnees[0][0]\n        \n        if self.IDprestation == None :'''),
              ('''        listeDonnees = DB.ResultatReq()     \n        DB.Close() \n        IDcompte_payeur = listeDonnees[0][0]\n        \n        DB = GestionDB.DB()''', '''        listeDonnees = DB.ResultatReq()     \n        DB.Close() \n        if not listeDonnees:\n            return False\n        IDcompte_payeur = listeDonnees[0][0]\n        \n        DB = GestionDB.DB()'''),
            ],
          }

          for filename, replacements in patches.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'Motif absent dans {filename}: {old[:80]!r}')
                  if filename.endswith('DLG_Famille_reglements.py') and 'if listeDonnees[0][1]' in old:
                      text = text.replace(old, new)
                  elif count != 1:
                      raise SystemExit(f'Motif ambigu dans {filename}: {count} occurrences')
                  else:
                      text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile noethys/Dlg/DLG_Famille_reglements.py noethys/Dlg/DLG_Saisie_reglement.py noethys/Dlg/DLG_Saisie_prestation.py
          python scripts/audit_runtime_patterns.py --json runtime-after.json
          python - <<'PY'
          import json
          data=json.load(open('runtime-after.json', encoding='utf-8'))
          for key in ('RESULT_UNGUARDED','RESULT_ASSIGN'):
              selected=[x for x in data[key] if x['file'] in ('Dlg/DLG_Famille_reglements.py','Dlg/DLG_Saisie_reglement.py','Dlg/DLG_Saisie_prestation.py')]
              print(key, len(selected), selected)
          PY
      - name: Committer les corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Dlg/DLG_Famille_reglements.py noethys/Dlg/DLG_Saisie_reglement.py noethys/Dlg/DLG_Saisie_prestation.py
          git commit -m 'fix: protéger les résultats DB règlements et prestations'
          git push origin HEAD:master