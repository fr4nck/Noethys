name: Atomic PSU inscriptions

on:
  push:
    paths:
      - '.github/workflows/_tmp_atomic_psu_inscriptions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Patch suppressions PSU et inscriptions
        run: |
          python - <<'PY'
          from pathlib import Path

          # Validation PSU
          p=Path('noethys/Ol/OL_Contratspsu_validation.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('        # Suppression dans la base\n', s.index('    def Supprimer'))
          end=s.index('        # MAJ de la liste\n', start)
          old=s[start:end]
          new='''        # Suppression atomique dans la base\n        DB = GestionDB.DB()\n        ok = True\n\n        # Détache d'abord les consommations pour chaque mensualité sélectionnée.\n        for track in listeSelections:\n            if not ok or track.IDprestation is None:\n                continue\n            listeUnites = []\n            for IDunite in (track.IDunite_prevision, track.IDunite_presence):\n                if IDunite is not None and IDunite not in listeUnites:\n                    listeUnites.append(IDunite)\n            if len(listeUnites) == 0:\n                conditionUnites = "()"\n            elif len(listeUnites) == 1:\n                conditionUnites = "(%d)" % listeUnites[0]\n            else:\n                conditionUnites = str(tuple(listeUnites))\n            req = \"\"\"UPDATE consommations SET IDprestation=NULL\n            WHERE IDinscription=%d AND date>='%s' AND date<='%s' AND IDunite IN %s\n            ;\"\"\" % (track.IDinscription, track.forfait_date_debut, track.forfait_date_fin, conditionUnites)\n            if DB.ExecuterReq(req) != 1:\n                ok = False\n\n        if ok and len(listeSuppressions) > 0:\n            if len(listeSuppressions) == 1:\n                conditionSuppression = "(%d)" % listeSuppressions[0]\n            else:\n                conditionSuppression = str(tuple(listeSuppressions))\n            for req in (\n                "DELETE FROM ventilation WHERE IDprestation IN %s" % conditionSuppression,\n                "DELETE FROM deductions WHERE IDprestation IN %s" % conditionSuppression,\n                "DELETE FROM prestations WHERE IDprestation IN %s" % conditionSuppression,\n            ):\n                if DB.ExecuterReq(req) != 1:\n                    ok = False\n                    break\n\n        if ok:\n            DB.Commit()\n        else:\n            try:\n                DB.connexion.rollback()\n            except Exception:\n                pass\n        DB.Close()\n\n        if not ok:\n            dlg = wx.MessageDialog(self, _(u"La suppression des prestations PSU a échoué. Aucune modification n'a été validée."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n            dlg.ShowModal()\n            dlg.Destroy()\n            return False\n\n'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')

          # Suppression inscription
          p=Path('noethys/Ol/OL_Inscriptions.py')
          s=p.read_text(encoding='utf-8')
          old='''        if dlg.ShowModal() == wx.ID_YES :\n            IDinscription = self.Selection()[0].IDinscription\n            DB = GestionDB.DB()\n            DB.ReqDEL("inscriptions", "IDinscription", IDinscription)\n            # Suppression des forfaits associés déjà saisis\n            for IDprestation in listePrestationsForfait :\n                DB.ReqDEL("prestations", "IDprestation", IDprestation)\n                DB.ReqDEL("consommations", "IDprestation", IDprestation)\n                DB.ReqDEL("deductions", "IDprestation", IDprestation)\n                DB.ReqDEL("ventilation", "IDprestation", IDprestation)\n            DB.Close() \n            \n            # Mémorise l'action dans l'historique\n            UTILS_Historique.InsertActions([{\n                "IDindividu" : self.IDindividu,\n                "IDfamille" : IDfamille,\n                "IDcategorie" : 19, \n                "action" : _(u"Suppression de l'inscription à l'activité '%s'") % nomActivite\n                },])\n                \n            # Actualise l'affichage\n            self.MAJ()\n'''
          new='''        if dlg.ShowModal() == wx.ID_YES :\n            IDinscription = self.Selection()[0].IDinscription\n            DB = GestionDB.DB()\n            ok = True\n            # Suppression des forfaits associés déjà saisis et de leurs dépendances.\n            for IDprestation in listePrestationsForfait :\n                for table in ("consommations", "deductions", "ventilation", "prestations"):\n                    if not DB.ReqDEL(table, "IDprestation", IDprestation, commit=False):\n                        ok = False\n                        break\n                if not ok:\n                    break\n            if ok:\n                ok = DB.ReqDEL("inscriptions", "IDinscription", IDinscription, commit=False)\n            if ok:\n                ok = UTILS_Historique.InsertActions([{\n                    "IDindividu" : self.IDindividu,\n                    "IDfamille" : IDfamille,\n                    "IDcategorie" : 19,\n                    "action" : _(u"Suppression de l'inscription à l'activité '%s'") % nomActivite\n                    },], DB=DB, commit=False)\n            if ok:\n                DB.Commit()\n            else:\n                try:\n                    DB.connexion.rollback()\n                except Exception:\n                    pass\n            DB.Close()\n            if not ok:\n                erreur = wx.MessageDialog(self, _(u"La suppression de l'inscription a échoué. Aucune modification n'a été validée."), _(u"Erreur"), wx.OK | wx.ICON_ERROR)\n                erreur.ShowModal()\n                erreur.Destroy()\n                dlg.Destroy()\n                return False\n            # Actualise l'affichage\n            self.MAJ()\n'''
          if s.count(old)!=1:
              raise SystemExit('bloc inscription inattendu')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile noethys/Ol/OL_Contratspsu_validation.py noethys/Ol/OL_Inscriptions.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          psu=Path('noethys/Ol/OL_Contratspsu_validation.py').read_text(encoding='utf-8')
          b=psu[psu.index('# Suppression atomique dans la base'):psu.index('# MAJ de la liste', psu.index('# Suppression atomique dans la base'))]
          assert 'for track in listeSelections' in b
          assert b.count('DB.ExecuterReq(req) != 1') >= 2
          assert 'rollback()' in b and 'DB.Commit()' in b
          ins=Path('noethys/Ol/OL_Inscriptions.py').read_text(encoding='utf-8')
          b=ins[ins.index('        if dlg.ShowModal() == wx.ID_YES', ins.index('def Supprimer')):ins.index('        dlg.Destroy()', ins.index('        if dlg.ShowModal() == wx.ID_YES', ins.index('def Supprimer')))]
          assert 'commit=False' in b and 'DB=DB, commit=False' in b
          assert 'DB.Commit()' in b and 'rollback()' in b
          PY
      - name: Committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noethys/Ol/OL_Contratspsu_validation.py noethys/Ol/OL_Inscriptions.py
          git commit -m "fix: atomiser suppressions PSU et inscriptions"
          git push origin HEAD:master
