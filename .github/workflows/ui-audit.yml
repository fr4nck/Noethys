name: UI layout audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'noethys/**'
      - 'scripts/audit_ui_layout.py'
      - 'scripts/audit_wx_lifecycle.py'
      - 'tests/test_audit_wx_lifecycle.py'
      - '.github/workflows/ui-audit.yml'
  pull_request:
    paths:
      - 'noethys/**'
      - 'scripts/audit_ui_layout.py'
      - 'scripts/audit_wx_lifecycle.py'
      - 'tests/test_audit_wx_lifecycle.py'
      - '.github/workflows/ui-audit.yml'

permissions:
  contents: read

jobs:
  audit-ui-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Compiler les modules UI transversaux
        run: |
          python -m py_compile noethys/Utils/UTILS_UIMetrics.py
          python -m py_compile noethys/Utils/UTILS_Responsive.py
          python -m py_compile noethys/Utils/UTILS_Aui.py
          python -m py_compile noethys/Ctrl/CTRL_Ephemeride.py
      - name: Tester l'audit des contrats wxPython
        run: python -m unittest discover -s tests -p 'test_audit_wx_lifecycle.py' -v
      - name: Inventorier la dette de layout et interdire le masquage des assertions
        run: >-
          python scripts/audit_ui_layout.py
          --json tmp/ui-layout-audit.json
          --fail-on sizer_assertion_suppression
      - name: Inventorier les contrats de construction wxPython
        run: >-
          python scripts/audit_wx_lifecycle.py
          --json tmp/wx-lifecycle-audit.json
          --fail-on constructor_parent_callback
      - name: Conserver les inventaires UI
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-audit-inventories
          path: tmp/*-audit.json
          if-no-files-found: warn
