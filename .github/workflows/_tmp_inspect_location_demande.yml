name: Inspect location demande
on:
  push:
    paths:
      - '.github/workflows/_tmp_inspect_location_demande.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect
        run: |
          grep -R -n "def Sauvegarde.*DB.*IDdonnee" noethys | head -30 > .github/_tmp_inspect_location_demande.txt || true
          grep -R -n "ctrl_questionnaire.Sauvegarde" noethys/Dlg noethys/Ol | head -40 >> .github/_tmp_inspect_location_demande.txt || true
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/_tmp_inspect_location_demande.txt
          git commit -m "ci: publier inspection questionnaire location"
          git pull --rebase origin master
          git push origin HEAD:master
