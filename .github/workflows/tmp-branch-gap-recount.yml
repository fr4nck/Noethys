name: Temp branch gap recount

on:
  push:
    branches:
      - audit/branch-gap-recount

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exhaustive branch assignment gap audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_branch_assignment_gaps.py --json /tmp/branch-gaps.json
          echo '--- AUDIT SUMMARY ---'
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/branch-gaps.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          findings = data.get('findings', data.get('results', [])) if isinstance(data, dict) else data
          print('BRANCH_ASSIGNMENT_GAPS=', len(findings))
          for item in findings:
              print('FINDING', json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY
