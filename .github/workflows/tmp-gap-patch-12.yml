name: tmp gap patch 12
on:
  push:
    branches: [fix/branch-assignment-gap-batch-12]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/branch-assignment-gap-batch-12
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply controlled patch
        run: python scripts/tmp_patch_gap_batch_12.py
      - name: Targeted tests
        run: python -m unittest tests.test_small_ui_branch_contracts_batch_12 -v
      - name: Audit exact count and coverage
        run: |
          python scripts/audit_branch_assignment_gaps.py --json /tmp/gaps.json | tee /tmp/audit.txt
          python - <<'PY'
          import json
          data=json.load(open('/tmp/gaps.json', encoding='utf-8'))
          count=data['count']
          print('branch_assignment_gap count:', count)
          assert count == 176, count
          text=open('/tmp/audit.txt', encoding='utf-8').read()
          assert 'BRANCH_ASSIGNMENT_GAPS=176' in text
          assert '1043' in text
          PY
      - name: Remove temporary infrastructure and commit
        run: |
          git rm scripts/tmp_patch_gap_batch_12.py .github/workflows/tmp-gap-patch-12.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add noethys/Dlg/DLG_Gestionnaire_conso.py noethys/Dlg/DLG_Parametres_nbre_inscrits.py noethys/Dlg/DLG_Saisie_contrat.py noethys/Ol/OL_Langues.py noethys/Dlg/DLG_Individu_identite.py tests/test_small_ui_branch_contracts_batch_12.py
          git commit -m "fix: expliciter cinq contrats UI complémentaires"
          git push
