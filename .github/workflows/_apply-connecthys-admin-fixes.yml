name: Apply Connecthys administration fixes

on:
  push:
    branches:
      - fix/vanilla-connecthys-admin

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla-connecthys-admin
          fetch-depth: 0

      - name: Apply exact source fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # #134.1 — Content-Length compatible Python 3
          replace_once(
              "noethys/Utils/UTILS_Portail_installation.py",
              '''def AffichetailleFichier(url):\n    try :\n        fichier = urlopen(url)\n        infoFichier = (fichier.info().getheaders('Content-Length'))\n        if len(infoFichier) > 0 :\n            tailleFichier = infoFichier[0]\n        else :\n            tailleFichier = 0\n    except IOError :\n        tailleFichier = 0\n    return int(tailleFichier)\n''',
              '''def AffichetailleFichier(url):\n    try :\n        fichier = urlopen(url)\n        tailleFichier = fichier.headers.get('Content-Length', 0)\n    except Exception :\n        tailleFichier = 0\n    return int(tailleFichier or 0)\n''',
          )

          # #134.5 — MLST est un contrôle facultatif : son absence ne doit pas casser l'installation
          replace_once(
              "noethys/Utils/UTILS_Portail_installation.py",
              '''                            if "mode=0755" not in ftp.sendcmd("MLST %s" % self.dict_parametres["serveur_cgi_file"]) :\n                                message = u"Attention, le fichier %s n'a pas les bonnes permissions." % self.dict_parametres["serveur_cgi_file"]\n                                self.parent.EcritLog(message)\n                                print(message)\n''',
              '''                            try :\n                                reponse_mlst = ftp.sendcmd("MLST %s" % self.dict_parametres["serveur_cgi_file"])\n                                if "mode=0755" not in reponse_mlst :\n                                    message = u"Attention, le fichier %s n'a pas les bonnes permissions." % self.dict_parametres["serveur_cgi_file"]\n                                    self.parent.EcritLog(message)\n                                    print(message)\n                            except Exception as err :\n                                print("Verification MLST sur %s impossible :" % self.dict_parametres["serveur_cgi_file"], err)\n''',
          )

          # #134.2 — conserver le mode sous forme d'entier, pas int('0o755')
          replace_once(
              "noethys/Utils/UTILS_Portail_installation.py",
              '''                            mode = int(oct(stat.S_IMODE(ftp.stat(os.path.join(destpath, name)).st_mode)))\n                            if mode != 755 :\n                                message = u"Attention, le fichier %s n'a pas les bonnes permissions : %d au lieu de 0755." % (self.dict_parametres["serveur_cgi_file"], mode)\n''',
              '''                            mode = stat.S_IMODE(ftp.stat(os.path.join(destpath, name)).st_mode)\n                            if mode != 0o755 :\n                                message = u"Attention, le fichier %s n'a pas les bonnes permissions : %04o au lieu de 0755." % (self.dict_parametres["serveur_cgi_file"], mode)\n''',
          )

          # #134.3 — utiliser réellement la clé SSH configurée dans le contrôle serveur
          replace_once(
              "noethys/Utils/UTILS_Portail_controle.py",
              '''            ssh.connect(self.dict_parametres["ssh_serveur"], port=int(self.dict_parametres["ssh_port"]), username=self.dict_parametres["ssh_utilisateur"], password=self.dict_parametres["ssh_mdp"])\n''',
              '''            key_filename = self.dict_parametres.get("ssh_key_file") or None\n            password = self.dict_parametres.get("ssh_mdp") or None\n            ssh.connect(self.dict_parametres["ssh_serveur"], port=int(self.dict_parametres["ssh_port"]), username=self.dict_parametres["ssh_utilisateur"], password=password, key_filename=key_filename)\n''',
          )

          # #134.4 — statut distant robuste et attribut correctement orthographié
          replace_once(
              "noethys/Utils/UTILS_Portail_controle.py",
              '''        elif self.dict_parametres["hebergement_type"] == 2 and self.ssh != None:\n            stdin, stdout, stderr = self.ssh.exec_command('ps -C python -opid,command:100')\n\n            for line in stdout.readlines() :\n                if line != "" and "run.py" in line :\n                    server_is_running = True\n        else :\n            server_is_running = False\n\n        if server_is_running == True :\n            self.isrunnig = True\n\n        return server_is_running\n''',
              '''        elif self.dict_parametres["hebergement_type"] == 2 and self.ssh != None:\n            server_is_running = len(self.GetListeProcessBySSH()) > 0\n        else :\n            server_is_running = False\n\n        self.isrunning = server_is_running\n        return server_is_running\n''',
          )

          replace_once(
              "noethys/Utils/UTILS_Portail_controle.py",
              '''    def Arreter_serveurBySSH(self):\n        """ Kill les process déjà ouverts """\n        process_pid = self.GetListeProcessBySSH()[0]\n\n        commande = "kill " + process_pid\n        stdin, stdout, stderr = self.ssh.exec_command(commande)\n''',
              '''    def Arreter_serveurBySSH(self):\n        """ Kill les process déjà ouverts """\n        liste_process = self.GetListeProcessBySSH()\n        if len(liste_process) == 0 :\n            return False\n        for process_pid in liste_process :\n            commande = "kill " + process_pid\n            self.ssh.exec_command(commande)\n        return True\n''',
          )

          replace_once(
              "noethys/Utils/UTILS_Portail_controle.py",
              '''        stdin, stdout, stderr = self.ssh.exec_command('ps -C python -opid=,command=')\n        for line in stdout.readlines() :\n            if line != "" and "run.py" in line :\n                for param in line.split(" ") :\n                    if param != " ":\n                        listeProcess.append(param)\n        return listeProcess\n''',
              '''        stdin, stdout, stderr = self.ssh.exec_command('ps -eo pid=,comm=,args=')\n        for line in stdout.readlines() :\n            elements = line.strip().split(None, 2)\n            if len(elements) == 3 :\n                pid, commande, arguments = elements\n                if "python" in commande.lower() and "run.py" in arguments :\n                    listeProcess.append(pid)\n        return listeProcess\n''',
          )

          # #134.3 — utiliser également la clé configurée pour les synchronisations SFTP
          replace_once(
              "noethys/Utils/UTILS_Portail_synchro.py",
              '''                ssh.connect(self.dict_parametres["ssh_serveur"], port=int(self.dict_parametres["ssh_port"]), username=self.dict_parametres["ssh_utilisateur"], password=self.dict_parametres["ssh_mdp"])\n''',
              '''                key_filename = self.dict_parametres.get("ssh_key_file") or None\n                password = self.dict_parametres.get("ssh_mdp") or None\n                ssh.connect(self.dict_parametres["ssh_serveur"], port=int(self.dict_parametres["ssh_port"]), username=self.dict_parametres["ssh_utilisateur"], password=password, key_filename=key_filename)\n''',
          )

      - name: Verify targeted invariants
        shell: python
        run: |
          from pathlib import Path

          install = Path("noethys/Utils/UTILS_Portail_installation.py").read_text(encoding="utf-8")
          assert "headers.get('Content-Length', 0)" in install
          assert "int(oct(" not in install
          assert "mode != 0o755" in install
          assert "Verification MLST" in install

          controle = Path("noethys/Utils/UTILS_Portail_controle.py").read_text(encoding="utf-8")
          assert 'key_filename = self.dict_parametres.get("ssh_key_file") or None' in controle
          assert "self.isrunnig" not in controle
          assert "ps -eo pid=,comm=,args=" in controle
          assert "liste_process = self.GetListeProcessBySSH()" in controle

          synchro = Path("noethys/Utils/UTILS_Portail_synchro.py").read_text(encoding="utf-8")
          assert 'key_filename = self.dict_parametres.get("ssh_key_file") or None' in synchro

      - name: Compile changed Python files
        shell: python
        run: |
          import py_compile
          for path in [
              "noethys/Utils/UTILS_Portail_installation.py",
              "noethys/Utils/UTILS_Portail_controle.py",
              "noethys/Utils/UTILS_Portail_synchro.py",
          ]:
              py_compile.compile(path, doraise=True)

      - name: Commit application fixes and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-connecthys-admin-fixes.yml
          git add noethys/Utils/UTILS_Portail_installation.py \
                  noethys/Utils/UTILS_Portail_controle.py \
                  noethys/Utils/UTILS_Portail_synchro.py
          git commit -m "Vanilla: fiabiliser l'administration Connecthys"
          git push origin HEAD:fix/vanilla-connecthys-admin
