name: Runtime regression guarded patch

on:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_runtime_regression_fixes.py'
      - '.github/workflows/runtime-regression-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Apply guarded runtime fixes
        run: |
          python scripts/apply_runtime_regression_fixes.py
          python -m py_compile \
            noethys/Ctrl/CTRL_Saisie_transport.py \
            noethys/Ctrl/CTRL_TaskBarIcon.py \
            noethys/Ol/OL_Modes_reglements.py \
            noethys/Dlg/DLG_Emetteurs.py \
            noethys/Dlg/DLG_Utilisateurs_reseau.py \
            noethys/Utils/UTILS_Organisateur.py \
            noethys/Noethys.py
          git diff --check

      - name: Commit source fixes and remove patch runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            noethys/Ctrl/CTRL_Saisie_transport.py \
            noethys/Ctrl/CTRL_TaskBarIcon.py \
            noethys/Ol/OL_Modes_reglements.py \
            noethys/Dlg/DLG_Emetteurs.py \
            noethys/Dlg/DLG_Utilisateurs_reseau.py \
            noethys/Utils/UTILS_Organisateur.py \
            noethys/Noethys.py
          git rm scripts/apply_runtime_regression_fixes.py
          git rm .github/workflows/runtime-regression-patch.yml
          git commit -m "Fix Python 3 wx runtime regressions"
          git push origin HEAD:master
