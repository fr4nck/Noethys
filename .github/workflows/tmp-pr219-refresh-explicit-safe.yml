name: Temporary PR219 refresh explicit-safe fingerprints

on:
  push:
    branches:
      - fix/branch-assignment-candidates-pass-1
    paths:
      - .github/workflows/tmp-pr219-refresh-explicit-safe.yml

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Compute current full-flow fingerprints
        shell: bash
        run: |
          python - <<'PY'
          from scripts import qualify_branch_assignment_gaps as q

          raw = q.base.build_report()
          fields = ("file", "function", "name", "detail")
          for old_key in q.EXPLICIT_SAFE:
              identity = old_key[:4]
              matches = [
                  item for item in raw["findings"]
                  if tuple(item[field] for field in fields) == identity
              ]
              if len(matches) != 1:
                  raise SystemExit(f"identity {identity!r}: {len(matches)} candidate(s)")
              new_key = q.qualification_key(matches[0])
              print("REFRESH", identity, "OLD", old_key[4], "NEW", new_key[4])
          PY
